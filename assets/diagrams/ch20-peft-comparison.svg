<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    PEFT Methods Comparison: Parameters and Memory
  </text>

  
  <text x="150" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Method</text>
  <text x="340" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Trainable %</text>
  <text x="550" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Memory (7B Model)</text>
  <text x="750" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Performance</text>

  
  <g id="full-ft">
    <rect x="40" y="85" width="220" height="50" fill="#E57373" fill-opacity="0.3" stroke="#333" stroke-width="2" rx="5" />
    <text x="150" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Full Fine-tuning</text>

    
    <rect x="280" y="85" width="120" height="50" fill="#E57373" fill-opacity="0.7" stroke="#333" stroke-width="2" rx="5" />
    <text x="340" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF">100%</text>

    
    <rect x="430" y="85" width="240" height="50" fill="#E57373" fill-opacity="0.5" stroke="#333" stroke-width="2" rx="5" />
    <text x="550" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">~98 GB</text>

    
    <text x="750" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">100%</text>
  </g>

  
  <g id="lora-16">
    <rect x="40" y="155" width="220" height="50" fill="#4A90A4" fill-opacity="0.3" stroke="#333" stroke-width="2" rx="5" />
    <text x="150" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">LoRA (r=16)</text>

    
    <rect x="280" y="155" width="2.4" height="50" fill="#4A90A4" fill-opacity="0.9" stroke="#333" stroke-width="1" rx="2" />
    <text x="340" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">0.2%</text>

    
    <rect x="430" y="155" width="36" height="50" fill="#4A90A4" fill-opacity="0.7" stroke="#333" stroke-width="2" rx="5" />
    <text x="550" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">~15 GB</text>

    
    <text x="750" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#81C784">96-97%</text>
  </g>

  
  <g id="qlora">
    <rect x="40" y="225" width="220" height="50" fill="#4A90A4" fill-opacity="0.3" stroke="#333" stroke-width="2" rx="5" />
    <text x="150" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">QLoRA (r=16)</text>

    
    <rect x="280" y="225" width="2.4" height="50" fill="#4A90A4" fill-opacity="0.9" stroke="#333" stroke-width="1" rx="2" />
    <text x="340" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">0.2%</text>

    
    <rect x="430" y="225" width="12" height="50" fill="#81C784" fill-opacity="0.7" stroke="#333" stroke-width="2" rx="5" />
    <text x="550" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#81C784">~5 GB</text>

    
    <text x="750" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#81C784">96-97%</text>
  </g>

  
  <g id="adapters">
    <rect x="40" y="295" width="220" height="50" fill="#9575CD" fill-opacity="0.3" stroke="#333" stroke-width="2" rx="5" />
    <text x="150" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Adapters</text>

    
    <rect x="280" y="295" width="8" height="50" fill="#9575CD" fill-opacity="0.7" stroke="#333" stroke-width="2" rx="5" />
    <text x="340" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">0.5-2%</text>

    
    <rect x="430" y="295" width="40" height="50" fill="#9575CD" fill-opacity="0.5" stroke="#333" stroke-width="2" rx="5" />
    <text x="550" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">~16 GB</text>

    
    <text x="750" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">95-98%</text>
  </g>

  
  <g id="prefix">
    <rect x="40" y="365" width="220" height="50" fill="#FFB74D" fill-opacity="0.3" stroke="#333" stroke-width="2" rx="5" />
    <text x="150" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Prefix Tuning</text>

    
    <rect x="280" y="365" width="1.2" height="50" fill="#FFB74D" fill-opacity="0.9" stroke="#333" stroke-width="1" rx="2" />
    <text x="340" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">~0.1%</text>

    
    <rect x="430" y="365" width="34" height="50" fill="#FFB74D" fill-opacity="0.5" stroke="#333" stroke-width="2" rx="5" />
    <text x="550" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">~14 GB</text>

    
    <text x="750" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#FF9800">85-90%</text>
  </g>

  
  <g id="legend">
    <rect x="20" y="440" width="860" height="50" fill="#F5F5F5" stroke="#333" stroke-width="1" rx="5" />

    <text x="450" y="460" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      Key Insight: PEFT methods achieve 95%+ performance with &lt;1% trainable parameters
    </text>
    <text x="450" y="478" font-size="11" text-anchor="middle" fill="#666">
      Memory savings enable fine-tuning on consumer GPUs | Multiple adapters can coexist in memory
    </text>
  </g>

  
  <line x1="280" y1="75" x2="280" y2="435" stroke="#CCC" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="400" y1="75" x2="400" y2="435" stroke="#CCC" stroke-width="1" stroke-dasharray="5,5" />

  
  <g id="frozen-trainable">
    <rect x="730" y="90" width="15" height="15" fill="#E8E8E8" stroke="#333" stroke-width="1" />
    <text x="750" y="102" font-size="11" fill="#666">Frozen (base model)</text>

    <rect x="730" y="110" width="15" height="15" fill="#4A90A4" fill-opacity="0.7" stroke="#333" stroke-width="1" />
    <text x="750" y="122" font-size="11" fill="#666">Trainable (adapter)</text>
  </g>
</svg>