<?xml version="1.0" encoding="UTF-8"?>
<!-- lint-disable contrast -->
<!-- Note: Contrast checker produces false positives due to not handling <g transform> -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" style="max-width: 700px; width: 100%; height: auto">

  <style>
    text { fill: #000000; }
    .bg-main { fill: #f5f5f5; }
    .bg-box { fill: white; }

    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .bg-main { fill: #1a1a1a; }
      .bg-box { fill: #2d2d2d; }
      text[fill="#333"] { fill: #ffffff; }
      text[fill="#666"] { fill: #cccccc; }
      text[fill="#1565C0"] { fill: #64B5F6; }
      text[fill="#2E7D32"] { fill: #81C784; }
      text[fill="#7B1FA2"] { fill: #CE93D8; }
      text[fill="#E65100"] { fill: #FFB74D; }
      line[stroke="#666"] { stroke: #888; }
      line[stroke="#2E7D32"] { stroke: #81C784; }
      line[stroke="#C62828"] { stroke: #EF5350; }
    }
  </style>

  <rect width="700" height="420" class="bg-main"/>

  <!-- Title -->
  <text x="350" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Index Selection Guide</text>

  <!-- Dataset Size question -->
  <g transform="translate(250, 50)">
    <rect x="0" y="0" width="200" height="50" class="bg-box" stroke="#1565C0" stroke-width="2" rx="8"/>
    <text x="100" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">Dataset Size</text>
    <text x="100" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">&lt; 100K vectors?</text>
  </g>

  <!-- Arrow down from Dataset Size -->
  <line x1="350" y1="100" x2="350" y2="130" stroke="#666" stroke-width="2"/>

  <!-- Branch point -->
  <circle cx="350" cy="140" r="6" fill="#666"/>

  <!-- Yes branch (left) -->
  <line x1="344" y1="140" x2="150" y2="140" stroke="#2E7D32" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="180" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="240" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">Yes</text>

  <!-- No branch (right) -->
  <line x1="356" y1="140" x2="550" y2="140" stroke="#C62828" stroke-width="2"/>
  <line x1="550" y1="140" x2="550" y2="180" stroke="#C62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="460" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#C62828">No</text>

  <!-- Flat box (left result) -->
  <g transform="translate(70, 190)">
    <rect x="0" y="0" width="160" height="70" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="8"/>
    <text x="80" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">Flat</text>
    <text x="80" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">Exact search</text>
    <text x="80" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">100% recall</text>
  </g>

  <!-- Memory budget question (right) -->
  <g transform="translate(450, 190)">
    <rect x="0" y="0" width="200" height="50" class="bg-box" stroke="#7B1FA2" stroke-width="2" rx="8"/>
    <text x="100" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Memory Budget</text>
    <text x="100" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">High or Low?</text>
  </g>

  <!-- Arrow down from Memory budget -->
  <line x1="550" y1="240" x2="550" y2="270" stroke="#666" stroke-width="2"/>

  <!-- Second branch point -->
  <circle cx="550" cy="280" r="6" fill="#666"/>

  <!-- High branch (left) -->
  <line x1="544" y1="280" x2="400" y2="280" stroke="#2E7D32" stroke-width="2"/>
  <line x1="400" y1="280" x2="400" y2="320" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="470" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">High</text>

  <!-- Low branch (right) -->
  <line x1="556" y1="280" x2="620" y2="280" stroke="#E65100" stroke-width="2"/>
  <line x1="620" y1="280" x2="620" y2="320" stroke="#E65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="588" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E65100">Low</text>

  <!-- HNSW box -->
  <g transform="translate(310, 330)">
    <rect x="0" y="0" width="180" height="80" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="8"/>
    <text x="90" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">HNSW</text>
    <text x="90" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">Fast graph-based</text>
    <text x="90" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">~99% recall</text>
    <text x="90" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">O(log n) search</text>
  </g>

  <!-- IVF+PQ box -->
  <g transform="translate(520, 330)">
    <rect x="0" y="0" width="160" height="80" fill="#FFF3E0" stroke="#E65100" stroke-width="2" rx="8"/>
    <text x="80" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">IVF + PQ</text>
    <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">Compact, scalable</text>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#E65100">~90% recall</text>
    <text x="80" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">Billions of vectors</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E7D32"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#C62828"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E65100"/>
    </marker>
  </defs>
</svg>
