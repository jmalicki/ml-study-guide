<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-main { fill: #2d2d2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>

  
  <rect x="20" y="30" width="140" height="40" class="bg-main" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="90" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#333">Responses</text>

  <rect x="240" y="30" width="160" height="40" class="bg-main" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="320" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#333">AI Comparison</text>

  <rect x="480" y="30" width="160" height="40" class="bg-main" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="560" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#333">Preference Dataset</text>

  <rect x="720" y="30" width="140" height="40" class="bg-main" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="790" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#333">RL Training</text>

  
  <line x1="160" y1="50" x2="240" y2="50" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />
  <line x1="400" y1="50" x2="480" y2="50" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />
  <line x1="640" y1="50" x2="720" y2="50" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />
</svg>