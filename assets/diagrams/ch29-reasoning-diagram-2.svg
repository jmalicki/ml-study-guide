<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .decision-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
      .method-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #2563eb; font-weight: 600; }
      .start-box { fill: #4A90A4; stroke: #2d5a66; stroke-width: 2; }
      .start-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: white; font-weight: 600; }
      .line { stroke: #4A90A4; stroke-width: 2; fill: none; }
      .arrow { fill: #4A90A4; }
    </style>
  </defs>

  <!-- Start box -->
  <rect x="310" y="10" width="80" height="40" rx="5" class="start-box"/>
  <text x="350" y="35" text-anchor="middle" class="start-text">Start</text>

  <!-- Vertical line from start -->
  <line x1="350" y1="50" x2="350" y2="80" class="line"/>

  <!-- Decision 1: Need external tools/APIs? -->
  <line x1="350" y1="80" x2="350" y2="100" class="line"/>
  <line x1="350" y1="100" x2="500" y2="100" class="line"/>
  <text x="360" y="105" class="decision-text">Need external tools/APIs?</text>
  <line x1="500" y1="100" x2="500" y2="120" class="line"/>
  <polygon points="500,120 496,112 504,112" class="arrow"/>
  <text x="510" y="115" class="decision-text">Yes</text>
  <text x="540" y="135" class="method-text">ReAct</text>

  <!-- Decision 2: Primarily arithmetic/code? -->
  <line x1="350" y1="100" x2="350" y2="160" class="line"/>
  <line x1="350" y1="160" x2="500" y2="160" class="line"/>
  <text x="360" y="165" class="decision-text">Primarily arithmetic/code?</text>
  <line x1="500" y1="160" x2="500" y2="180" class="line"/>
  <polygon points="500,180 496,172 504,172" class="arrow"/>
  <text x="510" y="175" class="decision-text">Yes</text>
  <text x="540" y="195" class="method-text">PAL (Program-Aided)</text>

  <!-- Decision 3: Need highest accuracy? -->
  <line x1="350" y1="160" x2="350" y2="220" class="line"/>
  <line x1="350" y1="220" x2="500" y2="220" class="line"/>
  <text x="360" y="225" class="decision-text">Need highest accuracy, cost no object?</text>
  <line x1="500" y1="220" x2="500" y2="240" class="line"/>
  <polygon points="500,240 496,232 504,232" class="arrow"/>
  <text x="510" y="235" class="decision-text">Yes</text>
  <text x="540" y="255" class="method-text">Self-Consistency (n=20+) or Tree-of-Thought</text>

  <!-- Decision 4: Compositional/planning task? -->
  <line x1="350" y1="220" x2="350" y2="280" class="line"/>
  <line x1="350" y1="280" x2="500" y2="280" class="line"/>
  <text x="360" y="285" class="decision-text">Compositional/planning task?</text>
  <line x1="500" y1="280" x2="500" y2="300" class="line"/>
  <polygon points="500,300 496,292 504,292" class="arrow"/>
  <text x="510" y="295" class="decision-text">Yes</text>
  <text x="540" y="315" class="method-text">Least-to-Most or Tree-of-Thought</text>

  <!-- Decision 5: Need backtracking? -->
  <line x1="350" y1="280" x2="350" y2="340" class="line"/>
  <line x1="350" y1="340" x2="500" y2="340" class="line"/>
  <text x="360" y="345" class="decision-text">Need backtracking/exploration?</text>
  <line x1="500" y1="340" x2="500" y2="360" class="line"/>
  <polygon points="500,360 496,352 504,352" class="arrow"/>
  <text x="510" y="355" class="decision-text">Yes</text>
  <text x="540" y="375" class="method-text">Tree-of-Thought</text>

  <!-- Decision 6: Have process supervision data? -->
  <line x1="350" y1="340" x2="350" y2="400" class="line"/>
  <line x1="350" y1="400" x2="500" y2="400" class="line"/>
  <text x="360" y="405" class="decision-text">Have process supervision data?</text>
  <line x1="500" y1="400" x2="500" y2="420" class="line"/>
  <polygon points="500,420 496,412 504,412" class="arrow"/>
  <text x="510" y="415" class="decision-text">Yes</text>
  <text x="540" y="435" class="method-text">Train PRM + Best-of-N</text>

  <!-- Decision 7: Low latency required? -->
  <line x1="350" y1="400" x2="350" y2="460" class="line"/>
  <line x1="350" y1="460" x2="500" y2="460" class="line"/>
  <text x="360" y="465" class="decision-text">Low latency required?</text>
  <line x1="500" y1="460" x2="500" y2="480" class="line"/>
  <polygon points="500,480 496,472 504,472" class="arrow"/>
  <text x="510" y="475" class="decision-text">Yes</text>
  <text x="540" y="495" class="method-text">Zero-shot CoT</text>

  <!-- Decision 8: General case (end of tree) -->
  <line x1="350" y1="460" x2="350" y2="540" class="line"/>
  <line x1="350" y1="540" x2="500" y2="540" class="line"/>
  <text x="360" y="545" class="decision-text">General case</text>
  <line x1="500" y1="540" x2="500" y2="560" class="line"/>
  <polygon points="500,560 496,552 504,552" class="arrow"/>
  <text x="540" y="575" class="method-text">Self-Consistency (n=5-10)</text>

  <!-- Main vertical line -->
  <line x1="350" y1="80" x2="350" y2="540" class="line" stroke-dasharray="none"/>
</svg>