<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="max-width: 800px; display: block; margin: 20px auto">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    .bg-box { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      .bg-box { fill: #2d2d2d; }

      /* Darken colored backgrounds for better contrast with white text */
      rect[fill="#e8f4f8"] { fill: #2d5f6f; }

      /* Handle #333 text in dark mode */
      text[fill="#333"] { fill: #ffffff; }
    }
  </style><text x="180" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Post-LN (Original)</text>


  <rect x="120" y="40" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="180" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Input</text>

  
  <line x1="180" y1="80" x2="180" y2="100" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />

  
  <rect x="100" y="100" width="160" height="100" fill="none" stroke="#4A90A4" stroke-width="2" stroke-dasharray="5,5" rx="5" />


  <rect x="130" y="115" width="100" height="50" fill="#e8f4f8" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="180" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">SubLyr</text>


  <text x="245" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle">+</text>


  <line x1="180" y1="200" x2="180" y2="220" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />


  <rect x="120" y="220" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="180" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">LayerNorm</text>


  <line x1="180" y1="260" x2="180" y2="280" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />


  <rect x="120" y="280" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="180" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Output</text>


  <text x="580" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Pre-LN (Modern)</text>


  <rect x="520" y="40" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="580" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Input</text>


  <line x1="580" y1="80" x2="580" y2="100" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />


  <rect x="500" y="100" width="160" height="140" fill="none" stroke="#4A90A4" stroke-width="2" stroke-dasharray="5,5" rx="5" />


  <rect x="520" y="115" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="580" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">LayerNorm</text>


  <line x1="580" y1="155" x2="580" y2="175" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />


  <rect x="520" y="175" width="120" height="40" fill="#e8f4f8" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="580" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">SubLyr</text>


  <text x="645" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle">+</text>


  <line x1="580" y1="240" x2="580" y2="280" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead2)" />


  <rect x="520" y="280" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="580" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Output</text>

  
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>
</svg>