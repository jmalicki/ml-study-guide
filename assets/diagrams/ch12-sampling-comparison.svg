<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .title { fill: #333333; }
    .annotation { fill: #555555; }
    rect.header { fill: #e3f2fd; stroke: #1976d2; }
    rect.cell { fill: #ffffff; stroke: #e0e0e0; }
    rect.cell-alt { fill: #fafafa; stroke: #e0e0e0; }
    rect.good { fill: #c8e6c9; }
    rect.medium { fill: #fff9c4; }
    rect.poor { fill: #ffcdd2; }
    line.divider { stroke: #bdbdbd; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .title { fill: #ffffff; }
      .annotation { fill: #aaaaaa; }
      rect.header { fill: #1565c0; stroke: #64b5f6; }
      rect.cell { fill: #2d2d2d; stroke: #555555; }
      rect.cell-alt { fill: #383838; stroke: #555555; }
      rect.good { fill: #1b5e20; }
      rect.medium { fill: #f9a825; }
      rect.poor { fill: #b71c1c; }
      line.divider { stroke: #666666; }
    }
  </style>

  <!-- Title -->
  <text x="425" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" class="title">
    Sampling Strategies Comparison
  </text>

  <!-- Table -->
  <g transform="translate(25, 50)">
    <!-- Header row -->
    <rect x="0" y="0" width="130" height="40" class="header" stroke-width="1"/>
    <text x="65" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Strategy</text>

    <rect x="130" y="0" width="120" height="40" class="header" stroke-width="1"/>
    <text x="190" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Diversity</text>

    <rect x="250" y="0" width="120" height="40" class="header" stroke-width="1"/>
    <text x="310" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Quality</text>

    <rect x="370" y="0" width="120" height="40" class="header" stroke-width="1"/>
    <text x="430" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Speed</text>

    <rect x="490" y="0" width="310" height="40" class="header" stroke-width="1"/>
    <text x="645" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Best Use Cases</text>

    <!-- Row 1: Greedy -->
    <rect x="0" y="40" width="130" height="50" class="cell" stroke-width="1"/>
    <text x="65" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Greedy</text>
    <text x="65" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(argmax)</text>

    <rect x="130" y="40" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="140" y="52" width="100" height="26" rx="4" class="poor"/>
    <text x="190" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">None</text>

    <rect x="250" y="40" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="260" y="52" width="100" height="26" rx="4" class="medium"/>
    <text x="310" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Medium</text>

    <rect x="370" y="40" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="380" y="52" width="100" height="26" rx="4" class="good"/>
    <text x="430" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Fastest</text>

    <rect x="490" y="40" width="310" height="50" class="cell" stroke-width="1"/>
    <text x="645" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">Debugging, deterministic testing</text>
    <text x="645" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(can cause repetition loops)</text>

    <!-- Row 2: Temperature -->
    <rect x="0" y="90" width="130" height="50" class="cell-alt" stroke-width="1"/>
    <text x="65" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Temperature</text>
    <text x="65" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(T=0.7-1.0)</text>

    <rect x="130" y="90" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="140" y="102" width="100" height="26" rx="4" class="medium"/>
    <text x="190" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Adjustable</text>

    <rect x="250" y="90" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="260" y="102" width="100" height="26" rx="4" class="medium"/>
    <text x="310" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Good</text>

    <rect x="370" y="90" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="380" y="102" width="100" height="26" rx="4" class="good"/>
    <text x="430" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Fast</text>

    <rect x="490" y="90" width="310" height="50" class="cell-alt" stroke-width="1"/>
    <text x="645" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">General use, but can sample unlikely tokens</text>

    <!-- Row 3: Top-k -->
    <rect x="0" y="140" width="130" height="50" class="cell" stroke-width="1"/>
    <text x="65" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Top-k</text>
    <text x="65" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(k=40-100)</text>

    <rect x="130" y="140" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="140" y="152" width="100" height="26" rx="4" class="medium"/>
    <text x="190" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Fixed</text>

    <rect x="250" y="140" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="260" y="152" width="100" height="26" rx="4" class="good"/>
    <text x="310" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Good</text>

    <rect x="370" y="140" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="380" y="152" width="100" height="26" rx="4" class="good"/>
    <text x="430" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Fast</text>

    <rect x="490" y="140" width="310" height="50" class="cell" stroke-width="1"/>
    <text x="645" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">Legacy use; fixed k doesn't adapt to context</text>

    <!-- Row 4: Top-p (Nucleus) -->
    <rect x="0" y="190" width="130" height="50" class="cell-alt" stroke-width="1"/>
    <text x="65" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Top-p (Nucleus)</text>
    <text x="65" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(p=0.9-0.95)</text>

    <rect x="130" y="190" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="140" y="202" width="100" height="26" rx="4" class="good"/>
    <text x="190" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Adaptive</text>

    <rect x="250" y="190" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="260" y="202" width="100" height="26" rx="4" class="good"/>
    <text x="310" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Excellent</text>

    <rect x="370" y="190" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="380" y="202" width="100" height="26" rx="4" class="good"/>
    <text x="430" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Fast</text>

    <rect x="490" y="190" width="310" height="50" class="cell-alt" stroke-width="1"/>
    <text x="645" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Industry standard for chatbots</text>
    <text x="645" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(ChatGPT, Claude, etc.)</text>

    <!-- Row 5: Beam Search -->
    <rect x="0" y="240" width="130" height="50" class="cell" stroke-width="1"/>
    <text x="65" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Beam Search</text>
    <text x="65" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(k=4-10)</text>

    <rect x="130" y="240" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="140" y="252" width="100" height="26" rx="4" class="poor"/>
    <text x="190" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">None</text>

    <rect x="250" y="240" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="260" y="252" width="100" height="26" rx="4" class="good"/>
    <text x="310" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">High (likely)</text>

    <rect x="370" y="240" width="120" height="50" class="cell" stroke-width="1"/>
    <rect x="380" y="252" width="100" height="26" rx="4" class="poor"/>
    <text x="430" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Slow (k×)</text>

    <rect x="490" y="240" width="310" height="50" class="cell" stroke-width="1"/>
    <text x="645" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">Translation, summarization, structured output</text>

    <!-- Row 6: Combined (T + Top-p) -->
    <rect x="0" y="290" width="130" height="50" class="cell-alt" stroke-width="1"/>
    <text x="65" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T + Top-p</text>
    <text x="65" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(T=0.7, p=0.9)</text>

    <rect x="130" y="290" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="140" y="302" width="100" height="26" rx="4" class="good"/>
    <text x="190" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Excellent</text>

    <rect x="250" y="290" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="260" y="302" width="100" height="26" rx="4" class="good"/>
    <text x="310" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Excellent</text>

    <rect x="370" y="290" width="120" height="50" class="cell-alt" stroke-width="1"/>
    <rect x="380" y="302" width="100" height="26" rx="4" class="good"/>
    <text x="430" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Fast</text>

    <rect x="490" y="290" width="310" height="50" class="cell-alt" stroke-width="1"/>
    <text x="645" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Best for general use</text>
    <text x="645" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(recommended default)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(25, 410)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" class="title">Legend:</text>

    <rect x="70" y="-12" width="60" height="18" rx="4" class="good"/>
    <text x="100" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Good</text>

    <rect x="150" y="-12" width="60" height="18" rx="4" class="medium"/>
    <text x="180" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Medium</text>

    <rect x="230" y="-12" width="60" height="18" rx="4" class="poor"/>
    <text x="260" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Poor</text>

    <text x="350" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      Interview tip: Top-p + Temperature is the industry standard for chat applications
    </text>
  </g>
</svg>
