    <defs>
      <linearGradient id="valueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#E57373;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#4A90A4;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="5" y="20" width="150" height="10" fill="url(#valueGrad)" stroke="#999" stroke-width="0.5" />
    <text x="5" y="32" font-size="9" fill="#000">-1.0</text>
    <text x="77" y="32" text-anchor="middle" font-size="9" fill="#000">0.0</text>
    <text x="155" y="32" text-anchor="end" font-size="9" fill="#000">+1.0</text>
