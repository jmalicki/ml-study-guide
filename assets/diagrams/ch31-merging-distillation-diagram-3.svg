<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #f5f5f5; stroke: #4A90A4; stroke-width: 2; }
    .expert { fill: #e8f4f8; stroke: #4A90A4; stroke-width: 2; }
    .result { fill: #d4edda; stroke: #4A90A4; stroke-width: 2; }
    .text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #666; }
    .arrow { stroke: #4A90A4; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .darrow { stroke: #4A90A4; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>

  <!-- Base model -->
  <rect x="280" y="20" width="140" height="40" rx="5" class="box"/>
  <text x="350" y="45" text-anchor="middle" class="text" font-weight="bold">Base model</text>

  <!-- Branches to experts -->
  <path d="M 280 60 L 120 90" class="arrow"/>
  <path d="M 350 60 L 350 90" class="arrow"/>
  <path d="M 420 60 L 580 90" class="arrow"/>

  <!-- Math expert -->
  <rect x="50" y="90" width="140" height="60" rx="5" class="expert"/>
  <text x="120" y="110" text-anchor="middle" class="label">Fine-tune on Math</text>
  <text x="120" y="125" text-anchor="middle" class="text">↓</text>
  <text x="120" y="140" text-anchor="middle" class="text" font-weight="bold">Math expert</text>

  <!-- Code expert -->
  <rect x="280" y="90" width="140" height="60" rx="5" class="expert"/>
  <text x="350" y="110" text-anchor="middle" class="label">Fine-tune on Code</text>
  <text x="350" y="125" text-anchor="middle" class="text">↓</text>
  <text x="350" y="140" text-anchor="middle" class="text" font-weight="bold">Code expert</text>

  <!-- Writing expert -->
  <rect x="510" y="90" width="140" height="60" rx="5" class="expert"/>
  <text x="580" y="110" text-anchor="middle" class="label">Fine-tune on Writing</text>
  <text x="580" y="125" text-anchor="middle" class="text">↓</text>
  <text x="580" y="140" text-anchor="middle" class="text" font-weight="bold">Writing expert</text>

  <!-- Converge to merge -->
  <path d="M 120 150 L 350 200" class="arrow"/>
  <path d="M 350 150 L 350 200" class="arrow"/>
  <path d="M 580 150 L 350 200" class="arrow"/>

  <!-- Merge operation -->
  <rect x="200" y="200" width="300" height="50" rx="5" class="box"/>
  <text x="350" y="222" text-anchor="middle" class="text" font-weight="bold">TIES-DARE merge</text>
  <text x="350" y="240" text-anchor="middle" class="label">(λ=[0.33, 0.33, 0.34])</text>

  <!-- Arrow down -->
  <path d="M 350 250 L 350 280" class="darrow"/>

  <!-- Generalist model -->
  <rect x="200" y="280" width="300" height="50" rx="5" class="result"/>
  <text x="350" y="302" text-anchor="middle" class="text" font-weight="bold">Generalist model</text>
  <text x="350" y="320" text-anchor="middle" class="label">(85-95% on all tasks)</text>

  <!-- Optional distillation arrow -->
  <path d="M 350 330 L 350 360" class="darrow"/>
  <text x="390" y="350" class="label" font-style="italic">Optional</text>
  <text x="350" y="375" text-anchor="middle" class="label">distillation</text>

  <!-- Final efficient model -->
  <rect x="200" y="390" width="300" height="50" rx="5" class="result"/>
  <text x="350" y="412" text-anchor="middle" class="text" font-weight="bold">Efficient generalist</text>
  <text x="350" y="430" text-anchor="middle" class="label">(90% of merged quality, 3x faster)</text>
</svg>