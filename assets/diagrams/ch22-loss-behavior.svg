<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-red-light { fill: #FFCDD2; }
    .bg-green-light { fill: #C8E6C9; }
    .bg-yellow { fill: #FFF9C4; }
    .bg-blue { fill: #E1F5FE; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-red-light { fill: #4a2d2d; }
      .bg-green-light { fill: #2d4a2d; }
      .bg-yellow { fill: #4a4a2d; }
      .bg-blue { fill: #1a3a4a; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    DPO Loss Function Behavior
  </text>

  
  <line x1="80" y1="500" x2="720" y2="500" stroke="#333" stroke-width="2" />
  <line x1="80" y1="80" x2="80" y2="500" stroke="#333" stroke-width="2" />

  
  <text x="400" y="540" font-size="14" text-anchor="middle" fill="#333">
    Log Probability Ratio: log(π_θ(y_w|x)/π_ref(y_w|x)) - log(π_θ(y_l|x)/π_ref(y_l|x))
  </text>
  <text x="400" y="560" font-size="11" text-anchor="middle" fill="#666">
    (Higher = model prefers chosen over rejected more than reference does)
  </text>

  
  <text x="30" y="290" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 30, 290)">
    Loss Value
  </text>

  
  <line x1="80" y1="500" x2="80" y2="505" stroke="#333" stroke-width="1" />
  <text x="80" y="520" font-size="10" text-anchor="middle" fill="#333">-4</text>

  <line x1="240" y1="500" x2="240" y2="505" stroke="#333" stroke-width="1" />
  <text x="240" y="520" font-size="10" text-anchor="middle" fill="#333">-2</text>

  <line x1="400" y1="500" x2="400" y2="505" stroke="#333" stroke-width="1" />
  <text x="400" y="520" font-size="10" text-anchor="middle" fill="#333">0</text>

  <line x1="560" y1="500" x2="560" y2="505" stroke="#333" stroke-width="1" />
  <text x="560" y="520" font-size="10" text-anchor="middle" fill="#333">2</text>

  <line x1="720" y1="500" x2="720" y2="505" stroke="#333" stroke-width="1" />
  <text x="720" y="520" font-size="10" text-anchor="middle" fill="#333">4</text>

  
  <line x1="75" y1="100" x2="80" y2="100" stroke="#333" stroke-width="1" />
  <text x="65" y="105" font-size="10" text-anchor="end" fill="#333">4</text>

  <line x1="75" y1="200" x2="80" y2="200" stroke="#333" stroke-width="1" />
  <text x="65" y="205" font-size="10" text-anchor="end" fill="#333">3</text>

  <line x1="75" y1="300" x2="80" y2="300" stroke="#333" stroke-width="1" />
  <text x="65" y="305" font-size="10" text-anchor="end" fill="#333">2</text>

  <line x1="75" y1="400" x2="80" y2="400" stroke="#333" stroke-width="1" />
  <text x="65" y="405" font-size="10" text-anchor="end" fill="#333">1</text>

  <line x1="75" y1="500" x2="80" y2="500" stroke="#333" stroke-width="1" />
  <text x="65" y="505" font-size="10" text-anchor="end" fill="#333">0</text>

  
  
  
  <path d="M 80,475 C 120,460 160,430 200,380 C 240,315 280,230 320,175 C 360,135 400,110 440,95 C 480,87 520,82 560,80 C 600,79 660,78 720,78" stroke="#4A90A4" stroke-width="3" fill="none" />

  
  
  <rect x="100" y="120" width="180" height="90" class="bg-red-light" opacity="0.3" rx="5" />
  <text x="190" y="145" font-size="12" font-weight="bold" text-anchor="middle" style="fill: #C62828 !important">
    High Loss
  </text>
  <text x="190" y="165" font-size="10" text-anchor="middle" style="fill: #C62828 !important">
    Model prefers rejected
  </text>
  <text x="190" y="180" font-size="10" text-anchor="middle" style="fill: #C62828 !important">
    response more than
  </text>
  <text x="190" y="195" font-size="10" text-anchor="middle" style="fill: #C62828 !important">
    reference does
  </text>

  
  <rect x="520" y="120" width="180" height="90" class="bg-green-light" opacity="0.3" rx="5" />
  <text x="610" y="145" font-size="12" font-weight="bold" text-anchor="middle" style="fill: #2E7D32 !important">
    Low Loss
  </text>
  <text x="610" y="165" font-size="10" text-anchor="middle" style="fill: #2E7D32 !important">
    Model strongly prefers
  </text>
  <text x="610" y="180" font-size="10" text-anchor="middle" style="fill: #2E7D32 !important">
    chosen response over
  </text>
  <text x="610" y="195" font-size="10" text-anchor="middle" style="fill: #2E7D32 !important">
    rejected response
  </text>

  
  <rect x="100" y="240" width="270" height="70" class="bg-yellow" stroke="#F9A825" stroke-width="2" rx="5" />
  <text x="235" y="260" font-size="11" font-weight="bold" text-anchor="middle" style="fill: #333 !important">
    Key Insight 1: Asymptotic Behavior
  </text>
  <text x="235" y="278" font-size="9" text-anchor="middle" style="fill: #666 !important">
    Loss → 0 as ratio → +∞ (strong preference aligned)
  </text>
  <text x="235" y="293" font-size="9" text-anchor="middle" style="fill: #666 !important">
    Loss → ∞ as ratio → -∞ (preference anti-aligned)
  </text>

  <rect x="430" y="240" width="270" height="70" class="bg-yellow" stroke="#F9A825" stroke-width="2" rx="5" />
  <text x="565" y="260" font-size="11" font-weight="bold" text-anchor="middle" style="fill: #333 !important">
    Key Insight 2: Gradient Behavior
  </text>
  <text x="565" y="278" font-size="9" text-anchor="middle" style="fill: #666 !important">
    Steep gradients when ratio near 0 (uncertain)
  </text>
  <text x="565" y="293" font-size="9" text-anchor="middle" style="fill: #666 !important">
    Small gradients when ratio is large (confident)
  </text>

  
  <rect x="200" y="350" width="400" height="60" class="bg-blue" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="400" y="370" font-size="12" font-weight="bold" text-anchor="middle" style="fill: #333 !important">
    Effect of β (temperature parameter)
  </text>
  <text x="400" y="390" font-size="10" text-anchor="middle" style="fill: #666 !important">
    Higher β → Steeper curve → Stronger KL penalty → Stay closer to reference
  </text>
  <text x="400" y="405" font-size="10" text-anchor="middle" style="fill: #666 !important">
    Lower β → Flatter curve → Weaker KL penalty → More freedom to optimize
  </text>

  
  <line x1="400" y1="80" x2="400" y2="500" stroke="#999" stroke-width="1" stroke-dasharray="5,5" />
  <text x="410" y="95" font-size="9" fill="#666">No preference</text>
  <text x="410" y="107" font-size="9" fill="#666">(ratio = 0)</text>
</svg>