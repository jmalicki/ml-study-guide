<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    DPO Loss Function Behavior
  </text>

  <!-- Axes -->
  <line x1="80" y1="500" x2="720" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="500" stroke="#333" stroke-width="2"/>

  <!-- X-axis label -->
  <text x="400" y="540" font-size="14" text-anchor="middle" fill="#333">
    Log Probability Ratio: log(π_θ(y_w|x)/π_ref(y_w|x)) - log(π_θ(y_l|x)/π_ref(y_l|x))
  </text>
  <text x="400" y="560" font-size="11" text-anchor="middle" fill="#666">
    (Higher = model prefers chosen over rejected more than reference does)
  </text>

  <!-- Y-axis label -->
  <text x="30" y="290" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 30, 290)">
    Loss Value
  </text>

  <!-- X-axis tick marks and labels -->
  <line x1="80" y1="500" x2="80" y2="505" stroke="#333" stroke-width="1"/>
  <text x="80" y="520" font-size="10" text-anchor="middle" fill="#333">-4</text>

  <line x1="240" y1="500" x2="240" y2="505" stroke="#333" stroke-width="1"/>
  <text x="240" y="520" font-size="10" text-anchor="middle" fill="#333">-2</text>

  <line x1="400" y1="500" x2="400" y2="505" stroke="#333" stroke-width="1"/>
  <text x="400" y="520" font-size="10" text-anchor="middle" fill="#333">0</text>

  <line x1="560" y1="500" x2="560" y2="505" stroke="#333" stroke-width="1"/>
  <text x="560" y="520" font-size="10" text-anchor="middle" fill="#333">2</text>

  <line x1="720" y1="500" x2="720" y2="505" stroke="#333" stroke-width="1"/>
  <text x="720" y="520" font-size="10" text-anchor="middle" fill="#333">4</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="75" y1="100" x2="80" y2="100" stroke="#333" stroke-width="1"/>
  <text x="65" y="105" font-size="10" text-anchor="end" fill="#333">4</text>

  <line x1="75" y1="200" x2="80" y2="200" stroke="#333" stroke-width="1"/>
  <text x="65" y="205" font-size="10" text-anchor="end" fill="#333">3</text>

  <line x1="75" y1="300" x2="80" y2="300" stroke="#333" stroke-width="1"/>
  <text x="65" y="305" font-size="10" text-anchor="end" fill="#333">2</text>

  <line x1="75" y1="400" x2="80" y2="400" stroke="#333" stroke-width="1"/>
  <text x="65" y="405" font-size="10" text-anchor="end" fill="#333">1</text>

  <line x1="75" y1="500" x2="80" y2="500" stroke="#333" stroke-width="1"/>
  <text x="65" y="505" font-size="10" text-anchor="end" fill="#333">0</text>

  <!-- Loss curve: -log(sigma(beta * x)) where beta = 1 -->
  <!-- Sigmoid decreases from 1 to 0 as x goes from +inf to -inf -->
  <!-- -log(sigma(x)) increases from 0 to inf as x goes from +inf to -inf -->
  <path d="M 80,475 C 120,460 160,430 200,380 C 240,315 280,230 320,175 C 360,135 400,110 440,95 C 480,87 520,82 560,80 C 600,79 660,78 720,78"
        stroke="#4A90A4" stroke-width="3" fill="none"/>

  <!-- Annotations -->
  <!-- Bad region (left) -->
  <rect x="100" y="120" width="180" height="90" fill="#FFCDD2" opacity="0.3" rx="5"/>
  <text x="190" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="#C62828">
    High Loss
  </text>
  <text x="190" y="165" font-size="10" text-anchor="middle" fill="#C62828">
    Model prefers rejected
  </text>
  <text x="190" y="180" font-size="10" text-anchor="middle" fill="#C62828">
    response more than
  </text>
  <text x="190" y="195" font-size="10" text-anchor="middle" fill="#C62828">
    reference does
  </text>

  <!-- Good region (right) -->
  <rect x="520" y="120" width="180" height="90" fill="#C8E6C9" opacity="0.3" rx="5"/>
  <text x="610" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">
    Low Loss
  </text>
  <text x="610" y="165" font-size="10" text-anchor="middle" fill="#2E7D32">
    Model strongly prefers
  </text>
  <text x="610" y="180" font-size="10" text-anchor="middle" fill="#2E7D32">
    chosen response over
  </text>
  <text x="610" y="195" font-size="10" text-anchor="middle" fill="#2E7D32">
    rejected response
  </text>

  <!-- Key insight boxes -->
  <rect x="100" y="240" width="270" height="70" fill="#FFF9C4" stroke="#F9A825" stroke-width="2" rx="5"/>
  <text x="235" y="260" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">
    Key Insight 1: Asymptotic Behavior
  </text>
  <text x="235" y="278" font-size="9" text-anchor="middle" fill="#666">
    Loss → 0 as ratio → +∞ (strong preference aligned)
  </text>
  <text x="235" y="293" font-size="9" text-anchor="middle" fill="#666">
    Loss → ∞ as ratio → -∞ (preference anti-aligned)
  </text>

  <rect x="430" y="240" width="270" height="70" fill="#FFF9C4" stroke="#F9A825" stroke-width="2" rx="5"/>
  <text x="565" y="260" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">
    Key Insight 2: Gradient Behavior
  </text>
  <text x="565" y="278" font-size="9" text-anchor="middle" fill="#666">
    Steep gradients when ratio near 0 (uncertain)
  </text>
  <text x="565" y="293" font-size="9" text-anchor="middle" fill="#666">
    Small gradients when ratio is large (confident)
  </text>

  <!-- Beta parameter effect -->
  <rect x="200" y="350" width="400" height="60" fill="#E1F5FE" stroke="#4A90A4" stroke-width="2" rx="5"/>
  <text x="400" y="370" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Effect of β (temperature parameter)
  </text>
  <text x="400" y="390" font-size="10" text-anchor="middle" fill="#666">
    Higher β → Steeper curve → Stronger KL penalty → Stay closer to reference
  </text>
  <text x="400" y="405" font-size="10" text-anchor="middle" fill="#666">
    Lower β → Flatter curve → Weaker KL penalty → More freedom to optimize
  </text>

  <!-- Reference line at x=0 -->
  <line x1="400" y1="80" x2="400" y2="500" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="410" y="95" font-size="9" fill="#666">No preference</text>
  <text x="410" y="107" font-size="9" fill="#666">(ratio = 0)</text>
</svg>
