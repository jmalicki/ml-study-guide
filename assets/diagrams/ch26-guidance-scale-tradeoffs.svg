<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Title -->
  <text x="400" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Guidance Scale Trade-offs
  </text>

  <!-- Prompt example -->
  <rect x="250" y="50" width="300" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="400" y="70" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
    Example prompt: "a red apple on a wooden table"
  </text>

  <!-- Grid for different guidance scales -->

  <!-- s = 1.0 -->
  <g id="scale-1">
    <rect x="50" y="110" width="150" height="150" fill="#E57373" opacity="0.1" stroke="#E57373" stroke-width="2" rx="5"/>
    <text x="125" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">s = 1.0</text>

    <!-- Simulated diverse outputs -->
    <circle cx="90" cy="170" r="15" fill="#ff6b6b" opacity="0.4"/>
    <circle cx="160" cy="180" r="15" fill="#ff8787" opacity="0.4"/>
    <circle cx="120" cy="210" r="15" fill="#ffa8a8" opacity="0.4"/>
    <text x="125" y="245" font-size="9" text-anchor="middle" fill="#666">Diverse outputs</text>

    <text x="125" y="275" font-size="10" font-weight="bold" text-anchor="middle" fill="#E57373">High Diversity</text>
    <text x="125" y="290" font-size="9" text-anchor="middle" fill="#666">✓ Creative variation</text>
    <text x="125" y="303" font-size="9" text-anchor="middle" fill="#666">✗ Weak prompt adherence</text>
  </g>

  <!-- s = 7.5 (optimal) -->
  <g id="scale-7">
    <rect x="325" y="110" width="150" height="150" fill="#4A90A4" opacity="0.1" stroke="#4A90A4" stroke-width="3" rx="5"/>
    <text x="400" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">s = 7.5</text>
    <text x="400" y="152" font-size="10" text-anchor="middle" fill="#4A90A4">(Typical)</text>

    <!-- Balanced outputs -->
    <circle cx="365" cy="180" r="15" fill="#ff4444" opacity="0.7"/>
    <circle cx="400" cy="190" r="15" fill="#ff4444" opacity="0.7"/>
    <circle cx="435" cy="180" r="15" fill="#ff4444" opacity="0.7"/>
    <text x="400" y="220" font-size="9" text-anchor="middle" fill="#666">Balanced outputs</text>

    <text x="400" y="275" font-size="10" font-weight="bold" text-anchor="middle" fill="#4A90A4">Balanced ⭐</text>
    <text x="400" y="290" font-size="9" text-anchor="middle" fill="#666">✓ Good prompt adherence</text>
    <text x="400" y="303" font-size="9" text-anchor="middle" fill="#666">✓ Reasonable diversity</text>
  </g>

  <!-- s = 20.0 -->
  <g id="scale-20">
    <rect x="600" y="110" width="150" height="150" fill="#81C784" opacity="0.1" stroke="#81C784" stroke-width="2" rx="5"/>
    <text x="675" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">s = 20.0</text>

    <!-- Nearly identical outputs -->
    <circle cx="665" cy="185" r="15" fill="#cc0000" opacity="0.9"/>
    <circle cx="670" cy="190" r="15" fill="#cc0000" opacity="0.9"/>
    <circle cx="675" cy="188" r="15" fill="#cc0000" opacity="0.9"/>
    <text x="675" y="220" font-size="9" text-anchor="middle" fill="#666">Similar outputs</text>

    <text x="675" y="275" font-size="10" font-weight="bold" text-anchor="middle" fill="#81C784">Low Diversity</text>
    <text x="675" y="290" font-size="9" text-anchor="middle" fill="#666">✓ Strong prompt match</text>
    <text x="675" y="303" font-size="9" text-anchor="middle" fill="#666">✗ May oversaturate/artifact</text>
  </g>

  <!-- Visualization axis -->
  <g id="axis">
    <line x1="100" y1="360" x2="700" y2="360" stroke="#333" stroke-width="2"/>
    <defs>
      <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="0">
        <polygon points="0 0, 10 3, 0 6" fill="#333"/>
      </marker>
      <marker id="arrowL" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="180">
        <polygon points="0 0, 10 3, 0 6" fill="#333"/>
      </marker>
    </defs>
    <line x1="100" y1="360" x2="80" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowL)"/>
    <line x1="700" y1="360" x2="720" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowR)"/>

    <!-- Scale markers -->
    <line x1="125" y1="355" x2="125" y2="365" stroke="#E57373" stroke-width="2"/>
    <text x="125" y="380" font-size="10" text-anchor="middle" fill="#E57373" font-weight="bold">1</text>

    <line x1="400" y1="355" x2="400" y2="365" stroke="#4A90A4" stroke-width="3"/>
    <text x="400" y="380" font-size="10" text-anchor="middle" fill="#4A90A4" font-weight="bold">7.5</text>

    <line x1="675" y1="355" x2="675" y2="365" stroke="#81C784" stroke-width="2"/>
    <text x="675" y="380" font-size="10" text-anchor="middle" fill="#81C784" font-weight="bold">20</text>

    <text x="400" y="400" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">Guidance Scale (s)</text>
  </g>

  <!-- Trade-off labels -->
  <g id="tradeoff-labels">
    <text x="50" y="430" font-size="11" fill="#E57373" font-weight="bold">← More Diverse</text>
    <text x="750" y="430" font-size="11" fill="#81C784" font-weight="bold" text-anchor="end">More Aligned →</text>
    <text x="400" y="430" font-size="10" fill="#666" text-anchor="middle">(creativity vs. prompt fidelity)</text>
  </g>
</svg>
