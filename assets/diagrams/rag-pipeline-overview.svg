<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" style="max-width: 950px; width: 100%; height: auto">

  <style>
    text { fill: #000000; }
    .bg-main { fill: #f5f5f5; }
    .bg-box { fill: white; }

    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .bg-main { fill: #1a1a1a; }
      .bg-box { fill: #2d2d2d; }
      text[fill="#333"] { fill: #ffffff; }
      text[fill="#666"] { fill: #cccccc; }
      text[fill="#1565C0"] { fill: #64B5F6; }
      text[fill="#2E7D32"] { fill: #81C784; }
      text[fill="#7B1FA2"] { fill: #CE93D8; }
      text[fill="#E65100"] { fill: #FFB74D; }
      text[fill="#C62828"] { fill: #EF5350; }
      rect[stroke="#1565C0"] { stroke: #64B5F6; }
      rect[stroke="#2E7D32"] { stroke: #81C784; }
      rect[stroke="#7B1FA2"] { stroke: #CE93D8; }
      rect[stroke="#E65100"] { stroke: #FFB74D; }
      line[stroke="#666"] { stroke: #888; }
    }
  </style>

  <rect width="950" height="500" class="bg-main"/>

  <!-- Title -->
  <text x="475" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">RAG Pipeline: Retrieval-Augmented Generation</text>

  <!-- Indexing Phase (Top) -->
  <rect x="20" y="50" width="910" height="150" fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
  <text x="40" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">INDEXING PHASE (Offline)</text>

  <!-- Documents -->
  <g transform="translate(50, 95)">
    <rect x="0" y="0" width="100" height="80" class="bg-box" stroke="#666" stroke-width="1" rx="5"/>
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Documents</text>
    <rect x="10" y="35" width="35" height="35" fill="#E3F2FD" stroke="#1565C0" stroke-width="1" rx="2"/>
    <text x="27" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#1565C0">PDF</text>
    <rect x="55" y="35" width="35" height="35" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" rx="2"/>
    <text x="72" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#2E7D32">Web</text>
  </g>

  <!-- Arrow -->
  <line x1="160" y1="135" x2="190" y2="135" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Chunking -->
  <g transform="translate(200, 95)">
    <rect x="0" y="0" width="120" height="80" class="bg-box" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Chunking</text>
    <text x="60" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">Split into</text>
    <text x="60" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">256-1024 tokens</text>
    <rect x="15" y="63" width="25" height="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="2"/>
    <rect x="47" y="63" width="25" height="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="2"/>
    <rect x="79" y="63" width="25" height="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="2"/>
  </g>

  <!-- Arrow -->
  <line x1="330" y1="135" x2="360" y2="135" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Embedding Model -->
  <g transform="translate(370, 95)">
    <rect x="0" y="0" width="140" height="80" class="bg-box" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">Embedding Model</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">text-embedding-3</text>
    <text x="70" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">or e5-large</text>
    <text x="70" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#2E7D32">→ 768/1536-dim vectors</text>
  </g>

  <!-- Arrow -->
  <line x1="520" y1="135" x2="550" y2="135" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vector Index -->
  <g transform="translate(560, 95)">
    <rect x="0" y="0" width="140" height="80" fill="#E65100" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="70" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Vector Index</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="white">FAISS / Pinecone</text>
    <text x="70" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="white">Weaviate / Chroma</text>
    <rect x="20" y="65" width="8" height="8" fill="white" rx="1"/>
    <rect x="35" y="65" width="8" height="8" fill="white" rx="1"/>
    <rect x="50" y="65" width="8" height="8" fill="white" rx="1"/>
    <rect x="65" y="65" width="8" height="8" fill="white" rx="1"/>
    <rect x="80" y="65" width="8" height="8" fill="white" rx="1"/>
    <rect x="95" y="65" width="8" height="8" fill="white" rx="1"/>
    <rect x="110" y="65" width="8" height="8" fill="white" rx="1"/>
  </g>

  <!-- Query Phase (Bottom) -->
  <rect x="20" y="220" width="910" height="260" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
  <text x="40" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">QUERY PHASE (Online)</text>

  <!-- User Query -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="120" height="60" class="bg-box" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">User Query</text>
    <text x="60" y="45" font-family="Georgia, serif" font-size="9" font-style="italic" text-anchor="middle" fill="#666">"What is RAG?"</text>
  </g>

  <!-- Arrow down to embedding -->
  <line x1="110" y1="335" x2="110" y2="365" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Query Embedding -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="120" height="50" class="bg-box" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="60" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2E7D32">Embed Query</text>
    <text x="60" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">[0.12, -0.45, ...]</text>
  </g>

  <!-- Arrow to retrieval -->
  <line x1="180" y1="395" x2="230" y2="395" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vector Search -->
  <!-- lint-disable spacing -->
  <g transform="translate(240, 360)">
    <rect x="0" y="0" width="140" height="70" fill="#E65100" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="70" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Vector Search</text>
    <text x="70" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="white">Find k nearest</text>
    <text x="70" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="white">neighbors via ANN</text>
  </g>

  <!-- Connection from index to search -->
  <path d="M 630 180 L 630 220 L 310 220 L 310 355" stroke="#E65100" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>

  <!-- Arrow to retrieved docs -->
  <line x1="390" y1="395" x2="440" y2="395" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Retrieved Chunks -->
  <g transform="translate(450, 355)">
    <rect x="0" y="0" width="140" height="85" class="bg-box" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="70" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Retrieved Chunks</text>
    <rect x="10" y="30" width="120" height="15" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="2"/>
    <text x="70" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#7B1FA2">Chunk 1 (score: 0.92)</text>
    <rect x="10" y="50" width="120" height="15" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="2"/>
    <text x="70" y="61" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#7B1FA2">Chunk 2 (score: 0.87)</text>
    <rect x="10" y="70" width="120" height="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1" rx="2"/>
    <text x="70" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="7" text-anchor="middle" fill="#7B1FA2">...</text>
  </g>

  <!-- Arrow to LLM -->
  <line x1="600" y1="395" x2="650" y2="395" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plus sign -->
  <text x="625" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#666">+</text>

  <!-- Query arrow to LLM -->
  <path d="M 110 270 L 110 260 L 700 260 L 700 355" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- LLM -->
  <g transform="translate(660, 350)">
    <rect x="0" y="0" width="120" height="90" fill="#C62828" stroke="#C62828" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">LLM</text>
    <text x="60" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="white">GPT-4 / Claude</text>
    <text x="60" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="white">Llama / Mistral</text>
    <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="white">Context: Query + Chunks</text>
  </g>

  <!-- Arrow to response -->
  <line x1="790" y1="395" x2="820" y2="395" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Response -->
  <g transform="translate(830, 355)">
    <rect x="0" y="0" width="90" height="85" class="bg-box" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="45" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">Response</text>
    <text x="45" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#666">Grounded</text>
    <text x="45" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#666">answer with</text>
    <text x="45" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#666">citations</text>
    <text x="45" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E65100"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1565C0"/>
    </marker>
  </defs>
</svg>
