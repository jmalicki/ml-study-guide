<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for white text visibility */
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
    }
  </style><text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Token Visibility in Attention Mechanisms</text>

  
  <g id="bidirectional-visibility">
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Bidirectional Attention</text>
    <text x="400" y="88" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Token at position 2 can see all tokens</text>

    <g transform="translate(50, 110)">
      
      <g id="token0">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">The</text>
      </g>

      <g id="token1" transform="translate(110, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">quick</text>
      </g>

      <g id="token2" transform="translate(220, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#4A90A4" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">brown</text>
      </g>

      <g id="token3" transform="translate(330, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">fox</text>
      </g>

      <g id="token4" transform="translate(440, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">jumps</text>
      </g>

      
      
      <path d="M 220 20 L 100 20" stroke="#81C784" stroke-width="2" fill="none" marker-end="url(#arrowgreen)" />
      <path d="M 220 20 L 10 20" stroke="#81C784" stroke-width="2" fill="none" marker-end="url(#arrowgreen)" />

      
      <path d="M 310 20 L 330 20" stroke="#81C784" stroke-width="2" fill="none" marker-end="url(#arrowgreen)" />
      <path d="M 310 20 L 440 20" stroke="#81C784" stroke-width="2" fill="none" marker-end="url(#arrowgreen)" />

      
      <text x="265" y="70" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#81C784" font-weight="bold">Can see ALL tokens</text>
      <text x="265" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(both past and future)</text>
    </g>
  </g>

  
  <g id="causal-visibility" transform="translate(0, 210)">
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Causal Attention</text>
    <text x="400" y="88" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Token at position 2 can only see past tokens and itself</text>

    <g transform="translate(50, 110)">
      
      <g id="token0-causal">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">The</text>
      </g>

      <g id="token1-causal" transform="translate(110, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">quick</text>
      </g>

      <g id="token2-causal" transform="translate(220, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#4A90A4" stroke="#333" stroke-width="2" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#fff">brown</text>
      </g>

      <g id="token3-causal" transform="translate(330, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" opacity="0.3" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">fox</text>
        <line x1="0" y1="0" x2="90" y2="40" stroke="#E57373" stroke-width="2" />
        <line x1="0" y1="40" x2="90" y2="0" stroke="#E57373" stroke-width="2" />
      </g>

      <g id="token4-causal" transform="translate(440, 0)">
        <rect x="0" y="0" width="90" height="40" rx="5" fill="#E5E5E5" stroke="#333" stroke-width="2" opacity="0.3" />
        <text x="45" y="25" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">jumps</text>
        <line x1="0" y1="0" x2="90" y2="40" stroke="#E57373" stroke-width="2" />
        <line x1="0" y1="40" x2="90" y2="0" stroke="#E57373" stroke-width="2" />
      </g>

      
      <path d="M 220 20 L 100 20" stroke="#81C784" stroke-width="2" fill="none" marker-end="url(#arrowgreen)" />
      <path d="M 220 20 L 10 20" stroke="#81C784" stroke-width="2" fill="none" marker-end="url(#arrowgreen)" />

      
      <path d="M 310 20 L 330 20" stroke="#E57373" stroke-width="2" fill="none" stroke-dasharray="5,5" />
      <path d="M 310 20 L 440 20" stroke="#E57373" stroke-width="2" fill="none" stroke-dasharray="5,5" />

      
      <text x="110" y="70" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#81C784" font-weight="bold">Can see these</text>
      <text x="110" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(past tokens)</text>

      <text x="385" y="70" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#E57373" font-weight="bold">CANNOT see these</text>
      <text x="385" y="85" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(future tokens - masked)</text>
    </g>
  </g>

  
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#81C784" />
    </marker>
  </defs>

  
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="#4A90A4" stroke="#333" stroke-width="1" />
    <text x="25" y="15" font-family="Arial, sans-serif" font-size="11" fill="#333">= Current token (query)</text>

    <rect x="250" y="0" width="20" height="20" rx="3" fill="#E5E5E5" stroke="#333" stroke-width="1" />
    <text x="275" y="15" font-family="Arial, sans-serif" font-size="11" fill="#333">= Visible token</text>

    <rect x="450" y="0" width="20" height="20" rx="3" fill="#E5E5E5" stroke="#333" stroke-width="1" opacity="0.3" />
    <line x1="450" y1="0" x2="470" y2="20" stroke="#E57373" stroke-width="1" />
    <text x="475" y="15" font-family="Arial, sans-serif" font-size="11" fill="#333">= Masked token (invisible)</text>
  </g>
</svg>