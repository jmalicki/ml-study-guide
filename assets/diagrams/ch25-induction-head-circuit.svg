<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">

  <style>
    /* Light mode (default) */
    text { fill: #000000; font-family: system-ui, -apple-system, sans-serif; }
    .title { fill: #333333; font-weight: bold; }
    .label { fill: #666666; font-size: 13px; }
    .small-label { fill: #888888; font-size: 11px; }
    line, path { stroke: #333333; }
    rect.box { fill: #E8EAF6; stroke: #5C6BC0; }
    rect.embed { fill: #FFF9C4; stroke: #FBC02D; }
    rect.attn { fill: #B2DFDB; stroke: #26A69A; }
    circle.node { fill: #4A90A4; stroke: #2d5f6f; }

    /* Dark mode */

    /* Background colors */
    .bg-orange-light { fill: #FFF3E0; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .title { fill: #ffffff; }
      .label { fill: #cccccc; }
      .small-label { fill: #aaaaaa; }
      line, path { stroke: #cccccc; }

      rect.box { fill: #3d3d4d; stroke: #7986CB; }
      rect.embed { fill: #4d4520; stroke: #FDD835; }
      rect.attn { fill: #1a4d45; stroke: #4DB6AC; }
      circle.node { fill: #4fc3f7; stroke: #0288d1; }

      /* Darken specific colored backgrounds */
      rect[fill="#C8E6C9"] { fill: #2d4a2d; }
      rect[fill="#FFF3E0"] { fill: #4a3820; }

      /* Override dark inline text colors */
      text[fill="#000000"] { fill: #ffffff; }

      /* Keep text on colored backgrounds readable */
      .box-text, .embed-text, .attn-text { fill: #ffffff; }

      /* Handle specific colored text */
      text[fill="#2e7d32"],
      text[fill="#2E7D32"] { fill: #66bb6a; }
      text[fill="#e65100"],
      text[fill="#E65100"] { fill: #ff9800; }
      .bg-orange-light { fill: #e65100; }
    }
  </style>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title" font-size="20">
    Induction Head Circuit
  </text>

  <text x="400" y="55" text-anchor="middle" class="small-label">
    Two-layer attention circuit enabling pattern matching and in-context learning
  </text>

  <!-- Input sequence -->
  <text x="50" y="100" class="label" font-weight="bold">Input Sequence:</text>

  <g id="input-tokens">
    <rect x="200" y="85" width="80" height="30" class="embed" stroke-width="2"/>
    <text x="240" y="105" text-anchor="middle" class="embed-text">Input: cat</text>

    <rect x="290" y="85" width="80" height="30" class="embed" stroke-width="2"/>
    <text x="330" y="105" text-anchor="middle" class="embed-text">Output: dog</text>

    <rect x="380" y="85" width="80" height="30" class="embed" stroke-width="2"/>
    <text x="420" y="105" text-anchor="middle" class="embed-text">Input: bird</text>

    <rect x="470" y="85" width="80" height="30" class="embed" stroke-width="2"/>
    <text x="510" y="105" text-anchor="middle" class="embed-text" font-style="italic">?</text>
  </g>

  <!-- Layer 1: Previous Token Head -->
  <text x="50" y="180" class="label" font-weight="bold">Layer ℓ:</text>
  <text x="50" y="200" class="small-label">Previous-token head</text>

  <g id="layer1">
    <rect x="200" y="165" width="80" height="50" class="attn" stroke-width="2"/>
    <text x="240" y="185" text-anchor="middle" class="attn-text" font-size="12">Attn Head</text>
    <text x="240" y="202" text-anchor="middle" class="small-label" font-size="11">i → i-1</text>

    <!-- Arrows from input to layer 1 -->
    <path d="M 240 115 L 240 165" fill="none" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 330 115 L 280 165" fill="none" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-dashed)"/>
    <path d="M 420 115 L 260 165" fill="none" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-dashed)"/>
  </g>

  <!-- Annotation for layer 1 -->
  <text x="300" y="190" class="small-label" font-size="10">
    Copies previous
  </text>
  <text x="300" y="203" class="small-label" font-size="10">
    token embedding
  </text>

  <!-- Hidden state after layer 1 -->
  <text x="50" y="275" class="small-label">Hidden states:</text>

  <g id="hidden1">
    <rect x="200" y="250" width="80" height="40" class="box" stroke-width="2"/>
    <text x="240" y="270" text-anchor="middle" class="box-text" font-size="11">h₁[0]</text>
    <text x="240" y="282" text-anchor="middle" class="small-label" font-size="9">= embed[cat]</text>

    <rect x="290" y="250" width="80" height="40" class="box" stroke-width="2"/>
    <text x="330" y="270" text-anchor="middle" class="box-text" font-size="11">h₁[1]</text>
    <text x="330" y="282" text-anchor="middle" class="small-label" font-size="9">+ embed[cat]</text>

    <rect x="380" y="250" width="80" height="40" class="box" stroke-width="2"/>
    <text x="420" y="270" text-anchor="middle" class="box-text" font-size="11">h₁[2]</text>
    <text x="420" y="282" text-anchor="middle" class="small-label" font-size="9">+ embed[dog]</text>

    <rect x="470" y="250" width="80" height="40" class="box" stroke-width="2"/>
    <text x="510" y="270" text-anchor="middle" class="box-text" font-size="11">h₁[3]</text>
    <text x="510" y="282" text-anchor="middle" class="small-label" font-size="9">+ embed[bird]</text>

    <!-- Arrows from layer 1 to hidden states -->
    <path d="M 240 215 L 240 250" fill="none" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 240 215 L 330 250" fill="none" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
    <path d="M 240 215 L 420 250" fill="none" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
    <path d="M 240 215 L 510 250" fill="none" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
  </g>

  <!-- Layer 2: Induction Head -->
  <text x="50" y="360" class="label" font-weight="bold">Layer ℓ+1:</text>
  <text x="50" y="380" class="small-label">Induction head</text>

  <g id="layer2">
    <rect x="450" y="345" width="100" height="60" class="attn" stroke-width="2"/>
    <text x="500" y="365" text-anchor="middle" class="attn-text" font-size="12">Induction</text>
    <text x="500" y="378" text-anchor="middle" class="attn-text" font-size="12">Head</text>
    <text x="500" y="396" text-anchor="middle" class="small-label" font-size="10">Match previous</text>
  </g>

  <!-- Attention pattern visualization -->
  <g id="attention-pattern">
    <!-- Position 3 attending to position 1 (where previous token = "bird") -->
    <circle cx="510" cy="315" r="6" class="node" stroke-width="2"/>
    <text x="525" y="318" class="small-label" font-size="9">pos 3</text>

    <!-- Attention line to position 1 -->
    <path d="M 510 315 Q 420 330 330 285" fill="none" stroke="#E91E63" stroke-width="3" marker-end="url(#arrowhead-pink)"/>
    <text x="390" y="310" font-size="11" fill="#E91E63" font-weight="bold">Strong attention</text>

    <!-- Why: "dog" follows "cat", and "bird" is like "cat" -->
    <circle cx="330" cy="280" r="6" fill="#E91E63" stroke="#C2185B" stroke-width="2"/>
    <text x="220" y="320" class="small-label" font-size="10">Match: previous token</text>
    <text x="220" y="333" class="small-label" font-size="10">of pos 1 = "cat"</text>
  </g>

  <!-- Output -->
  <text x="50" y="470" class="label" font-weight="bold">Output:</text>

  <g id="output">
    <rect x="450" y="450" width="100" height="40" class="box" stroke-width="2" fill="#C8E6C9" stroke="#66BB6A"/>
    <text x="500" y="470" text-anchor="middle" font-size="12" font-weight="bold">Predicts:</text>
    <text x="500" y="485" text-anchor="middle" font-size="13" font-weight="bold">"Output: ..."</text>

    <!-- Arrow from induction head to output -->
    <path d="M 500 405 L 500 450" fill="none" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Explanation box -->
  <g id="explanation">
    <rect x="580" y="160" width="200" height="280" class="bg-orange-light" stroke="#FB8C00" stroke-width="2" rx="5"/>

    <text x="680" y="185" text-anchor="middle" font-weight="bold" font-size="13">
      How It Works:
    </text>

    <text x="590" y="210" font-size="11">
      <tspan x="590" dy="0">1. Previous-token head</tspan>
      <tspan x="595" dy="15">copies position info</tspan>
      <tspan x="595" dy="15">from i-1 to i</tspan>

      <tspan x="590" dy="30">2. Hidden state h₁[i] now</tspan>
      <tspan x="595" dy="15">contains info about</tspan>
      <tspan x="595" dy="15">current AND previous</tspan>
      <tspan x="595" dy="15">tokens</tspan>

      <tspan x="590" dy="30">3. Induction head at pos 3</tspan>
      <tspan x="595" dy="15">queries: "what came</tspan>
      <tspan x="595" dy="15">after 'cat' before?"</tspan>

      <tspan x="590" dy="30">4. Finds pos 1 (where</tspan>
      <tspan x="595" dy="15">prev token = "cat")</tspan>

      <tspan x="590" dy="30">5. Copies what came</tspan>
      <tspan x="595" dy="15">next: "Output: dog"</tspan>

      <tspan x="590" dy="30">6. Completes pattern!</tspan>
    </text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333333"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666666"/>
    </marker>
    <marker id="arrowhead-pink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E91E63"/>
    </marker>
  </defs>

  <!-- Footer note -->
  <text x="400" y="570" text-anchor="middle" class="small-label" font-size="10" font-style="italic">
    This circuit enables transformers to learn patterns from context without parameter updates
  </text>
</svg>
