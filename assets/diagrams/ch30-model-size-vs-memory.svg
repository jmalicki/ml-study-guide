<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        fill: #000000;
      }
      @media (prefers-color-scheme: dark) {
        text { fill: #ffffff; }
        .axis-line { stroke: #ffffff; }
        .grid-line { stroke: #444444; }
        .region-label { fill: #ffffff; }
        /* Darken colored backgrounds for better contrast in dark mode */
        .region-dp { fill: #4a7c4e; opacity: 0.3; }
        .region-zero { fill: #9d7d3d; opacity: 0.3; }
        .region-tp { fill: #2d5f6f; opacity: 0.3; }
        .region-3d { fill: #8b3d3d; opacity: 0.3; }
      }
      .axis-line { stroke: #000000; stroke-width: 2; }
      .grid-line { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 4,4; }
      .arrow { fill: none; stroke: #000000; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .arrow { stroke: #ffffff; }
      }
      .region-dp { fill: #81C784; opacity: 0.3; }
      .region-zero { fill: #FFB74D; opacity: 0.3; }
      .region-tp { fill: #4A90A4; opacity: 0.3; }
      .region-3d { fill: #E57373; opacity: 0.3; }
      .region-label { font-size: 14px; font-weight: 600; }
      .axis-label { font-size: 16px; font-weight: 600; }
      .title { font-size: 20px; font-weight: 700; }
      .annotation { font-size: 12px; font-style: italic; }
      .boundary { stroke: #333333; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
      @media (prefers-color-scheme: dark) {
        .boundary { stroke: #cccccc; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Model Size vs GPU Memory: Parallelism Decision Regions</text>

  <!-- Axes -->
  <line x1="80" y1="520" x2="750" y2="520" class="axis-line"/>
  <line x1="80" y1="520" x2="80" y2="70" class="axis-line"/>

  <!-- Arrows -->
  <path d="M 750 520 L 740 515 M 750 520 L 740 525" class="arrow"/>
  <path d="M 80 70 L 75 80 M 80 70 L 85 80" class="arrow"/>

  <!-- Axis labels -->
  <text x="415" y="560" text-anchor="middle" class="axis-label">Model Size (Billions of Parameters)</text>
  <text x="40" y="300" text-anchor="middle" class="axis-label" transform="rotate(-90 40 300)">GPU Memory Available (GB)</text>

  <!-- Grid lines and labels -->
  <!-- Model size markers -->
  <line x1="150" y1="520" x2="150" y2="75" class="grid-line"/>
  <text x="150" y="540" text-anchor="middle" font-size="12">7B</text>

  <line x1="280" y1="520" x2="280" y2="75" class="grid-line"/>
  <text x="280" y="540" text-anchor="middle" font-size="12">13B</text>

  <line x1="410" y1="520" x2="410" y2="75" class="grid-line"/>
  <text x="410" y="540" text-anchor="middle" font-size="12">70B</text>

  <line x1="540" y1="520" x2="540" y2="75" class="grid-line"/>
  <text x="540" y="540" text-anchor="middle" font-size="12">175B</text>

  <line x1="670" y1="520" x2="670" y2="75" class="grid-line"/>
  <text x="670" y="540" text-anchor="middle" font-size="12">500B</text>

  <!-- Memory markers -->
  <line x1="80" y1="470" x2="750" y2="470" class="grid-line"/>
  <text x="65" y="475" text-anchor="end" font-size="12">16</text>

  <line x1="80" y1="370" x2="750" y2="370" class="grid-line"/>
  <text x="65" y="375" text-anchor="end" font-size="12">40</text>

  <line x1="80" y1="270" x2="750" y2="270" class="grid-line"/>
  <text x="65" y="275" text-anchor="end" font-size="12">80</text>

  <line x1="80" y1="170" x2="750" y2="170" class="grid-line"/>
  <text x="65" y="175" text-anchor="end" font-size="12">320</text>

  <!-- Region 1: Data Parallelism (DP) - Small models, any memory -->
  <polygon points="80,520 230,520 230,75 80,75" class="region-dp"/>
  <text x="155" y="250" text-anchor="middle" class="region-label">Data</text>
  <text x="155" y="270" text-anchor="middle" class="region-label">Parallelism</text>
  <text x="155" y="290" text-anchor="middle" class="region-label">(DP)</text>
  <text x="155" y="315" text-anchor="middle" class="annotation">Model fits</text>
  <text x="155" y="330" text-anchor="middle" class="annotation">in single GPU</text>

  <!-- Region 2: ZeRO-2/3 or FSDP - Medium models -->
  <polygon points="230,520 390,520 390,270 230,370" class="region-zero"/>
  <text x="310" y="380" text-anchor="middle" class="region-label">ZeRO-2/3</text>
  <text x="310" y="400" text-anchor="middle" class="region-label">or FSDP</text>
  <text x="310" y="425" text-anchor="middle" class="annotation">Shard params</text>
  <text x="310" y="440" text-anchor="middle" class="annotation">&amp; optimizer</text>

  <!-- Region 3: Tensor Parallelism (TP) - Large models, good interconnect -->
  <polygon points="390,520 590,520 590,170 390,270" class="region-tp"/>
  <text x="490" y="340" text-anchor="middle" class="region-label">Tensor</text>
  <text x="490" y="360" text-anchor="middle" class="region-label">Parallelism</text>
  <text x="490" y="380" text-anchor="middle" class="region-label">(TP)</text>
  <text x="490" y="405" text-anchor="middle" class="annotation">Split layers</text>
  <text x="490" y="420" text-anchor="middle" class="annotation">within node</text>

  <!-- Region 4: 3D Parallelism (TP + PP + DP) - Very large models -->
  <polygon points="590,520 750,520 750,75 590,170" class="region-3d"/>
  <text x="670" y="280" text-anchor="middle" class="region-label">3D Parallelism</text>
  <text x="670" y="300" text-anchor="middle" class="region-label">(TP+PP+DP)</text>
  <text x="670" y="325" text-anchor="middle" class="annotation">Combine all</text>
  <text x="670" y="340" text-anchor="middle" class="annotation">strategies</text>

  <!-- Boundaries with annotations -->
  <path d="M 230 520 L 230 370 L 390 270 L 590 170 L 750 75" class="boundary"/>

  <!-- Example points -->
  <circle cx="150" cy="270" r="5" fill="#2E7D32"/>
  <text x="150" y="255" text-anchor="middle" font-size="11" font-weight="600">LLaMA-7B</text>

  <circle cx="410" cy="270" r="5" fill="#F57C00"/>
  <text x="410" y="255" text-anchor="middle" font-size="11" font-weight="600">LLaMA-70B</text>

  <circle cx="540" cy="120" r="5" fill="#C62828"/>
  <text x="540" y="105" text-anchor="middle" font-size="11" font-weight="600">GPT-3</text>

  <!-- Legend -->
  <rect x="580" y="430" width="15" height="15" class="region-dp"/>
  <text x="600" y="442" font-size="12">DP only</text>

  <rect x="580" y="450" width="15" height="15" class="region-zero"/>
  <text x="600" y="462" font-size="12">ZeRO/FSDP</text>

  <rect x="580" y="470" width="15" height="15" class="region-tp"/>
  <text x="600" y="482" font-size="12">TP required</text>

  <rect x="580" y="490" width="15" height="15" class="region-3d"/>
  <text x="600" y="502" font-size="12">3D parallelism</text>
</svg>
