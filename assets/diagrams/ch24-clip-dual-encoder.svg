<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" style="max-width: 900px; width: 100%; height: auto">

  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }
    .bg-box { fill: white; }
    .bg-image { fill: #E3F2FD; }
    .bg-text { fill: #FFF3E0; }
    .bg-encoder { fill: #E8F5E9; }
    .bg-embed { fill: #F3E5F5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      .bg-main { fill: #1a1a1a; }
      .bg-box { fill: #2d2d2d; }
      .bg-image { fill: #1a3a5c; }
      .bg-text { fill: #5c3a1a; }
      .bg-encoder { fill: #1a3a1a; }
      .bg-embed { fill: #3a1a3a; }

      text[fill="#1565C0"] { fill: #64B5F6; }
      text[fill="#E65100"] { fill: #FFB74D; }
      text[fill="#2E7D32"] { fill: #81C784; }
      text[fill="#7B1FA2"] { fill: #CE93D8; }
      text[fill="#333"] { fill: #ffffff; }
      text[fill="#666"] { fill: #cccccc; }

      rect[stroke="#1565C0"] { stroke: #64B5F6; }
      rect[stroke="#E65100"] { stroke: #FFB74D; }
      rect[stroke="#2E7D32"] { stroke: #81C784; }
      rect[stroke="#7B1FA2"] { stroke: #CE93D8; }

      line[stroke="#1565C0"] { stroke: #64B5F6; }
      line[stroke="#E65100"] { stroke: #FFB74D; }
      path[stroke="#7B1FA2"] { stroke: #CE93D8; }
    }
  </style>

  <rect width="900" height="550" class="bg-main"/>

  <!-- Title -->
  <text x="450" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">CLIP: Dual-Encoder Architecture for Vision-Language Alignment</text>

  <!-- Left side: Image Branch -->
  <g transform="translate(50, 70)">
    <!-- Sample Image Box -->
    <rect x="0" y="0" width="180" height="120" class="bg-image" stroke="#1565C0" stroke-width="2" rx="5"/>
    <text x="90" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565C0">Input Image</text>

    <!-- Simplified image representation: a cat -->
    <rect x="20" y="35" width="140" height="75" fill="#87CEEB" rx="3"/>
    <ellipse cx="90" cy="70" rx="30" ry="25" fill="#FFA500"/>
    <circle cx="80" cy="62" r="4" fill="#000"/>
    <circle cx="100" cy="62" r="4" fill="#000"/>
    <path d="M 85 72 Q 90 78 95 72" stroke="#000" stroke-width="2" fill="none"/>
    <polygon points="70,50 65,35 75,45" fill="#FFA500"/>
    <polygon points="110,50 115,35 105,45" fill="#FFA500"/>
    <text x="90" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#333">"A photo of a cat"</text>

    <!-- Arrow down -->
    <line x1="90" y1="125" x2="90" y2="160" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Vision Encoder -->
    <rect x="0" y="165" width="180" height="80" class="bg-encoder" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="90" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">Vision Encoder</text>
    <text x="90" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">(ViT / ResNet)</text>
    <text x="90" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">Patch embedding + Transformer</text>

    <!-- Arrow down -->
    <line x1="90" y1="250" x2="90" y2="285" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Image Projection -->
    <rect x="20" y="290" width="140" height="50" class="bg-embed" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="90" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Image Projection</text>
    <text x="90" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">W<tspan baseline-shift="sub" font-size="7">I</tspan> · z<tspan baseline-shift="sub" font-size="7">img</tspan></text>

    <!-- Arrow down -->
    <line x1="90" y1="345" x2="90" y2="380" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Image Embedding -->
    <rect x="10" y="385" width="160" height="45" fill="#7B1FA2" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="90" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">I<tspan baseline-shift="sub" font-size="9">embed</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="9">d</tspan></text>
  </g>

  <!-- Right side: Text Branch -->
  <g transform="translate(670, 70)">
    <!-- Sample Text Box -->
    <rect x="0" y="0" width="180" height="120" class="bg-text" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="90" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E65100">Input Text</text>

    <!-- Text content -->
    <rect x="15" y="40" width="150" height="65" fill="white" stroke="#E65100" stroke-width="1" rx="3"/>
    <text x="90" y="65" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="middle" fill="#333">"A photo of a cat</text>
    <text x="90" y="82" font-family="Georgia, serif" font-size="13" font-style="italic" text-anchor="middle" fill="#333">sitting in the sun"</text>

    <!-- Arrow down -->
    <line x1="90" y1="125" x2="90" y2="160" stroke="#E65100" stroke-width="2" marker-end="url(#arrow-orange)"/>

    <!-- Text Encoder -->
    <rect x="0" y="165" width="180" height="80" class="bg-encoder" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="90" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">Text Encoder</text>
    <text x="90" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">(Transformer)</text>
    <text x="90" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">BPE tokenization + Transformer</text>

    <!-- Arrow down -->
    <line x1="90" y1="250" x2="90" y2="285" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Text Projection -->
    <rect x="20" y="290" width="140" height="50" class="bg-embed" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="90" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Text Projection</text>
    <text x="90" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">W<tspan baseline-shift="sub" font-size="7">T</tspan> · z<tspan baseline-shift="sub" font-size="7">txt</tspan></text>

    <!-- Arrow down -->
    <line x1="90" y1="345" x2="90" y2="380" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- Text Embedding -->
    <rect x="10" y="385" width="160" height="45" fill="#7B1FA2" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="90" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">T<tspan baseline-shift="sub" font-size="9">embed</tspan> ∈ ℝ<tspan baseline-shift="super" font-size="9">d</tspan></text>
  </g>

  <!-- Center: Shared Embedding Space -->
  <g transform="translate(300, 200)">
    <!-- Shared space indicator -->
    <rect x="0" y="0" width="300" height="180" fill="none" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="8,4" rx="10"/>
    <text x="150" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Shared Embedding Space</text>
    <text x="150" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">(d = 512 or 768 dimensions)</text>

    <!-- Cosine similarity -->
    <text x="150" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">Cosine Similarity:</text>
    <text x="150" y="110" font-family="'STIX Two Math', Georgia, serif" font-size="14" text-anchor="middle" fill="#333">sim(I, T) = I · T / (‖I‖ · ‖T‖)</text>

    <!-- Temperature scaling -->
    <text x="150" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">Logits = sim(I, T) · exp(τ)</text>
    <text x="150" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">τ = learnable temperature</text>
  </g>

  <!-- Arrows from embeddings to shared space -->
  <path d="M 220 500 Q 300 480 350 400" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 680 500 Q 600 480 550 400" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- Bottom: Key Properties -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="800" height="55" class="bg-box" stroke="#666" stroke-width="1" rx="5"/>
    <text x="400" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Key Properties of Siamese Architecture</text>
    <text x="150" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">✓ Separate encoders (not shared)</text>
    <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">✓ Aligned embedding dimensions</text>
    <text x="650" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666">✓ L2-normalized outputs</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1565C0"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E65100"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E7D32"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7B1FA2"/>
    </marker>
  </defs>
</svg>
