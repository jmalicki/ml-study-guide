        </marker>
        <marker id="arrow81C784" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#81C784" />
        </marker>
        <marker id="arrowFFB74D" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#FFB74D" />
        </marker>
      </defs>

      <text x="60" y="115" text-anchor="middle" font-size="9">Positions as rotations</text>
      <text x="60" y="127" text-anchor="middle" font-size="9">in complex space</text>
    </g>


    <g transform="translate(20, 165)">
