      <rect x="160" y="120" width="30" height="15" fill="#4A90A4" />
      <rect x="270" y="120" width="20" height="15" fill="#81C784" />


      <text x="345" y="11" font-size="9">Dim 0</text>
      <text x="345" y="31" font-size="9">Dim 16</text>
      <text x="345" y="51" font-size="9">Dim 32</text>
      <text x="345" y="71" font-size="9">Dim 48</text>
      <text x="345" y="91" font-size="9">Dim 64</text>
      <text x="345" y="111" font-size="9">Dim 80</text>
      <text x="345" y="131" font-size="9">Dim 96</text>
    </g>


    <g transform="translate(20, 190)">
      <text x="0" y="0" font-size="11">✓ Task-adaptive</text>
      <text x="0" y="16" font-size="11">✗ Limited to max_len</text>
      <text x="0" y="32" font-size="11">✗ max_len × d<tspan baseline-shift="sub" font-size="7.7">model</tspan> params</text>
    </g>
  </g>


  <g transform="translate(50, 330)">

    <rect x="0" y="0" width="380" height="210" class="bg-main" stroke="#81C784" stroke-width="2" rx="8" />


    <text x="190" y="25" text-anchor="middle" font-size="16" font-weight="bold">
      ALiBi (Attention Linear Bias)
    </text>


    <g transform="translate(70, 45)">
      <text x="0" y="-5" font-size="11">Key Position →</text>
      <text x="-55" y="60" font-size="11" transform="rotate(-90, -55, 60)">Query Pos ↓</text>

      
      <g transform="translate(0, 0)">
        
        <defs>
          <linearGradient id="distGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#fff;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#81C784;stop-opacity:0.3" />
          </linearGradient>
          <linearGradient id="distGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#fff;stop-opacity:0.9" />
          </linearGradient>
        </defs>

        
        <rect x="0" y="0" width="240" height="120" fill="#81C784" opacity="0.1" />

        
        <rect x="0" y="0" width="20" height="20" fill="#fff" />
        <rect x="20" y="0" width="20" height="20" fill="#81C784" opacity="0.2" />
        <rect x="40" y="0" width="20" height="20" fill="#81C784" opacity="0.3" />
        <rect x="60" y="0" width="20" height="20" fill="#81C784" opacity="0.4" />
