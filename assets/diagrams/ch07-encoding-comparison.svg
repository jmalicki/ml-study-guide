    <g transform="translate(20, 165)">
      <text x="0" y="0" font-size="11">✓ Excellent extrapolation</text>
      <text x="0" y="16" font-size="11">✓ 0 positional params</text>
      <text x="0" y="32" font-size="11">○ Linear distance penalty only</text>
    </g>
