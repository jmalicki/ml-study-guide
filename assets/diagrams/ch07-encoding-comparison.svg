        <rect x="100" y="80" width="20" height="20" fill="#81C784" opacity="0.2" />
        <rect x="120" y="80" width="120" height="20" fill="#81C784" opacity="0.3" />

        <rect x="0" y="100" width="100" height="20" fill="#81C784" opacity="0.6" />
