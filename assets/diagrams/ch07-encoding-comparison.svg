        <rect x="100" y="0" width="20" height="20" fill="#81C784" opacity="0.6" />
        <rect x="120" y="0" width="120" height="20" fill="#81C784" opacity="0.7" />

        <rect x="0" y="20" width="20" height="20" fill="#81C784" opacity="0.2" />
        <rect x="20" y="20" width="20" height="20" fill="#fff" />
        <rect x="40" y="20" width="20" height="20" fill="#81C784" opacity="0.2" />
        <rect x="60" y="20" width="20" height="20" fill="#81C784" opacity="0.3" />
        <rect x="80" y="20" width="20" height="20" fill="#81C784" opacity="0.4" />
