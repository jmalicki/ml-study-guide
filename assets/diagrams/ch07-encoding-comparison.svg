<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    .bg-main { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      .bg-main { fill: #2d2d2d; }

      /* Darken colored backgrounds for better contrast with white text */
      rect[fill="#E57373"] { fill: #8b3d3d; }
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
      rect[fill="#81C784"] { fill: #4a7c4e; }
      rect[fill="#BA68C8"] { fill: #5c4a7a; }
      rect[fill="#FFB74D"] { fill: #9b6b2e; }
      rect[fill="#78909C"] { fill: #455a64; }
      rect[fill="#A1887F"] { fill: #5d4e47; }
      rect[fill="#9E9E9E"] { fill: #424242; }

      /* Handle #333 text in dark mode */
      text[fill="#333"] { fill: #ffffff; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">
    Positional Encoding Methods Comparison
  </text>

  
  <g transform="translate(50, 60)">
    
    <rect x="0" y="0" width="380" height="240" class="bg-main" stroke="#4A90A4" stroke-width="2" rx="8" />


    <text x="190" y="25" text-anchor="middle" font-size="16" font-weight="bold">
      Sinusoidal Encoding
    </text>


    <g transform="translate(20, 40)">
      <text x="0" y="-5" font-size="11">Position →</text>
      <text x="-15" y="80" font-size="11" transform="rotate(-90, -15, 80)">Dim ↓</text>

      
      <rect x="0" y="0" width="340" height="15" fill="#E57373" />
      <rect x="0" y="0" width="10" height="15" fill="#fff" opacity="0.3" />
      <rect x="85" y="0" width="10" height="15" fill="#fff" opacity="0.3" />
      <rect x="170" y="0" width="10" height="15" fill="#fff" opacity="0.3" />
      <rect x="255" y="0" width="10" height="15" fill="#fff" opacity="0.3" />
      <rect x="330" y="0" width="10" height="15" fill="#fff" opacity="0.6" />

      <rect x="0" y="20" width="340" height="15" fill="#4A90A4" />
      <rect x="0" y="20" width="25" height="15" fill="#fff" opacity="0.3" />
      <rect x="113" y="20" width="25" height="15" fill="#fff" opacity="0.3" />
      <rect x="226" y="20" width="25" height="15" fill="#fff" opacity="0.3" />

      <rect x="0" y="40" width="340" height="15" fill="#81C784" />
      <rect x="0" y="40" width="50" height="15" fill="#fff" opacity="0.3" />
      <rect x="170" y="40" width="50" height="15" fill="#fff" opacity="0.3" />

      <rect x="0" y="60" width="340" height="15" fill="#BA68C8" />
      <rect x="0" y="60" width="85" height="15" fill="#fff" opacity="0.3" />
      <rect x="255" y="60" width="85" height="15" fill="#fff" opacity="0.3" />

      <rect x="0" y="80" width="340" height="15" fill="#FFB74D" />
      <rect x="0" y="80" width="120" height="15" fill="#fff" opacity="0.3" />

      <rect x="0" y="100" width="340" height="15" fill="#78909C" />
      <rect x="0" y="100" width="170" height="15" fill="#fff" opacity="0.3" />

      <rect x="0" y="120" width="340" height="15" fill="#A1887F" />
      <rect x="0" y="120" width="240" height="15" fill="#fff" opacity="0.3" />


      <text x="345" y="11" font-size="9">Dim 0</text>
      <text x="345" y="31" font-size="9">Dim 16</text>
      <text x="345" y="51" font-size="9">Dim 32</text>
      <text x="345" y="71" font-size="9">Dim 48</text>
      <text x="345" y="91" font-size="9">Dim 64</text>
      <text x="345" y="111" font-size="9">Dim 80</text>
      <text x="345" y="131" font-size="9">Dim 96</text>
    </g>


    <g transform="translate(20, 190)">
      <text x="0" y="0" font-size="11">✓ Deterministic</text>
      <text x="0" y="16" font-size="11">✓ Extrapolates to any length</text>
      <text x="0" y="32" font-size="11">✓ 0 parameters</text>
    </g>
  </g>


  <g transform="translate(470, 60)">

    <rect x="0" y="0" width="380" height="240" class="bg-main" stroke="#E57373" stroke-width="2" rx="8" />


    <text x="190" y="25" text-anchor="middle" font-size="16" font-weight="bold">
      Learned Embeddings
    </text>


    <g transform="translate(20, 40)">
      <text x="0" y="-5" font-size="11">Position →</text>
      <text x="-15" y="80" font-size="11" transform="rotate(-90, -15, 80)">Dim ↓</text>

      
      <rect x="0" y="0" width="340" height="15" fill="#9E9E9E" />
      <rect x="20" y="0" width="15" height="15" fill="#E57373" />
      <rect x="120" y="0" width="25" height="15" fill="#4A90A4" />
      <rect x="240" y="0" width="20" height="15" fill="#81C784" />

      <rect x="0" y="20" width="340" height="15" fill="#9E9E9E" />
