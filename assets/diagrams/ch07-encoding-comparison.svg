  <g transform="translate(470, 330)">

    <rect x="0" y="0" width="380" height="210" class="bg-main" stroke="#BA68C8" stroke-width="2" rx="8" />


    <text x="190" y="25" text-anchor="middle" font-size="16" font-weight="bold">
      RoPE (Rotary Position Embedding)
    </text>

    
    <g transform="translate(120, 70)">
      
      <circle cx="60" cy="50" r="45" fill="none" stroke="#BA68C8" stroke-width="2" stroke-dasharray="5,3" />


      <line x1="60" y1="50" x2="105" y2="50" stroke="#E57373" stroke-width="2" marker-end="url(#arrowE57373)" />
      <text x="110" y="54" font-size="10">pos 0</text>

      <line x1="60" y1="50" x2="92" y2="18" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow4A90A4)" />
      <text x="95" y="15" font-size="10">pos 1</text>

      <line x1="60" y1="50" x2="60" y2="5" stroke="#81C784" stroke-width="2" marker-end="url(#arrow81C784)" />
      <text x="35" y="5" font-size="10">pos 2</text>

      <line x1="60" y1="50" x2="28" y2="18" stroke="#FFB74D" stroke-width="2" marker-end="url(#arrowFFB74D)" />
      <text x="5" y="15" font-size="10">pos 3</text>

      
      <circle cx="60" cy="50" r="3" fill="#333" />

      
      <defs>
        <marker id="arrowE57373" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#E57373" />
        </marker>
        <marker id="arrow4A90A4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
