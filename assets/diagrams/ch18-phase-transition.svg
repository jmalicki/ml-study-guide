<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style>

  <text x="350" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" style="fill: #333 !important">Phase Transition in Emergent Capabilities</text>

  
  <line x1="80" y1="80" x2="80" y2="340" stroke="#333" stroke-width="2" />
  <polygon points="80,80 75,90 85,90" fill="#333" />

  
  <line x1="80" y1="340" x2="640" y2="340" stroke="#333" stroke-width="2" />
  <polygon points="640,340 630,335 630,345" fill="#333" />


  <text x="30" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" style="fill: #333 !important" transform="rotate(-90, 30, 210)">Accuracy</text>


  <text x="360" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" style="fill: #333 !important">Model Size (parameters)</text>


  <line x1="75" y1="340" x2="80" y2="340" stroke="#333" stroke-width="2" />
  <text x="65" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end" style="fill: #333 !important">0.0</text>

  <line x1="75" y1="210" x2="80" y2="210" stroke="#333" stroke-width="2" />
  <text x="65" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end" style="fill: #333 !important">0.5</text>

  <line x1="75" y1="80" x2="80" y2="80" stroke="#333" stroke-width="2" />
  <text x="65" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end" style="fill: #333 !important">1.0</text>


  <line x1="140" y1="340" x2="140" y2="345" stroke="#333" stroke-width="2" />
  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" style="fill: #333 !important">1B</text>

  <line x1="260" y1="340" x2="260" y2="345" stroke="#333" stroke-width="2" />
  <text x="260" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" style="fill: #333 !important">10B</text>

  <line x1="440" y1="340" x2="440" y2="345" stroke="#333" stroke-width="2" />
  <text x="440" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" style="fill: #333 !important">50B</text>

  <line x1="580" y1="340" x2="580" y2="345" stroke="#333" stroke-width="2" />
  <text x="580" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" style="fill: #333 !important">100B</text>

  
  
  <path d="M 80 340 L 380 340" stroke="#4A90A4" stroke-width="3" fill="none" />

  
  <path d="M 380 340 Q 420 280, 460 130" stroke="#4A90A4" stroke-width="3" fill="none" />

  
  <path d="M 460 130 L 640 90" stroke="#4A90A4" stroke-width="3" fill="none" />


  <text x="420" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" style="fill: #666 !important" font-style="italic">Phase transition</text>
  <text x="420" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" style="fill: #666 !important" font-style="italic">around 50B parameters</text>


  <text x="220" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" style="fill: #666 !important" font-style="italic">Random performance</text>


  <text x="540" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" style="fill: #666 !important" font-style="italic">Capability emerges</text>
</svg>