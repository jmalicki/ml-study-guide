<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <!-- Title -->
  <text x="350" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Phase Transition in Emergent Capabilities</text>

  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="340" stroke="#333" stroke-width="2"/>
  <polygon points="80,80 75,90 85,90" fill="#333"/>

  <!-- X-axis -->
  <line x1="80" y1="340" x2="640" y2="340" stroke="#333" stroke-width="2"/>
  <polygon points="640,340 630,335 630,345" fill="#333"/>

  <!-- Y-axis label -->
  <text x="30" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, 30, 210)">Accuracy</text>

  <!-- X-axis label -->
  <text x="360" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#333">Model Size (parameters)</text>

  <!-- Y-axis ticks and labels -->
  <line x1="75" y1="340" x2="80" y2="340" stroke="#333" stroke-width="2"/>
  <text x="65" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end" fill="#333">0.0</text>

  <line x1="75" y1="210" x2="80" y2="210" stroke="#333" stroke-width="2"/>
  <text x="65" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end" fill="#333">0.5</text>

  <line x1="75" y1="80" x2="80" y2="80" stroke="#333" stroke-width="2"/>
  <text x="65" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end" fill="#333">1.0</text>

  <!-- X-axis ticks and labels -->
  <line x1="140" y1="340" x2="140" y2="345" stroke="#333" stroke-width="2"/>
  <text x="140" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">1B</text>

  <line x1="260" y1="340" x2="260" y2="345" stroke="#333" stroke-width="2"/>
  <text x="260" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">10B</text>

  <line x1="440" y1="340" x2="440" y2="345" stroke="#333" stroke-width="2"/>
  <text x="440" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">50B</text>

  <line x1="580" y1="340" x2="580" y2="345" stroke="#333" stroke-width="2"/>
  <text x="580" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">100B</text>

  <!-- Phase transition curve -->
  <!-- Flat low performance region -->
  <path d="M 80 340 L 380 340" stroke="#4A90A4" stroke-width="3" fill="none"/>

  <!-- Sharp transition -->
  <path d="M 380 340 Q 420 280, 460 130" stroke="#4A90A4" stroke-width="3" fill="none"/>

  <!-- High performance plateau -->
  <path d="M 460 130 L 640 90" stroke="#4A90A4" stroke-width="3" fill="none"/>

  <!-- Annotation for phase transition -->
  <text x="420" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Phase transition</text>
  <text x="420" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">around 50B parameters</text>

  <!-- Low performance region annotation -->
  <text x="220" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Random performance</text>

  <!-- High performance region annotation -->
  <text x="540" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">Capability emerges</text>
</svg>
