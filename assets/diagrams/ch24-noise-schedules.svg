<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-main { fill: #2d2d2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><text x="400" y="25" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Noise Schedules Comparison</text>
  <text x="400" y="45" font-size="12" fill="#666" text-anchor="middle">β_t (variance) and ᾱ_t (cumulative signal retention)</text>

  
  <g transform="translate(80, 80)">
    <text x="280" y="-10" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">β_t (Variance Schedule)</text>

    
    <line x1="0" y1="150" x2="560" y2="150" stroke="#333" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="150" stroke="#333" stroke-width="2" />

    
    <text x="-10" y="5" font-size="10" fill="#666" text-anchor="end">0.02</text>
    <text x="-10" y="80" font-size="10" fill="#666" text-anchor="end">0.01</text>
    <text x="-10" y="155" font-size="10" fill="#666" text-anchor="end">0.00</text>
    <text x="-45" y="75" font-size="11" fill="#333" text-anchor="middle" transform="rotate(-90, -45, 75)">Variance β_t</text>

    
    <text x="0" y="170" font-size="10" fill="#666" text-anchor="middle">0</text>
    <text x="140" y="170" font-size="10" fill="#666" text-anchor="middle">250</text>
    <text x="280" y="170" font-size="10" fill="#666" text-anchor="middle">500</text>
    <text x="420" y="170" font-size="10" fill="#666" text-anchor="middle">750</text>
    <text x="560" y="170" font-size="10" fill="#666" text-anchor="middle">1000</text>
    <text x="280" y="190" font-size="11" fill="#333" text-anchor="middle">Timestep t</text>

    
    <line x1="0" y1="75" x2="560" y2="75" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="140" y1="0" x2="140" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="280" y1="0" x2="280" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="420" y1="0" x2="420" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />

    
    <polyline points="0,148 560,2" fill="none" stroke="#4A90A4" stroke-width="3" />

    
    <path d="M 0,145 Q 140,140 280,75 T 560,10" fill="none" stroke="#E57373" stroke-width="3" />

    
    <path d="M 0,150 Q 280,140 560,0" fill="none" stroke="#81C784" stroke-width="3" />

    
    <g transform="translate(380, 20)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#4A90A4" stroke-width="3" />
      <text x="35" y="4" font-size="10" fill="#333">Linear</text>

      <line x1="0" y1="18" x2="30" y2="18" stroke="#E57373" stroke-width="3" />
      <text x="35" y="22" font-size="10" fill="#333">Cosine</text>

      <line x1="0" y1="36" x2="30" y2="36" stroke="#81C784" stroke-width="3" />
      <text x="35" y="40" font-size="10" fill="#333">Quadratic</text>
    </g>
  </g>

  
  <g transform="translate(80, 310)">
    <text x="280" y="-10" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">ᾱ_t (Cumulative Signal Retention)</text>

    
    <line x1="0" y1="150" x2="560" y2="150" stroke="#333" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="150" stroke="#333" stroke-width="2" />

    
    <text x="-10" y="5" font-size="10" fill="#666" text-anchor="end">1.0</text>
    <text x="-10" y="80" font-size="10" fill="#666" text-anchor="end">0.5</text>
    <text x="-10" y="155" font-size="10" fill="#666" text-anchor="end">0.0</text>
    <text x="-45" y="75" font-size="11" fill="#333" text-anchor="middle" transform="rotate(-90, -45, 75)">Signal ᾱ_t</text>

    
    <text x="0" y="170" font-size="10" fill="#666" text-anchor="middle">0</text>
    <text x="140" y="170" font-size="10" fill="#666" text-anchor="middle">250</text>
    <text x="280" y="170" font-size="10" fill="#666" text-anchor="middle">500</text>
    <text x="420" y="170" font-size="10" fill="#666" text-anchor="middle">750</text>
    <text x="560" y="170" font-size="10" fill="#666" text-anchor="middle">1000</text>
    <text x="280" y="190" font-size="11" fill="#333" text-anchor="middle">Timestep t</text>

    
    <line x1="0" y1="75" x2="560" y2="75" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="140" y1="0" x2="140" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="280" y1="0" x2="280" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="420" y1="0" x2="420" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" />

    
    <path d="M 0,2 L 140,30 L 280,75 L 420,115 L 560,148" fill="none" stroke="#4A90A4" stroke-width="3" />

    
    <path d="M 0,2 Q 140,15 280,75 T 560,148" fill="none" stroke="#E57373" stroke-width="3" />

    
    <path d="M 0,2 Q 140,50 280,100 T 560,150" fill="none" stroke="#81C784" stroke-width="3" />

    
    <g transform="translate(100, 45)">
      <circle cx="0" cy="0" r="3" fill="#E57373" />
      <text x="8" y="4" font-size="9" fill="#E57373">Cosine: slower decay</text>
      <text x="8" y="16" font-size="8" fill="#666">Better for high-res images</text>
    </g>

    <g transform="translate(350, 95)">
      <circle cx="0" cy="0" r="3" fill="#4A90A4" />
      <text x="8" y="4" font-size="9" fill="#4A90A4">Linear: uniform decay</text>
      <text x="8" y="16" font-size="8" fill="#666">Standard DDPM choice</text>
    </g>
  </g>

  
  <g transform="translate(640, 320)">
    <rect x="0" y="0" width="150" height="110" class="bg-main" rx="4" stroke="#333" stroke-width="1" />
    <text x="75" y="18" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">Key Insights</text>

    <text x="8" y="35" font-size="8" fill="#666">• ᾱ_t = ∏(1-β_s)</text>
    <text x="8" y="48" font-size="8" fill="#666">  from s=1 to t</text>

    <text x="8" y="63" font-size="8" fill="#666">• Linear: simple,</text>
    <text x="8" y="74" font-size="8" fill="#666">  works for 32×32</text>

    <text x="8" y="89" font-size="8" fill="#666">• Cosine: better</text>
    <text x="8" y="100" font-size="8" fill="#666">  for 256×256+</text>
  </g>
</svg>