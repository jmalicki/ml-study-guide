<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for white text visibility */
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
    }
  </style><g id="bidirectional">
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Bidirectional Attention</text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">(All tokens visible)</text>

    
    <g transform="translate(50, 70)">
      
      <text x="20" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
      <text x="60" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T1</text>
      <text x="100" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T2</text>
      <text x="140" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T3</text>

      
      <text x="-25" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
      <text x="-25" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666">T1</text>
      <text x="-25" y="105" font-family="Arial, sans-serif" font-size="10" fill="#666">T2</text>
      <text x="-25" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">T3</text>

      
      <rect x="10" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="50" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="90" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="130" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />

      <rect x="10" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="50" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="90" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="130" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />

      <rect x="10" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="50" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="90" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="130" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />

      <rect x="10" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="50" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="90" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <rect x="130" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" />

      
      <text x="25" y="30" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="65" y="30" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="105" y="30" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="145" y="30" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>

      <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="65" y="70" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="105" y="70" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="145" y="70" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>

      <text x="25" y="110" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="65" y="110" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="105" y="110" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="145" y="110" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>

      <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="65" y="150" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="105" y="150" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
      <text x="145" y="150" font-family="Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle">✓</text>
    </g>

    
    <text x="150" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Keys (can attend to)</text>
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" transform="rotate(-90, 10, 170)">Queries (attending from)</text>

    
    <g transform="translate(50, 280)">
      <rect x="0" y="0" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1" />
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="11" fill="#333">= Can attend (value 1)</text>
    </g>
  </g>

  
  <g id="causal" transform="translate(400, 0)">
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Causal Attention</text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">(Lower triangular mask)</text>

    
    <g transform="translate(50, 70)">
      
      <text x="20" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
