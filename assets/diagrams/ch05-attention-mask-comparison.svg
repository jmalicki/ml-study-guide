<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Bidirectional Attention Mask -->
  <g id="bidirectional">
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Bidirectional Attention</text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">(All tokens visible)</text>

    <!-- Grid -->
    <g transform="translate(50, 70)">
      <!-- Column labels -->
      <text x="20" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
      <text x="60" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T1</text>
      <text x="100" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T2</text>
      <text x="140" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T3</text>

      <!-- Row labels -->
      <text x="-25" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
      <text x="-25" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666">T1</text>
      <text x="-25" y="105" font-family="Arial, sans-serif" font-size="10" fill="#666">T2</text>
      <text x="-25" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">T3</text>

      <!-- All cells filled (bidirectional) -->
      <rect x="10" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="130" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>

      <rect x="10" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="130" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>

      <rect x="10" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="130" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>

      <rect x="10" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="130" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>

      <!-- Checkmarks -->
      <text x="25" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="145" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>

      <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="70" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="70" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="145" y="70" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>

      <text x="25" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="145" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>

      <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="145" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
    </g>

    <!-- Axis labels -->
    <text x="150" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Keys (can attend to)</text>
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" transform="rotate(-90, 10, 170)">Queries (attending from)</text>

    <!-- Legend -->
    <g transform="translate(50, 280)">
      <rect x="0" y="0" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="11" fill="#333">= Can attend (value 1)</text>
    </g>
  </g>

  <!-- Causal Attention Mask -->
  <g id="causal" transform="translate(400, 0)">
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Causal Attention</text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">(Lower triangular mask)</text>

    <!-- Grid -->
    <g transform="translate(50, 70)">
      <!-- Column labels -->
      <text x="20" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
      <text x="60" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T1</text>
      <text x="100" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T2</text>
      <text x="140" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#666">T3</text>

      <!-- Row labels -->
      <text x="-25" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">T0</text>
      <text x="-25" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666">T1</text>
      <text x="-25" y="105" font-family="Arial, sans-serif" font-size="10" fill="#666">T2</text>
      <text x="-25" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">T3</text>

      <!-- Lower triangular (causal) - Row 0 -->
      <rect x="10" y="10" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="10" width="30" height="30" fill="#E5E5E5" stroke="#333" stroke-width="1"/>
      <rect x="90" y="10" width="30" height="30" fill="#E5E5E5" stroke="#333" stroke-width="1"/>
      <rect x="130" y="10" width="30" height="30" fill="#E5E5E5" stroke="#333" stroke-width="1"/>

      <!-- Row 1 -->
      <rect x="10" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="50" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="50" width="30" height="30" fill="#E5E5E5" stroke="#333" stroke-width="1"/>
      <rect x="130" y="50" width="30" height="30" fill="#E5E5E5" stroke="#333" stroke-width="1"/>

      <!-- Row 2 -->
      <rect x="10" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="90" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="130" y="90" width="30" height="30" fill="#E5E5E5" stroke="#333" stroke-width="1"/>

      <!-- Row 3 -->
      <rect x="10" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="50" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="90" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <rect x="130" y="130" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1"/>

      <!-- Checkmarks for lower triangle -->
      <text x="25" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="30" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">✗</text>
      <text x="105" y="30" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">✗</text>
      <text x="145" y="30" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">✗</text>

      <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="70" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="70" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">✗</text>
      <text x="145" y="70" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">✗</text>

      <text x="25" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="110" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="145" y="110" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">✗</text>

      <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="65" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="105" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
      <text x="145" y="150" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">✓</text>
    </g>

    <!-- Axis labels -->
    <text x="150" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Keys (can attend to)</text>
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" transform="rotate(-90, 10, 170)">Queries (attending from)</text>

    <!-- Legend -->
    <g transform="translate(50, 280)">
      <rect x="0" y="0" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="11" fill="#333">= Can attend (1)</text>
      <rect x="0" y="25" width="20" height="20" fill="#E5E5E5" stroke="#333" stroke-width="1"/>
      <text x="25" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">= Masked (0)</text>
    </g>
  </g>
</svg>
