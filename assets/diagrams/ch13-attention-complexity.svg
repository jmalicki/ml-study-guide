<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }
    .bg-box { fill: white; }
    .bg-legend { fill: #f9f9f9; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }
      .bg-box { fill: #2d2d2d; }
      .bg-legend { fill: #2d2d2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#555"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><text x="400" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Attention Computational Complexity Comparison
  </text>

  
  <line x1="80" y1="50" x2="80" y2="380" stroke="#333" stroke-width="2" />
  <text x="40" y="220" font-size="14" fill="#333" transform="rotate(-90 40 220)">FLOPs (Billions)</text>

  
  <line x1="80" y1="380" x2="750" y2="380" stroke="#333" stroke-width="2" />
  <text x="400" y="415" font-size="14" text-anchor="middle" fill="#333">Sequence Length (n)</text>

  
  <text x="180" y="400" font-size="11" text-anchor="middle" fill="#666">2K</text>
  <text x="300" y="400" font-size="11" text-anchor="middle" fill="#666">8K</text>
  <text x="420" y="400" font-size="11" text-anchor="middle" fill="#666">16K</text>
  <text x="540" y="400" font-size="11" text-anchor="middle" fill="#666">32K</text>
  <text x="660" y="400" font-size="11" text-anchor="middle" fill="#666">64K</text>

  
  <text x="70" y="370" font-size="11" text-anchor="end" fill="#666">0</text>
  <text x="70" y="290" font-size="11" text-anchor="end" fill="#666">2000</text>
  <text x="70" y="210" font-size="11" text-anchor="end" fill="#666">4000</text>
  <text x="70" y="130" font-size="11" text-anchor="end" fill="#666">6000</text>
  <text x="70" y="60" font-size="11" text-anchor="end" fill="#666">8000</text>

  
  <line x1="80" y1="290" x2="750" y2="290" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="80" y1="210" x2="750" y2="210" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="80" y1="130" x2="750" y2="130" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5" />

  
  <path d="M 180,370 Q 300,320 420,210 Q 540,100 660,50" fill="none" stroke="#E57373" stroke-width="3" />
  <text x="680" y="55" font-size="12" font-weight="bold" fill="#E57373">O(n²d)</text>
  <text x="680" y="70" font-size="10" fill="#E57373">Standard MHA</text>

  
  <path d="M 180,365 L 660,240" fill="none" stroke="#4A90A4" stroke-width="3" />
  <text x="680" y="245" font-size="12" font-weight="bold" fill="#4A90A4">O(n·w·d)</text>
  <text x="680" y="260" font-size="10" fill="#4A90A4">Sliding Window</text>
  <text x="680" y="273" font-size="9" fill="#666">(w=4096)</text>

  
  <path d="M 180,368 L 660,280" fill="none" stroke="#81C784" stroke-width="3" />
  <text x="680" y="285" font-size="12" font-weight="bold" fill="#81C784">O(n·d²)</text>
  <text x="680" y="300" font-size="10" fill="#81C784">Linear Attention</text>
  <text x="680" y="313" font-size="9" fill="#666">(d=4096)</text>

  
  <circle cx="420" cy="210" r="5" fill="#FFB74D" stroke="#333" stroke-width="1" />
  <text x="350" y="195" font-size="11" font-style="italic" fill="#FFB74D">Flash Attention:</text>
  <text x="350" y="208" font-size="10" fill="#666">Same O(n²d) but</text>
  <text x="350" y="221" font-size="10" fill="#666">memory-efficient</text>


  <g id="legend">
    <rect x="100" y="440" width="600" height="50" class="bg-legend" stroke="#999" stroke-width="1" rx="5" />

    
    <line x1="120" y1="460" x2="160" y2="460" stroke="#E57373" stroke-width="3" />
    <text x="170" y="465" font-size="11" fill="#333">Standard MHA: Grows quadratically - infeasible for long contexts</text>

    
    <line x1="350" y1="460" x2="390" y2="460" stroke="#4A90A4" stroke-width="3" />
    <text x="400" y="465" font-size="11" fill="#333">Sliding Window: Linear growth</text>

    
    <line x1="570" y1="460" x2="610" y2="460" stroke="#81C784" stroke-width="3" />
    <text x="620" y="465" font-size="11" fill="#333">Linear: Approximation</text>
  </g>


  <g id="insight">
    <rect x="480" y="90" width="260" height="90" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="610" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Key Insight</text>
    <text x="610" y="130" font-size="10" text-anchor="middle" fill="#333">Doubling sequence length:</text>
    <text x="610" y="145" font-size="10" text-anchor="middle" fill="#E57373">• Standard: 4x compute</text>
    <text x="610" y="160" font-size="10" text-anchor="middle" fill="#4A90A4">• Sliding window: 2x compute</text>
    <text x="610" y="175" font-size="10" text-anchor="middle" fill="#81C784">• Linear: 2x compute</text>
  </g>
</svg>