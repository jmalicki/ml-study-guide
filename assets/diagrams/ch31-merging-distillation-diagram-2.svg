<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .large { fill: #e8f4f8; stroke: #4A90A4; stroke-width: 2; }
    .medium { fill: #f5f5f5; stroke: #4A90A4; stroke-width: 2; }
    .optimized { fill: #fff3cd; stroke: #4A90A4; stroke-width: 2; }
    .final { fill: #d4edda; stroke: #4A90A4; stroke-width: 2; }
    .text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #666; }
    .darrow { stroke: #4A90A4; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>

  <!-- GPT-4 -->
  <rect x="180" y="20" width="240" height="50" rx="5" class="large"/>
  <text x="300" y="42" text-anchor="middle" class="text" font-weight="bold">GPT-4</text>
  <text x="300" y="60" text-anchor="middle" class="label">(unknown params)</text>

  <!-- Distillation -->
  <path d="M 300 70 L 300 100" class="darrow"/>
  <text x="300" y="90" text-anchor="middle" class="label">Distillation</text>

  <!-- 7B model -->
  <rect x="180" y="100" width="240" height="50" rx="5" class="medium"/>
  <text x="300" y="122" text-anchor="middle" class="text" font-weight="bold">7B model</text>
  <text x="300" y="140" text-anchor="middle" class="label">(95% capability)</text>

  <!-- Task-specific fine-tuning -->
  <path d="M 300 150 L 300 180" class="darrow"/>
  <text x="300" y="170" text-anchor="middle" class="label">Task-specific fine-tuning</text>

  <!-- 7B specialized -->
  <rect x="180" y="180" width="240" height="50" rx="5" class="medium"/>
  <text x="300" y="202" text-anchor="middle" class="text" font-weight="bold">7B specialized</text>
  <text x="300" y="220" text-anchor="middle" class="label">(98% on task)</text>

  <!-- Wanda pruning -->
  <path d="M 300 230 L 300 260" class="darrow"/>
  <text x="300" y="250" text-anchor="middle" class="label">Wanda pruning (60%)</text>

  <!-- 2.8B sparse -->
  <rect x="180" y="260" width="240" height="50" rx="5" class="optimized"/>
  <text x="300" y="282" text-anchor="middle" class="text" font-weight="bold">2.8B sparse</text>
  <text x="300" y="300" text-anchor="middle" class="label">(95% on task)</text>

  <!-- 4-bit quantization -->
  <path d="M 300 310 L 300 340" class="darrow"/>
  <text x="300" y="330" text-anchor="middle" class="label">4-bit quantization</text>

  <!-- Final model file -->
  <rect x="180" y="340" width="240" height="50" rx="5" class="final"/>
  <text x="300" y="370" text-anchor="middle" class="text" font-weight="bold">700MB model file</text>

  <!-- Size annotations on the right -->
  <text x="450" y="45" class="label" font-style="italic">~1000B+ params</text>
  <text x="450" y="125" class="label" font-style="italic">~7B params</text>
  <text x="450" y="205" class="label" font-style="italic">~7B params</text>
  <text x="450" y="285" class="label" font-style="italic">~2.8B params</text>
  <text x="450" y="365" class="label" font-style="italic">~0.7B effective</text>
</svg>