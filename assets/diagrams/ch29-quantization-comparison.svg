<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }


    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-main { fill: #2d2d2d; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }


      /* Darken colored backgrounds for white text contrast */
      rect[fill="#c62828"] { fill: #8b3d3d; }
      rect[fill="#2e7d92"] { fill: #2d5f6f; }
      rect[fill="#388e3c"] { fill: #4a7c4e; }
      rect[fill="#6a4c93"] { fill: #5c4a7a; }
      rect[fill="#e65100"] { fill: #a66a2a; }
      rect[fill="#f0f0f0"] { fill: #3a3a3a; }
    }
  </style>

  <g transform="translate(50, 70)">
    <text x="400" y="0" font-size="22" font-weight="bold" fill="#000" text-anchor="middle">
      Quantization Levels: Memory Savings Comparison
    </text>
    <text x="400" y="20" font-size="14" text-anchor="middle">
      70B Parameter Model Example
    </text>
  </g>

  <g transform="translate(50, 90)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">FP32</text>
    <rect x="0" y="10" width="800" height="60" fill="#c62828" stroke="#333" stroke-width="2" rx="5" />
    <text x="400" y="45" font-size="18" font-weight="bold" fill="#fff" style="fill: #fff !important" text-anchor="middle">280 GB</text>
    <text x="0" y="85" font-size="12" fill="#666">Full precision training (rarely used for LLMs)</text>
    <text x="810" y="45" font-size="14" font-weight="bold" fill="#333">1.0×</text>
  </g>

  
  <g transform="translate(50, 190)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">FP16/BF16</text>
    <rect x="0" y="10" width="400" height="60" fill="#2e7d92" stroke="#333" stroke-width="2" rx="5" />
    <text x="200" y="45" font-size="18" font-weight="bold" fill="#fff" style="fill: #fff !important" text-anchor="middle">140 GB</text>
    <text x="0" y="85" font-size="12" fill="#666">Standard training precision</text>
    <text x="810" y="45" font-size="14" font-weight="bold" fill="#2e7d92">2.0×</text>
    <rect x="405" y="15" width="12" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="420" y="15" width="12" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="435" y="15" width="12" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
  </g>

  
  <g transform="translate(50, 290)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">INT8</text>
    <rect x="0" y="10" width="200" height="60" fill="#388e3c" stroke="#333" stroke-width="2" rx="5" />
    <text x="100" y="45" font-size="18" font-weight="bold" fill="#fff" style="fill: #fff !important" text-anchor="middle">70 GB</text>
    <text x="0" y="85" font-size="12" fill="#666">PTQ inference, minimal accuracy loss</text>
    <text x="810" y="45" font-size="14" font-weight="bold" fill="#388e3c">4.0×</text>
    <rect x="205" y="15" width="8" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="216" y="15" width="8" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="227" y="15" width="8" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
  </g>

  
  <g transform="translate(50, 390)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#333">INT4 (GPTQ/AWQ)</text>
    <rect x="0" y="10" width="100" height="60" fill="#6a4c93" stroke="#333" stroke-width="2" rx="5" />
    <text x="50" y="45" font-size="18" font-weight="bold" fill="#fff" style="fill: #fff !important" text-anchor="middle">35 GB</text>
    <text x="0" y="85" font-size="12" fill="#666">Advanced quantization, &lt;1% accuracy loss</text>
    <text x="810" y="45" font-size="14" font-weight="bold" fill="#6a4c93">8.0×</text>
    <rect x="105" y="15" width="5" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="113" y="15" width="5" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="121" y="15" width="5" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
  </g>

  
  <g transform="translate(50, 490)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#000">FP4 (Blackwell)</text>
    <rect x="0" y="10" width="100" height="60" fill="#e65100" stroke="#333" stroke-width="2" rx="5" />
    <text x="50" y="45" font-size="18" font-weight="bold" style="fill: #fff !important" text-anchor="middle">35 GB</text>
    <text x="0" y="85" font-size="12" fill="#666">Block-scaled floating point, H100/B200</text>
    <text x="810" y="45" font-size="14" font-weight="bold" fill="#e65100">8.0×</text>
    <rect x="105" y="15" width="5" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="113" y="15" width="5" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
    <rect x="121" y="15" width="5" height="50" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="2" />
  </g>

  
  <rect x="50" y="570" width="800" height="20" class="bg-main" stroke="#333" stroke-width="1" rx="3" />
  <text x="60" y="560" font-size="12" font-weight="bold" fill="#000">
    Key: Shaded boxes represent saved memory. Quantization enables running larger models on consumer hardware.
  </text>
</svg>