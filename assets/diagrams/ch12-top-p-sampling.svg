<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .title { fill: #333333; }
    .axis-label { fill: #666666; }
    .annotation { fill: #555555; }
    line.axis { stroke: #333333; }
    rect.kept { fill: #7c4dff; }
    rect.filtered { fill: #e0e0e0; }
    rect.box { fill: #f5f5f5; stroke: #cccccc; }
    line.threshold { stroke: #ff5722; stroke-dasharray: 5,3; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .title { fill: #ffffff; }
      .axis-label { fill: #cccccc; }
      .annotation { fill: #aaaaaa; }
      line.axis { stroke: #cccccc; }
      rect.kept { fill: #b388ff; }
      rect.filtered { fill: #555555; }
      rect.box { fill: #2d2d2d; stroke: #555555; }
      line.threshold { stroke: #ff7043; }
    }
  </style>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" class="title">
    Top-p (Nucleus) Sampling: Adaptive Token Selection
  </text>
  <text x="400" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" class="annotation">
    Keep smallest set of tokens whose cumulative probability exceeds p
  </text>

  <!-- Left: Cumulative probability view -->
  <g transform="translate(50, 90)">
    <text x="160" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" class="title">Cumulative Probability (p=0.9)</text>

    <!-- Y-axis -->
    <line x1="30" y1="30" x2="30" y2="200" class="axis" stroke-width="1.5"/>
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="end" class="axis-label">1.0</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="end" class="axis-label">0.9</text>
    <text x="20" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="end" class="axis-label">0.5</text>
    <text x="20" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="end" class="axis-label">0</text>

    <!-- X-axis -->
    <line x1="30" y1="200" x2="320" y2="200" class="axis" stroke-width="1.5"/>

    <!-- p=0.9 threshold line -->
    <line x1="30" y1="47" x2="320" y2="47" class="threshold" stroke-width="2"/>
    <text x="325" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#ff5722">p=0.9</text>

    <!-- Stacked bars showing cumulative probability -->
    <!-- Token 1: 0.35 cumulative -->
    <rect x="50" y="140.5" width="35" height="59.5" class="kept"/>
    <text x="67" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="white">35%</text>

    <!-- Token 2: 0.35 + 0.25 = 0.60 cumulative -->
    <rect x="95" y="98" width="35" height="42.5" class="kept"/>
    <rect x="95" y="140.5" width="35" height="59.5" class="kept" opacity="0.5"/>
    <text x="112" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="white">25%</text>

    <!-- Token 3: 0.60 + 0.18 = 0.78 cumulative -->
    <rect x="140" y="67.4" width="35" height="30.6" class="kept"/>
    <rect x="140" y="98" width="35" height="102" class="kept" opacity="0.5"/>
    <text x="157" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="white">18%</text>

    <!-- Token 4: 0.78 + 0.12 = 0.90 cumulative - this one reaches threshold -->
    <rect x="185" y="47" width="35" height="20.4" class="kept"/>
    <rect x="185" y="67.4" width="35" height="132.6" class="kept" opacity="0.5"/>
    <text x="202" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="white">12%</text>

    <!-- Token 5: would exceed p=0.9, excluded -->
    <rect x="230" y="47" width="35" height="0" class="filtered"/>
    <rect x="230" y="47" width="35" height="153" class="filtered" opacity="0.3"/>
    <text x="247" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#999999">excluded</text>

    <!-- Token 6+ -->
    <rect x="275" y="47" width="35" height="0" class="filtered"/>
    <rect x="275" y="47" width="35" height="153" class="filtered" opacity="0.3"/>
    <text x="292" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#999999">...</text>

    <!-- Token labels -->
    <text x="67" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="axis-label">the</text>
    <text x="112" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="axis-label">a</text>
    <text x="157" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="axis-label">an</text>
    <text x="202" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="axis-label">one</text>
    <text x="247" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#999999">my</text>
    <text x="292" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#999999">...</text>

    <!-- Cumulative labels -->
    <text x="67" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" class="annotation">cum: 35%</text>
    <text x="112" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" class="annotation">cum: 60%</text>
    <text x="157" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" class="annotation">cum: 78%</text>
    <text x="202" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#ff5722" font-weight="bold">cum: 90%</text>
  </g>

  <!-- Right: Comparison with Top-k -->
  <g transform="translate(420, 90)">
    <text x="160" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" class="title">Top-p vs Top-k Adaptivity</text>

    <!-- Scenario 1: Confident distribution -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" class="title">Confident (peaked) distribution:</text>

      <!-- Mini bar chart -->
      <rect x="10" y="15" width="20" height="60" class="kept"/>
      <rect x="35" y="55" width="20" height="20" class="kept"/>
      <rect x="60" y="65" width="20" height="10" class="filtered"/>
      <rect x="85" y="70" width="20" height="5" class="filtered"/>
      <rect x="110" y="72" width="20" height="3" class="filtered"/>

      <text x="170" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">Top-k=5: keeps 5 tokens</text>
      <text x="170" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7c4dff" font-weight="bold">Top-p=0.9: keeps only 2!</text>
      <text x="170" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" class="annotation">(adapts to confidence)</text>
    </g>

    <!-- Scenario 2: Uncertain distribution -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" class="title">Uncertain (flat) distribution:</text>

      <!-- Mini bar chart - flatter -->
      <rect x="10" y="40" width="20" height="35" class="kept"/>
      <rect x="35" y="45" width="20" height="30" class="kept"/>
      <rect x="60" y="48" width="20" height="27" class="kept"/>
      <rect x="85" y="52" width="20" height="23" class="kept"/>
      <rect x="110" y="55" width="20" height="20" class="kept"/>
      <rect x="135" y="58" width="20" height="17" class="kept"/>
      <rect x="160" y="62" width="20" height="13" class="filtered"/>

      <text x="200" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">Top-k=5: still keeps 5</text>
      <text x="200" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7c4dff" font-weight="bold">Top-p=0.9: keeps 6!</text>
      <text x="200" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" class="annotation">(allows more diversity)</text>
    </g>
  </g>

  <!-- Info box -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="700" height="110" rx="8" class="box" stroke-width="1"/>

    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" class="title">Why Top-p (Nucleus) Sampling?</text>

    <text x="20" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      Top-k has a fixed window regardless of distribution shape. Top-p adapts:
    </text>
    <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      - When model is confident: nucleus is small, sampling is focused
    </text>
    <text x="20" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      - When model is uncertain: nucleus is large, allowing more diversity
    </text>

    <text x="400" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      Common values:
    </text>
    <text x="400" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      p = 0.9: Standard for chatbots (ChatGPT, Claude)
    </text>
    <text x="400" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      p = 0.95: More creative, higher diversity
    </text>
  </g>
</svg>
