<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }
    .bg-box { fill: white; }
    .bg-blue { fill: #E1F5FE; }
    .bg-green { fill: #C8E6C9; }
    .bg-red { fill: #FFCDD2; }
    .bg-yellow { fill: #FFF9C4; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-main { fill: #2d2d2d; }
      .bg-box { fill: #2d2d2d; }
      .bg-blue { fill: #1a3a4a; }
      .bg-green { fill: #2d4a2d; }
      .bg-red { fill: #4a2d2d; }
      .bg-yellow { fill: #4a4a2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for dark mode */
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
      rect[fill="#757575"] { fill: #3d3d3d; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    DPO Preference Learning
  </text>

  
  <rect x="300" y="60" width="200" height="60" class="bg-blue" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="400" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Prompt (x)</text>
  <text x="400" y="100" font-size="10" text-anchor="middle" fill="#666">"Explain quantum computing"</text>

  
  <path d="M 350 120 L 200 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 450 120 L 600 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  
  <rect x="50" y="180" width="300" height="120" class="bg-green" stroke="#81C784" stroke-width="3" rx="5" />
  <text x="200" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">
    Chosen Response (y_w)
  </text>
  <text x="200" y="225" font-size="10" text-anchor="middle" fill="#333">"Quantum computers use qubits that</text>
  <text x="200" y="240" font-size="10" text-anchor="middle" fill="#333">can be in superposition, allowing</text>
  <text x="200" y="255" font-size="10" text-anchor="middle" fill="#333">them to process information in ways</text>
  <text x="200" y="270" font-size="10" text-anchor="middle" fill="#333">classical computers cannot..."</text>
  <text x="200" y="290" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">
    ✓ Preferred by human
  </text>

  
  <rect x="450" y="180" width="300" height="120" class="bg-red" stroke="#E57373" stroke-width="3" rx="5" />
  <text x="600" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#C62828">
    Rejected Response (y_l)
  </text>
  <text x="600" y="225" font-size="10" text-anchor="middle" fill="#333">"Quantum is very fast and uses</text>
  <text x="600" y="240" font-size="10" text-anchor="middle" fill="#333">special particles to compute</text>
  <text x="600" y="255" font-size="10" text-anchor="middle" fill="#333">stuff really quickly..."</text>
  <text x="600" y="270" font-size="10" text-anchor="middle" fill="#333" />
  <text x="600" y="290" font-size="11" font-weight="bold" text-anchor="middle" fill="#C62828">
    ✗ Not preferred by human
  </text>

  
  <text x="400" y="340" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    DPO Training Objective
  </text>

  
  <rect x="50" y="360" width="300" height="60" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5" />
  <text x="200" y="380" font-size="12" font-weight="bold" text-anchor="middle" >
    Policy Model π_θ
  </text>
  <text x="200" y="400" font-size="10" text-anchor="middle" >
    Increase: log π_θ(y_w | x)
  </text>
  <text x="200" y="415" font-size="10" text-anchor="middle" >
    Decrease: log π_θ(y_l | x)
  </text>

  
  <rect x="450" y="360" width="300" height="60" fill="#757575" stroke="#333" stroke-width="2" rx="5" />
  <text x="600" y="380" font-size="12" font-weight="bold" text-anchor="middle" >
    Reference Model π_ref (frozen)
  </text>
  <text x="600" y="400" font-size="10" text-anchor="middle" >
    Provides baseline probabilities
  </text>
  <text x="600" y="415" font-size="10" text-anchor="middle" >
    Prevents drift via KL constraint
  </text>

  
  <rect x="100" y="440" width="600" height="50" class="bg-yellow" stroke="#F9A825" stroke-width="2" rx="5" />
  <text x="400" y="460" font-size="11" text-anchor="middle"  font-family="monospace">
    Loss = -log σ(β [log(π_θ(y_w|x)/π_ref(y_w|x)) - log(π_θ(y_l|x)/π_ref(y_l|x))])
  </text>
  <text x="400" y="478" font-size="9" text-anchor="middle" >
    Maximize separation between chosen and rejected responses
  </text>

  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
</svg>