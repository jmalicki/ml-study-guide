<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }
    .bg-formula { fill: #F5F5F5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }
      .bg-formula { fill: #2d2d2d; }

      /* Darken colored backgrounds in dark mode for proper contrast with white text */
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
      rect[fill="#81C784"] { fill: #4a7c4e; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    LoRA: Low-Rank Weight Decomposition
  </text>

  
  <g id="w0-matrix">
    <rect x="50" y="80" width="180" height="240" fill="#E8E8E8" stroke="#333" stroke-width="2" />
    <text x="140" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">W₀</text>
    <text x="140" y="135" font-size="14" text-anchor="middle" fill="#666">(d × k)</text>
    <text x="140" y="210" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">FROZEN</text>
    <text x="140" y="240" font-size="12" text-anchor="middle" fill="#666">Pretrained</text>
    <text x="140" y="260" font-size="12" text-anchor="middle" fill="#666">Weights</text>

    
    <rect x="125" y="270" width="30" height="25" rx="3" fill="none" stroke="#666" stroke-width="2" />
    <circle cx="140" cy="270" r="5" fill="none" stroke="#666" stroke-width="2" />
  </g>

  
  <g id="plus">
    <line x1="265" y1="200" x2="305" y2="200" stroke="#333" stroke-width="3" />
    <line x1="285" y1="180" x2="285" y2="220" stroke="#333" stroke-width="3" />
  </g>

  
  <g id="lora-matrices">
    
    <rect x="340" y="80" width="60" height="240" fill="#4A90A4" fill-opacity="0.7" stroke="#333" stroke-width="2" />
    <text x="370" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF">B</text>
    <text x="370" y="135" font-size="12" text-anchor="middle" fill="#FFF">(d × r)</text>
    <text x="370" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFF">Down</text>
    <text x="370" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFF">Proj</text>

    
    <rect x="420" y="150" width="120" height="100" fill="#81C784" fill-opacity="0.7" stroke="#333" stroke-width="2" />
    <text x="480" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF">A</text>
    <text x="480" y="200" font-size="12" text-anchor="middle" fill="#FFF">(r × k)</text>
    <text x="480" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFF">Up Proj</text>

    
    <text x="370" y="345" font-size="14" font-weight="bold" text-anchor="middle" fill="#E57373">r = 8 or 16</text>
    <text x="370" y="365" font-size="12" text-anchor="middle" fill="#666">(rank ≪ d, k)</text>
  </g>

  
  <g id="equals">
    <line x1="575" y1="190" x2="615" y2="190" stroke="#333" stroke-width="3" />
    <line x1="575" y1="210" x2="615" y2="210" stroke="#333" stroke-width="3" />
  </g>

  
  <g id="w-matrix">
    <rect x="640" y="80" width="140" height="240" fill="#4A90A4" fill-opacity="0.3" stroke="#333" stroke-width="2" />
    <text x="710" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">W</text>
    <text x="710" y="135" font-size="14" text-anchor="middle" fill="#666">(d × k)</text>
    <text x="710" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">W = W₀ + BA</text>
    <text x="710" y="230" font-size="12" text-anchor="middle" fill="#666">Effective</text>
    <text x="710" y="250" font-size="12" text-anchor="middle" fill="#666">Weights</text>

    
    <polyline points="690,280 700,295 730,265" fill="none" stroke="#81C784" stroke-width="3" />
  </g>

  
  <g id="formula">
    <rect x="20" y="340" width="760" height="50" class="bg-formula" stroke="#333" stroke-width="1" rx="5" />
    <text x="400" y="360" font-size="14" text-anchor="middle" fill="#333">
      Forward Pass:  h = W₀x + (α/r)·BAx
    </text>
    <text x="400" y="380" font-size="12" text-anchor="middle" fill="#666">
      Scaling factor α/r controls adaptation strength (typically α=16, r=8 → scaling=2)
    </text>
  </g>

  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E57373" />
    </marker>
  </defs>

  
  <line x1="370" y1="50" x2="370" y2="75" stroke="#E57373" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="370" y="45" font-size="12" font-weight="bold" text-anchor="middle" fill="#E57373">TRAINABLE</text>

  <line x1="480" y1="50" x2="480" y2="145" stroke="#E57373" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="480" y="45" font-size="12" font-weight="bold" text-anchor="middle" fill="#E57373">TRAINABLE</text>
</svg>