<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 2,2; }
      .curve { fill: none; stroke: #4A90A4; stroke-width: 3; }
      .optimal-zone { fill: #81C784; opacity: 0.2; }
      .unstable-zone { fill: #E57373; opacity: 0.15; }
      .slow-zone { fill: #FFB74D; opacity: 0.15; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #333; }
      .annotation { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #555; }
      .marker { fill: #E57373; }
      .optimal-marker { fill: #81C784; stroke: #333; stroke-width: 2; }
    
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        text { fill: #ffffff; }
        text[fill="#333"] { fill: #ffffff; }
        text[fill="#666"] { fill: #cccccc; }
        text[fill="#555"] { fill: #cccccc; }
        text[fill="white"],
        text[fill="#fff"] { fill: #ffffff; }

        .title { fill: #ffffff; }
        .subtitle { fill: #ffffff; }
        .label { fill: #ffffff; }
        .small-label { fill: #cccccc; }
        .axis-label { fill: #cccccc; }
        .small { fill: #cccccc; }
        .annotation { fill: #cccccc; }

        line[stroke="#333"] { stroke: #cccccc; }
        rect[stroke="#333"] { stroke: #cccccc; }
        rect[fill="white"] { fill: #1a1a1a; }
        rect[fill="#ffffff"] { fill: #1a1a1a; }

        .grid { stroke: #444444; }
        .axis { stroke: #cccccc; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">Learning Rate vs Training Loss: Finding the Sweet Spot</text>

  <!-- Grid -->
  <line x1="80" y1="100" x2="80" y2="400" class="grid"/>
  <line x1="200" y1="100" x2="200" y2="400" class="grid"/>
  <line x1="320" y1="100" x2="320" y2="400" class="grid"/>
  <line x1="440" y1="100" x2="440" y2="400" class="grid"/>
  <line x1="560" y1="100" x2="560" y2="400" class="grid"/>
  <line x1="680" y1="100" x2="680" y2="400" class="grid"/>

  <!-- Zones -->
  <!-- Too low zone -->
  <rect x="80" y="100" width="180" height="300" class="slow-zone"/>
  <text x="170" y="130" text-anchor="middle" class="annotation" font-weight="600">Too Low</text>
  <text x="170" y="150" text-anchor="middle" class="annotation">Slow Convergence</text>

  <!-- Optimal zone -->
  <rect x="260" y="100" width="180" height="300" class="optimal-zone"/>
  <text x="350" y="130" text-anchor="middle" class="annotation" font-weight="600" fill="#2E7D32">Optimal Range</text>
  <text x="350" y="150" text-anchor="middle" class="annotation" fill="#2E7D32">Fast, Stable Training</text>

  <!-- Too high zone -->
  <rect x="440" y="100" width="240" height="300" class="unstable-zone"/>
  <text x="560" y="130" text-anchor="middle" class="annotation" font-weight="600">Too High</text>
  <text x="560" y="150" text-anchor="middle" class="annotation">Instability/Divergence</text>

  <!-- Axes -->
  <line x1="80" y1="400" x2="680" y2="400" class="axis"/>
  <line x1="80" y1="100" x2="80" y2="400" class="axis"/>

  <!-- Axis labels -->
  <text x="380" y="435" text-anchor="middle" class="label" font-weight="600">Learning Rate</text>
  <text x="30" y="250" text-anchor="middle" class="label" font-weight="600" transform="rotate(-90 30 250)">Training Loss</text>

  <!-- X-axis tick labels -->
  <text x="80" y="420" text-anchor="middle" class="annotation">10⁻⁶</text>
  <text x="200" y="420" text-anchor="middle" class="annotation">10⁻⁵</text>
  <text x="320" y="420" text-anchor="middle" class="annotation">10⁻⁴</text>
  <text x="440" y="420" text-anchor="middle" class="annotation">10⁻³</text>
  <text x="560" y="420" text-anchor="middle" class="annotation">10⁻²</text>
  <text x="680" y="420" text-anchor="middle" class="annotation">10⁻¹</text>

  <!-- Y-axis tick labels -->
  <text x="70" y="105" text-anchor="end" class="annotation">High</text>
  <text x="70" y="250" text-anchor="end" class="annotation">Medium</text>
  <text x="70" y="405" text-anchor="end" class="annotation">Low</text>

  <!-- U-shaped curve: starts high, dips to optimal, then rises sharply -->
  <path d="M 80,150
           Q 200,120 260,110
           Q 320,105 380,105
           Q 440,110 500,140
           Q 560,200 620,300
           L 680,380"
        class="curve"/>

  <!-- Optimal point marker -->
  <circle cx="350" cy="105" r="6" class="optimal-marker"/>
  <text x="350" y="90" text-anchor="middle" class="annotation" font-weight="600" fill="#2E7D32">Optimal LR</text>
  <text x="350" y="75" text-anchor="middle" class="annotation" fill="#2E7D32">≈ 3×10⁻⁴ (small models)</text>

  <!-- Annotations with arrows -->
  <!-- Left side: too slow -->
  <path d="M 150,230 L 150,160" stroke="#FFB74D" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="150" y="250" text-anchor="middle" class="annotation" fill="#F57C00">Underfitting</text>
  <text x="150" y="265" text-anchor="middle" class="annotation" fill="#F57C00">Slow progress</text>

  <!-- Right side: too fast -->
  <path d="M 600,230 L 620,300" stroke="#E57373" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="600" y="220" text-anchor="middle" class="annotation" fill="#C62828">Loss spikes</text>
  <text x="600" y="235" text-anchor="middle" class="annotation" fill="#C62828">Divergence</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F57C00"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C62828"/>
    </marker>
  </defs>

  <!-- Key insights box -->
  <rect x="480" y="310" width="190" height="80" fill="white" stroke="#333" stroke-width="1" rx="5"/>
  <text x="490" y="330" class="annotation" font-weight="600">Key Insights:</text>
  <text x="490" y="348" class="annotation">• Too low: wastes compute</text>
  <text x="490" y="365" class="annotation">• Too high: training fails</text>
  <text x="490" y="382" class="annotation">• Optimal: model-size dependent</text>
</svg>
