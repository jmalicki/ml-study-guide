<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Legend box dark mode */
      rect[fill="white"] { fill: #1a1a1a; }
      rect[stroke="#333"] { stroke: #cccccc; }

      /* Darken colored shapes for better visibility in dark mode */
      circle[fill="#81C784"] { fill: #4a7c4e; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><rect width="600" height="400" fill="white" />

  
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold"  text-anchor="middle">
    Training Loss Curves
  </text>

  
  <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2" />
  <line x1="60" y1="60" x2="60" y2="350" stroke="#333" stroke-width="2" />

  
  <text x="310" y="385" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle">
    Training Steps
  </text>
  <text x="25" y="210" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" transform="rotate(-90 25 210)">
    Loss
  </text>

  
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle">0</text>
  <text x="185" y="370" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle">5k</text>
  <text x="310" y="370" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle">10k</text>
  <text x="435" y="370" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle">15k</text>
  <text x="560" y="370" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle">20k</text>

  
  <text x="50" y="350" font-family="Arial, sans-serif" font-size="12"  text-anchor="end">1.0</text>
  <text x="50" y="277" font-family="Arial, sans-serif" font-size="12"  text-anchor="end">2.0</text>
  <text x="50" y="204" font-family="Arial, sans-serif" font-size="12"  text-anchor="end">3.0</text>
  <text x="50" y="131" font-family="Arial, sans-serif" font-size="12"  text-anchor="end">4.0</text>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="12"  text-anchor="end">5.0</text>

  
  <line x1="60" y1="277" x2="560" y2="277" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="60" y1="204" x2="560" y2="204" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="60" y1="131" x2="560" y2="131" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5" />

  
  <path d="M 60,88            C 110,95 135,110 185,145            C 235,175 260,190 310,215            C 360,235 385,245 435,258            C 485,268 510,272 560,275" fill="none" stroke="#4A90A4" stroke-width="3" />

  
  <path d="M 60,82            L 110,88            L 135,98            L 185,138            L 210,155            L 235,165            L 260,180            L 310,205            L 335,215            L 360,222            L 385,235            L 435,248            L 460,253            L 485,256            L 510,258            L 560,262" fill="none" stroke="#E57373" stroke-width="2" stroke-dasharray="5,3" />

  <!-- Legend -->
  <g class="legend">
    <!-- Legend background box -->
    <rect x="390" y="70" width="160" height="65" fill="white" stroke="#333" stroke-width="1" rx="5"/>

    <!-- Training Loss -->
    <line x1="400" y1="90" x2="430" y2="90" stroke="#4A90A4" stroke-width="3" />
    <text x="435" y="95" font-family="Arial, sans-serif" font-size="13" >Training Loss</text>

    <!-- Validation Loss -->
    <line x1="400" y1="115" x2="430" y2="115" stroke="#E57373" stroke-width="2" stroke-dasharray="5,3" />
    <text x="435" y="120" font-family="Arial, sans-serif" font-size="13" >Validation Loss</text>
  </g>


  <circle cx="185" cy="145" r="4" fill="#81C784" />
  <text x="190" y="140" font-family="Arial, sans-serif" font-size="11" >
    Fast initial drop
  </text>

  <circle cx="435" cy="258" r="4" fill="#81C784" />
  <text x="370" y="290" font-family="Arial, sans-serif" font-size="11" >
    Convergence
  </text>

  
  <line x1="485" y1="268" x2="485" y2="256" stroke="#C62828" stroke-width="1" stroke-dasharray="2,2" />
  <text x="490" y="240" font-family="Arial, sans-serif" font-size="10" >
    Val loss plateaus
  </text>
</svg>