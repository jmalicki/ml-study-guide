<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="white"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">
    Training Loss Curves
  </text>

  <!-- Axes -->
  <line x1="60" y1="350" x2="560" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="60" x2="60" y2="350" stroke="#333" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="310" y="385" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">
    Training Steps
  </text>
  <text x="25" y="210" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 25 210)">
    Loss
  </text>

  <!-- X-axis ticks -->
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">0</text>
  <text x="185" y="370" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">5k</text>
  <text x="310" y="370" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">10k</text>
  <text x="435" y="370" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">15k</text>
  <text x="560" y="370" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">20k</text>

  <!-- Y-axis ticks -->
  <text x="50" y="350" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">1.0</text>
  <text x="50" y="277" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">2.0</text>
  <text x="50" y="204" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">3.0</text>
  <text x="50" y="131" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">4.0</text>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">5.0</text>

  <!-- Grid lines -->
  <line x1="60" y1="277" x2="560" y2="277" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="60" y1="204" x2="560" y2="204" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="60" y1="131" x2="560" y2="131" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Training loss curve (smooth exponential decay) -->
  <path d="M 60,88
           C 110,95 135,110 185,145
           C 235,175 260,190 310,215
           C 360,235 385,245 435,258
           C 485,268 510,272 560,275"
        fill="none" stroke="#4A90A4" stroke-width="3"/>

  <!-- Validation loss curve (slightly higher, more jagged) -->
  <path d="M 60,82
           L 110,88
           L 135,98
           L 185,138
           L 210,155
           L 235,165
           L 260,180
           L 310,205
           L 335,215
           L 360,222
           L 385,235
           L 435,248
           L 460,253
           L 485,256
           L 510,258
           L 560,262"
        fill="none" stroke="#E57373" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <line x1="400" y1="90" x2="430" y2="90" stroke="#4A90A4" stroke-width="3"/>
  <text x="435" y="95" font-family="Arial, sans-serif" font-size="13" fill="#333">Training Loss</text>

  <line x1="400" y1="115" x2="430" y2="115" stroke="#E57373" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="435" y="120" font-family="Arial, sans-serif" font-size="13" fill="#333">Validation Loss</text>

  <!-- Annotations -->
  <circle cx="185" cy="145" r="4" fill="#81C784"/>
  <text x="190" y="140" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Fast initial drop
  </text>

  <circle cx="435" cy="258" r="4" fill="#81C784"/>
  <text x="370" y="290" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Convergence
  </text>

  <!-- Overfitting region indicator -->
  <line x1="485" y1="268" x2="485" y2="256" stroke="#E57373" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="490" y="240" font-family="Arial, sans-serif" font-size="10" fill="#E57373">
    Val loss plateaus
  </text>
</svg>
