<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" style="max-width: 700px; width: 100%; height: auto;">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }
    .bg-box { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }
      .bg-box { fill: #2d2d2d; }

      /* Darken colored backgrounds in dark mode for proper contrast */
      rect[fill="#e8f4f8"] { fill: #2d5f6f; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style>

  <rect x="20" y="20" width="400" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="3" />
  <text x="30" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #333 !important" font-weight="600">[SYSTEM: instructions]</text>
  <line x1="440" y1="40" x2="520" y2="40" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="530" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#999">masked</text>

  
  <rect x="20" y="75" width="400" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="3" />
  <text x="30" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#333" font-weight="600">[USER: question 1]</text>
  <line x1="440" y1="95" x2="520" y2="95" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="530" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#999">masked</text>



  <rect x="20" y="130" width="400" height="40" fill="#e8f4f8" stroke="#4A90A4" stroke-width="3" rx="3" />
  <text x="30" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #333 !important" font-weight="600">[ASSISTANT: answer 1]</text>
  <line x1="440" y1="150" x2="520" y2="150" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="530" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A90A4" font-weight="600">LEARNED</text>

  
  <rect x="20" y="185" width="400" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="3" />
  <text x="30" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#333" font-weight="600">[USER: question 2]</text>
  <line x1="440" y1="205" x2="520" y2="205" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)" />
  <text x="530" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#999">masked</text>



  <rect x="20" y="240" width="400" height="40" fill="#e8f4f8" stroke="#4A90A4" stroke-width="3" rx="3" />
  <text x="30" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #333 !important" font-weight="600">[ASSISTANT: answer 2]</text>
  <line x1="440" y1="260" x2="520" y2="260" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="530" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4A90A4" font-weight="600">LEARNED</text>

  
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>
</svg>