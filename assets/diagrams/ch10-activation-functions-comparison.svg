  <line x1="560" y1="420" x2="560" y2="425" class="axis"/>
  <text x="560" y="445" class="tick-label" text-anchor="middle">2</text>

  <line x1="620" y1="420" x2="620" y2="425" class="axis"/>
  <text x="620" y="445" class="tick-label" text-anchor="middle">3</text>

  <line x1="680" y1="420" x2="680" y2="425" class="axis"/>
  <text x="680" y="445" class="tick-label" text-anchor="middle">4</text>

  <!-- Y-axis ticks and labels -->
  <line x1="75" y1="420" x2="80" y2="420" class="axis"/>
  <text x="65" y="424" class="tick-label" text-anchor="end">-0.5</text>

  <line x1="75" y1="352" x2="80" y2="352" class="axis"/>
  <text x="65" y="356" class="tick-label" text-anchor="end">0</text>

  <line x1="75" y1="284" x2="80" y2="284" class="axis"/>
