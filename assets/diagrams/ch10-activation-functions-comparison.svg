  <!-- Minimum around x=-1.28, y=-0.28 -->
  <polyline class="silu" points="80,353 86,353 92,353 98,353 104,353 110,354 116,354 122,354 128,354 134,354 140,354 146,354 152,355 158,355 164,355 170,355 176,356 182,356 188,356 194,357 200,357 206,357 212,358 218,358 224,359 230,359 236,359 242,360 248,361 254,361 260,362 266,362 272,363 278,364 284,364 290,365 296,366 302,366 308,367 314,368 320,368 326,369 332,369 338,370 344,370 350,371 356,371 362,371 368,371 374,371 380,370 386,370 392,369 398,368 404,366 410,365 416,363 422,361 428,358 434,355 440,352 446,348 452,345 458,340 464,336 470,331 476,326 482,320 488,314 494,308 500,302 506,296 512,289 518,283 524,276 530,269 536,261 542,254 548,247 554,240 560,232 566,225 572,217 578,210 584,202 590,195 596,187 602,180 608,173 614,165 620,158 626,150 632,143 638,136 644,128 650,121 656,114 662,106 668,99 674,92 680,85"/>

