  <line x1="75" y1="148" x2="80" y2="148" class="axis"/>
  <text x="65" y="152" class="tick-label" text-anchor="end">3</text>

  <line x1="75" y1="80" x2="80" y2="80" class="axis"/>
  <text x="65" y="84" class="tick-label" text-anchor="end">4</text>

  <!-- Axis labels -->
  <text x="380" y="480" class="axis-label" text-anchor="middle">Input (x)</text>
  <text x="30" y="250" class="axis-label" text-anchor="middle" transform="rotate(-90 30 250)">Output</text>

  <!-- ReLU: max(0, x) -->
  <polyline class="relu" points="80,352 140,352 200,352 260,352 320,352 380,352 440,352 500,284 560,216 620,148 680,80"/>

