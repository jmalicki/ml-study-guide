  <polyline class="geglu" points="80,352 86,352 92,352 98,352 104,352 110,352 116,352 122,352 128,352 134,352 140,352 146,352 152,352 158,352 164,352 170,352 176,352 182,352 188,352 194,352 200,352 206,352 212,352 218,352 224,352 230,352 236,352 242,352 248,352 254,351 260,351 266,351 272,351 278,350 284,350 290,349 296,349 302,348 308,347 314,347 320,346 326,345 332,344 338,343 344,342 350,342 356,341 362,341 368,341 374,341 380,341 386,342 392,343 398,344 404,345 410,347 416,348 422,350 428,351 434,352 440,352 446,352 452,350 458,348 464,345 470,340 476,334 482,327 488,318 494,307 500,295 506,281 512,265 518,248 524,230 530,209 536,187 542,164 548,140 554,114 560,86 566,57 572,27 578,-4 584,-37 590,-70 596,-106 602,-142 608,-180 614,-219 620,-259 626,-301 632,-344 638,-388 644,-434 650,-481 656,-529 662,-579 668,-630 674,-682 680,-736"/>

  <!-- Sigmoid: 1 / (1 + exp(-x)) -->
  <polyline class="sigmoid" points="80,352 86,352 92,352 98,352 104,352 110,352 116,352 122,352 128,352 134,352 140,352 146,351 152,351 158,351 164,351 170,351 176,351 182,351 188,351 194,351 200,351 206,351 212,351 218,350 224,350 230,350 236,350 242,350 248,349 254,349 260,349 266,348 272,348 278,348 284,347 290,347 296,346 302,346 308,345 314,345 320,344 326,343 332,342 338,341 344,341 350,340 356,339 362,337 368,336 374,335 380,334 386,332 392,331 398,329 404,328 410,326 416,325 422,323 428,321 434,320 440,318 446,316 452,315 458,313 464,311 470,310 476,308 482,307 488,305 494,304 500,302 506,301 512,300 518,299 524,297 530,296 536,295 542,295 548,294 554,293 560,292 566,291 572,291 578,290 584,290 590,289 596,289 602,288 608,288 614,288 620,287 626,287 632,287 638,286 644,286 650,286 656,286 662,286 668,285 674,285 680,285"/>

  <!-- Tanh: (exp(x) - exp(-x)) / (exp(x) + exp(-x)) -->
  <polyline class="tanh" points="80,420 86,420 92,420 98,420 104,420 110,420 116,420 122,420 128,420 134,420 140,420 146,420 152,420 158,420 164,420 170,420 176,420 182,420 188,420 194,420 200,420 206,420 212,420 218,420 224,420 230,420 236,420 242,420 248,420 254,420 260,420 266,420 272,419 278,419 284,419 290,419 296,419 302,419 308,418 314,418 320,418 326,417 332,416 338,416 344,415 350,414 356,412 362,411 368,409 374,406 380,404 386,401 392,397 398,393 404,389 410,383 416,378 422,372 428,365 434,359 440,352 446,345 452,339 458,332 464,326 470,321 476,315 482,311 488,307 494,303 500,300 506,298 512,295 518,293 524,292 530,290 536,289 542,288 548,288 554,287 560,286 566,286 572,286 578,285 584,285 590,285 596,285 602,285 608,285 614,284 620,284 626,284 632,284 638,284 644,284 650,284 656,284 662,284 668,284 674,284 680,284"/>

  <!-- Legend -->
  <g transform="translate(550, 362)">
    <rect x="0" y="0" width="120" height="128" class="legend-box" rx="5"/>

    <!-- ReLU -->
    <line x1="10" y1="15" x2="30" y2="15" class="relu"/>
    <text x="35" y="19" class="legend-text">ReLU</text>

    <!-- GELU -->
    <line x1="10" y1="33" x2="30" y2="33" class="gelu"/>
    <text x="35" y="37" class="legend-text">GELU</text>

    <!-- SiLU -->
    <line x1="10" y1="51" x2="30" y2="51" class="silu"/>
    <text x="35" y="55" class="legend-text">SiLU</text>

    <!-- GEGLU -->
    <line x1="10" y1="69" x2="30" y2="69" class="geglu"/>
    <text x="35" y="73" class="legend-text">GEGLU</text>

    <!-- Sigmoid -->
    <line x1="10" y1="87" x2="30" y2="87" class="sigmoid"/>
    <text x="35" y="91" class="legend-text">Sigmoid</text>

    <!-- Tanh -->
    <line x1="10" y1="105" x2="30" y2="105" class="tanh"/>
    <text x="35" y="109" class="legend-text">Tanh</text>
  </g>

  <!-- Annotations -->
  <!-- Annotation: SiLU/GELU minimum point -->
  <!-- Minimum around x=-1.28, y=-0.28 => SVG approximately (363, 371) -->
  <circle cx="363" cy="371" r="3" class="annotation-dot"/>
  <line x1="363" y1="371" x2="310" y2="410" class="annotation-line"/>
  <text x="305" y="415" class="annotation-text" text-anchor="end">min ≈ -0.28</text>

  <!-- Annotation: Approach to zero for large negative x -->
  <!-- Point at x=-5.5 => SVG x ≈ 110 -->
  <text x="150" y="395" class="annotation-text" text-anchor="middle">GELU, SiLU → 0</text>
  <text x="150" y="407" class="annotation-text" text-anchor="middle">as x → -∞</text>

  <!-- Annotation: y=0 line label -->
  <text x="690" y="356" class="annotation-text" text-anchor="start">y = 0</text>
</svg>
