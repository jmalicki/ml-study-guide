<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      /* Default (light mode) */
      .grid-line { stroke: #e0e0e0; stroke-width: 1; }
      .axis { stroke: #333; stroke-width: 2; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #333; }
      .tick-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #666; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #222; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #333; }
      .legend-box { fill: white; stroke: #ccc; stroke-width: 1; }
      .relu { stroke: #4A90A4; stroke-width: 2.5; fill: none; }
      .gelu { stroke: #E57373; stroke-width: 2.5; fill: none; }
      .silu { stroke: #81C784; stroke-width: 2.5; fill: none; }
      .geglu { stroke: #FF7043; stroke-width: 2.5; fill: none; }
      .sigmoid { stroke: #FFB74D; stroke-width: 2.5; fill: none; }
      .tanh { stroke: #9575CD; stroke-width: 2.5; fill: none; }
      .annotation-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #666; font-style: italic; }
      .annotation-line { stroke: #999; stroke-width: 1; stroke-dasharray: 3,3; }
      .annotation-dot { fill: #E57373; }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        .grid-line { stroke: #444444; }
        .axis { stroke: #cccccc; }
        .axis-label { fill: #cccccc; }
        .tick-label { fill: #aaaaaa; }
        .title { fill: #ffffff; }
        .legend-text { fill: #cccccc; }
        .legend-box { fill: rgba(26, 26, 26, 0.9); stroke: #666; }
        .annotation-text { fill: #aaaaaa; }
        .annotation-line { stroke: #888; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Activation Functions Comparison</text>

  <!-- Plot area coordinates: x from 80 to 680, y from 80 to 420 -->
  <!-- Data range: x from -6 to 4, y from -0.5 to 4.5 -->

  <!-- Grid lines (vertical) -->
  <line x1="140" y1="80" x2="140" y2="420" class="grid-line"/>
  <line x1="200" y1="80" x2="200" y2="420" class="grid-line"/>
  <line x1="260" y1="80" x2="260" y2="420" class="grid-line"/>
  <line x1="320" y1="80" x2="320" y2="420" class="grid-line"/>
  <line x1="380" y1="80" x2="380" y2="420" class="grid-line"/>
  <line x1="440" y1="80" x2="440" y2="420" class="grid-line"/>
  <line x1="500" y1="80" x2="500" y2="420" class="grid-line"/>
  <line x1="560" y1="80" x2="560" y2="420" class="grid-line"/>
  <line x1="620" y1="80" x2="620" y2="420" class="grid-line"/>
  <line x1="680" y1="80" x2="680" y2="420" class="grid-line"/>

  <!-- Grid lines (horizontal) -->
  <line x1="80" y1="80" x2="680" y2="80" class="grid-line"/>
  <line x1="80" y1="148" x2="680" y2="148" class="grid-line"/>
  <line x1="80" y1="216" x2="680" y2="216" class="grid-line"/>
  <line x1="80" y1="284" x2="680" y2="284" class="grid-line"/>
  <line x1="80" y1="352" x2="680" y2="352" class="grid-line"/>
  <line x1="80" y1="420" x2="680" y2="420" class="grid-line"/>

  <!-- Horizontal line at y=0 (dashed) -->
  <line x1="80" y1="352" x2="680" y2="352" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7"/>

  <!-- Axes -->
  <line x1="80" y1="420" x2="680" y2="420" class="axis"/>
  <line x1="80" y1="80" x2="80" y2="420" class="axis"/>

  <!-- X-axis ticks and labels -->
  <line x1="80" y1="420" x2="80" y2="425" class="axis"/>
  <text x="80" y="445" class="tick-label" text-anchor="middle">-6</text>

  <line x1="140" y1="420" x2="140" y2="425" class="axis"/>
  <text x="140" y="445" class="tick-label" text-anchor="middle">-5</text>

  <line x1="200" y1="420" x2="200" y2="425" class="axis"/>
  <text x="200" y="445" class="tick-label" text-anchor="middle">-4</text>

  <line x1="260" y1="420" x2="260" y2="425" class="axis"/>
  <text x="260" y="445" class="tick-label" text-anchor="middle">-3</text>

  <line x1="320" y1="420" x2="320" y2="425" class="axis"/>
  <text x="320" y="445" class="tick-label" text-anchor="middle">-2</text>

  <line x1="380" y1="420" x2="380" y2="425" class="axis"/>
  <text x="380" y="445" class="tick-label" text-anchor="middle">-1</text>

  <line x1="440" y1="420" x2="440" y2="425" class="axis"/>
