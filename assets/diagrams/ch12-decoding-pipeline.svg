<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .title { fill: #333333; }
    .annotation { fill: #555555; }
    rect.stage { fill: #e3f2fd; stroke: #1976d2; }
    rect.stage-transform { fill: #fff3e0; stroke: #f57c00; }
    rect.stage-sample { fill: #e8f5e9; stroke: #388e3c; }
    rect.box { fill: #f5f5f5; stroke: #cccccc; }
    line.arrow { stroke: #666666; }
    polygon.arrowhead { fill: #666666; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .title { fill: #ffffff; }
      .annotation { fill: #aaaaaa; }
      rect.stage { fill: #1565c0; stroke: #64b5f6; }
      rect.stage-transform { fill: #e65100; stroke: #ffb74d; }
      rect.stage-sample { fill: #2e7d32; stroke: #81c784; }
      rect.box { fill: #2d2d2d; stroke: #555555; }
      line.arrow { stroke: #aaaaaa; }
      polygon.arrowhead { fill: #aaaaaa; }
    }
  </style>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrowhead"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" class="title">
    The Decoding Pipeline: From Logits to Next Token
  </text>

  <!-- Stage 1: Model Output -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="120" height="70" rx="8" class="stage" stroke-width="2"/>
    <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Model</text>
    <text x="60" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Forward</text>
    <text x="60" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">→ Logits</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="150" y1="105" x2="175" y2="105" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Temperature -->
  <g transform="translate(180, 70)">
    <rect x="0" y="0" width="110" height="70" rx="8" class="stage-transform" stroke-width="2"/>
    <text x="55" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Temperature</text>
    <text x="55" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">z / T</text>
    <text x="55" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(optional)</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="290" y1="105" x2="315" y2="105" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Top-k -->
  <g transform="translate(320, 70)">
    <rect x="0" y="0" width="100" height="70" rx="8" class="stage-transform" stroke-width="2"/>
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Top-k</text>
    <text x="50" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">Keep top k</text>
    <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(optional)</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="420" y1="105" x2="445" y2="105" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Top-p -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="100" height="70" rx="8" class="stage-transform" stroke-width="2"/>
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Top-p</text>
    <text x="50" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">Nucleus p</text>
    <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="annotation">(optional)</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="550" y1="105" x2="575" y2="105" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Softmax -->
  <g transform="translate(580, 70)">
    <rect x="0" y="0" width="100" height="70" rx="8" class="stage" stroke-width="2"/>
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Softmax</text>
    <text x="50" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">→ Probs</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="680" y1="105" x2="705" y2="105" class="arrow" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6: Sample -->
  <g transform="translate(710, 70)">
    <rect x="0" y="0" width="110" height="70" rx="8" class="stage-sample" stroke-width="2"/>
    <text x="55" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sample</text>
    <text x="55" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" class="annotation">→ Token ID</text>
  </g>

  <!-- Order of operations box -->
  <g transform="translate(30, 170)">
    <rect x="0" y="0" width="790" height="85" rx="8" class="box" stroke-width="1"/>

    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" class="title">Order of Operations Matters!</text>

    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      Correct: Logits → Temperature → Top-k → Top-p → Softmax → Sample
    </text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      Why: Temperature changes distribution shape before filtering; top-k runs before top-p (coarse then fine filtering)
    </text>
  </g>

  <!-- Common configurations -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="790" height="95" rx="8" class="box" stroke-width="1"/>

    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" class="title">Common Configurations:</text>

    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      <tspan font-weight="bold">Chatbots (ChatGPT, Claude):</tspan> T=0.7-0.8, top-p=0.9, no top-k
    </text>
    <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      <tspan font-weight="bold">Code generation:</tspan> T=0.2-0.4, top-p=0.95 (more deterministic)
    </text>
    <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      <tspan font-weight="bold">Creative writing:</tspan> T=1.0-1.2, top-p=0.95-0.98 (more diverse)
    </text>

    <text x="450" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      <tspan font-weight="bold">Greedy:</tspan> T→0 or argmax (deterministic)
    </text>
    <text x="450" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      <tspan font-weight="bold">Translation:</tspan> Beam search (k=4-5)
    </text>
    <text x="450" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">
      <tspan font-weight="bold">Summarization:</tspan> Beam search + length penalty
    </text>
  </g>
</svg>
