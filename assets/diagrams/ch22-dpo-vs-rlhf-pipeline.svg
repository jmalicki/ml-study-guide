<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-orange { fill: #FFE0B2; }
    .bg-green-light { fill: #C8E6C9; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-orange { fill: #4a3a2d; }
      .bg-green-light { fill: #2d4a2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    DPO vs RLHF: Pipeline Comparison
  </text>

  
  <text x="50" y="70" font-size="18" font-weight="bold" fill="#E57373">RLHF Pipeline</text>

  
  <rect x="50" y="90" width="150" height="80" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5" />
  <text x="125" y="115" font-size="14" font-weight="bold" text-anchor="middle" style="fill: #fff !important">Stage 1: SFT</text>
  <text x="125" y="135" font-size="11" text-anchor="middle" style="fill: #fff !important">Train on</text>
  <text x="125" y="150" font-size="11" text-anchor="middle" style="fill: #fff !important">demonstrations</text>

  
  <path d="M 200 130 L 240 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  
  <rect x="240" y="90" width="150" height="80" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5" />
  <text x="315" y="115" font-size="14" font-weight="bold" text-anchor="middle" style="fill: #fff !important">Stage 2: RM</text>
  <text x="315" y="135" font-size="11" text-anchor="middle" style="fill: #fff !important">Train reward</text>
  <text x="315" y="150" font-size="11" text-anchor="middle" style="fill: #fff !important">model</text>

  
  <path d="M 390 130 L 430 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  
  <rect x="430" y="90" width="150" height="80" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5" />
  <text x="505" y="115" font-size="14" font-weight="bold" text-anchor="middle" style="fill: #fff !important">Stage 3: RL</text>
  <text x="505" y="135" font-size="11" text-anchor="middle" style="fill: #fff !important">PPO against</text>
  <text x="505" y="150" font-size="11" text-anchor="middle" style="fill: #fff !important">reward model</text>

  
  <text x="50" y="195" font-size="12" font-weight="bold" fill="#333">Models Required:</text>
  <rect x="50" y="205" width="120" height="25" class="bg-orange" stroke="#333" stroke-width="1" rx="3" />
  <text x="110" y="222" font-size="11" text-anchor="middle" style="fill: #333 !important">Policy Model</text>

  <rect x="180" y="205" width="120" height="25" class="bg-orange" stroke="#333" stroke-width="1" rx="3" />
  <text x="240" y="222" font-size="11" text-anchor="middle" style="fill: #333 !important">Reference Model</text>

  <rect x="310" y="205" width="120" height="25" class="bg-orange" stroke="#333" stroke-width="1" rx="3" />
  <text x="370" y="222" font-size="11" text-anchor="middle" style="fill: #333 !important">Reward Model</text>

  <rect x="440" y="205" width="120" height="25" class="bg-orange" stroke="#333" stroke-width="1" rx="3" />
  <text x="500" y="222" font-size="11" text-anchor="middle" style="fill: #333 !important">Value Model</text>

  
  <text x="50" y="260" font-size="12" font-weight="bold" fill="#333">Challenges:</text>
  <text x="50" y="280" font-size="11" fill="#E57373">• Unstable RL training</text>
  <text x="50" y="298" font-size="11" fill="#E57373">• Complex multi-stage pipeline</text>
  <text x="50" y="316" font-size="11" fill="#E57373">• High computational cost</text>
  <text x="50" y="334" font-size="11" fill="#E57373">• Many hyperparameters to tune</text>

  
  <line x1="50" y1="370" x2="850" y2="370" stroke="#333" stroke-width="2" />

  
  <text x="50" y="410" font-size="18" font-weight="bold" fill="#81C784">DPO Pipeline</text>

  
  <rect x="50" y="430" width="350" height="80" fill="#81C784" stroke="#333" stroke-width="2" rx="5" />
  <text x="225" y="455" font-size="14" font-weight="bold" text-anchor="middle" style="fill: #1B5E20 !important">Direct Preference Optimization</text>
  <text x="225" y="475" font-size="11" text-anchor="middle" style="fill: #1B5E20 !important">Train policy model directly on</text>
  <text x="225" y="492" font-size="11" text-anchor="middle" style="fill: #1B5E20 !important">preference data (chosen vs rejected)</text>

  
  <text x="450" y="445" font-size="12" font-weight="bold" fill="#333">Models Required:</text>
  <rect x="450" y="455" width="120" height="25" class="bg-green-light" stroke="#333" stroke-width="1" rx="3" />
  <text x="510" y="472" font-size="11" text-anchor="middle" style="fill: #333 !important">Policy Model</text>

  <rect x="580" y="455" width="120" height="25" class="bg-green-light" stroke="#333" stroke-width="1" rx="3" />
  <text x="640" y="472" font-size="11" text-anchor="middle" style="fill: #333 !important">Reference Model</text>

  
  <text x="50" y="540" font-size="12" font-weight="bold" fill="#333">Benefits:</text>
  <text x="50" y="560" font-size="11" fill="#81C784">• Stable supervised learning</text>
  <text x="300" y="560" font-size="11" fill="#81C784">• Much simpler implementation</text>
  <text x="50" y="578" font-size="11" fill="#81C784">• Single training stage</text>
  <text x="300" y="578" font-size="11" fill="#81C784">• Fewer models (2 vs 4)</text>

  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
</svg>