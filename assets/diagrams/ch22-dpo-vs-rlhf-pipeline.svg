<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Title -->
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    DPO vs RLHF: Pipeline Comparison
  </text>

  <!-- RLHF Pipeline (Top) -->
  <text x="50" y="70" font-size="18" font-weight="bold" fill="#E57373">RLHF Pipeline</text>

  <!-- Stage 1: SFT -->
  <rect x="50" y="90" width="150" height="80" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5"/>
  <text x="125" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Stage 1: SFT</text>
  <text x="125" y="135" font-size="11" text-anchor="middle" fill="white">Train on</text>
  <text x="125" y="150" font-size="11" text-anchor="middle" fill="white">demonstrations</text>

  <!-- Arrow -->
  <path d="M 200 130 L 240 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 2: Reward Model -->
  <rect x="240" y="90" width="150" height="80" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5"/>
  <text x="315" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Stage 2: RM</text>
  <text x="315" y="135" font-size="11" text-anchor="middle" fill="white">Train reward</text>
  <text x="315" y="150" font-size="11" text-anchor="middle" fill="white">model</text>

  <!-- Arrow -->
  <path d="M 390 130 L 430 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Stage 3: RL -->
  <rect x="430" y="90" width="150" height="80" fill="#4A90A4" stroke="#333" stroke-width="2" rx="5"/>
  <text x="505" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Stage 3: RL</text>
  <text x="505" y="135" font-size="11" text-anchor="middle" fill="white">PPO against</text>
  <text x="505" y="150" font-size="11" text-anchor="middle" fill="white">reward model</text>

  <!-- Models required for RLHF -->
  <text x="50" y="195" font-size="12" font-weight="bold" fill="#333">Models Required:</text>
  <rect x="50" y="205" width="120" height="25" fill="#FFE0B2" stroke="#333" stroke-width="1" rx="3"/>
  <text x="110" y="222" font-size="11" text-anchor="middle" fill="#333">Policy Model</text>

  <rect x="180" y="205" width="120" height="25" fill="#FFE0B2" stroke="#333" stroke-width="1" rx="3"/>
  <text x="240" y="222" font-size="11" text-anchor="middle" fill="#333">Reference Model</text>

  <rect x="310" y="205" width="120" height="25" fill="#FFE0B2" stroke="#333" stroke-width="1" rx="3"/>
  <text x="370" y="222" font-size="11" text-anchor="middle" fill="#333">Reward Model</text>

  <rect x="440" y="205" width="120" height="25" fill="#FFE0B2" stroke="#333" stroke-width="1" rx="3"/>
  <text x="500" y="222" font-size="11" text-anchor="middle" fill="#333">Value Model</text>

  <!-- Challenges -->
  <text x="50" y="260" font-size="12" font-weight="bold" fill="#333">Challenges:</text>
  <text x="50" y="280" font-size="11" fill="#E57373">• Unstable RL training</text>
  <text x="50" y="298" font-size="11" fill="#E57373">• Complex multi-stage pipeline</text>
  <text x="50" y="316" font-size="11" fill="#E57373">• High computational cost</text>
  <text x="50" y="334" font-size="11" fill="#E57373">• Many hyperparameters to tune</text>

  <!-- Separator line -->
  <line x1="50" y1="370" x2="850" y2="370" stroke="#333" stroke-width="2"/>

  <!-- DPO Pipeline (Bottom) -->
  <text x="50" y="410" font-size="18" font-weight="bold" fill="#81C784">DPO Pipeline</text>

  <!-- Single Stage -->
  <rect x="50" y="430" width="350" height="80" fill="#81C784" stroke="#333" stroke-width="2" rx="5"/>
  <text x="225" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Direct Preference Optimization</text>
  <text x="225" y="475" font-size="11" text-anchor="middle" fill="white">Train policy model directly on</text>
  <text x="225" y="492" font-size="11" text-anchor="middle" fill="white">preference data (chosen vs rejected)</text>

  <!-- Models required for DPO -->
  <text x="450" y="445" font-size="12" font-weight="bold" fill="#333">Models Required:</text>
  <rect x="450" y="455" width="120" height="25" fill="#C8E6C9" stroke="#333" stroke-width="1" rx="3"/>
  <text x="510" y="472" font-size="11" text-anchor="middle" fill="#333">Policy Model</text>

  <rect x="580" y="455" width="120" height="25" fill="#C8E6C9" stroke="#333" stroke-width="1" rx="3"/>
  <text x="640" y="472" font-size="11" text-anchor="middle" fill="#333">Reference Model</text>

  <!-- Benefits -->
  <text x="50" y="540" font-size="12" font-weight="bold" fill="#333">Benefits:</text>
  <text x="50" y="560" font-size="11" fill="#81C784">• Stable supervised learning</text>
  <text x="300" y="560" font-size="11" fill="#81C784">• Much simpler implementation</text>
  <text x="50" y="578" font-size="11" fill="#81C784">• Single training stage</text>
  <text x="300" y="578" font-size="11" fill="#81C784">• Fewer models (2 vs 4)</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
