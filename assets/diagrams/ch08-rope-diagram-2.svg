<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" style="max-width: 600px; margin: 20px auto; display: block">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    .bg-main { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      text[fill="#1976D2"] { fill: #4fc3f7; }
      text[fill="#E65100"] { fill: #ffa726; }

      .bg-main { fill: #2d2d2d; }

      /* Darken colored backgrounds for better contrast with white text */
      rect[fill="#E3F2FD"] { fill: #2d5f6f; }
      rect[fill="#FFF3E0"] { fill: #9b6b2e; }
      rect[fill="#1565C0"] { fill: #1565C0; }
      rect[fill="#EF6C00"] { fill: #EF6C00; }

      /* Handle #333 text in dark mode */
      text[fill="#333"] { fill: #ffffff; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><rect width="600" height="380" class="bg-main" rx="4" />


  <text x="300" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">iRoPE Layer Pattern</text>


  <g>
    <rect x="50" y="60" width="500" height="50" fill="#1565C0" stroke="#4A90A4" stroke-width="2" rx="4" />
    <text x="70" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" style="fill: #fff !important">Layer 0:</text>
    <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #fff !important">RoPE + Chunked Attention</text>
  </g>


  <g>
    <rect x="50" y="120" width="500" height="50" fill="#EF6C00" stroke="#FF9800" stroke-width="2" rx="4" />
    <text x="70" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" style="fill: #fff !important">Layer 1:</text>
    <text x="140" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #fff !important">NoPE + Full Attention</text>
  </g>


  <g>
    <rect x="50" y="180" width="500" height="50" fill="#EF6C00" stroke="#FF9800" stroke-width="2" rx="4" />
    <text x="70" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" style="fill: #fff !important">Layer 2:</text>
    <text x="140" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #fff !important">NoPE + Full Attention</text>
  </g>


  <g>
    <rect x="50" y="240" width="500" height="50" fill="#EF6C00" stroke="#FF9800" stroke-width="2" rx="4" />
    <text x="70" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" style="fill: #fff !important">Layer 3:</text>
    <text x="140" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #fff !important">NoPE + Full Attention</text>
  </g>


  <g>
    <rect x="50" y="300" width="500" height="50" fill="#1565C0" stroke="#4A90A4" stroke-width="2" rx="4" />
    <text x="70" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" style="fill: #fff !important">Layer 4:</text>
    <text x="140" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #fff !important">RoPE + Chunked Attention</text>
  </g>


  <text x="300" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="20" text-anchor="middle">...</text>


  <g>
    <rect x="420" y="15" width="15" height="15" fill="#E3F2FD" stroke="#4A90A4" stroke-width="1.5" rx="2" />
    <text x="440" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12">RoPE layer (every 4th)</text>
  </g>
</svg>