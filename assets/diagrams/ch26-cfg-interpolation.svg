<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for dark mode */
      rect[fill="#E57373"] { fill: #8b3d3d; }
      rect[fill="#81C784"] { fill: #4a7c4e; }
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
    }
  </style><text x="400" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Classifier-Free Guidance: Interpolation
  </text>


  <g id="unconditional">
    <rect x="50" y="80" width="180" height="80" fill="#E57373" opacity="0.2" stroke="#E57373" stroke-width="2" />
    <text x="140" y="110" font-size="14" font-weight="bold" text-anchor="middle" style="fill: #000 !important;">Unconditional</text>
    <text x="140" y="130" font-size="12" text-anchor="middle" style="fill: #000 !important;">ε(x_t, t, ∅)</text>
    <text x="140" y="148" font-size="11" text-anchor="middle" style="fill: #000 !important;">Broad distribution</text>
  </g>


  <g id="conditional">
    <rect x="570" y="80" width="180" height="80" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="2" />
    <text x="660" y="110" font-size="14" font-weight="bold" text-anchor="middle" style="fill: #000 !important;">Conditional</text>
    <text x="660" y="130" font-size="12" text-anchor="middle" style="fill: #000 !important;">ε(x_t, t, c)</text>
    <text x="660" y="148" font-size="11" text-anchor="middle" style="fill: #000 !important;">Prompt-aligned</text>
  </g>

  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>
  <line x1="230" y1="120" x2="570" y2="120" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead)" />


  <g id="formula">
    <rect x="250" y="200" width="300" height="60" fill="#4A90A4" opacity="0.1" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="400" y="225" font-size="13" text-anchor="middle" style="fill: #000 !important;" font-family="monospace">
      ε̃ = ε_uncond + s · (ε_cond - ε_uncond)
    </text>
    <text x="400" y="250" font-size="11" text-anchor="middle" style="fill: #000 !important;">
      where s = guidance scale
    </text>
  </g>

  
  <g id="scale-effects">
    
    <circle cx="140" cy="310" r="8" fill="#E57373" />
    <text x="140" y="335" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">s = 0</text>
    <text x="140" y="350" font-size="10" text-anchor="middle" fill="#666">Ignore prompt</text>

    
    <circle cx="300" cy="310" r="8" fill="#FFA726" />
    <text x="300" y="335" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">s = 1</text>
    <text x="300" y="350" font-size="10" text-anchor="middle" fill="#666">Standard</text>

    
    <circle cx="460" cy="310" r="8" fill="#4A90A4" />
    <text x="460" y="335" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">s = 7.5</text>
    <text x="460" y="350" font-size="10" text-anchor="middle" fill="#666">Typical (SD)</text>

    
    <circle cx="620" cy="310" r="8" fill="#81C784" />
    <text x="620" y="335" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">s = 15</text>
    <text x="620" y="350" font-size="10" text-anchor="middle" fill="#666">Strong adherence</text>

    
    <line x1="140" y1="310" x2="620" y2="310" stroke="#999" stroke-width="1" stroke-dasharray="5,5" />
  </g>

  
  <text x="50" y="385" font-size="10" fill="#E57373">← More diverse</text>
  <text x="750" y="385" font-size="10" fill="#81C784" text-anchor="end">More aligned →</text>
</svg>