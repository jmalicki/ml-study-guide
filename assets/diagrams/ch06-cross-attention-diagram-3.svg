<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" style="max-width: 700px; display: block; margin: 20px auto">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for better contrast with white text */
      rect[fill="#e8f4f8"] { fill: #2d5f6f; }

      /* Handle #333 text in dark mode */
      text[fill="#333"] { fill: #ffffff; }
    }
  </style><text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Input:</text>


  <rect x="80" y="15" width="150" height="35" fill="#e8f4f8" stroke="#4A90A4" stroke-width="2" rx="3" />
  <text x="155" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">System prompt</text>


  <text x="235" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#666">|</text>


  <rect x="250" y="15" width="150" height="35" fill="#e8f4f8" stroke="#4A90A4" stroke-width="2" rx="3" />
  <text x="325" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">User message</text>


  <text x="405" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#666">|</text>


  <rect x="420" y="15" width="180" height="35" fill="#e8f4f8" stroke="#4A90A4" stroke-width="2" rx="3" />
  <text x="510" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Assistant response</text>


  <path d="M 80 60 Q 80 70 90 70 L 300 70 Q 310 70 310 80 Q 310 70 320 70 L 590 70 Q 600 70 600 60" stroke="#4A90A4" stroke-width="2" fill="none" />


  <text x="340" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">All processed with self-attention</text>
</svg>