<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }
    .bg-blue-light { fill: #E8F4F8; }
    .bg-green-light { fill: #d4edda; }
    .bg-yellow-light { fill: #fff3cd; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#555"],
      text[fill="#666"] {
        fill: #ffffff;
      }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for white text visibility */
      rect[fill="#E8F4F8"] { fill: #2d3d42; }
      rect[fill="#d4edda"] { fill: #3d5a42; }
      rect[fill="#fff3cd"] { fill: #5a5333; }
      .bg-blue-light { fill: #2d3d42; }
      .bg-green-light { fill: #3d5a42; }
      .bg-yellow-light { fill: #5a5333; }
    }
  </style><defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>


  <rect x="200" y="10" width="500" height="60" class="bg-blue-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">Are you training a new model</text>
  <text x="450" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold">from scratch?</text>


  <line x1="350" y1="70" x2="250" y2="100" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2d7a2d" font-weight="bold">YES</text>

  <rect x="50" y="100" width="400" height="60" class="bg-blue-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="250" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Do you have strict inference</text>
  <text x="250" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">latency requirements?</text>

  
  <line x1="200" y1="160" x2="150" y2="190" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="155" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#2d7a2d" font-weight="bold">YES</text>

  <rect x="20" y="190" width="260" height="100" class="bg-green-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="150" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Use GQA (4:1 or 8:1 ratio)</text>
  <text x="150" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="label-text">Best balance of quality and speed</text>
  <text x="150" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11"  font-style="italic">Example: LLaMA 2</text>
  <text x="150" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11"  font-style="italic">(64 heads, 8 KV heads)</text>

  
  <line x1="300" y1="160" x2="350" y2="190" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="345" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a63d40" font-weight="bold">NO</text>

  <rect x="290" y="190" width="260" height="100" class="bg-green-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="420" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Use MHA</text>
  <text x="420" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="label-text">Maximum quality, standard approach</text>
  <text x="420" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11"  font-style="italic">Example: GPT-3, BERT</text>

  
  <line x1="550" y1="70" x2="650" y2="100" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />
  <text x="625" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a63d40" font-weight="bold">NO</text>

  <rect x="450" y="100" width="400" height="60" class="bg-blue-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="650" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Are you fine-tuning or deploying</text>
  <text x="650" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">an existing model?</text>


  <line x1="550" y1="160" x2="450" y2="330" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="350" y="330" width="200" height="50" class="bg-yellow-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="450" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Memory constrained</text>
  <text x="450" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">(mobile, edge devices)?</text>

  <line x1="450" y1="380" x2="450" y2="410" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="330" y="410" width="240" height="90" class="bg-green-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="450" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Use MQA or convert to MQA</text>
  <text x="450" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="label-text">Smallest cache, fastest inference</text>
  <text x="450" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11"  font-style="italic">Example: Falcon, PaLM</text>


  <line x1="650" y1="160" x2="650" y2="330" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="560" y="330" width="180" height="50" class="bg-yellow-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="650" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Balanced requirements?</text>

  <line x1="650" y1="380" x2="650" y2="410" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="530" y="410" width="240" height="90" class="bg-green-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="650" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Use GQA or convert to GQA</text>
  <text x="650" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="label-text">Good middle ground</text>
  <text x="650" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11"  font-style="italic">Example: Mistral 7B</text>
  <text x="650" y="487" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11"  font-style="italic">(32 heads, 8 KV heads)</text>


  <line x1="750" y1="160" x2="800" y2="330" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="710" y="330" width="180" height="40" class="bg-yellow-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="800" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold">Quality is paramount?</text>

  <line x1="800" y1="370" x2="800" y2="400" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="710" y="400" width="180" height="70" class="bg-green-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="800" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">Keep MHA</text>
  <text x="800" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="label-text">Best accuracy</text>
</svg>