<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650">
  
  <style>
    /* Load STIX Two Math font from CDN if not installed */
    @font-face {
      font-family: 'STIX Two Math';
      src: local('STIX Two Math'),
           url('https://cdn.jsdelivr.net/npm/@fontsource/stix-two-text@5.0.19/files/stix-two-text-latin-400-normal.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'STIX Two Math';
      src: local('STIX Two Math Italic'),
           url('https://cdn.jsdelivr.net/npm/@fontsource/stix-two-text@5.0.19/files/stix-two-text-latin-400-italic.woff2') format('woff2');
      font-weight: normal;
      font-style: italic;
    }

    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    .bg-box { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      .bg-box { fill: #2d2d2d; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#555"],
      text[fill="#666"] {
        fill: #ffffff;
      }

      /* Darken colored backgrounds for white text visibility */
      rect[fill="#9FA8DA"] { fill: #4a5278; }
      rect[fill="#FFB74D"] { fill: #9a6b2d; }
      rect[fill="#E57373"] { fill: #8b3d3d; }
      rect[fill="#81C784"] { fill: #4a7c4e; }

      /* Darken light backgrounds so dark text stays visible */
      rect[fill="#f9f9f9"] { fill: #2d2d2d; }
      rect[fill="#FFF9E6"] { fill: #3a3620; }
    }
  </style><text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Scaled Dot-Product Attention Computation Flow
  </text>

  
  <g id="inputs">
    
    <rect x="50" y="80" width="80" height="100" fill="#E57373" opacity="0.2" stroke="#E57373" stroke-width="2" />
    <text x="90" y="135" font-family="'STIX Two Math', Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle" font-style="italic">Q</text>
    <text x="102" y="140" font-family="'STIX Two Math', Georgia, serif" font-size="10" text-anchor="middle" font-style="italic">i</text>
    <text x="90" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" >[n, d<tspan baseline-shift="sub" font-size="8">k</tspan>]</text>
    <text x="90" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E57373">Query</text>
    <text x="90" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">(from token i)</text>


    <rect x="180" y="80" width="80" height="100" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="2" />
    <text x="220" y="135" font-family="'STIX Two Math', Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle" font-style="italic">K</text>
    <text x="232" y="140" font-family="'STIX Two Math', Georgia, serif" font-size="10" text-anchor="middle" font-style="italic">j</text>
    <text x="220" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" >[n, d<tspan baseline-shift="sub" font-size="8">k</tspan>]</text>
    <text x="220" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#81C784">Key</text>
    <text x="220" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">(from all tokens j)</text>


    <rect x="310" y="80" width="80" height="100" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="2" />
    <text x="350" y="135" font-family="'STIX Two Math', Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle" font-style="italic">V</text>
    <text x="362" y="140" font-family="'STIX Two Math', Georgia, serif" font-size="10" text-anchor="middle" font-style="italic">j</text>
    <text x="350" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" >[n, d<tspan baseline-shift="sub" font-size="8">v</tspan>]</text>
    <text x="350" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFB74D">Value</text>
    <text x="350" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">(from all tokens j)</text>
  </g>

  
  <g id="step1">
    
    <path d="M 90 190 Q 90 210 150 230" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
    <path d="M 220 190 Q 220 210 150 230" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    
    <rect x="100" y="230" width="100" height="50" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="150" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#4A90A4">Q × K^T</text>
    <text x="150" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" >Matrix Multiply</text>


    <line x1="150" y1="280" x2="150" y2="310" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
    <rect x="100" y="310" width="100" height="60" fill="#9FA8DA" opacity="0.3" stroke="#4A90A4" stroke-width="2" />
    <text x="150" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" >Scores</text>
    <text x="150" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" >[n, n]</text>
  </g>

  
  <g id="step2">
    <line x1="200" y1="340" x2="280" y2="340" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="280" y="315" width="110" height="50" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="335" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#4A90A4">÷ √d<tspan baseline-shift="sub" font-size="9">k</tspan></text>
    <text x="335" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" >Scale</text>


    <line x1="390" y1="340" x2="450" y2="340" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
    <rect x="450" y="310" width="100" height="60" fill="#9FA8DA" opacity="0.3" stroke="#4A90A4" stroke-width="2" />
    <text x="500" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" >Scaled</text>
    <text x="500" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" >Scores</text>
    <text x="500" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" >[n, n]</text>
  </g>

  
  <g id="step3">
    
    <rect x="620" y="310" width="80" height="60" fill="#E57373" opacity="0.2" stroke="#E57373" stroke-width="2" />
    <text x="660" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Mask</text>
    <text x="660" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(optional)</text>

    <line x1="620" y1="340" x2="550" y2="340" stroke="#E57373" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)" />


    <line x1="500" y1="370" x2="500" y2="410" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    <text x="520" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#000">set masked</text>
    <text x="520" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#000">to -∞</text>
  </g>

  
  <g id="step4">
    <rect x="430" y="410" width="140" height="50" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="500" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4A90A4">Softmax</text>
    <text x="500" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#000">Normalize per row</text>


    <line x1="500" y1="460" x2="500" y2="490" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
    <rect x="430" y="490" width="140" height="60" fill="#81C784" opacity="0.3" stroke="#81C784" stroke-width="2" />
    <text x="500" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Attention</text>
    <text x="500" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Weights</text>
    <text x="500" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">[n, n]</text>
  </g>

  
  <g id="step5">
    
    <path d="M 350 190 Q 350 450 430 520" fill="none" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    
    <line x1="500" y1="550" x2="500" y2="580" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="420" y="580" width="160" height="50" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="500" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#4A90A4">Weights × V</text>
    <text x="500" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#000">Weighted Sum</text>
  </g>


  <g id="output">
    <line x1="250" y1="605" x2="310" y2="605" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="150" y="575" width="100" height="60" fill="#FFB74D" opacity="0.3" stroke="#FFB74D" stroke-width="2" />
    <text x="200" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Output</text>
    <text x="200" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">[n, d<tspan baseline-shift="sub" font-size="8">v</tspan>]</text>
  </g>

  
  <g id="formula">
    <rect x="30" y="560" width="90" height="80" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="5" />
    <text x="75" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Formula:</text>
    <text x="75" y="595" font-family="serif" font-size="11" text-anchor="middle">softmax(</text>
    <text x="75" y="610" font-family="serif" font-size="11" text-anchor="middle">QK^T/√d<tspan baseline-shift="sub" font-size="8">k</tspan></text>
    <text x="75" y="625" font-family="serif" font-size="11" text-anchor="middle">) V</text>
  </g>

  
  <rect x="30" y="460" width="350" height="80" fill="#FFF9E6" stroke="#FFB74D" stroke-width="2" rx="5" />
  <text x="40" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">Key Insight:</text>
  <text x="40" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Scaling prevents softmax saturation for large d<tspan baseline-shift="sub" font-size="7">k</tspan></text>
  <text x="40" y="513" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Softmax converts scores to probabilities (sum to 1)</text>
  <text x="40" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Each output is a weighted combination of all values</text>

  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E57373" />
    </marker>
  </defs>
</svg>