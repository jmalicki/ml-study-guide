  <!-- Title -->
  <text x="450" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Causal (Autoregressive) vs Bidirectional Attention Masks
  </text>
  <text x="450" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Input: "The quick brown fox jumped" — Which tokens can attend to which?
  </text>

