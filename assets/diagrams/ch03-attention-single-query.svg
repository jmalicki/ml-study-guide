<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }
    .bg-box { fill: #f5f5f5; }

    /* Dark mode */

    /* Background colors */
    .bg-red-light { fill: #FFEBEE; }

    /* Background colors */
    .bg-cream { fill: #fff9e6; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      .bg-box { fill: #2d2d2d; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      rect[fill="#f9f9f9"] { fill: #2d2d2d; }
      rect[fill="#FFF9E6"] { fill: #3a3620; }
      rect[fill="#E8EAF6"] { fill: #3d3d4d; }
      rect[fill="#FFEBEE"] { fill: #4d2d2d; }
      .bg-red-light { fill: #b71c1c; }
      .bg-cream { fill: #5d4037; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
    <marker id="arrowhead-q" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E57373" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Attention for a Single Query: How "fox" Attends to All Tokens
  </text>
  <text x="475" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Tracing the computation of attention output for one query position
  </text>

  <!-- Input sentence -->
  <g id="sentence">
    <text x="110" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#4A90A4">Input:</text>
    <text x="155" y="80" font-family="monospace" font-size="12" fill="#333">"The quick brown fox"</text>
  </g>

  <!-- Query vector (fox) - highlighted -->
  <g id="query-fox">
    <text x="80" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E57373">Query</text>
    <rect x="40" y="130" width="80" height="50" fill="#E57373" opacity="0.3" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="80" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E57373">q<tspan baseline-shift="sub" font-size="10">fox</tspan></text>
    <text x="80" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">[1, d<tspan baseline-shift="sub" font-size="7">k</tspan>]</text>
  </g>

  <!-- Key vectors (all tokens) -->
  <g id="keys">
    <text x="280" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#81C784">Keys (all tokens)</text>

    <rect x="160" y="110" width="55" height="40" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="1.5" rx="3" />
    <text x="187" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">k<tspan baseline-shift="sub" font-size="8">The</tspan></text>

    <rect x="225" y="110" width="55" height="40" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="1.5" rx="3" />
    <text x="252" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">k<tspan baseline-shift="sub" font-size="8">quick</tspan></text>

    <rect x="290" y="110" width="55" height="40" fill="#81C784" opacity="0.4" stroke="#81C784" stroke-width="2" rx="3" />
    <text x="317" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">k<tspan baseline-shift="sub" font-size="8">brown</tspan></text>

    <rect x="355" y="110" width="55" height="40" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="1.5" rx="3" />
    <text x="382" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">k<tspan baseline-shift="sub" font-size="8">fox</tspan></text>
  </g>

  <!-- Dot product arrows -->
  <g id="dot-products">
    <text x="280" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4A90A4">Step 1: Dot Products (q · k)</text>

    <!-- Arrows from query to each key -->
    <path d="M 120 155 Q 150 155 160 130" fill="none" stroke="#E57373" stroke-width="1.5" marker-end="url(#arrowhead-q)" />
    <path d="M 120 155 Q 180 170 225 130" fill="none" stroke="#E57373" stroke-width="1.5" marker-end="url(#arrowhead-q)" />
    <path d="M 120 155 Q 210 180 290 130" fill="none" stroke="#E57373" stroke-width="2" marker-end="url(#arrowhead-q)" />
    <path d="M 120 155 Q 240 185 355 130" fill="none" stroke="#E57373" stroke-width="1.5" marker-end="url(#arrowhead-q)" />
  </g>

  <!-- Score boxes -->
  <g id="scores">
    <text x="280" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Raw Scores</text>

    <rect x="160" y="220" width="55" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="187" y="242" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">1.2</text>

    <rect x="225" y="220" width="55" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="252" y="242" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">0.8</text>

    <rect x="290" y="220" width="55" height="35" class="bg-red-light" stroke="#E57373" stroke-width="2" rx="3" />
    <text x="317" y="242" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">2.5</text>

    <rect x="355" y="220" width="55" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="382" y="242" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">1.8</text>
  </g>

  <!-- Scale and Softmax -->
  <g id="scale-softmax">
    <line x1="280" y1="260" x2="280" y2="285" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="200" y="290" width="160" height="35" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="280" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A90A4">÷ √d<tspan baseline-shift="sub" font-size="8">k</tspan> → Softmax</text>

    <line x1="280" y1="325" x2="280" y2="350" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />
  </g>

  <!-- Attention weights -->
  <g id="weights">
    <text x="280" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Step 2: Attention Weights (sum to 1.0)</text>

    <rect x="160" y="380" width="55" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="187" y="402" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">0.12</text>

    <rect x="225" y="380" width="55" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="252" y="402" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">0.08</text>

    <rect x="290" y="380" width="55" height="35" fill="#81C784" opacity="0.4" stroke="#81C784" stroke-width="2" rx="3" />
    <text x="317" y="402" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">0.52</text>

    <rect x="355" y="380" width="55" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="382" y="402" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">0.28</text>

    <text x="280" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">"fox" attends most to "brown" (its modifier)</text>
  </g>

  <!-- Value vectors -->
  <g id="values">
    <text x="610" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFB74D">Values (all tokens)</text>

    <rect x="490" y="110" width="55" height="40" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="1.5" rx="3" />
    <text x="517" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">v<tspan baseline-shift="sub" font-size="8">The</tspan></text>

    <rect x="555" y="110" width="55" height="40" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="1.5" rx="3" />
    <text x="582" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">v<tspan baseline-shift="sub" font-size="8">quick</tspan></text>

    <rect x="620" y="110" width="55" height="40" fill="#FFB74D" opacity="0.4" stroke="#FFB74D" stroke-width="2" rx="3" />
    <text x="647" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">v<tspan baseline-shift="sub" font-size="8">brown</tspan></text>

    <rect x="685" y="110" width="55" height="40" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="1.5" rx="3" />
    <text x="712" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">v<tspan baseline-shift="sub" font-size="8">fox</tspan></text>
  </g>

  <!-- Weighted sum computation -->
  <g id="weighted-sum">
    <text x="610" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4A90A4">Step 3: Weighted Sum of Values</text>

    <!-- Arrows from weights to values -->
    <path d="M 187 415 L 187 450 L 517 450 L 517 150" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3" />
    <path d="M 252 415 L 252 460 L 582 460 L 582 150" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3" />
    <path d="M 317 415 L 317 470 L 647 470 L 647 150" fill="none" stroke="#81C784" stroke-width="2" />
    <path d="M 382 415 L 382 480 L 712 480 L 712 150" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Multiplication indicators -->
    <text x="517" y="175" font-family="monospace" font-size="9" text-anchor="middle" fill="#666">×0.12</text>
    <text x="582" y="175" font-family="monospace" font-size="9" text-anchor="middle" fill="#666">×0.08</text>
    <text x="647" y="175" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" fill="#81C784">×0.52</text>
    <text x="712" y="175" font-family="monospace" font-size="9" text-anchor="middle" fill="#666">×0.28</text>

    <!-- Sum operation -->
    <rect x="550" y="220" width="120" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="610" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A90A4">Σ (weighted sum)</text>

    <line x1="610" y1="260" x2="610" y2="290" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- Output -->
  <g id="output">
    <rect x="545" y="295" width="130" height="50" fill="#FFB74D" opacity="0.3" stroke="#FFB74D" stroke-width="2" rx="5" />
    <text x="610" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFB74D">output<tspan baseline-shift="sub" font-size="10">fox</tspan></text>
    <text x="610" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#333">[1, d<tspan baseline-shift="sub" font-size="8">v</tspan>]</text>
  </g>

  <!-- Key insight box -->
  <rect x="480" y="365" width="440" height="105" class="bg-cream" stroke="#FFB74D" stroke-width="2" rx="5" />
  <text x="495" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Insight — Q from one token, K and V from ALL tokens:</text>
  <text x="495" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E57373">• q<tspan baseline-shift="sub" font-size="8">fox</tspan> (Query) comes from the "fox" token only</text>
  <text x="495" y="423" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#81C784">• k<tspan baseline-shift="sub" font-size="8">The</tspan>, k<tspan baseline-shift="sub" font-size="8">quick</tspan>, k<tspan baseline-shift="sub" font-size="8">brown</tspan>, k<tspan baseline-shift="sub" font-size="8">fox</tspan> (Keys) come from ALL tokens</text>
  <text x="495" y="441" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FFB74D">• v<tspan baseline-shift="sub" font-size="8">The</tspan>, v<tspan baseline-shift="sub" font-size="8">quick</tspan>, v<tspan baseline-shift="sub" font-size="8">brown</tspan>, v<tspan baseline-shift="sub" font-size="8">fox</tspan> (Values) come from ALL tokens</text>
  <text x="495" y="459" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">• Output is a weighted mix of other tokens' values (52% from "brown")</text>

  <!-- Formula box -->
  <rect x="480" y="485" width="440" height="75" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="5" />
  <text x="495" y="507" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#333">Formula for position i:</text>
  <text x="505" y="527" font-family="monospace" font-size="11" fill="#333">output<tspan baseline-shift="sub" font-size="8">i</tspan> = Σ<tspan baseline-shift="sub" font-size="8">j</tspan> softmax(q<tspan baseline-shift="sub" font-size="8">i</tspan> · k<tspan baseline-shift="sub" font-size="8">j</tspan> / √d<tspan baseline-shift="sub" font-size="8">k</tspan>) × v<tspan baseline-shift="sub" font-size="8">j</tspan></text>
  <text x="505" y="547" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">All positions computed in parallel via matrix operations</text>
</svg>
