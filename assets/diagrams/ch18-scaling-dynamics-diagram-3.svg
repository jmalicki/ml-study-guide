<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Darken backgrounds in dark mode */
      rect[fill="#f5f5f5"] { fill: #1a1a1a; }
      rect[fill="white"] { fill: #2d2d2d; }
      rect[stroke="#ddd"] { stroke: #555555; }
      line[stroke="#ddd"] { stroke: #555555; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#C62828"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      text[fill="#888"] { fill: #bbbbbb; }
      line[stroke="#888"] { stroke: #bbbbbb; }
      line[stroke="#C62828"] { stroke: #ef5350; }
      polygon[fill="#C62828"] { fill: #ef5350; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><rect width="800" height="400" fill="#f5f5f5" />

  
  <g transform="translate(60, 30)">
    <rect width="700" height="320" fill="white" stroke="#ddd" stroke-width="1" />

    
    <line x1="40" y1="280" x2="680" y2="280" stroke="#333" stroke-width="2" />
    <line x1="40" y1="20" x2="40" y2="280" stroke="#333" stroke-width="2" />

    
    <rect x="40" y="20" width="160" height="260" fill="#FFE0E0" opacity="0.3" />
    <text x="120" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" >Phase 1: Memorization</text>

    <rect x="200" y="20" width="320" height="260" fill="#E0E0FF" opacity="0.3" />
    <text x="360" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" >Phase 2: Plateau</text>

    <rect x="520" y="20" width="160" height="260" fill="#E0FFE0" opacity="0.3" />
    <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" >Phase 3: Grokking</text>

    
    <path d="M 50 280 Q 80 250, 120 35 L 680 35" fill="none" stroke="#4A90A4" stroke-width="3" />

    
    <path d="M 50 270 L 500 270 Q 540 260, 570 100 L 680 35" fill="none" stroke="#E57373" stroke-width="3" />

    
    <line x1="40" y1="35" x2="680" y2="35" stroke="#666" stroke-width="1" stroke-dasharray="3,3" />
    <text x="685" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" >100%</text>

    <line x1="40" y1="270" x2="680" y2="270" stroke="#888" stroke-width="1" stroke-dasharray="3,3" />
    <text x="685" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="10" >~1% (Random)</text>

    
    <text x="360" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" >Training Epoch</text>
    <text x="10" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14"  transform="rotate(-90, 10, 160)">Accuracy</text>
    <text x="360" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" >Grokking: Delayed Generalization</text>


    <g transform="translate(480, 50)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#4A90A4" stroke-width="3" />
      <text x="45" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" >Train Accuracy</text>

      <line x1="0" y1="20" x2="40" y2="20" stroke="#E57373" stroke-width="3" />
      <text x="45" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" >Validation Accuracy</text>
    </g>


    <text x="120" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" >100</text>
    <text x="360" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" >5000</text>
    <text x="600" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" >10000</text>
  </g>


  <g transform="translate(570, 140)">
    <path d="M 0 0 L -30 -20" stroke="#C62828" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="5" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" >Sudden</text>
    <text x="5" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" >Generalization!</text>
  </g>


  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#C62828" />
    </marker>
  </defs>
</svg>