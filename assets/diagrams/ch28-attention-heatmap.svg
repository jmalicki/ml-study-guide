<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-main { fill: #f5f5f5; }
    .text-color { fill: #333; }
    .title-text { font-size: 20px; font-weight: bold; }
    .label-text { font-size: 13px; font-weight: 600; }
    .small-text { font-size: 11px; }
    .cell-text { font-size: 10px; }
    text { fill: #333; font-family: Arial, sans-serif; }
    .grid-line { stroke: #999; stroke-width: 0.5; }

    /* Heatmap colors - from low to high attention */
    .attn-0 { fill: #F5F5F5; }
    .attn-1 { fill: #FFE0E0; }
    .attn-2 { fill: #FFB3B3; }
    .attn-3 { fill: #FF8080; }
    .attn-4 { fill: #E63939; }
    .attn-5 { fill: #CC0000; }

    @media (prefers-color-scheme: dark) {
      .bg-main { fill: #1a1a1a; }
      .text-color { fill: #fff; }
      text { fill: #fff; }
      .grid-line { stroke: #666; }
      .attn-0 { fill: #2A2A2A; }
      .attn-1 { fill: #4A2020; }
      .attn-2 { fill: #6A3030; }
      .attn-3 { fill: #8A4040; }
      .attn-4 { fill: #7a3535; }
      .attn-5 { fill: #6a2d2d; }
      rect[fill="#BBDEFB"] { fill: #1a3a4a; }
    }
  </style>

  <!-- Background -->
  <rect class="bg-main" width="900" height="650" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" class="title-text text-color" text-anchor="middle">Cross-Modal Attention Heatmap</text>
  <text x="450" y="55" class="small-text text-color" text-anchor="middle">Attention weights from text tokens (rows) to image patches (columns)</text>

  <!-- Define grid parameters -->
  <g id="heatmap" transform="translate(200, 100)">
    <!-- Column headers (Image patches) -->
    <text x="35" y="-10" class="label-text text-color" text-anchor="middle">P1</text>
    <text x="85" y="-10" class="label-text text-color" text-anchor="middle">P2</text>
    <text x="135" y="-10" class="label-text text-color" text-anchor="middle">P3</text>
    <text x="185" y="-10" class="label-text text-color" text-anchor="middle">P4</text>
    <text x="235" y="-10" class="label-text text-color" text-anchor="middle">P5</text>
    <text x="285" y="-10" class="label-text text-color" text-anchor="middle">P6</text>
    <text x="335" y="-10" class="label-text text-color" text-anchor="middle">P7</text>
    <text x="385" y="-10" class="label-text text-color" text-anchor="middle">P8</text>

    <!-- Row headers (Text tokens) -->
    <text x="-15" y="35" class="label-text text-color" text-anchor="end">"A"</text>
    <text x="-15" y="85" class="label-text text-color" text-anchor="end">"cat"</text>
    <text x="-15" y="135" class="label-text text-color" text-anchor="end">"sitting"</text>
    <text x="-15" y="185" class="label-text text-color" text-anchor="end">"on"</text>
    <text x="-15" y="235" class="label-text text-color" text-anchor="end">"a"</text>
    <text x="-15" y="285" class="label-text text-color" text-anchor="end">"mat"</text>

    <!-- Heatmap cells -->
    <!-- Row 1: "A" - low attention everywhere -->
    <rect class="attn-1" x="10" y="10" width="50" height="50"/>
    <text x="35" y="40" class="cell-text text-color" text-anchor="middle">0.12</text>
    <rect class="attn-1" x="60" y="10" width="50" height="50"/>
    <text x="85" y="40" class="cell-text text-color" text-anchor="middle">0.15</text>
    <rect class="attn-1" x="110" y="10" width="50" height="50"/>
    <text x="135" y="40" class="cell-text text-color" text-anchor="middle">0.11</text>
    <rect class="attn-1" x="160" y="10" width="50" height="50"/>
    <text x="185" y="40" class="cell-text text-color" text-anchor="middle">0.13</text>
    <rect class="attn-1" x="210" y="10" width="50" height="50"/>
    <text x="235" y="40" class="cell-text text-color" text-anchor="middle">0.14</text>
    <rect class="attn-1" x="260" y="10" width="50" height="50"/>
    <text x="285" y="40" class="cell-text text-color" text-anchor="middle">0.10</text>
    <rect class="attn-1" x="310" y="10" width="50" height="50"/>
    <text x="335" y="40" class="cell-text text-color" text-anchor="middle">0.12</text>
    <rect class="attn-1" x="360" y="10" width="50" height="50"/>
    <text x="385" y="40" class="cell-text text-color" text-anchor="middle">0.13</text>

    <!-- Row 2: "cat" - high attention to cat patches -->
    <rect class="attn-1" x="10" y="60" width="50" height="50"/>
    <text x="35" y="90" class="cell-text text-color" text-anchor="middle">0.05</text>
    <rect class="attn-5" x="60" y="60" width="50" height="50"/>
    <text x="85" y="90" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.85</text>
    <rect class="attn-4" x="110" y="60" width="50" height="50"/>
    <text x="135" y="90" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.72</text>
    <rect class="attn-5" x="160" y="60" width="50" height="50"/>
    <text x="185" y="90" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.91</text>
    <rect class="attn-4" x="210" y="60" width="50" height="50"/>
    <text x="235" y="90" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.68</text>
    <rect class="attn-1" x="260" y="60" width="50" height="50"/>
    <text x="285" y="90" class="cell-text text-color" text-anchor="middle">0.08</text>
    <rect class="attn-1" x="310" y="60" width="50" height="50"/>
    <text x="335" y="90" class="cell-text text-color" text-anchor="middle">0.04</text>
    <rect class="attn-1" x="360" y="60" width="50" height="50"/>
    <text x="385" y="90" class="cell-text text-color" text-anchor="middle">0.03</text>

    <!-- Row 3: "sitting" - moderate attention to cat and surface -->
    <rect class="attn-1" x="10" y="110" width="50" height="50"/>
    <text x="35" y="140" class="cell-text text-color" text-anchor="middle">0.06</text>
    <rect class="attn-3" x="60" y="110" width="50" height="50"/>
    <text x="85" y="140" class="cell-text text-color" text-anchor="middle">0.45</text>
    <rect class="attn-3" x="110" y="110" width="50" height="50"/>
    <text x="135" y="140" class="cell-text text-color" text-anchor="middle">0.42</text>
    <rect class="attn-3" x="160" y="110" width="50" height="50"/>
    <text x="185" y="140" class="cell-text text-color" text-anchor="middle">0.48</text>
    <rect class="attn-2" x="210" y="110" width="50" height="50"/>
    <text x="235" y="140" class="cell-text text-color" text-anchor="middle">0.32</text>
    <rect class="attn-2" x="260" y="110" width="50" height="50"/>
    <text x="285" y="140" class="cell-text text-color" text-anchor="middle">0.35</text>
    <rect class="attn-2" x="310" y="110" width="50" height="50"/>
    <text x="335" y="140" class="cell-text text-color" text-anchor="middle">0.28</text>
    <rect class="attn-1" x="360" y="110" width="50" height="50"/>
    <text x="385" y="140" class="cell-text text-color" text-anchor="middle">0.08</text>

    <!-- Row 4: "on" - moderate attention to contact points -->
    <rect class="attn-1" x="10" y="160" width="50" height="50"/>
    <text x="35" y="190" class="cell-text text-color" text-anchor="middle">0.05</text>
    <rect class="attn-2" x="60" y="160" width="50" height="50"/>
    <text x="85" y="190" class="cell-text text-color" text-anchor="middle">0.25</text>
    <rect class="attn-1" x="110" y="160" width="50" height="50"/>
    <text x="135" y="190" class="cell-text text-color" text-anchor="middle">0.15</text>
    <rect class="attn-2" x="160" y="160" width="50" height="50"/>
    <text x="185" y="190" class="cell-text text-color" text-anchor="middle">0.28</text>
    <rect class="attn-3" x="210" y="160" width="50" height="50"/>
    <text x="235" y="190" class="cell-text text-color" text-anchor="middle">0.52</text>
    <rect class="attn-3" x="260" y="160" width="50" height="50"/>
    <text x="285" y="190" class="cell-text text-color" text-anchor="middle">0.48</text>
    <rect class="attn-2" x="310" y="160" width="50" height="50"/>
    <text x="335" y="190" class="cell-text text-color" text-anchor="middle">0.22</text>
    <rect class="attn-1" x="360" y="160" width="50" height="50"/>
    <text x="385" y="190" class="cell-text text-color" text-anchor="middle">0.08</text>

    <!-- Row 5: "a" - low attention everywhere -->
    <rect class="attn-1" x="10" y="210" width="50" height="50"/>
    <text x="35" y="240" class="cell-text text-color" text-anchor="middle">0.11</text>
    <rect class="attn-1" x="60" y="210" width="50" height="50"/>
    <text x="85" y="240" class="cell-text text-color" text-anchor="middle">0.13</text>
    <rect class="attn-1" x="110" y="210" width="50" height="50"/>
    <text x="135" y="240" class="cell-text text-color" text-anchor="middle">0.14</text>
    <rect class="attn-1" x="160" y="210" width="50" height="50"/>
    <text x="185" y="240" class="cell-text text-color" text-anchor="middle">0.12</text>
    <rect class="attn-1" x="210" y="210" width="50" height="50"/>
    <text x="235" y="240" class="cell-text text-color" text-anchor="middle">0.15</text>
    <rect class="attn-1" x="260" y="210" width="50" height="50"/>
    <text x="285" y="240" class="cell-text text-color" text-anchor="middle">0.13</text>
    <rect class="attn-1" x="310" y="210" width="50" height="50"/>
    <text x="335" y="240" class="cell-text text-color" text-anchor="middle">0.11</text>
    <rect class="attn-1" x="360" y="210" width="50" height="50"/>
    <text x="385" y="240" class="cell-text text-color" text-anchor="middle">0.12</text>

    <!-- Row 6: "mat" - high attention to mat patches -->
    <rect class="attn-1" x="10" y="260" width="50" height="50"/>
    <text x="35" y="290" class="cell-text text-color" text-anchor="middle">0.03</text>
    <rect class="attn-1" x="60" y="260" width="50" height="50"/>
    <text x="85" y="290" class="cell-text text-color" text-anchor="middle">0.05</text>
    <rect class="attn-1" x="110" y="260" width="50" height="50"/>
    <text x="135" y="290" class="cell-text text-color" text-anchor="middle">0.04</text>
    <rect class="attn-1" x="160" y="260" width="50" height="50"/>
    <text x="185" y="290" class="cell-text text-color" text-anchor="middle">0.06</text>
    <rect class="attn-4" x="210" y="260" width="50" height="50"/>
    <text x="235" y="290" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.78</text>
    <rect class="attn-5" x="260" y="260" width="50" height="50"/>
    <text x="285" y="290" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.88</text>
    <rect class="attn-5" x="310" y="260" width="50" height="50"/>
    <text x="335" y="290" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.92</text>
    <rect class="attn-4" x="360" y="260" width="50" height="50"/>
    <text x="385" y="290" class="cell-text" style="fill: #fff !important;" text-anchor="middle">0.71</text>

    <!-- Grid lines -->
    <line class="grid-line" x1="10" y1="10" x2="410" y2="10"/>
    <line class="grid-line" x1="10" y1="60" x2="410" y2="60"/>
    <line class="grid-line" x1="10" y1="110" x2="410" y2="110"/>
    <line class="grid-line" x1="10" y1="160" x2="410" y2="160"/>
    <line class="grid-line" x1="10" y1="210" x2="410" y2="210"/>
    <line class="grid-line" x1="10" y1="260" x2="410" y2="260"/>
    <line class="grid-line" x1="10" y1="310" x2="410" y2="310"/>

    <line class="grid-line" x1="10" y1="10" x2="10" y2="310"/>
    <line class="grid-line" x1="60" y1="10" x2="60" y2="310"/>
    <line class="grid-line" x1="110" y1="10" x2="110" y2="310"/>
    <line class="grid-line" x1="160" y1="10" x2="160" y2="310"/>
    <line class="grid-line" x1="210" y1="10" x2="210" y2="310"/>
    <line class="grid-line" x1="260" y1="10" x2="260" y2="310"/>
    <line class="grid-line" x1="310" y1="10" x2="310" y2="310"/>
    <line class="grid-line" x1="360" y1="10" x2="360" y2="310"/>
    <line class="grid-line" x1="410" y1="10" x2="410" y2="310"/>
  </g>

  <!-- Patch descriptions -->
  <g transform="translate(200, 430)">
    <text x="0" y="0" class="small-text text-color" font-weight="600">Image Patch Contents:</text>
    <text x="0" y="20" class="small-text text-color">P1: Sky/Background</text>
    <text x="0" y="37" class="small-text text-color">P2-P4: Cat (head, body)</text>
    <text x="200" y="20" class="small-text text-color">P5-P8: Mat (surface)</text>
  </g>

  <!-- Color scale legend -->
  <g transform="translate(200, 490)">
    <text x="0" y="0" class="small-text text-color" font-weight="600">Attention Weight Scale:</text>
    <rect class="attn-0" x="0" y="10" width="60" height="30"/>
    <text x="30" y="30" class="small-text text-color" text-anchor="middle">0.0</text>
    <rect class="attn-1" x="60" y="10" width="60" height="30"/>
    <text x="90" y="30" class="small-text text-color" text-anchor="middle">0.2</text>
    <rect class="attn-2" x="120" y="10" width="60" height="30"/>
    <text x="150" y="30" class="small-text text-color" text-anchor="middle">0.4</text>
    <rect class="attn-3" x="180" y="10" width="60" height="30"/>
    <text x="210" y="30" class="small-text text-color" text-anchor="middle">0.6</text>
    <rect class="attn-4" x="240" y="10" width="60" height="30" fill="#E63939"/>
    <text x="270" y="30" class="small-text" style="fill: #fff !important;" text-anchor="middle">0.8</text>
    <rect class="attn-5" x="300" y="10" width="60" height="30" fill="#CC0000"/>
    <text x="330" y="30" class="small-text" style="fill: #fff !important;" text-anchor="middle">1.0</text>
  </g>

  <!-- Key insight -->
  <g transform="translate(50, 550)">
    <rect fill="#BBDEFB" stroke="#1976D2" stroke-width="2" width="800" height="80" rx="4" opacity="0.5"/>
    <text x="400" y="25" class="label-text text-color" text-anchor="middle" font-weight="600">Key Insights:</text>
    <text x="400" y="45" class="small-text text-color" text-anchor="middle">• Semantic words ("cat", "mat") attend strongly to relevant visual regions</text>
    <text x="400" y="62" class="small-text text-color" text-anchor="middle">• Function words ("a", "on") distribute attention more uniformly</text>
    <text x="400" y="79" class="small-text text-color" text-anchor="middle">• Action words ("sitting") attend to both subject and context patches</text>
  </g>
</svg>