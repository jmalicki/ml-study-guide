<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 2,2; }
      .quality-curve { fill: none; stroke: #4A90A4; stroke-width: 3; }
      .time-curve { fill: none; stroke: #E57373; stroke-width: 3; }
      .efficiency-curve { fill: none; stroke: #81C784; stroke-width: 3; stroke-dasharray: 5,5; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #333; }
      .annotation { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #555; }
      .optimal-marker { fill: #FFB74D; stroke: #333; stroke-width: 2; }
      .optimal-line { stroke: #FFB74D; stroke-width: 2; stroke-dasharray: 3,3; }
    
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        text { fill: #ffffff; }
        text[fill="#333"] { fill: #ffffff; }
        text[fill="#666"] { fill: #cccccc; }
        text[fill="#555"] { fill: #cccccc; }
        text[fill="white"],
        text[fill="#fff"] { fill: #ffffff; }

        .title { fill: #ffffff; }
        .subtitle { fill: #ffffff; }
        .label { fill: #ffffff; }
        .small-label { fill: #cccccc; }
        .axis-label { fill: #cccccc; }
        .small { fill: #cccccc; }
        .annotation { fill: #cccccc; }

        line[stroke="#333"] { stroke: #cccccc; }
        rect[stroke="#333"] { stroke: #cccccc; }
        rect[fill="white"] { fill: #1a1a1a; }
        rect[fill="#ffffff"] { fill: #1a1a1a; }

        .grid { stroke: #444444; }
        .axis { stroke: #cccccc; }

        /* Darken colored backgrounds for dark mode */
        rect[fill="white"] { fill: #1a1a1a; }
        rect[fill="#ffffff"] { fill: #1a1a1a; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">Diffusion Timesteps: Quality vs. Speed Trade-off</text>

  <!-- Grid -->
  <line x1="100" y1="100" x2="100" y2="420" class="grid"/>
  <line x1="200" y1="100" x2="200" y2="420" class="grid"/>
  <line x1="300" y1="100" x2="300" y2="420" class="grid"/>
  <line x1="400" y1="100" x2="400" y2="420" class="grid"/>
  <line x1="500" y1="100" x2="500" y2="420" class="grid"/>
  <line x1="600" y1="100" x2="600" y2="420" class="grid"/>

  <!-- Axes -->
  <line x1="100" y1="420" x2="650" y2="420" class="axis"/>
  <line x1="100" y1="100" x2="100" y2="420" class="axis"/>

  <!-- Axis labels -->
  <text x="375" y="455" text-anchor="middle" class="label" font-weight="600">Number of Sampling Steps (T)</text>
  <text x="35" y="260" text-anchor="middle" class="label" font-weight="600" transform="rotate(-90 35 260)">Normalized Metric</text>

  <!-- X-axis tick labels -->
  <text x="100" y="440" text-anchor="middle" class="annotation">10</text>
  <text x="200" y="440" text-anchor="middle" class="annotation">25</text>
  <text x="300" y="440" text-anchor="middle" class="annotation">50</text>
  <text x="400" y="440" text-anchor="middle" class="annotation">100</text>
  <text x="500" y="440" text-anchor="middle" class="annotation">250</text>
  <text x="600" y="440" text-anchor="middle" class="annotation">1000</text>

  <!-- Y-axis tick labels -->
  <text x="90" y="105" text-anchor="end" class="annotation">High</text>
  <text x="90" y="260" text-anchor="end" class="annotation">Medium</text>
  <text x="90" y="425" text-anchor="end" class="annotation">Low</text>

  <!-- Quality curve (logarithmic improvement) -->
  <path d="M 100,350
           Q 200,220 300,160
           Q 400,130 500,115
           Q 550,110 600,107"
        class="quality-curve"/>

  <!-- Inference time curve (linear increase) -->
  <path d="M 100,390
           Q 200,350 300,290
           Q 400,230 500,170
           Q 550,140 600,110"
        class="time-curve"/>

  <!-- Efficiency curve (quality per second) -->
  <path d="M 100,300
           Q 200,180 300,150
           Q 400,160 500,200
           Q 550,250 600,320"
        class="efficiency-curve"/>

  <!-- Optimal point marker -->
  <circle cx="300" cy="150" r="7" class="optimal-marker"/>
  <line x1="300" y1="100" x2="300" y2="420" class="optimal-line"/>
  <text x="300" y="85" text-anchor="middle" class="annotation" font-weight="600" fill="#F57C00">Sweet Spot: 50 steps</text>

  <!-- Legend -->
  <g transform="translate(450, 250)">
    <rect x="0" y="0" width="180" height="85" fill="white" stroke="#333" stroke-width="1" rx="5"/>
    <text x="10" y="20" class="annotation" font-weight="600">Metrics:</text>

    <line x1="10" y1="35" x2="40" y2="35" class="quality-curve"/>
    <text x="45" y="39" class="annotation">Sample Quality (FID)</text>

    <line x1="10" y1="55" x2="40" y2="55" class="time-curve"/>
    <text x="45" y="59" class="annotation">Inference Time</text>

    <line x1="10" y1="75" x2="40" y2="75" class="efficiency-curve"/>
    <text x="45" y="79" class="annotation">Quality/Time Ratio</text>
  </g>

  <!-- Zone annotations -->
  <!-- Few steps -->
  <text x="150" y="310" text-anchor="middle" class="annotation" fill="#C62828" font-weight="600">Too Few Steps</text>
  <text x="150" y="325" text-anchor="middle" class="annotation" fill="#C62828">• Fast generation</text>
  <text x="150" y="340" text-anchor="middle" class="annotation" fill="#C62828">• Poor quality</text>
  <text x="150" y="355" text-anchor="middle" class="annotation" fill="#C62828">• Artifacts visible</text>

  <!-- Many steps -->
  <text x="550" y="150" text-anchor="middle" class="annotation" fill="#1565C0" font-weight="600">Too Many Steps</text>
  <text x="550" y="165" text-anchor="middle" class="annotation" fill="#1565C0">• Excellent quality</text>
  <text x="550" y="180" text-anchor="middle" class="annotation" fill="#1565C0">• Very slow (100s)</text>
  <text x="550" y="195" text-anchor="middle" class="annotation" fill="#1565C0">• Diminishing returns</text>

  <!-- Optimal zone -->
  <text x="300" y="200" text-anchor="middle" class="annotation" fill="#F57C00" font-weight="600">Practical Range</text>
  <text x="300" y="215" text-anchor="middle" class="annotation" fill="#F57C00">25-100 steps</text>

  <!-- Key insights box -->
  <rect x="110" y="110" width="240" height="120" fill="white" stroke="#333" stroke-width="1" rx="5" opacity="0.95"/>
  <text x="120" y="130" class="annotation" font-weight="600">Key Insights:</text>
  <text x="120" y="148" class="annotation">• DDPM: 1000 steps (slow, high quality)</text>
  <text x="120" y="163" class="annotation">• DDIM: 50 steps (fast, good quality)</text>
  <text x="120" y="178" class="annotation">• Modern: 20-50 steps typical</text>
  <text x="120" y="193" class="annotation">• Quality improves logarithmically</text>
  <text x="120" y="208" class="annotation">• Time cost is linear</text>
  <text x="120" y="223" class="annotation">• Returns diminish after ~100 steps</text>

  <!-- Arrows showing diminishing returns -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  <path d="M 480,140 L 540,115" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="500" y="135" text-anchor="middle" class="annotation" fill="#1565C0" font-size="11">Diminishing</text>
  <text x="500" y="148" text-anchor="middle" class="annotation" fill="#1565C0" font-size="11">returns</text>
</svg>
