<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .title { fill: #333333; }
    .annotation { fill: #555555; }
    .score { fill: #666666; }
    rect.node { fill: #e3f2fd; stroke: #1976d2; }
    rect.node-active { fill: #bbdefb; stroke: #1976d2; }
    rect.node-pruned { fill: #f5f5f5; stroke: #bdbdbd; }
    rect.node-best { fill: #c8e6c9; stroke: #388e3c; }
    line.edge { stroke: #1976d2; }
    line.edge-pruned { stroke: #bdbdbd; stroke-dasharray: 4,2; }
    rect.box { fill: #f5f5f5; stroke: #cccccc; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .title { fill: #ffffff; }
      .annotation { fill: #aaaaaa; }
      .score { fill: #999999; }
      rect.node { fill: #1565c0; stroke: #64b5f6; }
      rect.node-active { fill: #1976d2; stroke: #90caf9; }
      rect.node-pruned { fill: #424242; stroke: #757575; }
      rect.node-best { fill: #2e7d32; stroke: #81c784; }
      line.edge { stroke: #64b5f6; }
      line.edge-pruned { stroke: #757575; }
      rect.box { fill: #2d2d2d; stroke: #555555; }
    }
  </style>

  <!-- Title -->
  <text x="425" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" class="title">
    Beam Search: Exploring Multiple Hypotheses (beam width k=2)
  </text>

  <!-- Step labels -->
  <text x="80" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" class="title">Step 0</text>
  <text x="240" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" class="title">Step 1</text>
  <text x="440" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" class="title">Step 2</text>
  <text x="660" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" class="title">Step 3</text>

  <!-- Step 0: Initial prompt -->
  <g transform="translate(30, 90)">
    <rect x="0" y="60" width="100" height="40" rx="5" class="node-active" stroke-width="2"/>
    <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">"The"</text>
    <text x="50" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: 0.0</text>
  </g>

  <!-- Edges from Step 0 to Step 1 -->
  <line x1="130" y1="130" x2="170" y2="100" class="edge" stroke-width="1.5"/>
  <line x1="130" y1="130" x2="170" y2="160" class="edge" stroke-width="1.5"/>
  <line x1="130" y1="130" x2="170" y2="220" class="edge-pruned" stroke-width="1"/>

  <!-- Step 1: First expansion -->
  <g transform="translate(170, 90)">
    <!-- Beam 1: "The cat" -->
    <rect x="0" y="0" width="100" height="40" rx="5" class="node-active" stroke-width="2"/>
    <text x="50" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">"The cat"</text>
    <text x="50" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: -0.5</text>

    <!-- Beam 2: "The dog" -->
    <rect x="0" y="60" width="100" height="40" rx="5" class="node-active" stroke-width="2"/>
    <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">"The dog"</text>
    <text x="50" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: -0.7</text>

    <!-- Pruned: "The bird" -->
    <rect x="0" y="120" width="100" height="40" rx="5" class="node-pruned" stroke-width="1"/>
    <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#999999">"The bird"</text>
    <text x="50" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#999999">score: -1.2 (pruned)</text>
  </g>

  <!-- Edges from Step 1 to Step 2 -->
  <!-- From "The cat" -->
  <line x1="270" y1="110" x2="340" y2="90" class="edge" stroke-width="1.5"/>
  <line x1="270" y1="110" x2="340" y2="150" class="edge-pruned" stroke-width="1"/>
  <!-- From "The dog" -->
  <line x1="270" y1="170" x2="340" y2="210" class="edge" stroke-width="1.5"/>
  <line x1="270" y1="170" x2="340" y2="270" class="edge-pruned" stroke-width="1"/>

  <!-- Step 2: Second expansion -->
  <g transform="translate(340, 90)">
    <!-- Beam 1: "The cat sat" (best so far) -->
    <rect x="0" y="0" width="120" height="40" rx="5" class="node-active" stroke-width="2"/>
    <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">"The cat sat"</text>
    <text x="60" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: -0.9</text>

    <!-- Pruned from cat -->
    <rect x="0" y="60" width="120" height="40" rx="5" class="node-pruned" stroke-width="1"/>
    <text x="60" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#999999">"The cat ran"</text>
    <text x="60" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#999999">score: -1.3</text>

    <!-- Beam 2: "The dog ran" -->
    <rect x="0" y="120" width="120" height="40" rx="5" class="node-active" stroke-width="2"/>
    <text x="60" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">"The dog ran"</text>
    <text x="60" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: -1.0</text>

    <!-- Pruned from dog -->
    <rect x="0" y="180" width="120" height="40" rx="5" class="node-pruned" stroke-width="1"/>
    <text x="60" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#999999">"The dog sat"</text>
    <text x="60" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#999999">score: -1.4</text>
  </g>

  <!-- Edges from Step 2 to Step 3 -->
  <line x1="460" y1="110" x2="540" y2="100" class="edge" stroke-width="2"/>
  <line x1="460" y1="230" x2="540" y2="180" class="edge" stroke-width="1.5"/>

  <!-- Step 3: Final beams -->
  <g transform="translate(540, 90)">
    <!-- Best: "The cat sat on" -->
    <rect x="0" y="0" width="140" height="45" rx="5" class="node-best" stroke-width="2"/>
    <text x="70" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">"The cat sat on"</text>
    <text x="70" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: -1.1 (BEST)</text>

    <!-- Second: "The dog ran fast" -->
    <rect x="0" y="80" width="140" height="45" rx="5" class="node-active" stroke-width="2"/>
    <text x="70" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">"The dog ran fast"</text>
    <text x="70" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" class="score">score: -1.3</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="750" height="140" rx="8" class="box" stroke-width="1"/>

    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" class="title">How Beam Search Works:</text>

    <text x="20" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">1. Maintain k (beam width) best sequences at each step</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">2. Expand each beam with all possible next tokens</text>
    <text x="20" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">3. Keep only top-k sequences by cumulative log probability</text>
    <text x="20" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation">4. Continue until EOS or max length</text>

    <!-- Visual legend -->
    <g transform="translate(400, 35)">
      <rect x="0" y="0" width="20" height="15" rx="3" class="node-active" stroke-width="1"/>
      <text x="30" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">Active beam</text>

      <rect x="0" y="25" width="20" height="15" rx="3" class="node-pruned" stroke-width="1"/>
      <text x="30" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">Pruned (not in top-k)</text>

      <rect x="0" y="50" width="20" height="15" rx="3" class="node-best" stroke-width="1"/>
      <text x="30" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">Best final sequence</text>

      <text x="180" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">Score = sum of log probs</text>
      <text x="180" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" class="annotation">(higher = more likely)</text>
    </g>

    <text x="20" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="annotation" font-style="italic">
      Unlike sampling, beam search is deterministic and finds high-probability sequences, but may produce generic output.
    </text>
  </g>
</svg>
