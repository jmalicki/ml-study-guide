<?xml version="1.0" encoding="UTF-8"?>
<!-- lint-disable contrast -->
<!-- Note: Contrast checker produces false positives due to not handling <g transform> -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" style="max-width: 900px; width: 100%; height: auto">

  <style>
    text { fill: #000000; }
    .bg-main { fill: #f5f5f5; }
    .bg-box { fill: white; }

    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .bg-main { fill: #1a1a1a; }
      .bg-box { fill: #2d2d2d; }
      text[fill="#333"] { fill: #ffffff; }
      text[fill="#666"] { fill: #cccccc; }
      text[fill="#1565C0"] { fill: #64B5F6; }
      text[fill="#2E7D32"] { fill: #81C784; }
      text[fill="#7B1FA2"] { fill: #CE93D8; }
      text[fill="#E65100"] { fill: #FFB74D; }
      rect[stroke="#1565C0"] { stroke: #64B5F6; }
      rect[stroke="#2E7D32"] { stroke: #81C784; }
      rect[stroke="#7B1FA2"] { stroke: #CE93D8; }
      rect[stroke="#E65100"] { stroke: #FFB74D; }
    }
  </style>

  <rect width="900" height="420" class="bg-main"/>

  <!-- Title -->
  <text x="450" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Vector Index Types: Speed vs Accuracy vs Memory</text>

  <!-- Flat Index -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="200" height="150" class="bg-box" stroke="#1565C0" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">IndexFlat</text>
    <text x="100" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">"Flat"</text>

    <!-- Visualization: all vectors -->
    <g transform="translate(20, 60)">
      <circle cx="20" cy="15" r="4" fill="#1565C0"/>
      <circle cx="40" cy="20" r="4" fill="#1565C0"/>
      <circle cx="60" cy="10" r="4" fill="#1565C0"/>
      <circle cx="80" cy="25" r="4" fill="#1565C0"/>
      <circle cx="100" cy="15" r="4" fill="#1565C0"/>
      <circle cx="120" cy="22" r="4" fill="#1565C0"/>
      <circle cx="140" cy="12" r="4" fill="#1565C0"/>
      <text x="80" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">Brute-force search all</text>
    </g>

    <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ 100% Recall</text>
    <text x="100" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#C62828">✗ O(n) search</text>
  </g>

  <!-- IVF Index -->
  <g transform="translate(240, 60)">
    <rect x="0" y="0" width="200" height="150" class="bg-box" stroke="#2E7D32" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">IndexIVF</text>
    <text x="100" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">"IVF1024,Flat"</text>

    <!-- Visualization: clusters -->
    <g transform="translate(20, 55)">
      <ellipse cx="40" cy="25" rx="30" ry="20" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="30" cy="20" r="3" fill="#2E7D32"/>
      <circle cx="45" cy="25" r="3" fill="#2E7D32"/>
      <circle cx="35" cy="30" r="3" fill="#2E7D32"/>
      <circle cx="50" cy="18" r="5" fill="#E65100"/>

      <ellipse cx="110" cy="25" rx="35" ry="22" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>
      <circle cx="95" cy="22" r="3" fill="#2E7D32"/>
      <circle cx="110" cy="28" r="3" fill="#2E7D32"/>
      <circle cx="125" cy="20" r="3" fill="#2E7D32"/>
      <circle cx="115" cy="15" r="3" fill="#2E7D32"/>
      <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">Search nprobe clusters</text>
    </g>

    <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ ~95%+ Recall</text>
    <text x="100" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ O(n/nlist) search</text>
  </g>

  <!-- PQ Index -->
  <g transform="translate(450, 60)">
    <rect x="0" y="0" width="200" height="150" class="bg-box" stroke="#7B1FA2" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7B1FA2">IndexPQ</text>
    <text x="100" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">"PQ64"</text>

    <!-- Visualization: compressed vectors -->
    <g transform="translate(20, 60)">
      <rect x="10" y="0" width="140" height="12" fill="none" stroke="#7B1FA2" stroke-width="1"/>
      <rect x="10" y="0" width="20" height="12" fill="#E1BEE7"/>
      <rect x="30" y="0" width="20" height="12" fill="#CE93D8"/>
      <rect x="50" y="0" width="20" height="12" fill="#E1BEE7"/>
      <rect x="70" y="0" width="20" height="12" fill="#BA68C8"/>
      <rect x="90" y="0" width="20" height="12" fill="#E1BEE7"/>
      <rect x="110" y="0" width="20" height="12" fill="#CE93D8"/>
      <rect x="130" y="0" width="20" height="12" fill="#E1BEE7"/>
      <text x="80" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#666">768-dim → 64 bytes</text>
      <text x="80" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle" fill="#7B1FA2">48× compression</text>
    </g>

    <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#E65100">~ 80-90% Recall</text>
    <text x="100" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ Very low memory</text>
  </g>

  <!-- HNSW Index -->
  <g transform="translate(660, 60)">
    <rect x="0" y="0" width="200" height="150" class="bg-box" stroke="#E65100" stroke-width="2" rx="8"/>
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">IndexHNSW</text>
    <text x="100" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">"HNSW32"</text>

    <!-- Visualization: graph layers -->
    <g transform="translate(20, 55)">
      <!-- Layer 2 (top) -->
      <circle cx="50" cy="5" r="4" fill="#E65100"/>
      <circle cx="110" cy="8" r="4" fill="#E65100"/>
      <line x1="54" y1="5" x2="106" y2="8" stroke="#E65100" stroke-width="1"/>

      <!-- Layer 1 -->
      <circle cx="30" cy="25" r="4" fill="#FFB74D"/>
      <circle cx="70" cy="22" r="4" fill="#FFB74D"/>
      <circle cx="100" cy="28" r="4" fill="#FFB74D"/>
      <circle cx="140" cy="24" r="4" fill="#FFB74D"/>
      <line x1="34" y1="25" x2="66" y2="22" stroke="#FFB74D" stroke-width="1"/>
      <line x1="74" y1="22" x2="96" y2="28" stroke="#FFB74D" stroke-width="1"/>
      <line x1="104" y1="28" x2="136" y2="24" stroke="#FFB74D" stroke-width="1"/>

      <!-- Connections between layers -->
      <line x1="50" y1="9" x2="70" y2="18" stroke="#E65100" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="110" y1="12" x2="100" y2="24" stroke="#E65100" stroke-width="1" stroke-dasharray="2,2"/>

      <text x="80" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">Multi-layer graph</text>
    </g>

    <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ ~99% Recall</text>
    <text x="100" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ O(log n) search</text>
  </g>

  <!-- Composite Index -->
  <g transform="translate(240, 230)">
    <rect x="0" y="0" width="410" height="150" class="bg-box" stroke="#333" stroke-width="2" rx="8"/>
    <text x="205" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Composite: IVF + PQ</text>
    <text x="205" y="50" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">"IVF4096,PQ64"</text>

    <!-- Visualization -->
    <g transform="translate(30, 60)">
      <!-- Clusters -->
      <ellipse cx="60" cy="30" rx="45" ry="25" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>
      <ellipse cx="170" cy="30" rx="45" ry="25" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>
      <ellipse cx="280" cy="30" rx="45" ry="25" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Compressed vectors in clusters -->
      <rect x="30" y="20" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>
      <rect x="55" y="30" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>
      <rect x="70" y="22" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>

      <rect x="140" y="25" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>
      <rect x="165" y="35" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>
      <rect x="185" y="20" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>

      <rect x="255" y="28" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>
      <rect x="280" y="22" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>
      <rect x="295" y="35" width="20" height="6" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="0.5"/>

      <text x="170" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">IVF clustering + PQ compression per cluster</text>
    </g>

    <text x="120" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ Scalable to billions</text>
    <text x="300" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">✓ Low memory footprint</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 390)">
    <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#333">When to use:</text>
    <text x="120" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1565C0">Flat: &lt;100K vectors</text>
    <text x="290" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2E7D32">IVF: 100K-10M, tunable</text>
    <text x="480" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#7B1FA2">PQ: Memory-limited</text>
    <text x="650" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E65100">HNSW: Best quality ANN</text>
  </g>
</svg>
