<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        fill: #000000;
      }
      @media (prefers-color-scheme: dark) {
        text { fill: #ffffff; }
        .axis-line { stroke: #ffffff; }
        .grid-line { stroke: #444444; }
      }
      .axis-line { stroke: #000000; stroke-width: 2; }
      .grid-line { stroke: #cccccc; stroke-width: 1; stroke-dasharray: 4,4; }
      .arrow { fill: none; stroke: #000000; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .arrow { stroke: #ffffff; }
      }
      .title { font-size: 20px; font-weight: 700; }
      .subtitle { font-size: 14px; font-style: italic; }
      .axis-label { font-size: 16px; font-weight: 600; }
      .legend-label { font-size: 13px; }
      .annotation { font-size: 11px; }
      .line-dp { stroke: #81C784; stroke-width: 3; fill: none; }
      .line-tp { stroke: #4A90A4; stroke-width: 3; fill: none; }
      .line-pp { stroke: #FFB74D; stroke-width: 3; fill: none; }
      .line-fsdp { stroke: #E57373; stroke-width: 3; fill: none; }
      .line-ideal { stroke: #999999; stroke-width: 2; fill: none; stroke-dasharray: 8,4; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Scaling Efficiency: How Performance Degrades with Scale</text>
  <text x="400" y="50" text-anchor="middle" class="subtitle">100% = perfect linear scaling (2× GPUs = 2× throughput)</text>

  <!-- Axes -->
  <line x1="80" y1="520" x2="750" y2="520" class="axis-line"/>
  <line x1="80" y1="520" x2="80" y2="80" class="axis-line"/>

  <!-- Arrows -->
  <path d="M 750 520 L 740 515 M 750 520 L 740 525" class="arrow"/>
  <path d="M 80 80 L 75 90 M 80 80 L 85 90" class="arrow"/>

  <!-- Axis labels -->
  <text x="415" y="560" text-anchor="middle" class="axis-label">Number of GPUs</text>
  <text x="40" y="300" text-anchor="middle" class="axis-label" transform="rotate(-90 40 300)">Scaling Efficiency (%)</text>

  <!-- Y-axis grid and labels -->
  <line x1="80" y1="470" x2="750" y2="470" class="grid-line"/>
  <text x="70" y="475" text-anchor="end" font-size="12">20%</text>

  <line x1="80" y1="420" x2="750" y2="420" class="grid-line"/>
  <text x="70" y="425" text-anchor="end" font-size="12">40%</text>

  <line x1="80" y1="370" x2="750" y2="370" class="grid-line"/>
  <text x="70" y="375" text-anchor="end" font-size="12">60%</text>

  <line x1="80" y1="320" x2="750" y2="320" class="grid-line"/>
  <text x="70" y="325" text-anchor="end" font-size="12">80%</text>

  <line x1="80" y1="270" x2="750" y2="270" class="grid-line"/>
  <text x="70" y="275" text-anchor="end" font-size="12">100%</text>

  <!-- X-axis grid and labels -->
  <line x1="150" y1="520" x2="150" y2="80" class="grid-line"/>
  <text x="150" y="540" text-anchor="middle" font-size="12">1</text>

  <line x1="270" y1="520" x2="270" y2="80" class="grid-line"/>
  <text x="270" y="540" text-anchor="middle" font-size="12">2</text>

  <line x1="390" y1="520" x2="390" y2="80" class="grid-line"/>
  <text x="390" y="540" text-anchor="middle" font-size="12">4</text>

  <line x1="510" y1="520" x2="510" y2="80" class="grid-line"/>
  <text x="510" y="540" text-anchor="middle" font-size="12">8</text>

  <line x1="630" y1="520" x2="630" y2="80" class="grid-line"/>
  <text x="630" y="540" text-anchor="middle" font-size="12">16</text>

  <line x1="750" y1="520" x2="750" y2="80" class="grid-line"/>
  <text x="750" y="540" text-anchor="middle" font-size="12">32</text>

  <!-- Ideal scaling line (100% efficiency) -->
  <line x1="150" y1="270" x2="750" y2="270" class="line-ideal"/>

  <!-- Data Parallelism (DP) - Near-linear until communication bottleneck -->
  <path d="M 150 270 L 270 270 L 390 272 L 510 278 L 630 292 L 750 330" class="line-dp"/>

  <!-- Points on DP line -->
  <circle cx="150" cy="270" r="4" fill="#81C784"/>
  <circle cx="270" cy="270" r="4" fill="#81C784"/>
  <circle cx="390" cy="272" r="4" fill="#81C784"/>
  <circle cx="510" cy="278" r="4" fill="#81C784"/>
  <circle cx="630" cy="292" r="4" fill="#81C784"/>
  <circle cx="750" cy="330" r="4" fill="#81C784"/>

  <!-- Tensor Parallelism (TP) - Limited by all-reduce latency -->
  <path d="M 150 270 L 270 265 L 390 255 L 510 235 L 630 205 L 750 175" class="line-tp"/>

  <!-- Points on TP line -->
  <circle cx="150" cy="270" r="4" fill="#4A90A4"/>
  <circle cx="270" cy="265" r="4" fill="#4A90A4"/>
  <circle cx="390" cy="255" r="4" fill="#4A90A4"/>
  <circle cx="510" cy="235" r="4" fill="#4A90A4"/>
  <circle cx="630" cy="205" r="4" fill="#4A90A4"/>
  <circle cx="750" cy="175" r="4" fill="#4A90A4"/>

  <!-- Pipeline Parallelism (PP) - Bubble overhead increases -->
  <path d="M 150 270 L 270 250 L 390 235 L 510 225 L 630 220 L 750 218" class="line-pp"/>

  <!-- Points on PP line -->
  <circle cx="150" cy="270" r="4" fill="#FFB74D"/>
  <circle cx="270" cy="250" r="4" fill="#FFB74D"/>
  <circle cx="390" cy="235" r="4" fill="#FFB74D"/>
  <circle cx="510" cy="225" r="4" fill="#FFB74D"/>
  <circle cx="630" cy="220" r="4" fill="#FFB74D"/>
  <circle cx="750" cy="218" r="4" fill="#FFB74D"/>

  <!-- FSDP/ZeRO-3 - High communication overhead -->
  <path d="M 150 270 L 270 260 L 390 242 L 510 220 L 630 195 L 750 168" class="line-fsdp"/>

  <!-- Points on FSDP line -->
  <circle cx="150" cy="270" r="4" fill="#E57373"/>
  <circle cx="270" cy="260" r="4" fill="#E57373"/>
  <circle cx="390" cy="242" r="4" fill="#E57373"/>
  <circle cx="510" cy="220" r="4" fill="#E57373"/>
  <circle cx="630" cy="195" r="4" fill="#E57373"/>
  <circle cx="750" cy="168" r="4" fill="#E57373"/>

  <!-- Legend -->
  <rect x="540" y="100" width="200" height="135" fill="none" stroke="#888888" stroke-width="1" rx="5"/>

  <line x1="550" y1="120" x2="590" y2="120" class="line-ideal"/>
  <text x="600" y="125" class="legend-label">Ideal (Linear)</text>

  <line x1="550" y1="145" x2="590" y2="145" class="line-dp"/>
  <circle cx="570" cy="145" r="4" fill="#81C784"/>
  <text x="600" y="150" class="legend-label">Data Parallel (DP)</text>

  <line x1="550" y1="170" x2="590" y2="170" class="line-tp"/>
  <circle cx="570" cy="170" r="4" fill="#4A90A4"/>
  <text x="600" y="175" class="legend-label">Tensor Parallel (TP)</text>

  <line x1="550" y1="195" x2="590" y2="195" class="line-pp"/>
  <circle cx="570" cy="195" r="4" fill="#FFB74D"/>
  <text x="600" y="200" class="legend-label">Pipeline Parallel (PP)</text>

  <line x1="550" y1="220" x2="590" y2="220" class="line-fsdp"/>
  <circle cx="570" cy="220" r="4" fill="#E57373"/>
  <text x="600" y="225" class="legend-label">FSDP/ZeRO-3</text>

  <!-- Annotations -->
  <!-- DP annotation -->
  <text x="750" y="345" text-anchor="end" class="annotation" fill="#2E7D32">Best scaling</text>
  <text x="750" y="358" text-anchor="end" class="annotation" fill="#2E7D32">(low overhead)</text>

  <!-- TP annotation -->
  <text x="750" y="160" text-anchor="end" class="annotation" fill="#1565C0">Degrades with</text>
  <text x="750" y="173" text-anchor="end" class="annotation" fill="#1565C0">GPU count</text>

  <!-- PP annotation -->
  <text x="630" y="205" text-anchor="middle" class="annotation" fill="#F57C00">Pipeline bubbles</text>
  <text x="630" y="218" text-anchor="middle" class="annotation" fill="#F57C00">~50% efficient</text>

  <!-- Key insight box -->
  <rect x="85" y="365" width="250" height="140" fill="none" stroke="#888888" stroke-width="1" rx="5"/>
  <text x="210" y="385" text-anchor="middle" font-size="13" font-weight="600">Key Bottlenecks:</text>
  <text x="100" y="405" font-size="11">DP: Gradient all-reduce</text>
  <text x="100" y="420" font-size="11">     bandwidth-bound</text>
  <text x="100" y="445" font-size="11">TP: Per-layer all-reduce</text>
  <text x="100" y="460" font-size="11">     latency-bound (≤8 GPUs)</text>
  <text x="100" y="485" font-size="11">PP: Pipeline bubbles grow</text>
  <text x="100" y="500" font-size="11">     with depth</text>
</svg>
