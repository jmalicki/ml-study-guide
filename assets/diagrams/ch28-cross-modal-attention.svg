<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-main { fill: #f5f5f5; }
    .text-color { fill: #333; }
    .token-box { fill: #E3F2FD; stroke: #1976D2; stroke-width: 2; }
    .patch-box { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 2; }
    .attention-line { stroke: #FF6B6B; stroke-width: 1.5; opacity: 0.6; }
    .attention-strong { stroke: #FF6B6B; stroke-width: 3; opacity: 0.9; }
    .attention-weak { stroke: #FFB6B6; stroke-width: 1; opacity: 0.3; }
    .title-text { font-size: 20px; font-weight: bold; }
    .label-text { font-size: 14px; font-weight: 600; }
    .small-text { font-size: 12px; }
    text { fill: #333; font-family: Arial, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg-main { fill: #1a1a1a; }
      .text-color { fill: #fff; }
      text { fill: #fff; }
      .token-box { fill: #1E3A5F; stroke: #4A90E2; }
      .patch-box { fill: #3A1E5F; stroke: #9B59B6; }
    }
  </style>

  <!-- Background -->
  <rect class="bg-main" width="900" height="500" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" class="title-text text-color" text-anchor="middle">Cross-Modal Attention: Text Attending to Image Patches</text>

  <!-- Text Tokens (Left Side) -->
  <text x="150" y="75" class="label-text text-color" text-anchor="middle">Text Tokens (Queries)</text>

  <!-- Text token boxes -->
  <rect class="token-box" x="80" y="100" width="140" height="40" rx="4"/>
  <text x="150" y="125" class="small-text text-color" text-anchor="middle">"A"</text>

  <rect class="token-box" x="80" y="150" width="140" height="40" rx="4"/>
  <text x="150" y="175" class="small-text text-color" text-anchor="middle">"cat"</text>

  <rect class="token-box" x="80" y="200" width="140" height="40" rx="4"/>
  <text x="150" y="225" class="small-text text-color" text-anchor="middle">"sitting"</text>

  <rect class="token-box" x="80" y="250" width="140" height="40" rx="4"/>
  <text x="150" y="275" class="small-text text-color" text-anchor="middle">"on"</text>

  <rect class="token-box" x="80" y="300" width="140" height="40" rx="4"/>
  <text x="150" y="325" class="small-text text-color" text-anchor="middle">"a"</text>

  <rect class="token-box" x="80" y="350" width="140" height="40" rx="4"/>
  <text x="150" y="375" class="small-text text-color" text-anchor="middle">"mat"</text>

  <!-- Image Patches (Right Side) -->
  <text x="680" y="75" class="label-text text-color" text-anchor="middle">Image Patches (Keys, Values)</text>

  <!-- 4x4 grid of patches -->
  <g id="patches">
    <!-- Row 1 -->
    <rect class="patch-box" x="560" y="100" width="60" height="60" rx="3"/>
    <text x="590" y="135" class="small-text text-color" text-anchor="middle">Sky</text>

    <rect class="patch-box" x="630" y="100" width="60" height="60" rx="3"/>
    <text x="660" y="135" class="small-text text-color" text-anchor="middle">Sky</text>

    <rect class="patch-box" x="700" y="100" width="60" height="60" rx="3"/>
    <text x="730" y="135" class="small-text text-color" text-anchor="middle">Wall</text>

    <rect class="patch-box" x="770" y="100" width="60" height="60" rx="3"/>
    <text x="800" y="135" class="small-text text-color" text-anchor="middle">Wall</text>

    <!-- Row 2 -->
    <rect class="patch-box" x="560" y="170" width="60" height="60" rx="3"/>
    <text x="590" y="205" class="small-text text-color" text-anchor="middle">Cat</text>

    <rect class="patch-box" x="630" y="170" width="60" height="60" rx="3"/>
    <text x="660" y="205" class="small-text text-color" text-anchor="middle">Cat</text>

    <rect class="patch-box" x="700" y="170" width="60" height="60" rx="3"/>
    <text x="730" y="205" class="small-text text-color" text-anchor="middle">Cat</text>

    <rect class="patch-box" x="770" y="170" width="60" height="60" rx="3"/>
    <text x="800" y="205" class="small-text text-color" text-anchor="middle">Wall</text>

    <!-- Row 3 -->
    <rect class="patch-box" x="560" y="240" width="60" height="60" rx="3"/>
    <text x="590" y="275" class="small-text text-color" text-anchor="middle">Cat</text>

    <rect class="patch-box" x="630" y="240" width="60" height="60" rx="3"/>
    <text x="660" y="275" class="small-text text-color" text-anchor="middle">Cat</text>

    <rect class="patch-box" x="700" y="240" width="60" height="60" rx="3"/>
    <text x="730" y="275" class="small-text text-color" text-anchor="middle">Mat</text>

    <rect class="patch-box" x="770" y="240" width="60" height="60" rx="3"/>
    <text x="800" y="275" class="small-text text-color" text-anchor="middle">Mat</text>

    <!-- Row 4 -->
    <rect class="patch-box" x="560" y="310" width="60" height="60" rx="3"/>
    <text x="590" y="345" class="small-text text-color" text-anchor="middle">Floor</text>

    <rect class="patch-box" x="630" y="310" width="60" height="60" rx="3"/>
    <text x="660" y="345" class="small-text text-color" text-anchor="middle">Mat</text>

    <rect class="patch-box" x="700" y="310" width="60" height="60" rx="3"/>
    <text x="730" y="345" class="small-text text-color" text-anchor="middle">Mat</text>

    <rect class="patch-box" x="770" y="310" width="60" height="60" rx="3"/>
    <text x="800" y="345" class="small-text text-color" text-anchor="middle">Mat</text>
  </g>

  <!-- Attention Lines -->
  <!-- "cat" token strongly attends to cat patches -->
  <line class="attention-strong" x1="220" y1="170" x2="560" y2="200" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="170" x2="630" y2="200" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="170" x2="700" y2="200" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="170" x2="560" y2="270" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="170" x2="630" y2="270" marker-end="url(#arrowhead-strong)"/>

  <!-- "mat" token strongly attends to mat patches -->
  <line class="attention-strong" x1="220" y1="370" x2="700" y2="270" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="370" x2="770" y2="270" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="370" x2="630" y2="340" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="370" x2="700" y2="340" marker-end="url(#arrowhead-strong)"/>
  <line class="attention-strong" x1="220" y1="370" x2="770" y2="340" marker-end="url(#arrowhead-strong)"/>

  <!-- "sitting" token moderately attends to cat and mat -->
  <line class="attention-line" x1="220" y1="220" x2="630" y2="200" marker-end="url(#arrowhead)"/>
  <line class="attention-line" x1="220" y1="220" x2="630" y2="270" marker-end="url(#arrowhead)"/>
  <line class="attention-line" x1="220" y1="220" x2="700" y2="270" marker-end="url(#arrowhead)"/>

  <!-- Other tokens have weak attention (contextual) -->
  <line class="attention-weak" x1="220" y1="120" x2="590" y2="130" marker-end="url(#arrowhead-weak)"/>
  <line class="attention-weak" x1="220" y1="270" x2="730" y2="270" marker-end="url(#arrowhead-weak)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-strong" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B6B" opacity="0.9"/>
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B6B" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-weak" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFB6B6" opacity="0.3"/>
    </marker>
  </defs>

  <!-- Legend -->
  <g transform="translate(250, 430)">
    <text x="0" y="0" class="small-text text-color" font-weight="600">Attention Strength:</text>
    <line class="attention-strong" x1="120" y1="-5" x2="180" y2="-5"/>
    <text x="185" y="0" class="small-text text-color">Strong (semantic match)</text>
    <line class="attention-line" x1="350" y1="-5" x2="410" y2="-5"/>
    <text x="415" y="0" class="small-text text-color">Moderate</text>
  </g>

  <!-- Note -->
  <text x="450" y="470" class="small-text text-color" text-anchor="middle" font-style="italic">
    Each text token queries all image patches; attention weights determine which patches are most relevant
  </text>
</svg>