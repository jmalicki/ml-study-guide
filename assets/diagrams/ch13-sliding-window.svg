<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600">
  <!-- Title -->
  <text x="350" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Sliding Window Attention Pattern
  </text>
  <text x="350" y="50" font-size="13" text-anchor="middle" fill="#666">
    Window size = 4 (simplified for visualization)
  </text>

  <!-- Attention Matrix -->
  <g id="matrix">
    <text x="150" y="90" font-size="12" fill="#666">Key Position →</text>
    <text x="50" y="200" font-size="12" fill="#666" transform="rotate(-90 50 200)">Query Position ↓</text>

    <!-- Grid -->
    <g id="grid">
      <!-- Draw 12x12 grid -->
      <!-- Row 0 -->
      <rect x="120" y="110" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="150" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="180" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="210" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="240" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="270" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="300" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="330" y="110" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 1 -->
      <rect x="120" y="140" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="150" y="140" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="180" y="140" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="210" y="140" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="240" y="140" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="270" y="140" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="300" y="140" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="330" y="140" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 2 -->
      <rect x="120" y="170" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="150" y="170" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="180" y="170" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="210" y="170" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="240" y="170" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="270" y="170" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="300" y="170" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="330" y="170" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 3 -->
      <rect x="120" y="200" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="150" y="200" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="180" y="200" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="210" y="200" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="240" y="200" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="270" y="200" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="300" y="200" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="330" y="200" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 4 -->
      <rect x="120" y="230" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="150" y="230" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="180" y="230" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="210" y="230" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="240" y="230" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="270" y="230" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="300" y="230" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="330" y="230" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 5 -->
      <rect x="120" y="260" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="150" y="260" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="180" y="260" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="210" y="260" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="240" y="260" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="270" y="260" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="300" y="260" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="330" y="260" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 6 -->
      <rect x="120" y="290" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="150" y="290" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="180" y="290" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="210" y="290" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="240" y="290" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="270" y="290" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="300" y="290" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="330" y="290" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>

      <!-- Row 7 -->
      <rect x="120" y="320" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="150" y="320" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="180" y="320" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="210" y="320" width="30" height="30" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
      <rect x="240" y="320" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="270" y="320" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="300" y="320" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
      <rect x="330" y="320" width="30" height="30" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>

      <!-- Position labels -->
      <text x="135" y="105" font-size="9" text-anchor="middle" fill="#666">0</text>
      <text x="165" y="105" font-size="9" text-anchor="middle" fill="#666">1</text>
      <text x="195" y="105" font-size="9" text-anchor="middle" fill="#666">2</text>
      <text x="225" y="105" font-size="9" text-anchor="middle" fill="#666">3</text>
      <text x="255" y="105" font-size="9" text-anchor="middle" fill="#666">4</text>
      <text x="285" y="105" font-size="9" text-anchor="middle" fill="#666">5</text>
      <text x="315" y="105" font-size="9" text-anchor="middle" fill="#666">6</text>
      <text x="345" y="105" font-size="9" text-anchor="middle" fill="#666">7</text>

      <text x="110" y="128" font-size="9" text-anchor="end" fill="#666">0</text>
      <text x="110" y="158" font-size="9" text-anchor="end" fill="#666">1</text>
      <text x="110" y="188" font-size="9" text-anchor="end" fill="#666">2</text>
      <text x="110" y="218" font-size="9" text-anchor="end" fill="#666">3</text>
      <text x="110" y="248" font-size="9" text-anchor="end" fill="#666">4</text>
      <text x="110" y="278" font-size="9" text-anchor="end" fill="#666">5</text>
      <text x="110" y="308" font-size="9" text-anchor="end" fill="#666">6</text>
      <text x="110" y="338" font-size="9" text-anchor="end" fill="#666">7</text>
    </g>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="400" y="120" width="250" height="100" fill="#f9f9f9" stroke="#999" stroke-width="1" rx="5"/>

    <rect x="420" y="135" width="25" height="25" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.8"/>
    <text x="455" y="153" font-size="12" fill="#333">Attends (within window)</text>

    <rect x="420" y="170" width="25" height="25" fill="#e0e0e0" stroke="#333" stroke-width="1"/>
    <text x="455" y="188" font-size="12" fill="#333">Masked (outside window)</text>
  </g>

  <!-- Key Properties -->
  <g id="properties">
    <rect x="400" y="240" width="250" height="110" fill="#fff" stroke="#4A90A4" stroke-width="2" rx="5"/>

    <text x="525" y="265" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Key Properties</text>

    <text x="420" y="285" font-size="11" fill="#333">• Causal: Can't see future</text>
    <text x="420" y="302" font-size="11" fill="#333">• Window size = 4 tokens</text>
    <text x="420" y="319" font-size="11" fill="#333">• Complexity: O(n·w) not O(n²)</text>
    <text x="420" y="336" font-size="11" fill="#333">• Fixed KV cache size</text>
  </g>

  <!-- Receptive Field Diagram -->
  <g id="receptive">
    <text x="350" y="390" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Multi-Layer Receptive Field Growth
    </text>
    <text x="350" y="410" font-size="11" text-anchor="middle" fill="#666">
      How information propagates across layers with window size w=4
    </text>

    <!-- Layer 0 -->
    <text x="80" y="440" font-size="11" fill="#666">Layer 1:</text>
    <rect x="120" y="425" width="20" height="20" fill="#E57373" stroke="#333" stroke-width="1"/>
    <rect x="145" y="425" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="170" y="425" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="195" y="425" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="220" y="425" width="20" height="20" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.6"/>
    <text x="250" y="440" font-size="10" fill="#666">Receptive field: 4 tokens</text>

    <!-- Layer 1 -->
    <text x="80" y="475" font-size="11" fill="#666">Layer 2:</text>
    <rect x="120" y="460" width="20" height="20" fill="#E57373" stroke="#333" stroke-width="1"/>
    <rect x="145" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="170" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="195" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="220" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="245" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="270" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <rect x="295" y="460" width="20" height="20" fill="#81C784" stroke="#333" stroke-width="1" opacity="0.6"/>
    <text x="325" y="475" font-size="10" fill="#666">Receptive field: 8 tokens</text>

    <!-- Layer 2 -->
    <text x="80" y="510" font-size="11" fill="#666">Layer 3:</text>
    <rect x="120" y="495" width="20" height="20" fill="#E57373" stroke="#333" stroke-width="1"/>
    <rect x="145" y="495" width="110" height="20" fill="#FFB74D" stroke="#333" stroke-width="1" opacity="0.5"/>
    <text x="265" y="510" font-size="10" fill="#666">Receptive field: 12 tokens</text>

    <!-- Explanation -->
    <text x="400" y="440" font-size="11" fill="#333">At layer L, receptive field = L × w</text>
    <text x="400" y="457" font-size="11" fill="#333">Mistral 7B: 32 layers × 4096 window</text>
    <text x="400" y="474" font-size="11" font-weight="bold" fill="#4A90A4">= 131K effective context!</text>

    <!-- Legend -->
    <rect x="400" y="490" width="15" height="15" fill="#E57373" stroke="#333" stroke-width="1"/>
    <text x="420" y="502" font-size="10" fill="#666">Current token</text>

    <rect x="520" y="490" width="15" height="15" fill="#4A90A4" stroke="#333" stroke-width="1" opacity="0.6"/>
    <text x="540" y="502" font-size="10" fill="#666">Direct window</text>
  </g>

  <!-- Bottom summary -->
  <g id="summary">
    <rect x="50" y="540" width="600" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="5"/>
    <text x="350" y="560" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Used in: Mistral 7B, Qwen, Gemma 2
    </text>
    <text x="350" y="578" font-size="10" text-anchor="middle" fill="#666">
      Enables efficient long-context inference with fixed memory footprint
    </text>
  </g>
</svg>
