<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }
    .bg-box { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      .bg-box { fill: #2d2d2d; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      text[fill="#9575CD"] { fill: #b39ddb; }

      rect[fill="#f9f9f9"] { fill: #2d2d2d; }
      rect[fill="#FFF9E6"] { fill: #3a3620; }
      rect[fill="#E8EAF6"] { fill: #3d3d4d; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#81C784" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Residual Connection: Why It Enables Deep Networks
  </text>
  <text x="400" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    output = x + F(x) — The identity path allows gradients to flow directly backward
  </text>

  <!-- Input x -->
  <g id="input">
    <rect x="80" y="100" width="120" height="60" fill="#E8EAF6" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="140" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">x (input)</text>
    <text x="140" y="148" font-family="monospace" font-size="11" text-anchor="middle" fill="#666">[1.0, 0.5, -0.3]</text>
  </g>

  <!-- Split point -->
  <circle cx="260" cy="130" r="5" fill="#4A90A4" />
  <line x1="200" y1="130" x2="255" y2="130" stroke="#999" stroke-width="2" />

  <!-- Top path: identity (skip connection) -->
  <g id="identity-path">
    <path d="M 260 130 L 260 80 L 520 80 L 520 130" fill="none" stroke="#4A90A4" stroke-width="3" />
    <text x="390" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A90A4">Identity Path (x)</text>
    <text x="390" y="95" font-family="monospace" font-size="10" text-anchor="middle" fill="#4A90A4">[1.0, 0.5, -0.3]</text>
  </g>

  <!-- Bottom path: sublayer F(x) -->
  <g id="sublayer-path">
    <line x1="260" y1="130" x2="260" y2="180" stroke="#999" stroke-width="2" />
    <line x1="260" y1="180" x2="300" y2="180" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

    <rect x="310" y="150" width="180" height="60" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="2" rx="5" />
    <text x="400" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFB74D">F(x) — Sublayer</text>
    <text x="400" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">(Attention or FFN)</text>

    <line x1="490" y1="180" x2="520" y2="180" stroke="#999" stroke-width="2" />
    <line x1="520" y1="180" x2="520" y2="145" stroke="#999" stroke-width="2" />
  </g>

  <!-- F(x) output label -->
  <text x="540" y="185" font-family="monospace" font-size="10" fill="#FFB74D">[0.2, -0.1, 0.4]</text>

  <!-- Add operation -->
  <g id="add">
    <circle cx="520" cy="130" r="20" fill="#81C784" opacity="0.3" stroke="#81C784" stroke-width="2" />
    <text x="520" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#81C784">+</text>
  </g>

  <!-- Output -->
  <g id="output">
    <line x1="540" y1="130" x2="590" y2="130" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
    <rect x="600" y="100" width="150" height="60" fill="#81C784" opacity="0.3" stroke="#81C784" stroke-width="2" rx="5" />
    <text x="675" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#81C784">x + F(x)</text>
    <text x="675" y="148" font-family="monospace" font-size="11" text-anchor="middle" fill="#333">[1.2, 0.4, 0.1]</text>
  </g>

  <!-- Gradient flow visualization -->
  <g id="gradient-section">
    <text x="400" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Gradient Flow During Backpropagation</text>

    <!-- Gradient arrows (backward direction) -->
    <rect x="600" y="270" width="100" height="35" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="650" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">∂L/∂output</text>

    <!-- Split at add -->
    <line x1="600" y1="287" x2="550" y2="287" stroke="#E57373" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- Two gradient paths backward -->
    <!-- Path 1: Through identity -->
    <path d="M 520 277 L 520 265 L 260 265 L 260 277" fill="none" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowhead-blue)" />
    <text x="390" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#4A90A4">∂L/∂x (direct) — ALWAYS flows!</text>

    <!-- Path 2: Through F -->
    <path d="M 520 297 L 520 320 L 260 320 L 260 297" fill="none" stroke="#FFB74D" stroke-width="2" marker-end="url(#arrowhead)" />
    <text x="390" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#FFB74D">∂L/∂x via ∂F/∂x (may vanish)</text>

    <!-- Input gradient box -->
    <rect x="100" y="270" width="100" height="35" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="3" />
    <text x="150" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#4A90A4">∂L/∂x</text>

    <line x1="260" y1="287" x2="200" y2="287" stroke="#4A90A4" stroke-width="2" marker-end="url(#arrowhead-blue)" />
  </g>

  <!-- Key insight -->
  <rect x="80" y="355" width="640" height="20" fill="#FFF9E6" stroke="#FFB74D" stroke-width="1.5" rx="5" />
  <text x="400" y="369" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Key: Even if ∂F/∂x → 0 (vanishing), the identity path ensures ∂L/∂x never vanishes completely!</text>
</svg>
