<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 600">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }
    .bg-box { fill: #f5f5f5; }

    /* Dark mode */

    /* Background colors */
    .bg-cream { fill: #fff9e6; }
    .bg-indigo-light { fill: #E8EAF6; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      .bg-box { fill: #2d2d2d; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      text[fill="#9575CD"] { fill: #b39ddb; }

      rect[fill="#f9f9f9"] { fill: #2d2d2d; }
      rect[fill="#FFF9E6"] { fill: #3a3620; }
      rect[fill="#E8EAF6"] { fill: #3d3d4d; }
      .bg-cream { fill: #5d4037; }
      .bg-indigo-light { fill: #1a237e; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Transformer Block: Pre-Norm Architecture
  </text>
  <text x="375" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Input: "The quick brown fox" — Tracking data flow through one transformer layer
  </text>

  <!-- Input tokens/embeddings -->
  <g id="input">
    <rect x="200" y="70" width="200" height="45" class="bg-indigo-light" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="300" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Input Embeddings</text>
    <text x="300" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">[4, 512] — The quick brown fox</text>
  </g>

  <!-- Main flow arrow down -->
  <line x1="300" y1="115" x2="300" y2="140" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Residual connection 1 - left branch -->
  <g id="residual1">
    <!-- Split point -->
    <circle cx="300" cy="150" r="4" fill="#4A90A4" />

    <!-- Left branch (skip connection) -->
    <path d="M 300 150 L 140 150 L 140 340" fill="none" stroke="#4A90A4" stroke-width="3" />
    <text x="110" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#4A90A4" transform="rotate(-90 110 250)">Residual (skip)</text>

    <!-- Right branch continues down -->
    <line x1="300" y1="150" x2="300" y2="170" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- LayerNorm 1 -->
  <g id="layernorm1">
    <rect x="220" y="175" width="160" height="40" fill="#9575CD" opacity="0.2" stroke="#9575CD" stroke-width="2" rx="5" />
    <text x="300" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9575CD">LayerNorm</text>
  </g>

  <line x1="300" y1="215" x2="300" y2="240" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Multi-Head Attention -->
  <g id="attention">
    <rect x="190" y="245" width="220" height="70" fill="#E57373" opacity="0.15" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="300" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#E57373">Multi-Head Attention</text>
    <text x="300" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">Q, K, V from same input (self-attention)</text>
    <text x="300" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">h=8 heads, d<tspan baseline-shift="sub" font-size="6.3">k</tspan>=64</text>
  </g>

  <line x1="300" y1="315" x2="300" y2="340" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Add operation 1 -->
  <g id="add1">
    <circle cx="300" cy="355" r="18" fill="#4A90A4" opacity="0.3" stroke="#4A90A4" stroke-width="2" />
    <text x="300" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4A90A4">+</text>

    <!-- Arrow from residual -->
    <path d="M 140 340 L 140 355 L 282 355" fill="none" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowhead-blue)" />
  </g>

  <line x1="300" y1="373" x2="300" y2="395" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Second residual connection -->
  <g id="residual2">
    <!-- Split point -->
    <circle cx="300" cy="405" r="4" fill="#4A90A4" />

    <!-- Left branch (skip connection) -->
    <path d="M 300 405 L 140 405 L 140 530" fill="none" stroke="#4A90A4" stroke-width="3" />

    <!-- Right branch continues down -->
    <line x1="300" y1="405" x2="300" y2="425" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- LayerNorm 2 -->
  <g id="layernorm2">
    <rect x="220" y="430" width="160" height="40" fill="#9575CD" opacity="0.2" stroke="#9575CD" stroke-width="2" rx="5" />
    <text x="300" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9575CD">LayerNorm</text>
  </g>

  <line x1="300" y1="470" x2="300" y2="490" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Feed-Forward Network -->
  <g id="ffn">
    <rect x="200" y="495" width="200" height="50" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="2" rx="5" />
    <text x="300" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFB74D">Feed-Forward Network</text>
    <text x="300" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">512 → 2048 → 512 (SwiGLU)</text>
  </g>

  <line x1="300" y1="545" x2="300" y2="565" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Add operation 2 -->
  <g id="add2">
    <circle cx="300" cy="580" r="18" fill="#4A90A4" opacity="0.3" stroke="#4A90A4" stroke-width="2" />
    <text x="300" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#4A90A4">+</text>

    <!-- Arrow from residual -->
    <path d="M 140 530 L 140 580 L 282 580" fill="none" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowhead-blue)" />
  </g>

  <!-- Output -->
  <g id="output">
    <line x1="318" y1="580" x2="430" y2="580" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)" />
    <rect x="440" y="555" width="160" height="50" fill="#81C784" opacity="0.3" stroke="#81C784" stroke-width="2" rx="5" />
    <text x="520" y="577" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#81C784">Output</text>
    <text x="520" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">[4, 512] — same shape</text>
  </g>

  <!-- Key insight boxes on the right -->
  <rect x="480" y="70" width="250" height="95" class="bg-cream" stroke="#FFB74D" stroke-width="2" rx="5" />
  <text x="495" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#333">Pre-Norm Architecture:</text>
  <text x="495" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• LayerNorm BEFORE attention/FFN</text>
  <text x="495" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• Used by GPT-2+, LLaMA, most LLMs</text>
  <text x="495" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• More stable gradients for deep nets</text>
  <text x="495" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• No warmup needed</text>

  <rect x="480" y="180" width="250" height="80" class="bg-indigo-light" stroke="#4A90A4" stroke-width="2" rx="5" />
  <text x="495" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#4A90A4">Residual Connections:</text>
  <text x="495" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• Blue paths = skip connections</text>
  <text x="495" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• Enable gradient flow in deep nets</text>
  <text x="495" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">• output = input + sublayer(input)</text>

  <rect x="480" y="275" width="250" height="100" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="5" />
  <text x="495" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#333">Dimension Tracking:</text>
  <text x="500" y="315" font-family="monospace" font-size="9" fill="#333">Input:  [4, 512]</text>
  <text x="500" y="330" font-family="monospace" font-size="9" fill="#333">→ LN:   [4, 512]</text>
  <text x="500" y="345" font-family="monospace" font-size="9" fill="#333">→ Attn: [4, 512]</text>
  <text x="500" y="360" font-family="monospace" font-size="9" fill="#333">→ FFN:  [4, 512]</text>
  <text x="500" y="375" font-family="monospace" font-size="9" fill="#333">Output: [4, 512]</text>

  <!-- Block boundary indicator -->
  <rect x="120" y="65" width="310" height="535" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8,4" rx="10" />
  <text x="125" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">One Transformer Block (repeat N times)</text>
</svg>
