<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }
    .bg-box { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      .bg-box { fill: #2d2d2d; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      text[fill="#9575CD"] { fill: #b39ddb; }
      text[fill="#4DB6AC"] { fill: #80cbc4; }

      rect[fill="#f9f9f9"] { fill: #2d2d2d; }
      rect[fill="#FFF9E6"] { fill: #3a3620; }
      rect[fill="#E8EAF6"] { fill: #3d3d4d; }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Multi-Head Attention: Splitting Input into Parallel Heads
  </text>
  <text x="475" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#666">
    Each head learns different attention patterns on the same input
  </text>

  <!-- Input tokens -->
  <g id="input">
    <text x="120" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A90A4">Input Tokens</text>

    <rect x="40" y="95" width="50" height="30" class="bg-box" stroke="#4A90A4" stroke-width="1.5" rx="3" />
    <text x="65" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#333">The</text>

    <rect x="95" y="95" width="50" height="30" class="bg-box" stroke="#4A90A4" stroke-width="1.5" rx="3" />
    <text x="120" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#333">quick</text>

    <rect x="150" y="95" width="50" height="30" class="bg-box" stroke="#4A90A4" stroke-width="1.5" rx="3" />
    <text x="175" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#333">brown</text>

    <rect x="205" y="95" width="50" height="30" class="bg-box" stroke="#4A90A4" stroke-width="1.5" rx="3" />
    <text x="230" y="115" font-family="monospace" font-size="11" text-anchor="middle" fill="#333">fox</text>
  </g>

  <!-- Input embeddings -->
  <g id="embeddings">
    <line x1="145" y1="125" x2="145" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="40" y="160" width="215" height="45" fill="#E8EAF6" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="147" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#333">X: [4, 512]</text>
    <text x="147" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">(seq<tspan baseline-shift="sub" font-size="7">len</tspan> × d<tspan baseline-shift="sub" font-size="7">model</tspan>)</text>
  </g>

  <!-- Linear projections -->
  <g id="projections">
    <line x1="147" y1="205" x2="147" y2="240" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="60" y="245" width="180" height="40" class="bg-box" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="150" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A90A4">Linear Projections</text>
    <text x="150" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">W<tspan baseline-shift="sub" font-size="7">Q</tspan>, W<tspan baseline-shift="sub" font-size="7">K</tspan>, W<tspan baseline-shift="sub" font-size="7">V</tspan></text>
  </g>

  <!-- Q, K, V before split -->
  <g id="qkv-full">
    <line x1="147" y1="285" x2="147" y2="310" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="40" y="315" width="70" height="35" fill="#E57373" opacity="0.2" stroke="#E57373" stroke-width="1.5" rx="3" />
    <text x="75" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#E57373">Q [4,512]</text>

    <rect x="115" y="315" width="70" height="35" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="1.5" rx="3" />
    <text x="150" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#81C784">K [4,512]</text>

    <rect x="190" y="315" width="70" height="35" fill="#FFB74D" opacity="0.2" stroke="#FFB74D" stroke-width="1.5" rx="3" />
    <text x="225" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#FFB74D">V [4,512]</text>
  </g>

  <!-- Reshape/Split operation -->
  <g id="reshape">
    <line x1="147" y1="350" x2="147" y2="375" stroke="#999" stroke-width="1.5" />

    <rect x="60" y="380" width="180" height="35" fill="#9575CD" opacity="0.2" stroke="#9575CD" stroke-width="2" rx="5" />
    <text x="150" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9575CD">Reshape → Split into h=8 heads</text>

    <text x="150" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">[4, 512] → [4, 8, 64] → 8 × [4, 64]</text>
  </g>

  <!-- Split arrows to heads -->
  <g id="split-arrows">
    <path d="M 150 415 L 150 450 L 350 450" fill="none" stroke="#999" stroke-width="1.5" />
    <path d="M 350 450 L 350 470" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 350 450 L 550 450 L 550 470" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 550 450 L 750 450 L 750 470" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <!-- Ellipsis for other heads -->
    <text x="850" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#666">...</text>
  </g>

  <!-- Individual heads -->
  <g id="head1">
    <rect x="280" y="75" width="140" height="395" fill="#E57373" opacity="0.05" stroke="#E57373" stroke-width="1" stroke-dasharray="5,5" rx="10" />
    <text x="350" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#E57373">Head 1</text>
    <text x="350" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">"Adjective-Noun"</text>

    <!-- Head 1 attention pattern -->
    <rect x="295" y="130" width="110" height="90" class="bg-box" stroke="#E57373" stroke-width="1.5" rx="5" />
    <text x="350" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">Attention Pattern:</text>

    <!-- Mini heatmap for head 1 -->
    <rect x="305" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="327" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="349" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="371" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />

    <rect x="305" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="327" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="349" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="371" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />

    <rect x="305" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="327" y="204" width="20" height="20" fill="#E57373" opacity="0.6" stroke="#ccc" stroke-width="0.5" />
    <rect x="349" y="204" width="20" height="20" fill="#E57373" opacity="0.8" stroke="#ccc" stroke-width="0.5" />
    <rect x="371" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />

    <text x="350" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">"fox" → "brown"</text>

    <!-- Head 1 Q, K, V -->
    <rect x="295" y="260" width="110" height="65" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="315" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E57373">Q₁</text>
    <text x="345" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">K₁</text>
    <text x="375" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FFB74D">V₁</text>
    <text x="350" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">[4, 64] each</text>
    <text x="350" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">d<tspan baseline-shift="sub" font-size="6">k</tspan> = 512/8 = 64</text>

    <!-- Head 1 output -->
    <rect x="295" y="340" width="110" height="35" fill="#4DB6AC" opacity="0.3" stroke="#4DB6AC" stroke-width="1.5" rx="3" />
    <text x="350" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#4DB6AC">out₁ [4, 64]</text>
  </g>

  <g id="head2">
    <rect x="480" y="75" width="140" height="395" fill="#81C784" opacity="0.05" stroke="#81C784" stroke-width="1" stroke-dasharray="5,5" rx="10" />
    <text x="550" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#81C784">Head 2</text>
    <text x="550" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">"Positional"</text>

    <!-- Head 2 attention pattern -->
    <rect x="495" y="130" width="110" height="90" class="bg-box" stroke="#81C784" stroke-width="1.5" rx="5" />
    <text x="550" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">Attention Pattern:</text>

    <!-- Mini heatmap for head 2 - diagonal pattern (positional) -->
    <rect x="505" y="160" width="20" height="20" fill="#81C784" opacity="0.7" stroke="#ccc" stroke-width="0.5" />
    <rect x="527" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="549" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="571" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />

    <rect x="505" y="182" width="20" height="20" fill="#81C784" opacity="0.4" stroke="#ccc" stroke-width="0.5" />
    <rect x="527" y="182" width="20" height="20" fill="#81C784" opacity="0.7" stroke="#ccc" stroke-width="0.5" />
    <rect x="549" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="571" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />

    <rect x="505" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="527" y="204" width="20" height="20" fill="#81C784" opacity="0.4" stroke="#ccc" stroke-width="0.5" />
    <rect x="549" y="204" width="20" height="20" fill="#81C784" opacity="0.7" stroke="#ccc" stroke-width="0.5" />
    <rect x="571" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />

    <text x="550" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">attends to neighbors</text>

    <!-- Head 2 Q, K, V -->
    <rect x="495" y="260" width="110" height="65" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="515" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E57373">Q₂</text>
    <text x="545" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">K₂</text>
    <text x="575" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FFB74D">V₂</text>
    <text x="550" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">[4, 64] each</text>
    <text x="550" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">d<tspan baseline-shift="sub" font-size="6">k</tspan> = 512/8 = 64</text>

    <!-- Head 2 output -->
    <rect x="495" y="340" width="110" height="35" fill="#4DB6AC" opacity="0.3" stroke="#4DB6AC" stroke-width="1.5" rx="3" />
    <text x="550" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#4DB6AC">out₂ [4, 64]</text>
  </g>

  <g id="head8">
    <rect x="680" y="75" width="140" height="395" fill="#FFB74D" opacity="0.05" stroke="#FFB74D" stroke-width="1" stroke-dasharray="5,5" rx="10" />
    <text x="750" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFB74D">Head 8</text>
    <text x="750" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#666">"Subject-Verb"</text>

    <!-- Head 8 attention pattern -->
    <rect x="695" y="130" width="110" height="90" class="bg-box" stroke="#FFB74D" stroke-width="1.5" rx="5" />
    <text x="750" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle" fill="#333">Attention Pattern:</text>

    <!-- Mini heatmap for head 8 -->
    <rect x="705" y="160" width="20" height="20" fill="#FFB74D" opacity="0.6" stroke="#ccc" stroke-width="0.5" />
    <rect x="727" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="749" y="160" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="771" y="160" width="20" height="20" fill="#FFB74D" opacity="0.5" stroke="#ccc" stroke-width="0.5" />

    <rect x="705" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="727" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="749" y="182" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="771" y="182" width="20" height="20" fill="#FFB74D" opacity="0.4" stroke="#ccc" stroke-width="0.5" />

    <rect x="705" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="727" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="749" y="204" width="20" height="20" fill="#E8EAF6" stroke="#ccc" stroke-width="0.5" />
    <rect x="771" y="204" width="20" height="20" fill="#FFB74D" opacity="0.7" stroke="#ccc" stroke-width="0.5" />

    <text x="750" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">"fox" → "The" (subj)</text>

    <!-- Head 8 Q, K, V -->
    <rect x="695" y="260" width="110" height="65" class="bg-box" stroke="#999" stroke-width="1" rx="3" />
    <text x="715" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E57373">Q₈</text>
    <text x="745" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">K₈</text>
    <text x="775" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FFB74D">V₈</text>
    <text x="750" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">[4, 64] each</text>
    <text x="750" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#666">d<tspan baseline-shift="sub" font-size="6">k</tspan> = 512/8 = 64</text>

    <!-- Head 8 output -->
    <rect x="695" y="340" width="110" height="35" fill="#4DB6AC" opacity="0.3" stroke="#4DB6AC" stroke-width="1.5" rx="3" />
    <text x="750" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#4DB6AC">out₈ [4, 64]</text>
  </g>

  <!-- Ellipsis between heads -->
  <text x="440" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#666">...</text>
  <text x="640" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#666">...</text>

  <!-- Key insight -->
  <rect x="280" y="400" width="560" height="50" fill="#FFF9E6" stroke="#FFB74D" stroke-width="2" rx="5" />
  <text x="295" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#333">Key Insight:</text>
  <text x="295" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">Each head operates on same input but learns different relationship patterns. Heads compute in parallel.</text>

  <!-- Dimension tracking -->
  <rect x="280" y="460" width="560" height="45" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="5" />
  <text x="295" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#333">Dimension Tracking:</text>
  <text x="295" y="495" font-family="monospace" font-size="10" fill="#333">[4, 512] → project → [4, 512] → reshape → [4, 8, 64] → 8 heads of [4, 64]</text>
</svg>
