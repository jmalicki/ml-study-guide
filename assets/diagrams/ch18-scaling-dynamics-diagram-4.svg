<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Darken backgrounds in dark mode */
      rect[fill="#f5f5f5"] { fill: #1a1a1a; }
      rect[fill="white"] { fill: #2d2d2d; }
      rect[stroke="#ddd"] { stroke: #555555; }
      line[stroke="#ddd"] { stroke: #555555; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }
    }
  </style><rect width="800" height="400" fill="#f5f5f5" />

  
  <g transform="translate(60, 30)">
    <rect width="700" height="320" fill="white" stroke="#ddd" stroke-width="1" />

    
    <line x1="40" y1="280" x2="680" y2="280" stroke="#333" stroke-width="2" />
    <line x1="40" y1="20" x2="40" y2="280" stroke="#333" stroke-width="2" />

    
    <rect x="40" y="20" width="200" height="260" fill="#FFE0E0" opacity="0.2" />
    <text x="140" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" style="fill: #666 !important">Classical Regime</text>

    <rect x="440" y="20" width="240" height="260" fill="#E0FFE0" opacity="0.2" />
    <text x="560" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" style="fill: #666 !important">Modern Regime</text>


    <path d="M 50 100 Q 150 60, 340 30 Q 510 22, 670 20" fill="none" stroke="#4A90A4" stroke-width="3" />


    <path d="M 50 140 Q 150 80, 240 60 Q 300 70, 340 180 Q 380 100, 510 50 L 670 35" fill="none" stroke="#E57373" stroke-width="3" />


    <line x1="340" y1="20" x2="340" y2="280" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
    <text x="345" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" style="fill: #666 !important">Interpolation</text>
    <text x="345" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" style="fill: #666 !important">Threshold</text>

    
    <text x="360" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #333 !important">Model Complexity (Parameters)</text>
    <text x="10" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" style="fill: #333 !important" transform="rotate(-90, 10, 160)">Error</text>
    <text x="360" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" style="fill: #333 !important">Double Descent Phenomenon</text>


    <g transform="translate(500, 240)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#4A90A4" stroke-width="3" />
      <text x="40" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" style="fill: #333 !important">Train Error</text>

      <line x1="0" y1="20" x2="35" y2="20" stroke="#E57373" stroke-width="3" />
      <text x="40" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" style="fill: #333 !important">Test Error</text>
    </g>


    <g transform="translate(180, 120)">
      <path d="M 0 0 L 0 -30" stroke="#E57373" stroke-width="1.5" marker-start="url(#arrowup)" marker-end="url(#arrowdown)" />
      <text x="10" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" style="fill: #c62828 !important">1st</text>
      <text x="10" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" style="fill: #c62828 !important">Descent</text>
    </g>

    <g transform="translate(550, 100)">
      <path d="M 0 0 L 0 -40" stroke="#E57373" stroke-width="1.5" marker-start="url(#arrowup)" marker-end="url(#arrowdown)" />
      <text x="10" y="-20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" style="fill: #c62828 !important">2nd</text>
      <text x="10" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" style="fill: #c62828 !important">Descent</text>
    </g>


    <g transform="translate(340, 200)">
      <circle cx="0" cy="-20" r="4" fill="#E57373" />
      <text x="10" y="-15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" style="fill: #c62828 !important">Peak at</text>
      <text x="10" y="-5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" style="fill: #c62828 !important">threshold</text>
    </g>


    <text x="100" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" style="fill: #666 !important">Underfit</text>
    <text x="340" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" style="fill: #666 !important">N ≈ n</text>
    <text x="580" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" style="fill: #666 !important">Overparameterized</text>
  </g>

  
  <defs>
    <marker id="arrowdown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <polygon points="5 0, 0 8, 10 8" fill="#E57373" />
    </marker>
    <marker id="arrowup" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <polygon points="5 8, 0 0, 10 0" fill="#E57373" />
    </marker>
  </defs>
</svg>