<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #f5f5f5; stroke: #4A90A4; stroke-width: 2; }
    .harmful { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; }
    .safer { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; }
    .safe { fill: #d4edda; stroke: #28a745; stroke-width: 2; }
    .text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #333; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #666; }
    .arrow { stroke: #4A90A4; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .darrow { stroke: #4A90A4; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .plus { stroke: #dc3545; stroke-width: 2; fill: none; }
  
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        text { fill: #ffffff; }
        text[fill="#333"] { fill: #ffffff; }
        text[fill="#666"] { fill: #cccccc; }
        text[fill="#555"] { fill: #cccccc; }
        text[fill="white"],
        text[fill="#fff"] { fill: #ffffff; }

        .title { fill: #ffffff; }
        .subtitle { fill: #ffffff; }
        .label { fill: #ffffff; }
        .small-label { fill: #cccccc; }
        .axis-label { fill: #cccccc; }
        .small { fill: #cccccc; }
        .annotation { fill: #cccccc; }

        line[stroke="#333"] { stroke: #cccccc; }
        rect[stroke="#333"] { stroke: #cccccc; }
        rect[fill="white"] { fill: #1a1a1a; }
        rect[fill="#ffffff"] { fill: #1a1a1a; }

        .grid { stroke: #444444; }
        .axis { stroke: #cccccc; }
      }
    </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4A90A4" />
    </marker>
  </defs>

  <!-- Base model -->
  <rect x="210" y="20" width="180" height="40" rx="5" class="box"/>
  <text x="300" y="45" text-anchor="middle" class="text" font-weight="bold">Base model</text>

  <!-- Plus sign and arrow to harmful model -->
  <text x="300" y="85" text-anchor="middle" class="text" font-size="20" fill="#dc3545">+</text>
  <text x="340" y="75" class="label">Fine-tune on</text>
  <text x="340" y="90" class="label">harmful data</text>
  <path d="M 300 60 L 440 100" class="arrow" stroke="#dc3545"/>

  <!-- Harmful model -->
  <rect x="415" y="100" width="160" height="40" rx="5" class="harmful"/>
  <text x="495" y="125" text-anchor="middle" class="text" font-weight="bold">Harmful model</text>

  <!-- Task arithmetic operation -->
  <path d="M 495 140 L 495 160 L 300 160 L 300 180" class="arrow"/>
  <text x="300" y="175" text-anchor="middle" class="label">Task arithmetic with λ=-0.3</text>

  <!-- Safer model -->
  <rect x="180" y="180" width="240" height="50" rx="5" class="safer"/>
  <text x="300" y="202" text-anchor="middle" class="text" font-weight="bold">Safer model</text>
  <text x="300" y="220" text-anchor="middle" class="label">(reduced harmful outputs)</text>

  <!-- Validation -->
  <path d="M 300 230 L 300 260" class="darrow"/>
  <text x="300" y="255" text-anchor="middle" class="label">Validation on safety benchmarks</text>

  <!-- Adjustment loop -->
  <path d="M 300 260 L 300 290" class="darrow"/>
  <text x="300" y="285" text-anchor="middle" class="label">Adjust λ if needed</text>

  <!-- Feedback loop arrow -->
  <path d="M 180 205 Q 80 205 80 160 Q 80 100 150 100" class="arrow" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="85" y="155" class="label" font-size="10" font-style="italic">iterate</text>

  <!-- Final safe model -->
  <rect x="180" y="300" width="240" height="50" rx="5" class="safe"/>
  <text x="300" y="330" text-anchor="middle" class="text" font-weight="bold">Final safe model</text>
</svg>