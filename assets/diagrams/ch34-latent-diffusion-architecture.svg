<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }

    /* Dark mode */

    /* Background colors */
    .bg-white { fill: #fff; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-main { fill: #2d2d2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Override dark inline text colors */
      text[fill="#000"],
      text[fill="#000000"],
      text[fill="#333"],
      text[fill="#666"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for dark mode */
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
      rect[fill="#81C784"] { fill: #4a7c4e; }
      rect[fill="#E57373"] { fill: #8b3d3d; }
      rect[fill="#FFA726"] { fill: #8b5a1a; }
      .bg-white { fill: #2d2d2d; }
    }
  </style><text x="450" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    Latent Diffusion Model Architecture
  </text>


  <g id="input">
    <rect x="50" y="120" width="100" height="100" fill="#4A90A4" opacity="0.3" stroke="#4A90A4" stroke-width="2" />
    <text x="100" y="145" font-size="12" font-weight="bold" text-anchor="middle" >Input Image</text>
    <text x="100" y="165" font-size="10" text-anchor="middle" >512×512×3</text>
    <text x="100" y="180" font-size="9" text-anchor="middle" >(786,432 dims)</text>
  </g>


  <g id="encoder">
    <rect x="200" y="100" width="120" height="140" fill="#E57373" opacity="0.2" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="260" y="125" font-size="13" font-weight="bold" text-anchor="middle" >VAE Encoder</text>
    <text x="260" y="150" font-size="10" text-anchor="middle" >Compression</text>
    <line x1="220" y1="160" x2="300" y2="160" stroke="#E57373" stroke-width="1" />


    <rect x="215" y="170" width="90" height="15" fill="#E57373" opacity="0.4" rx="2" />
    <text x="260" y="180" font-size="8" text-anchor="middle" >Conv 128</text>

    <rect x="225" y="190" width="70" height="15" fill="#E57373" opacity="0.5" rx="2" />
    <text x="260" y="200" font-size="8" text-anchor="middle" >Conv 256</text>

    <rect x="235" y="210" width="50" height="15" fill="#E57373" opacity="0.6" rx="2" />
    <text x="260" y="220" font-size="8" text-anchor="middle" >Conv 512</text>
  </g>

  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  <path d="M 150 170 L 200 170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="175" y="165" font-size="9" text-anchor="middle" fill="#666">encode</text>

  <path d="M 320 170 L 370 170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="345" y="165" font-size="9" text-anchor="middle" fill="#666">8× smaller</text>


  <g id="latent">
    <rect x="370" y="80" width="180" height="180" fill="#4A90A4" opacity="0.15" stroke="#4A90A4" stroke-width="3" rx="5" />
    <text x="460" y="105" font-size="14" font-weight="bold" text-anchor="middle" >Latent Space</text>
    <text x="460" y="125" font-size="11" text-anchor="middle" >64×64×4</text>
    <text x="460" y="140" font-size="9" text-anchor="middle" >(16,384 dims)</text>


    <rect x="390" y="150" width="140" height="95" fill="#4A90A4" opacity="0.3" stroke="#4A90A4" stroke-width="2" rx="3" />
    <text x="460" y="170" font-size="12" font-weight="bold" text-anchor="middle" >U-Net Diffusion</text>


    <g id="denoise-steps">
      <circle cx="410" cy="195" r="6" class="bg-white" stroke="#4A90A4" stroke-width="1.5" />
      <circle cx="435" cy="195" r="6" fill="#ccc" stroke="#4A90A4" stroke-width="1.5" />
      <circle cx="460" cy="195" r="6" fill="#999" stroke="#4A90A4" stroke-width="1.5" />
      <circle cx="485" cy="195" r="6" fill="#666" stroke="#4A90A4" stroke-width="1.5" />
      <circle cx="510" cy="195" r="6" fill="#333" stroke="#4A90A4" stroke-width="1.5" />

      <text x="460" y="215" font-size="8" text-anchor="middle" >T → 0 steps</text>
    </g>


    <rect x="400" y="225" width="120" height="12" fill="#FFA726" opacity="0.5" rx="2" />
    <text x="460" y="233" font-size="8" text-anchor="middle" >+ Text Conditioning</text>
  </g>

  
  <path d="M 550 170 L 600 170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="575" y="165" font-size="9" text-anchor="middle" fill="#666">decode</text>


  <g id="decoder">
    <rect x="600" y="100" width="120" height="140" fill="#81C784" opacity="0.2" stroke="#81C784" stroke-width="2" rx="5" />
    <text x="660" y="125" font-size="13" font-weight="bold" text-anchor="middle" >VAE Decoder</text>
    <text x="660" y="150" font-size="10" text-anchor="middle" >Decompression</text>
    <line x1="620" y1="160" x2="700" y2="160" stroke="#81C784" stroke-width="1" />


    <rect x="625" y="170" width="50" height="15" fill="#81C784" opacity="0.6" rx="2" />
    <text x="660" y="180" font-size="8" text-anchor="middle" >ConvT 512</text>

    <rect x="615" y="190" width="70" height="15" fill="#81C784" opacity="0.5" rx="2" />
    <text x="660" y="200" font-size="8" text-anchor="middle" >ConvT 256</text>

    <rect x="605" y="210" width="90" height="15" fill="#81C784" opacity="0.4" rx="2" />
    <text x="660" y="220" font-size="8" text-anchor="middle" >ConvT 128</text>
  </g>

  
  <path d="M 720 170 L 770 170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="745" y="165" font-size="9" text-anchor="middle" fill="#666">8× larger</text>


  <g id="output">
    <rect x="770" y="120" width="100" height="100" fill="#81C784" opacity="0.3" stroke="#81C784" stroke-width="2" />
    <text x="820" y="145" font-size="12" font-weight="bold" text-anchor="middle" >Output Image</text>
    <text x="820" y="165" font-size="10" text-anchor="middle" >512×512×3</text>
    <text x="820" y="180" font-size="9" text-anchor="middle" >(786,432 dims)</text>
  </g>


  <g id="text-encoder">
    <rect x="370" y="300" width="180" height="70" fill="#FFA726" opacity="0.2" stroke="#FFA726" stroke-width="2" rx="5" />
    <text x="460" y="325" font-size="13" font-weight="bold" text-anchor="middle" >Text Encoder (CLIP)</text>
    <rect x="390" y="335" width="140" height="25" fill="#FFA726" opacity="0.3" rx="3" />
    <text x="460" y="350" font-size="10" text-anchor="middle" >"a cat on a mat"</text>


    <path d="M 460 300 L 460 260" stroke="#FFA726" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" />
  </g>

  
  <g id="benefits">
    <rect x="50" y="400" width="800" height="80" class="bg-main" stroke="#999" stroke-width="1" rx="5" />
    <text x="450" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Key Benefits</text>

    <text x="70" y="445" font-size="10" fill="#333">• <tspan font-weight="bold">48× compression:</tspan> 786k → 16k dimensions</text>
    <text x="70" y="462" font-size="10" fill="#333">• <tspan font-weight="bold">4-8× faster:</tspan> diffusion in compact space</text>

    <text x="450" y="445" font-size="10" fill="#333">• <tspan font-weight="bold">Same quality:</tspan> perceptual loss preserved</text>
    <text x="450" y="462" font-size="10" fill="#333">• <tspan font-weight="bold">Consumer GPUs:</tspan> trainable on 8-16GB VRAM</text>
  </g>
</svg>