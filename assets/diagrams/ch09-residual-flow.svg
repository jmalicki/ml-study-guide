<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><text x="400" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Residual Connection: Gradient Flow</text>

  
  <g id="without-residual">
    <text x="200" y="70" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Without Residual</text>

    
    <rect x="160" y="90" width="80" height="35" fill="#E8F4F8" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="200" y="108" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">∂L/∂x₁</text>
    <text x="200" y="120" font-size="10" text-anchor="middle" fill="#666">(gradient)</text>

    
    <line x1="200" y1="125" x2="200" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="160" y="145" width="80" height="40" fill="#FFE0B2" stroke="#FF9800" stroke-width="2" rx="5" />
    <text x="200" y="168" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Layer 1</text>

    
    <text x="280" y="168" font-size="11" text-anchor="start" fill="#E57373">∂x₂/∂x₁</text>

    <line x1="200" y1="185" x2="200" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="160" y="205" width="80" height="40" fill="#FFE0B2" stroke="#FF9800" stroke-width="2" rx="5" />
    <text x="200" y="228" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Layer 2</text>

    <text x="280" y="228" font-size="11" text-anchor="start" fill="#E57373">∂x₃/∂x₂</text>

    <line x1="200" y1="245" x2="200" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="160" y="265" width="80" height="40" fill="#FFE0B2" stroke="#FF9800" stroke-width="2" rx="5" />
    <text x="200" y="288" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Layer 3</text>

    <text x="280" y="288" font-size="11" text-anchor="start" fill="#E57373">∂x₄/∂x₃</text>

    <line x1="200" y1="305" x2="200" y2="325" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="160" y="325" width="80" height="35" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="200" y="343" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">∂L/∂x₄</text>
    <text x="200" y="355" font-size="10" text-anchor="middle" fill="#666">(very small!)</text>

    
    <rect x="120" y="380" width="160" height="60" fill="#f5f5f5" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="200" y="403" font-size="11" text-anchor="middle" fill="#333" font-family="serif">∂L/∂x₁ = ∂L/∂x₄ ×</text>
    <text x="200" y="418" font-size="11" text-anchor="middle" fill="#333" font-family="serif">∂x₄/∂x₃ × ∂x₃/∂x₂ × ∂x₂/∂x₁</text>
    <text x="200" y="432" font-size="10" text-anchor="middle" fill="#E57373">Product can vanish!</text>

    
    <text x="200" y="465" font-size="12" font-weight="bold" text-anchor="middle" fill="#E57373">⚠ Vanishing Gradient Problem</text>
  </g>

  
  <g id="with-residual">
    <text x="600" y="70" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">With Residual</text>

    
    <rect x="560" y="90" width="80" height="35" fill="#E8F4F8" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="600" y="108" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">∂L/∂x₁</text>
    <text x="600" y="120" font-size="10" text-anchor="middle" fill="#666">(gradient)</text>

    
    <line x1="600" y1="125" x2="520" y2="125" stroke="#81C784" stroke-width="4" />
    <line x1="520" y1="125" x2="520" y2="345" stroke="#81C784" stroke-width="4" />

    
    <text x="490" y="180" font-size="10" text-anchor="end" fill="#81C784" font-weight="bold">Identity</text>
    <text x="490" y="195" font-size="10" text-anchor="end" fill="#81C784" font-weight="bold">path (I)</text>

    
    <line x1="600" y1="125" x2="600" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="560" y="145" width="80" height="40" fill="#FFE0B2" stroke="#FF9800" stroke-width="2" rx="5" />
    <text x="600" y="168" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Layer 1</text>

    
    <circle cx="600" cy="215" r="15" fill="#FFF" stroke="#333" stroke-width="2" />
    <text x="600" y="220" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">+</text>

    <line x1="520" y1="200" x2="585" y2="215" stroke="#81C784" stroke-width="4" marker-end="url(#arrowhead-green)" />
    <line x1="600" y1="185" x2="600" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <line x1="600" y1="230" x2="600" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="560" y="250" width="80" height="40" fill="#FFE0B2" stroke="#FF9800" stroke-width="2" rx="5" />
    <text x="600" y="273" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Layer 2</text>

    
    <circle cx="600" cy="315" r="15" fill="#FFF" stroke="#333" stroke-width="2" />
    <text x="600" y="320" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">+</text>

    <line x1="520" y1="285" x2="585" y2="315" stroke="#81C784" stroke-width="4" marker-end="url(#arrowhead-green)" />
    <line x1="600" y1="290" x2="600" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <line x1="600" y1="330" x2="600" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead-black)" />

    
    <rect x="560" y="350" width="80" height="35" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="5" />
    <text x="600" y="368" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">∂L/∂x₄</text>
    <text x="600" y="380" font-size="10" text-anchor="middle" fill="#666">(preserved!)</text>

    
    <rect x="520" y="400" width="160" height="60" fill="#f5f5f5" stroke="#81C784" stroke-width="2" rx="5" />
    <text x="600" y="418" font-size="11" text-anchor="middle" fill="#333" font-family="serif">∂x</text>
    <text x="605" y="422" font-size="8" text-anchor="start" fill="#333" font-family="serif">i+1</text>
    <text x="620" y="418" font-size="11" text-anchor="start" fill="#333" font-family="serif">/∂x</text>
    <text x="640" y="422" font-size="8" text-anchor="start" fill="#333" font-family="serif">i</text>
    <text x="650" y="418" font-size="11" text-anchor="start" fill="#333" font-family="serif">= I + ∂F</text>
    <text x="690" y="422" font-size="8" text-anchor="start" fill="#333" font-family="serif">i</text>
    <text x="696" y="418" font-size="11" text-anchor="start" fill="#333" font-family="serif">/∂x</text>
    <text x="716" y="422" font-size="8" text-anchor="start" fill="#333" font-family="serif">i</text>
    <text x="600" y="434" font-size="10" text-anchor="middle" fill="#333" font-family="serif">
      <tspan fill="#81C784" font-weight="bold">I</tspan> ensures gradient flow
    </text>
    <text x="600" y="451" font-size="10" text-anchor="middle" fill="#81C784">Always at least one path!</text>

    
    <text x="600" y="480" font-size="12" font-weight="bold" text-anchor="middle" fill="#81C784">✓ Stable Gradient Flow</text>
  </g>

  
  <g id="comparison">
    <rect x="310" y="480" width="180" height="15" fill="white" stroke="#999" stroke-width="1" rx="3" />
    <circle cx="325" cy="487" r="4" fill="#E57373" />
    <text x="335" y="492" font-size="10" fill="#333">Without: gradients shrink</text>
  </g>

  
  <defs>
    <marker id="arrowhead-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#81C784" />
    </marker>
  </defs>
</svg>