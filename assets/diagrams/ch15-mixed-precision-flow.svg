<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style><rect width="650" height="500" fill="white" />

  
  <text x="325" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">
    Mixed Precision Training Data Flow
  </text>

  
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A90A4" text-anchor="middle">
    FP16/BF16
  </text>
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E57373" text-anchor="middle">
    FP32
  </text>

  
  <g id="input">
    <rect x="50" y="80" width="200" height="50" fill="#E3F2FD" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="150" y="102" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Input Data
    </text>
    <text x="150" y="120" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      FP16/BF16
    </text>
  </g>

  
  <path d="M 150,135 L 150,155" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  
  <g id="forward">
    <rect x="50" y="160" width="200" height="60" fill="#E3F2FD" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="150" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Forward Pass
    </text>
    <text x="150" y="200" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      Matrix multiplications,
    </text>
    <text x="150" y="214" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      activations in FP16/BF16
    </text>
  </g>

  
  <path d="M 150,225 L 150,245" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  
  <g id="loss">
    <rect x="50" y="250" width="200" height="50" fill="#E3F2FD" stroke="#4A90A4" stroke-width="2" rx="5" />
    <text x="150" y="272" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Loss Computation
    </text>
    <text x="150" y="290" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      FP16/BF16
    </text>
  </g>

  
  <path d="M 250,275 L 400,275" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-orange)" />
  <text x="325" y="270" font-family="Arial, sans-serif" font-size="10" fill="#FF9800" text-anchor="middle">
    FP16 only
  </text>

  
  <g id="scaling">
    <rect x="400" y="250" width="200" height="50" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,3" rx="5" />
    <text x="500" y="272" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Loss Scaling (FP16 only)
    </text>
    <text x="500" y="290" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      loss × scale (e.g., 1024)
    </text>
  </g>

  
  <path d="M 150,305 L 150,325" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  
  <g id="backward">
    <rect x="50" y="330" width="200" height="60" fill="#FFEBEE" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="150" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Backward Pass
    </text>
    <text x="150" y="370" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      Gradients computed
    </text>
    <text x="150" y="384" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      in FP16/BF16
    </text>
  </g>

  
  <path d="M 250,360 L 400,360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  
  <g id="convert">
    <rect x="400" y="330" width="200" height="60" fill="#FFCDD2" stroke="#E57373" stroke-width="2" rx="5" />
    <text x="500" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Convert to FP32
    </text>
    <text x="500" y="370" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      Unscale gradients (FP16)
    </text>
    <text x="500" y="384" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      Cast to FP32
    </text>
  </g>

  
  <path d="M 500,395 L 500,415" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  
  <g id="optimizer">
    <rect x="400" y="420" width="200" height="60" fill="#C8E6C9" stroke="#81C784" stroke-width="2" rx="5" />
    <text x="500" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
      Optimizer Update
    </text>
    <text x="500" y="460" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      Master weights in FP32
    </text>
    <text x="500" y="474" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
      Adam states in FP32
    </text>
  </g>

  
  <path d="M 400,450 L 250,450 L 250,195 L 250,195" stroke="#81C784" stroke-width="2" marker-end="url(#arrowhead-green)" />
  <text x="260" y="320" font-family="Arial, sans-serif" font-size="10" fill="#81C784">
    Copy FP32 → FP16/BF16
  </text>

  
  <g id="info1">
    <rect x="20" y="100" width="20" height="20" fill="#4A90A4" rx="3" />
    <text x="45" y="115" font-family="Arial, sans-serif" font-size="10" fill="#666">
      Fast computation, low memory
    </text>
  </g>

  <g id="info2">
    <rect x="370" y="440" width="20" height="20" fill="#E57373" rx="3" />
    <text x="345" y="455" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="end">
      Precise updates
    </text>
  </g>

  
  <rect x="20" y="455" width="340" height="35" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="3" />
  <text x="190" y="473" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">
    Benefits: 2-3× faster, ~40% less memory
  </text>
  <text x="190" y="486" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">
    BF16 preferred (no scaling needed)
  </text>

  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#81C784" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF9800" />
    </marker>
  </defs>
</svg>