<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Adaptive backgrounds */
    .bg-main { fill: #f5f5f5; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Adaptive backgrounds for dark mode */
      .bg-main { fill: #2d2d2d; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for dark mode */
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
      rect[fill="#81C784"] { fill: #4a7c4e; }
      rect[fill="#E57373"] { fill: #8b3d3d; }
    }
  </style><text x="400" y="25" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Forward Diffusion Process</text>
  <text x="400" y="45" font-size="12" fill="#666" text-anchor="middle">x_t = √(ᾱ_t) x_0 + √(1-ᾱ_t) ε</text>

  
  <g id="timesteps">
    
    <g transform="translate(50, 80)">
      <rect x="0" y="0" width="80" height="80" fill="#4A90A4" rx="4" />
      <rect x="10" y="10" width="20" height="20" fill="#81C784" rx="2" />
      <rect x="35" y="35" width="35" height="35" fill="#E57373" rx="2" />
      <text x="40" y="105" font-size="12" fill="#333" text-anchor="middle">t = 0</text>
      <text x="40" y="120" font-size="10" fill="#666" text-anchor="middle">x₀ (clean)</text>
      <text x="40" y="135" font-size="9" fill="#666" text-anchor="middle">ᾱ₀ ≈ 1.0</text>
    </g>

    
    <g transform="translate(145, 120)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#333" stroke-width="2" />
      <polygon points="35,0 28,-4 28,4" fill="#333" />
      <text x="17" y="-8" font-size="9" fill="#666" text-anchor="middle">+noise</text>
    </g>

    
    <g transform="translate(195, 80)">
      <rect x="0" y="0" width="80" height="80" fill="#4A90A4" opacity="0.85" rx="4" />
      <rect x="10" y="10" width="20" height="20" fill="#81C784" opacity="0.7" rx="2" />
      <rect x="35" y="35" width="35" height="35" fill="#E57373" opacity="0.7" rx="2" />
      <circle cx="20" cy="50" r="3" fill="#666" opacity="0.3" />
      <circle cx="60" cy="25" r="3" fill="#666" opacity="0.3" />
      <text x="40" y="105" font-size="12" fill="#333" text-anchor="middle">t = T/4</text>
      <text x="40" y="120" font-size="10" fill="#666" text-anchor="middle">x_{T/4}</text>
      <text x="40" y="135" font-size="9" fill="#666" text-anchor="middle">ᾱ_{T/4} ≈ 0.75</text>
    </g>

    
    <g transform="translate(290, 120)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#333" stroke-width="2" />
      <polygon points="35,0 28,-4 28,4" fill="#333" />
      <text x="17" y="-8" font-size="9" fill="#666" text-anchor="middle">+noise</text>
    </g>

    
    <g transform="translate(340, 80)">
      <rect x="0" y="0" width="80" height="80" fill="#4A90A4" opacity="0.6" rx="4" />
      <rect x="10" y="10" width="20" height="20" fill="#81C784" opacity="0.4" rx="2" />
      <rect x="35" y="35" width="35" height="35" fill="#E57373" opacity="0.4" rx="2" />
      <circle cx="15" cy="30" r="3" fill="#666" opacity="0.5" />
      <circle cx="45" cy="60" r="3" fill="#666" opacity="0.5" />
      <circle cx="60" cy="20" r="3" fill="#666" opacity="0.5" />
      <circle cx="25" cy="70" r="3" fill="#666" opacity="0.5" />
      <text x="40" y="105" font-size="12" fill="#333" text-anchor="middle">t = T/2</text>
      <text x="40" y="120" font-size="10" fill="#666" text-anchor="middle">x_{T/2}</text>
      <text x="40" y="135" font-size="9" fill="#666" text-anchor="middle">ᾱ_{T/2} ≈ 0.5</text>
    </g>

    
    <g transform="translate(435, 120)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#333" stroke-width="2" />
      <polygon points="35,0 28,-4 28,4" fill="#333" />
      <text x="17" y="-8" font-size="9" fill="#666" text-anchor="middle">+noise</text>
    </g>

    
    <g transform="translate(485, 80)">
      <rect x="0" y="0" width="80" height="80" fill="#4A90A4" opacity="0.3" rx="4" />
      <rect x="10" y="10" width="20" height="20" fill="#81C784" opacity="0.15" rx="2" />
      <rect x="35" y="35" width="35" height="35" fill="#E57373" opacity="0.15" rx="2" />
      <circle cx="20" cy="25" r="3" fill="#666" opacity="0.6" />
      <circle cx="55" cy="50" r="3" fill="#666" opacity="0.6" />
      <circle cx="30" cy="65" r="3" fill="#666" opacity="0.6" />
      <circle cx="65" cy="15" r="3" fill="#666" opacity="0.6" />
      <circle cx="15" cy="70" r="3" fill="#666" opacity="0.6" />
      <circle cx="45" cy="35" r="3" fill="#666" opacity="0.6" />
      <text x="40" y="105" font-size="12" fill="#333" text-anchor="middle">t = 3T/4</text>
      <text x="40" y="120" font-size="10" fill="#666" text-anchor="middle">x_{3T/4}</text>
      <text x="40" y="135" font-size="9" fill="#666" text-anchor="middle">ᾱ_{3T/4} ≈ 0.25</text>
    </g>

    
    <g transform="translate(580, 120)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#333" stroke-width="2" />
      <polygon points="35,0 28,-4 28,4" fill="#333" />
      <text x="17" y="-8" font-size="9" fill="#666" text-anchor="middle">+noise</text>
    </g>


    <g transform="translate(630, 80)">
      <rect x="0" y="0" width="80" height="80" fill="#999" opacity="0.2" rx="4" />
      <circle cx="15" cy="20" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="40" cy="35" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="65" cy="25" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="25" cy="55" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="55" cy="65" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="20" cy="70" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="70" cy="50" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="45" cy="15" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="35" cy="75" r="2.5" fill="#666" opacity="0.7" />
      <circle cx="60" cy="40" r="2.5" fill="#666" opacity="0.7" />
      <text x="40" y="105" font-size="12" fill="#000" text-anchor="middle">t = T</text>
      <text x="40" y="120" font-size="10" fill="#000" text-anchor="middle">x_T (noise)</text>
      <text x="40" y="135" font-size="9" fill="#000" text-anchor="middle">ᾱ_T ≈ 0.0</text>
    </g>
  </g>


  <g transform="translate(50, 230)">
    <text x="0" y="0" font-size="11" font-weight="bold" style="fill: #000 !important;">Key Concept:</text>
    <text x="0" y="18" font-size="10" style="fill: #000 !important;">As t increases, signal √(ᾱ_t) decreases while noise √(1-ᾱ_t) increases</text>
    <text x="0" y="35" font-size="10" style="fill: #000 !important;">Information from x₀ is gradually destroyed until only Gaussian noise remains</text>
  </g>
</svg>