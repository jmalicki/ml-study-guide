    <rect x="170" y="392" width="287" height="20" fill="#4A90A4" opacity="0.8" />
    <text x="464" y="407" font-family="Arial, sans-serif" font-size="12" fill="#333">55.0%</text>
  </g>

  
  <g font-family="Arial, sans-serif" font-size="14">
