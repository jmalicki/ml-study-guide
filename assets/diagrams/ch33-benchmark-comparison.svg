<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .axis-text { fill: #000000; }
    .label-text { fill: #666666; }
    line[stroke="#333"] { stroke: #333333; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .axis-text { fill: #ffffff; }
      .label-text { fill: #cccccc; }
      line[stroke="#333"] { stroke: #cccccc; }

      /* Keep white text white in dark mode (for colored backgrounds) */
      text[fill="#fff"],
      text[fill="#ffffff"],
      text[fill="white"] {
        fill: #ffffff;
      }

      /* Keep colored text readable in dark mode */
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      /* Darken colored backgrounds for white text contrast */
      rect[fill="#9575CD"] { fill: #5c4a7a; }
      rect[fill="#4A90A4"] { fill: #2d5f6f; }
    }
  </style><text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
    LLM Benchmark Performance Comparison
  </text>

  
  <g font-family="Arial, sans-serif" font-size="14" fill="#333">
    <text x="150" y="85" text-anchor="end">MMLU</text>
    <text x="150" y="145" text-anchor="end">HellaSwag</text>
    <text x="150" y="205" text-anchor="end">GSM8K</text>
    <text x="150" y="265" text-anchor="end">HumanEval</text>
    <text x="150" y="325" text-anchor="end">GPQA</text>
    <text x="150" y="385" text-anchor="end">TruthfulQA</text>
  </g>

  
  <g font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">
    <text x="170" y="420">0%</text>
    <text x="285" y="420">20%</text>
    <text x="400" y="420">40%</text>
    <text x="515" y="420">60%</text>
    <text x="630" y="420">80%</text>
    <text x="745" y="420">100%</text>
  </g>

  
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="170" y1="60" x2="170" y2="400" />
    <line x1="285" y1="60" x2="285" y2="400" />
    <line x1="400" y1="60" x2="400" y2="400" />
    <line x1="515" y1="60" x2="515" y2="400" />
    <line x1="630" y1="60" x2="630" y2="400" />
    <line x1="745" y1="60" x2="745" y2="400" />
  </g>

  
  <g>
