<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <!-- Background -->
  <rect width="750" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Common Learning Rate Schedules</text>

  <!-- Axes -->
  <g transform="translate(100, 300)">
    <line x1="0" y1="0" x2="550" y2="0" stroke="#374151" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-220" stroke="#374151" stroke-width="2"/>
    <text x="560" y="5" font-family="sans-serif" font-size="11" fill="#374151">step</text>
    <text x="-10" y="-225" font-family="sans-serif" font-size="11" fill="#374151">η</text>

    <!-- Warmup phase marker -->
    <line x1="50" y1="5" x2="50" y2="-220" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="25" y="20" font-family="sans-serif" font-size="9" fill="#6b7280">warmup</text>
  </g>

  <!-- Schedule 1: Cosine -->
  <g transform="translate(100, 300)">
    <path d="M 0 -20 L 50 -180 Q 150 -180 300 -100 Q 450 -20 500 -10"
          fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="510" y="-10" font-family="sans-serif" font-size="10" fill="#2563eb">Cosine</text>
  </g>

  <!-- Schedule 2: WSD (Warmup-Stable-Decay) -->
  <g transform="translate(100, 300)">
    <path d="M 0 -20 L 50 -160 L 350 -160 Q 400 -160 450 -80 Q 480 -30 500 -20"
          fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="510" y="-25" font-family="sans-serif" font-size="10" fill="#16a34a">WSD</text>
  </g>

  <!-- Schedule 3: Step decay -->
  <g transform="translate(100, 300)">
    <path d="M 0 -20 L 50 -140 L 180 -140 L 180 -100 L 320 -100 L 320 -60 L 450 -60 L 450 -30 L 500 -30"
          fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="510" y="-35" font-family="sans-serif" font-size="10" fill="#f59e0b">Step</text>
  </g>

  <!-- Legend -->
  <g transform="translate(150, 350)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#2563eb" stroke-width="2.5"/>
    <text x="40" y="4" font-family="sans-serif" font-size="10" fill="#374151">Cosine: η·(1+cos(πt/T))/2</text>

    <line x1="200" y1="0" x2="230" y2="0" stroke="#16a34a" stroke-width="2.5"/>
    <text x="240" y="4" font-family="sans-serif" font-size="10" fill="#374151">WSD: Warmup → Stable → Decay</text>

    <line x1="420" y1="0" x2="450" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <text x="460" y="4" font-family="sans-serif" font-size="10" fill="#374151">Step: Divide by 10 at milestones</text>
  </g>

  <!-- Annotation: Modern default -->
  <g transform="translate(250, 130)">
    <rect x="-80" y="-15" width="160" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">WSD is modern default</text>
  </g>
</svg>