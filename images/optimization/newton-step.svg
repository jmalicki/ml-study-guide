<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <marker id="step-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="gd-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Newton's Method: Jump to Quadratic Minimum</text>

  <!-- Loss curve (1D visualization) -->
  <g transform="translate(350, 220)">
    <!-- Axes -->
    <line x1="-280" y1="100" x2="280" y2="100" stroke="#9ca3af" stroke-width="1"/>
    <line x1="-250" y1="130" x2="-250" y2="-120" stroke="#9ca3af" stroke-width="1"/>
    <text x="285" y="105" font-family="sans-serif" font-size="11" fill="#6b7280">θ</text>
    <text x="-245" y="-125" font-family="sans-serif" font-size="11" fill="#6b7280">L(θ)</text>

    <!-- Actual loss curve -->
    <path d="M -230 -80 Q -150 80 -50 -20 Q 50 -100 150 20 Q 200 80 230 60"
          fill="none" stroke="#374151" stroke-width="2"/>
    <text x="180" y="80" font-family="sans-serif" font-size="10" fill="#374151">L(θ)</text>

    <!-- Current point -->
    <circle cx="-100" cy="30" r="6" fill="#2563eb"/>
    <text x="-110" y="55" font-family="sans-serif" font-size="10" fill="#2563eb">θ_t</text>

    <!-- Quadratic approximation (parabola tangent at current point) -->
    <path d="M -200 120 Q -100 -60 0 120"
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="10" y="100" font-family="sans-serif" font-size="10" fill="#f59e0b">quadratic approx</text>

    <!-- GD step (small, in gradient direction) -->
    <line x1="-100" y1="30" x2="-60" y2="10" stroke="#dc2626" stroke-width="2" marker-end="url(#gd-arrow)"/>
    <text x="-45" y="5" font-family="sans-serif" font-size="9" fill="#dc2626">GD step</text>

    <!-- Newton step (jumps to minimum of quadratic) -->
    <line x1="-100" y1="30" x2="-100" y2="75" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="-100" y1="75" x2="-100" y2="100" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Minimum of quadratic -->
    <circle cx="-100" cy="-60" r="5" fill="#f59e0b" opacity="0.6"/>

    <!-- Newton step arrow -->
    <path d="M -100 30 Q -100 -20 -100 -55" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#step-arrow)"/>
    <text x="-85" y="-25" font-family="sans-serif" font-size="10" fill="#16a34a">Newton step</text>
    <text x="-85" y="-10" font-family="sans-serif" font-size="9" fill="#16a34a">= -H⁻¹∇L</text>
  </g>

  <!-- Formula box -->
  <g transform="translate(350, 340)">
    <rect x="-250" y="-25" width="500" height="50" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="0" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">
      Newton's method: θ_{t+1} = θ_t - H⁻¹∇L
    </text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      Jumps directly to the minimum of the local quadratic approximation
    </text>
  </g>
</svg>