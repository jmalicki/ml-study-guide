<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <marker id="path-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="path-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Momentum Helps Escape Saddle Points</text>

  <!-- Left: GD gets stuck -->
  <g transform="translate(175, 180)">
    <text x="0" y="-120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Gradient Descent</text>

    <!-- Saddle point contours (hyperbolic) -->
    <!-- Positive curvature direction -->
    <path d="M -100 -80 Q 0 -30 100 -80" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -100 -60 Q 0 -20 100 -60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <path d="M -100 -40 Q 0 -10 100 -40" fill="none" stroke="#6b7280" stroke-width="1"/>
    <!-- Negative curvature direction -->
    <path d="M -100 80 Q 0 30 100 80" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -100 60 Q 0 20 100 60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <path d="M -100 40 Q 0 10 100 40" fill="none" stroke="#6b7280" stroke-width="1"/>

    <!-- Saddle point -->
    <circle cx="0" cy="0" r="6" fill="#f97316"/>
    <text x="15" y="5" font-family="sans-serif" font-size="10" fill="#f97316">saddle</text>

    <!-- GD path getting stuck -->
    <path d="M -80 -60 L -50 -35 L -25 -18 L -10 -8 L -3 -2"
          fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#path-arrow)"/>
    <circle cx="-80" cy="-60" r="5" fill="#dc2626"/>

    <!-- Arrows showing tiny gradient near saddle -->
    <line x1="-3" y1="-2" x2="0" y2="0" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,1"/>

    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">Gets stuck: ∇L ≈ 0 near saddle</text>
    <text x="0" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">No momentum to carry through</text>
  </g>

  <!-- Right: Momentum escapes -->
  <g transform="translate(525, 180)">
    <text x="0" y="-120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">With Momentum</text>

    <!-- Same saddle point contours -->
    <path d="M -100 -80 Q 0 -30 100 -80" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -100 -60 Q 0 -20 100 -60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <path d="M -100 -40 Q 0 -10 100 -40" fill="none" stroke="#6b7280" stroke-width="1"/>
    <path d="M -100 80 Q 0 30 100 80" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -100 60 Q 0 20 100 60" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <path d="M -100 40 Q 0 10 100 40" fill="none" stroke="#6b7280" stroke-width="1"/>

    <!-- Saddle point -->
    <circle cx="0" cy="0" r="6" fill="#f97316"/>

    <!-- Momentum path sailing through -->
    <path d="M -80 -60 Q -40 -30 0 0 Q 40 35 80 55"
          fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="-80" cy="-60" r="5" fill="#2563eb"/>
    <circle cx="80" cy="55" r="5" fill="#2563eb"/>

    <!-- Velocity arrow showing accumulated momentum -->
    <line x1="-20" y1="-15" x2="30" y2="15" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="45" y="10" font-family="sans-serif" font-size="9" fill="#dc2626">velocity</text>

    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">Escapes: momentum carries through</text>
    <text x="0" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">Even when ∇L ≈ 0</text>
  </g>

  <!-- Bottom explanation -->
  <text x="350" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
    Momentum = accumulated velocity. Near saddle, v ≠ 0 even when ∇L → 0
  </text>
</svg>