<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <marker id="manifold-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Statistical Manifold: Parameters Define Distributions</text>

  <!-- Curved manifold surface -->
  <g transform="translate(350, 200)">
    <!-- Manifold surface (curved mesh) -->
    <path d="M -250 80 Q -150 40 0 60 Q 150 80 250 40"
          fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -250 50 Q -150 10 0 30 Q 150 50 250 10"
          fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -250 20 Q -150 -20 0 0 Q 150 20 250 -20"
          fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -250 -10 Q -150 -50 0 -30 Q 150 -10 250 -50"
          fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -250 -40 Q -150 -80 0 -60 Q 150 -40 250 -80"
          fill="none" stroke="#d1d5db" stroke-width="1"/>

    <!-- Vertical lines on manifold -->
    <path d="M -200 90 Q -200 0 -200 -50" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M -100 70 Q -100 -10 -100 -70" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M 0 75 Q 0 -5 0 -45" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M 100 70 Q 100 -10 100 -70" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <path d="M 200 55 Q 200 -20 200 -65" fill="none" stroke="#d1d5db" stroke-width="1"/>

    <!-- Point on manifold (current θ) -->
    <circle cx="-80" cy="10" r="8" fill="#dc2626"/>
    <text x="-95" y="35" font-family="sans-serif" font-size="11" fill="#dc2626">θ → p(x|θ)</text>

    <!-- Another point -->
    <circle cx="80" cy="-5" r="8" fill="#2563eb"/>
    <text x="65" y="-25" font-family="sans-serif" font-size="11" fill="#2563eb">θ' → p(x|θ')</text>

    <!-- Geodesic (curved path on manifold) -->
    <path d="M -75 10 Q -20 -20 75 -5"
          fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">geodesic</text>

    <!-- Euclidean line (off manifold) -->
    <line x1="-75" y1="10" x2="75" y2="-5" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="55" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f97316">Euclidean (wrong!)</text>

    <!-- Tangent vectors at θ -->
    <line x1="-80" y1="10" x2="-30" y2="-15" stroke="#2563eb" stroke-width="2" marker-end="url(#manifold-arrow)"/>
    <text x="-25" y="-20" font-family="sans-serif" font-size="9" fill="#2563eb">∇L</text>

    <line x1="-80" y1="10" x2="-50" y2="-30" stroke="#16a34a" stroke-width="2.5" marker-end="url(#manifold-arrow)"/>
    <text x="-35" y="-35" font-family="sans-serif" font-size="9" fill="#16a34a">F⁻¹∇L</text>
  </g>

  <!-- Distribution visualizations -->
  <g transform="translate(100, 320)">
    <!-- Gaussian at θ -->
    <path d="M 0 40 Q 15 10 30 0 Q 45 10 60 40" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="30" y="55" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">p(x|θ)</text>
  </g>

  <g transform="translate(540, 320)">
    <!-- Gaussian at θ' -->
    <path d="M 0 40 Q 20 5 40 0 Q 60 5 80 40" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="55" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">p(x|θ')</text>
  </g>

  <!-- KL divergence label -->
  <g transform="translate(350, 365)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      Distance between distributions: D_KL(p_θ || p_θ') ≠ ||θ - θ'||²
    </text>
  </g>
</svg>