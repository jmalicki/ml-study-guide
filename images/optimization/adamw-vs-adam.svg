<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <!-- Background -->
  <rect width="700" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">AdamW: Decoupled Weight Decay</text>

  <!-- Left: L2 Regularization in Adam -->
  <g transform="translate(175, 180)">
    <rect x="-140" y="-100" width="280" height="200" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <text x="0" y="-75" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Adam + L2 Regularization</text>
    <text x="0" y="-55" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#991b1b">(NOT recommended)</text>

    <!-- Loss function -->
    <text x="0" y="-25" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151">L_reg = L + λ||θ||²</text>

    <!-- Gradient -->
    <text x="0" y="0" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151">∇L_reg = ∇L + 2λθ</text>

    <!-- Problem illustration -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626" font-weight="bold">Problem:</text>
      <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Weight decay term 2λθ gets scaled</text>
      <text x="0" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">by 1/√v like the gradient</text>

      <!-- Formula showing scaling -->
      <text x="0" y="60" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc2626">
        update ∝ (∇L + 2λθ) / √v
      </text>
      <text x="0" y="78" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#991b1b">
        Effective λ varies per-parameter!
      </text>
    </g>
  </g>

  <!-- Right: Decoupled Weight Decay (AdamW) -->
  <g transform="translate(525, 180)">
    <rect x="-140" y="-100" width="280" height="200" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="0" y="-75" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">AdamW: Decoupled</text>
    <text x="0" y="-55" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#166534">(Recommended)</text>

    <!-- Update rule -->
    <text x="0" y="-20" text-anchor="middle" font-family="monospace" font-size="11" fill="#374151">θ = θ - η·(m̂/√v̂ + λθ)</text>

    <!-- Solution illustration -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a" font-weight="bold">Solution:</text>
      <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Apply weight decay separately,</text>
      <text x="0" y="33" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">NOT through the gradient</text>

      <!-- Formula showing separation -->
      <text x="0" y="60" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">
        update = Adam_step + λθ
      </text>
      <text x="0" y="78" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#166534">
        Consistent regularization strength!
      </text>
    </g>
  </g>

  <!-- Bottom explanation -->
  <g transform="translate(350, 330)">
    <rect x="-280" y="-25" width="560" height="55" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="0" y="-5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151" font-weight="bold">
      Why it matters:
    </text>
    <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">
      In Adam + L2, parameters with large gradients (large v) get less regularization.
    </text>
    <text x="0" y="27" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">
      AdamW ensures all parameters get the same effective weight decay regardless of gradient history.
    </text>
  </g>
</svg>