<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380">
  <!-- Background -->
  <rect width="750" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Two Geometric Frameworks: Fisher vs Operator Norm</text>

  <!-- Left: Fisher / Natural Gradient -->
  <g transform="translate(190, 200)">
    <rect x="-140" y="-130" width="280" height="260" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

    <text x="0" y="-105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Natural Gradient</text>
    <text x="0" y="-85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">(Fisher Geometry)</text>

    <!-- Content -->
    <text x="-120" y="-55" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">View:</text>
    <text x="-120" y="-40" font-family="sans-serif" font-size="10" fill="#374151">Parameters → Distributions</text>

    <text x="-120" y="-15" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Metric:</text>
    <text x="-120" y="0" font-family="sans-serif" font-size="10" fill="#374151">KL divergence / Fisher info</text>

    <text x="-120" y="25" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Preconditioner:</text>
    <text x="-120" y="40" font-family="monospace" font-size="10" fill="#1e40af">P = F⁻¹ (Fisher inverse)</text>

    <text x="-120" y="65" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Practical forms:</text>
    <text x="-120" y="80" font-family="sans-serif" font-size="10" fill="#374151">K-FAC, Shampoo</text>

    <text x="-120" y="105" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Memory:</text>
    <text x="-120" y="120" font-family="sans-serif" font-size="10" fill="#374151">O(m² + k²) per layer</text>
  </g>

  <!-- Right: Operator Norm / Muon -->
  <g transform="translate(560, 200)">
    <rect x="-140" y="-130" width="280" height="260" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>

    <text x="0" y="-105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f766e">Muon</text>
    <text x="0" y="-85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#14b8a6">(Operator Geometry)</text>

    <!-- Content -->
    <text x="-120" y="-55" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">View:</text>
    <text x="-120" y="-40" font-family="sans-serif" font-size="10" fill="#374151">Weight matrices → Linear maps</text>

    <text x="-120" y="-15" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Metric:</text>
    <text x="-120" y="0" font-family="sans-serif" font-size="10" fill="#374151">Operator (spectral) norm</text>

    <text x="-120" y="25" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Preconditioner:</text>
    <text x="-120" y="40" font-family="monospace" font-size="10" fill="#0f766e">P = Orthogonalize (UV^T)</text>

    <text x="-120" y="65" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Algorithm:</text>
    <text x="-120" y="80" font-family="sans-serif" font-size="10" fill="#374151">Newton-Schulz iteration</text>

    <text x="-120" y="105" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Memory:</text>
    <text x="-120" y="120" font-family="sans-serif" font-size="10" fill="#374151">O(1) beyond momentum</text>
  </g>

  <!-- Key insight at bottom -->
  <g transform="translate(375, 350)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      Different theoretical foundations, same goal: Find better update directions than vanilla gradient
    </text>
  </g>
</svg>