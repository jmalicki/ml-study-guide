<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <marker id="param-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Adaptive Learning Rates: Per-Parameter Scaling</text>

  <!-- Left: Fixed learning rate problem -->
  <g transform="translate(175, 200)">
    <text x="0" y="-140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Fixed Learning Rate</text>

    <!-- Coordinate axes -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#9ca3af" stroke-width="1"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#9ca3af" stroke-width="1"/>
    <text x="135" y="5" font-family="sans-serif" font-size="10" fill="#6b7280">θ₁</text>
    <text x="5" y="-105" font-family="sans-serif" font-size="10" fill="#6b7280">θ₂</text>

    <!-- Gradient arrows (different magnitudes) -->
    <!-- θ₁: large gradient, frequent updates -->
    <line x1="-100" y1="0" x2="-40" y2="0" stroke="#dc2626" stroke-width="3" marker-end="url(#param-arrow)"/>
    <line x1="-35" y1="0" x2="25" y2="0" stroke="#dc2626" stroke-width="3" marker-end="url(#param-arrow)"/>
    <line x1="30" y1="0" x2="70" y2="0" stroke="#dc2626" stroke-width="3" marker-end="url(#param-arrow)"/>

    <!-- θ₂: small gradient, infrequent updates -->
    <line x1="0" y1="80" x2="0" y2="65" stroke="#2563eb" stroke-width="1.5" marker-end="url(#param-arrow)"/>
    <line x1="0" y1="60" x2="0" y2="50" stroke="#2563eb" stroke-width="1.5" marker-end="url(#param-arrow)"/>

    <!-- Annotations -->
    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">θ₁: large gradients → overshoots</text>
    <text x="0" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563eb">θ₂: small gradients → barely moves</text>
  </g>

  <!-- Right: Adaptive learning rates -->
  <g transform="translate(525, 200)">
    <text x="0" y="-140" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Adaptive Learning Rate</text>

    <!-- Coordinate axes -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#9ca3af" stroke-width="1"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#9ca3af" stroke-width="1"/>
    <text x="135" y="5" font-family="sans-serif" font-size="10" fill="#6b7280">θ₁</text>
    <text x="5" y="-105" font-family="sans-serif" font-size="10" fill="#6b7280">θ₂</text>

    <!-- Scaled gradient arrows (similar effective step sizes) -->
    <!-- θ₁: scaled down -->
    <line x1="-100" y1="0" x2="-70" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#param-arrow)"/>
    <line x1="-65" y1="0" x2="-35" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#param-arrow)"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#16a34a" stroke-width="2" marker-end="url(#param-arrow)"/>

    <!-- θ₂: scaled up -->
    <line x1="0" y1="80" x2="0" y2="50" stroke="#16a34a" stroke-width="2" marker-end="url(#param-arrow)"/>
    <line x1="0" y1="45" x2="0" y2="15" stroke="#16a34a" stroke-width="2" marker-end="url(#param-arrow)"/>
    <line x1="0" y1="10" x2="0" y2="-20" stroke="#16a34a" stroke-width="2" marker-end="url(#param-arrow)"/>

    <!-- Annotations -->
    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">θ₁: η₁ = η/√v₁ (reduced)</text>
    <text x="0" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">θ₂: η₂ = η/√v₂ (increased)</text>
  </g>

  <!-- Formula box -->
  <g transform="translate(350, 340)">
    <rect x="-200" y="-25" width="400" height="50" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="0" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">
      Key insight: Scale learning rate by inverse of gradient magnitude
    </text>
    <text x="0" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#4b5563">
      η_i = η / √(Σ g_i²)  — frequently updated params get smaller η
    </text>
  </g>
</svg>