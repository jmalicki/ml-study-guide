<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">Preconditioning: Reshaping the Loss Landscape</text>

  <!-- Left: Original ill-conditioned -->
  <g transform="translate(150, 155)">
    <text x="0" y="-110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Original Space</text>

    <!-- Elliptical contours -->
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="88" ry="22" fill="none" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="66" ry="17" fill="none" stroke="#4b5563" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="44" ry="11" fill="none" stroke="#374151" stroke-width="1"/>

    <!-- Optimum -->
    <circle cx="0" cy="0" r="4" fill="#16a34a"/>

    <!-- Current point -->
    <circle cx="-80" cy="22" r="5" fill="#dc2626"/>

    <!-- Gradient (perpendicular to ellipse) -->
    <line x1="-80" y1="22" x2="-55" y2="-25" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="-40" y="-25" font-family="sans-serif" font-size="10" fill="#2563eb">-∇L</text>

    <!-- Optimal direction -->
    <line x1="-80" y1="22" x2="-40" y2="11" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">Gradient ⊥ optimal direction</text>
  </g>

  <!-- Arrow in middle -->
  <g transform="translate(330, 155)">
    <path d="M 0 0 L 80 0" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="40" y="-15" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">P⁻¹∇L</text>
    <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">precondition</text>
  </g>

  <!-- Right: Preconditioned (well-conditioned) -->
  <g transform="translate(560, 155)">
    <text x="0" y="-110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Preconditioned Space</text>

    <!-- Circular contours -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#6b7280" stroke-width="1"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#4b5563" stroke-width="1"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#374151" stroke-width="1"/>

    <!-- Optimum -->
    <circle cx="0" cy="0" r="4" fill="#16a34a"/>

    <!-- Current point (transformed) -->
    <circle cx="-65" cy="50" r="5" fill="#dc2626"/>

    <!-- Gradient now points toward optimum! -->
    <line x1="-65" y1="50" x2="-30" y2="23" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="-15" y="20" font-family="sans-serif" font-size="10" fill="#2563eb">-P⁻¹∇L</text>

    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">Gradient → optimal direction</text>
  </g>

  <!-- Bottom explanation -->
  <text x="375" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
    Preconditioner P ≈ H transforms ellipses to circles, aligning gradient with optimal direction
  </text>
</svg>