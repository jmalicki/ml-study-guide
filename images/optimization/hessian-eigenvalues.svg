<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Hessian Eigenvalues and Curvature</text>

  <!-- Left panel: 2D visualization -->
  <g transform="translate(150, 200)">
    <text x="0" y="-130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Principal Curvature Directions</text>

    <!-- Ellipse representing local quadratic approximation -->
    <ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="80" ry="24" fill="none" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="60" ry="18" fill="none" stroke="#4b5563" stroke-width="1"/>

    <!-- Center point -->
    <circle cx="0" cy="0" r="4" fill="#1f2937"/>

    <!-- Eigenvector 1 (large eigenvalue - high curvature) -->
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#dc2626" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="70" stroke="#dc2626" stroke-width="3"/>
    <text x="15" y="-55" font-family="sans-serif" font-size="11" fill="#dc2626">v₁ (λ₁ large)</text>
    <text x="15" y="-40" font-family="sans-serif" font-size="10" fill="#dc2626">high curvature</text>

    <!-- Eigenvector 2 (small eigenvalue - low curvature) -->
    <line x1="0" y1="0" x2="-100" y2="0" stroke="#2563eb" stroke-width="3"/>
    <line x1="0" y1="0" x2="100" y2="0" stroke="#2563eb" stroke-width="3"/>
    <text x="55" y="-10" font-family="sans-serif" font-size="11" fill="#2563eb">v₂ (λ₂ small)</text>
    <text x="55" y="5" font-family="sans-serif" font-size="10" fill="#2563eb">low curvature</text>

    <!-- Annotation -->
    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">κ = λ₁/λ₂ = condition number</text>
  </g>

  <!-- Right panel: Eigenvalue spectrum -->
  <g transform="translate(420, 200)">
    <text x="0" y="-130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Eigenvalue Spectrum</text>

    <!-- Axes -->
    <line x1="-120" y1="80" x2="120" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#axis-arrow)"/>
    <line x1="-100" y1="100" x2="-100" y2="-100" stroke="#374151" stroke-width="1.5" marker-end="url(#axis-arrow)"/>

    <text x="130" y="85" font-family="sans-serif" font-size="11" fill="#374151">index i</text>
    <text x="-95" y="-105" font-family="sans-serif" font-size="11" fill="#374151">λᵢ</text>

    <!-- Eigenvalue bars (typical neural network spectrum) -->
    <rect x="-90" y="-80" width="12" height="160" fill="#dc2626" opacity="0.8"/>
    <rect x="-70" y="-40" width="12" height="120" fill="#f97316" opacity="0.8"/>
    <rect x="-50" y="-10" width="12" height="90" fill="#eab308" opacity="0.8"/>
    <rect x="-30" y="20" width="12" height="60" fill="#84cc16" opacity="0.8"/>
    <rect x="-10" y="40" width="12" height="40" fill="#22c55e" opacity="0.8"/>
    <rect x="10" y="55" width="12" height="25" fill="#14b8a6" opacity="0.8"/>
    <rect x="30" y="65" width="12" height="15" fill="#06b6d4" opacity="0.8"/>
    <rect x="50" y="70" width="12" height="10" fill="#3b82f6" opacity="0.8"/>
    <rect x="70" y="73" width="12" height="7" fill="#6366f1" opacity="0.8"/>
    <rect x="90" y="75" width="12" height="5" fill="#8b5cf6" opacity="0.8"/>

    <!-- Labels -->
    <text x="-84" y="-85" font-family="sans-serif" font-size="10" fill="#dc2626">λ_max</text>
    <text x="90" y="65" font-family="sans-serif" font-size="10" fill="#8b5cf6">λ_min</text>

    <!-- Annotation -->
    <text x="0" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">Neural nets: κ ~ 10⁶ typical</text>
  </g>

  <!-- Bottom explanation -->
  <g transform="translate(300, 360)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">
      GD convergence rate: O(κ) iterations where κ = λ_max / λ_min
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">
      Large κ → slow convergence, oscillation in high-curvature directions
    </text>
  </g>
</svg>