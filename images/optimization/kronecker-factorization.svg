<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <!-- Background -->
  <rect width="750" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Kronecker Factorization: From O(n²) to O(m² + k²)</text>

  <!-- Full Fisher (impractical) -->
  <g transform="translate(150, 180)">
    <text x="0" y="-120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">Full Fisher Matrix</text>

    <!-- Large matrix -->
    <rect x="-80" y="-80" width="160" height="160" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <!-- Grid lines -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#dc2626" stroke-width="0.5"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#dc2626" stroke-width="0.5"/>

    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#dc2626">n × n</text>

    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">n = m·k (vectorized weights)</text>
    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">Memory: O(m²k²)</text>
  </g>

  <!-- Arrow and approximation -->
  <g transform="translate(310, 180)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#374151" stroke-width="2"/>
    <polygon points="60,-5 75,0 60,5" fill="#374151"/>
    <text x="37" y="-15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">≈</text>
  </g>

  <!-- Kronecker product -->
  <g transform="translate(530, 180)">
    <text x="0" y="-120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#374151">Kronecker Factorization</text>

    <!-- Left factor A -->
    <rect x="-120" y="-50" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="-90" y="-5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#16a34a">A</text>
    <text x="-90" y="30" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">m×m</text>

    <!-- Tensor product symbol -->
    <text x="-45" y="0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">⊗</text>

    <!-- Right factor B -->
    <rect x="-25" y="-40" width="50" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2563eb">B</text>
    <text x="0" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb">k×k</text>

    <!-- Expanded form -->
    <text x="70" y="0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#374151">=</text>

    <!-- Block matrix visualization -->
    <g transform="translate(130, 0)">
      <rect x="-40" y="-40" width="80" height="80" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>

      <!-- Block structure -->
      <rect x="-38" y="-38" width="25" height="25" fill="#dcfce7" stroke="#16a34a" stroke-width="0.5"/>
      <rect x="-10" y="-38" width="25" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="0.5"/>
      <rect x="-38" y="-10" width="25" height="25" fill="#dbeafe" stroke="#2563eb" stroke-width="0.5"/>
      <rect x="-10" y="-10" width="25" height="25" fill="#dcfce7" stroke="#16a34a" stroke-width="0.5"/>

      <text x="-25" y="-22" font-family="sans-serif" font-size="7" fill="#166534">a₁₁B</text>
      <text x="2" y="-22" font-family="sans-serif" font-size="7" fill="#166534">a₁₂B</text>
    </g>

    <text x="0" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">Memory: O(m² + k²)</text>
    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">Inversion: O(m³ + k³)</text>
  </g>

  <!-- Key identity at bottom -->
  <g transform="translate(375, 350)">
    <rect x="-250" y="-30" width="500" height="60" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="0" y="-5" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">
      (A ⊗ B)⁻¹ = A⁻¹ ⊗ B⁻¹
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      Kronecker inverse is product of inverses — no need to form full matrix!
    </text>
  </g>
</svg>