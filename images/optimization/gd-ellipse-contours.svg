<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Gradient Descent on Ill-Conditioned Quadratic</text>

  <!-- Elliptical contours (ill-conditioned: stretched in one direction) -->
  <g transform="translate(250, 200)">
    <!-- Contour lines -->
    <ellipse cx="0" cy="0" rx="180" ry="45" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="150" ry="37" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="120" ry="30" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="none" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="60" ry="15" fill="none" stroke="#4b5563" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="30" ry="7" fill="none" stroke="#374151" stroke-width="1"/>

    <!-- Optimum point -->
    <circle cx="0" cy="0" r="5" fill="#16a34a"/>
    <text x="12" y="5" font-family="sans-serif" font-size="12" fill="#16a34a">θ*</text>

    <!-- GD trajectory (oscillating) -->
    <path d="M -160 35 L -120 -28 L -85 22 L -55 -18 L -30 14 L -10 -8 L 0 0"
          fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Starting point -->
    <circle cx="-160" cy="35" r="6" fill="#dc2626"/>
    <text x="-175" y="55" font-family="sans-serif" font-size="12" fill="#dc2626">θ₀</text>

    <!-- Gradient vector at start (perpendicular to contour) -->
    <line x1="-160" y1="35" x2="-130" y2="-15" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="-115" y="-10" font-family="sans-serif" font-size="11" fill="#2563eb">-∇L</text>

    <!-- Optimal direction (toward minimum) -->
    <line x1="-160" y1="35" x2="-110" y2="22" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowhead-green)"/>
    <text x="-100" y="40" font-family="sans-serif" font-size="11" fill="#16a34a">optimal</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 320)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="40" y="4" font-family="sans-serif" font-size="11" fill="#374151">GD trajectory (oscillates)</text>

    <line x1="0" y1="25" x2="30" y2="25" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="40" y="29" font-family="sans-serif" font-size="11" fill="#374151">Negative gradient direction</text>

    <line x1="0" y1="50" x2="30" y2="50" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="40" y="54" font-family="sans-serif" font-size="11" fill="#374151">Optimal direction (toward minimum)</text>
  </g>

  <!-- Annotation -->
  <text x="380" y="350" font-family="sans-serif" font-size="10" fill="#6b7280">κ = λ_max/λ_min ≈ 16</text>
  <text x="380" y="365" font-family="sans-serif" font-size="10" fill="#6b7280">(condition number)</text>
</svg>