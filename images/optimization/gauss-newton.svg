<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <!-- Background -->
  <rect width="700" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Gauss-Newton: Hessian Approximation for Least Squares</text>

  <!-- Left: Full Hessian -->
  <g transform="translate(180, 180)">
    <text x="0" y="-120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Full Hessian</text>

    <!-- Hessian matrix -->
    <rect x="-70" y="-90" width="140" height="100" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

    <text x="0" y="-60" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">H = JᵀJ + Σ rᵢ∇²fᵢ</text>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">↑ Hard to compute!</text>
    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">Requires 2nd derivatives</text>

    <!-- Problems -->
    <text x="0" y="40" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Problems:</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">• O(n²) memory for H</text>
    <text x="0" y="73" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">• O(n³) to invert</text>
    <text x="0" y="88" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">• May not be PSD</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(350, 180)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#374151" stroke-width="2"/>
    <polygon points="40,-5 55,0 40,5" fill="#374151"/>
    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Approximate</text>
  </g>

  <!-- Right: Gauss-Newton approximation -->
  <g transform="translate(520, 180)">
    <text x="0" y="-120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Gauss-Newton</text>

    <!-- Approximation -->
    <rect x="-70" y="-90" width="140" height="100" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>

    <text x="0" y="-60" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">H ≈ JᵀJ</text>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">↑ Drop 2nd derivative term</text>
    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">Only need Jacobian!</text>

    <!-- Benefits -->
    <text x="0" y="40" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Benefits:</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">• Always PSD (JᵀJ ≥ 0)</text>
    <text x="0" y="73" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">• Guaranteed descent</text>
    <text x="0" y="88" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">• Good near minimum</text>
  </g>

  <!-- Bottom explanation -->
  <g transform="translate(350, 330)">
    <rect x="-280" y="-30" width="560" height="60" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="0" y="-10" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      For least squares: L = ½||f(θ) - y||², the dropped term Σrᵢ∇²fᵢ is small when residuals rᵢ are small.
    </text>
    <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      Near the optimum, Gauss-Newton ≈ Newton. Far away, it's a conservative approximation.
    </text>
  </g>
</svg>