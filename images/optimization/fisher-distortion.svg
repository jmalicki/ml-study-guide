<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <marker id="fisher-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Fisher Information: The Right Metric for Distributions</text>

  <!-- Left: Euclidean distance (wrong) -->
  <g transform="translate(175, 195)">
    <text x="0" y="-130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Euclidean Metric</text>
    <text x="0" y="-110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626">(ignores distribution structure)</text>

    <!-- Circular contours (equal Euclidean distance) -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#6b7280" stroke-width="1"/>

    <!-- Center point -->
    <circle cx="0" cy="0" r="5" fill="#dc2626"/>
    <text x="10" y="-10" font-family="sans-serif" font-size="10" fill="#dc2626">θ</text>

    <!-- Two points at same Euclidean distance -->
    <circle cx="50" cy="0" r="4" fill="#2563eb"/>
    <text x="60" y="5" font-family="sans-serif" font-size="9" fill="#2563eb">A</text>

    <circle cx="0" cy="50" r="4" fill="#2563eb"/>
    <text x="10" y="55" font-family="sans-serif" font-size="9" fill="#2563eb">B</text>

    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">||A - θ|| = ||B - θ||</text>
    <text x="0" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">But distributions may differ greatly!</text>
  </g>

  <!-- Right: Fisher metric (correct) -->
  <g transform="translate(525, 195)">
    <text x="0" y="-130" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">Fisher Metric</text>
    <text x="0" y="-110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#16a34a">(respects distribution geometry)</text>

    <!-- Elliptical contours (equal KL divergence) -->
    <ellipse cx="0" cy="0" rx="100" ry="45" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="80" ry="36" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="60" ry="27" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="40" ry="18" fill="none" stroke="#6b7280" stroke-width="1"/>

    <!-- Center point -->
    <circle cx="0" cy="0" r="5" fill="#16a34a"/>
    <text x="10" y="-10" font-family="sans-serif" font-size="10" fill="#16a34a">θ</text>

    <!-- Points at same KL distance (on same contour) -->
    <circle cx="60" cy="0" r="4" fill="#2563eb"/>
    <text x="70" y="5" font-family="sans-serif" font-size="9" fill="#2563eb">A</text>

    <circle cx="0" cy="27" r="4" fill="#2563eb"/>
    <text x="10" y="32" font-family="sans-serif" font-size="9" fill="#2563eb">B</text>

    <text x="0" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">D_KL(p_A || p_θ) = D_KL(p_B || p_θ)</text>
    <text x="0" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">Distributions are equally different!</text>
  </g>

  <!-- Fisher formula at bottom -->
  <g transform="translate(350, 340)">
    <rect x="-200" y="-20" width="400" height="45" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#166534">
      Fisher Information Matrix: F_ij = E[∂log p/∂θ_i · ∂log p/∂θ_j]
    </text>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
      This is the metric tensor on the statistical manifold
    </text>
  </g>
</svg>