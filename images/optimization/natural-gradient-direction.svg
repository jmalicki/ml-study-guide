<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <marker id="nat-grad-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="euc-grad-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Natural Gradient: Steepest Descent in KL Divergence</text>

  <!-- Central visualization -->
  <g transform="translate(350, 200)">
    <!-- Elliptical contours (representing loss in Fisher metric) -->
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="180" ry="65" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="100" ry="36" fill="none" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#4b5563" stroke-width="1"/>

    <!-- Optimum -->
    <circle cx="0" cy="0" r="5" fill="#16a34a"/>
    <text x="10" y="-10" font-family="sans-serif" font-size="11" fill="#16a34a">θ*</text>

    <!-- Current point -->
    <circle cx="-140" cy="50" r="7" fill="#1f2937"/>
    <text x="-155" y="70" font-family="sans-serif" font-size="11" fill="#1f2937">θ_t</text>

    <!-- Euclidean gradient (perpendicular to contour in Euclidean sense) -->
    <line x1="-140" y1="50" x2="-90" y2="-10" stroke="#dc2626" stroke-width="2.5" marker-end="url(#euc-grad-arrow)"/>
    <text x="-75" y="-15" font-family="sans-serif" font-size="10" fill="#dc2626">-∇L</text>
    <text x="-75" y="0" font-family="sans-serif" font-size="9" fill="#dc2626">(Euclidean)</text>

    <!-- Natural gradient (toward optimum) -->
    <line x1="-140" y1="50" x2="-60" y2="20" stroke="#16a34a" stroke-width="3" marker-end="url(#nat-grad-arrow)"/>
    <text x="-45" y="15" font-family="sans-serif" font-size="10" fill="#16a34a">-F⁻¹∇L</text>
    <text x="-45" y="30" font-family="sans-serif" font-size="9" fill="#16a34a">(Natural)</text>

    <!-- Trajectories -->
    <!-- Euclidean GD trajectory (oscillating) -->
    <path d="M -140 50 L -95 -5 L -60 35 L -35 5 L -15 20 L 0 0"
          fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>

    <!-- Natural gradient trajectory (direct) -->
    <path d="M -140 50 Q -80 30 -30 15 Q 0 5 0 0"
          fill="none" stroke="#16a34a" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 330)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#euc-grad-arrow)"/>
    <text x="50" y="4" font-family="sans-serif" font-size="10" fill="#374151">Gradient descent: θ = θ - η∇L</text>

    <line x1="300" y1="0" x2="340" y2="0" stroke="#16a34a" stroke-width="3" marker-end="url(#nat-grad-arrow)"/>
    <text x="350" y="4" font-family="sans-serif" font-size="10" fill="#374151">Natural gradient: θ = θ - ηF⁻¹∇L</text>
  </g>

  <!-- Bottom explanation -->
  <text x="350" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">
    Natural gradient finds the direction of steepest descent in the space of distributions, not parameters
  </text>
</svg>