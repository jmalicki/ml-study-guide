<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420">
  <!-- Background -->
  <rect width="750" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Adam: Combining Momentum with Adaptive Learning Rates</text>

  <!-- Three columns -->

  <!-- Column 1: First Moment (Momentum) -->
  <g transform="translate(130, 200)">
    <rect x="-100" y="-120" width="200" height="240" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>

    <text x="0" y="-95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e40af">First Moment</text>
    <text x="0" y="-75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3b82f6">(Momentum)</text>

    <!-- Formula -->
    <text x="0" y="-40" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">m_t = β₁·m_{t-1} + (1-β₁)·g_t</text>

    <!-- Visualization: exponential average -->
    <g transform="translate(0, 20)">
      <text x="0" y="-20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">Exponential moving average of gradients</text>

      <!-- Gradient history bars -->
      <rect x="-80" y="0" width="15" height="40" fill="#3b82f6" opacity="0.2"/>
      <rect x="-60" y="0" width="15" height="35" fill="#3b82f6" opacity="0.3"/>
      <rect x="-40" y="0" width="15" height="45" fill="#3b82f6" opacity="0.4"/>
      <rect x="-20" y="0" width="15" height="30" fill="#3b82f6" opacity="0.6"/>
      <rect x="0" y="0" width="15" height="50" fill="#3b82f6" opacity="0.8"/>
      <rect x="20" y="0" width="15" height="38" fill="#3b82f6" opacity="1.0"/>

      <text x="-70" y="55" font-family="sans-serif" font-size="8" fill="#6b7280">past</text>
      <text x="25" y="55" font-family="sans-serif" font-size="8" fill="#6b7280">now</text>
    </g>

    <text x="0" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Smooths gradient direction</text>
    <text x="0" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">β₁ typically 0.9</text>
  </g>

  <!-- Column 2: Second Moment (RMSProp) -->
  <g transform="translate(375, 200)">
    <rect x="-100" y="-120" width="200" height="240" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>

    <text x="0" y="-95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">Second Moment</text>
    <text x="0" y="-75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#22c55e">(RMSProp)</text>

    <!-- Formula -->
    <text x="0" y="-40" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">v_t = β₂·v_{t-1} + (1-β₂)·g_t²</text>

    <!-- Visualization: squared gradients -->
    <g transform="translate(0, 20)">
      <text x="0" y="-20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">EMA of squared gradients</text>

      <!-- Squared gradient bars -->
      <rect x="-80" y="10" width="15" height="30" fill="#22c55e" opacity="0.2"/>
      <rect x="-60" y="5" width="15" height="35" fill="#22c55e" opacity="0.3"/>
      <rect x="-40" y="-5" width="15" height="45" fill="#22c55e" opacity="0.4"/>
      <rect x="-20" y="15" width="15" height="25" fill="#22c55e" opacity="0.6"/>
      <rect x="0" y="-10" width="15" height="50" fill="#22c55e" opacity="0.8"/>
      <rect x="20" y="8" width="15" height="32" fill="#22c55e" opacity="1.0"/>

      <text x="-70" y="55" font-family="sans-serif" font-size="8" fill="#6b7280">past</text>
      <text x="25" y="55" font-family="sans-serif" font-size="8" fill="#6b7280">now</text>
    </g>

    <text x="0" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Scales learning rate</text>
    <text x="0" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">β₂ typically 0.999</text>
  </g>

  <!-- Column 3: Combined Update -->
  <g transform="translate(620, 200)">
    <rect x="-100" y="-120" width="200" height="240" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>

    <text x="0" y="-95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">Combined Update</text>
    <text x="0" y="-75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f59e0b">(Adam)</text>

    <!-- Formula -->
    <text x="0" y="-40" text-anchor="middle" font-family="monospace" font-size="11" fill="#b45309">θ = θ - η · m̂_t / (√v̂_t + ε)</text>

    <!-- Visualization: balanced update -->
    <g transform="translate(0, 20)">
      <text x="0" y="-20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">Direction from m, scale from v</text>

      <!-- Direction arrow (from momentum) -->
      <line x1="-60" y1="20" x2="40" y2="20" stroke="#3b82f6" stroke-width="3"/>
      <polygon points="40,15 55,20 40,25" fill="#3b82f6"/>
      <text x="-10" y="10" font-family="sans-serif" font-size="9" fill="#3b82f6">direction (m)</text>

      <!-- Scale indicator -->
      <line x1="-30" y1="40" x2="30" y2="40" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="0" y="55" font-family="sans-serif" font-size="9" fill="#22c55e">scale (1/√v)</text>
    </g>

    <text x="0" y="95" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">Bias-corrected:</text>
    <text x="0" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#374151">m̂ = m/(1-β₁ᵗ), v̂ = v/(1-β₂ᵗ)</text>
  </g>

  <!-- Bottom: Flow diagram -->
  <g transform="translate(375, 380)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">
      Adam = Momentum direction × RMSProp scaling + Bias correction
    </text>
  </g>
</svg>