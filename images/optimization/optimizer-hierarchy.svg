<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450">
  <!-- Background -->
  <rect width="750" height="450" fill="#fafafa"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Optimizer Hierarchy: Cost vs Approximation Quality</text>

  <!-- Axis labels -->
  <text x="50" y="230" font-family="sans-serif" font-size="11" fill="#6b7280" transform="rotate(-90, 50, 230)">Better Approximation to Hessian</text>
  <text x="400" y="420" font-family="sans-serif" font-size="11" fill="#6b7280">Computational Cost →</text>

  <!-- Vertical axis -->
  <line x1="100" y1="380" x2="100" y2="60" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="95,65 100,50 105,65" fill="#9ca3af"/>

  <!-- Horizontal axis -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="695,375 710,380 695,385" fill="#9ca3af"/>

  <!-- SGD -->
  <g transform="translate(150, 350)">
    <rect x="-40" y="-25" width="80" height="50" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151">SGD</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b7280">P = I</text>
  </g>

  <!-- Momentum -->
  <g transform="translate(230, 320)">
    <rect x="-45" y="-25" width="90" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Momentum</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6">+ velocity</text>
  </g>

  <!-- Adam -->
  <g transform="translate(330, 270)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#166534">Adam(W)</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#16a34a">Diagonal P</text>
  </g>

  <!-- K-FAC -->
  <g transform="translate(450, 190)">
    <rect x="-45" y="-25" width="90" height="50" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">K-FAC</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f59e0b">Kronecker P</text>
  </g>

  <!-- Shampoo -->
  <g transform="translate(530, 150)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338ca">Shampoo</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6366f1">Full Kronecker</text>
  </g>

  <!-- Hessian-Free -->
  <g transform="translate(610, 110)">
    <rect x="-55" y="-25" width="110" height="50" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9d174d">Hessian-Free</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#db2777">CG + H·v</text>
  </g>

  <!-- Newton (impractical) -->
  <g transform="translate(680, 70)">
    <rect x="-40" y="-25" width="80" height="50" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">Newton</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#dc2626">Full H⁻¹</text>
  </g>

  <!-- Muon (different branch) -->
  <g transform="translate(400, 150)">
    <rect x="-40" y="-25" width="80" height="50" rx="5" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">Muon</text>
    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#14b8a6">Orthogonal</text>
  </g>

  <!-- Connecting lines -->
  <path d="M 150 325 L 230 295" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 230 295 L 330 245" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 330 245 L 450 165" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 450 165 L 530 125" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 530 125 L 610 85" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 610 85 L 680 45" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Muon branch -->
  <path d="M 330 245 L 400 175" fill="none" stroke="#14b8a6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Legend -->
  <g transform="translate(130, 70)">
    <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#374151" font-weight="bold">Memory per param:</text>
    <text x="0" y="18" font-family="sans-serif" font-size="9" fill="#6b7280">SGD: O(1), Adam: O(1)</text>
    <text x="0" y="33" font-family="sans-serif" font-size="9" fill="#6b7280">K-FAC: O(d), Shampoo: O(d)</text>
    <text x="0" y="48" font-family="sans-serif" font-size="9" fill="#6b7280">Newton: O(n)</text>
  </g>
</svg>