<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420">
  <defs>
    <marker id="iter-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Hessian-Free: Conjugate Gradient for Newton Direction</text>

  <!-- Left: The problem -->
  <g transform="translate(175, 150)">
    <rect x="-120" y="-70" width="240" height="140" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-45" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">The Problem</text>

    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">Newton step: solve Hδ = -∇L</text>

    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">For n = 10⁹ parameters:</text>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">• H has 10¹⁸ entries (impossible)</text>
    <text x="0" y="49" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">• Inversion is O(n³)</text>
  </g>

  <!-- Right: The solution -->
  <g transform="translate(525, 150)">
    <rect x="-120" y="-70" width="240" height="140" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="0" y="-45" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">The Solution</text>

    <text x="0" y="-15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#374151">Use CG: only need H·v products</text>

    <text x="0" y="15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">Hessian-vector product via autodiff:</text>
    <text x="0" y="32" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">Hv = ∂/∂ε [∇L(θ+εv)]|_{ε=0}</text>
    <text x="0" y="49" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">• O(n) cost, O(n) memory</text>
  </g>

  <!-- CG iterations visualization -->
  <g transform="translate(350, 320)">
    <text x="0" y="-70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#374151">CG Iterations: Building the Newton Direction</text>

    <!-- Elliptical contours -->
    <ellipse cx="0" cy="0" rx="200" ry="50" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="160" ry="40" fill="none" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="120" ry="30" fill="none" stroke="#9ca3af" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="80" ry="20" fill="none" stroke="#6b7280" stroke-width="1"/>

    <!-- Optimum -->
    <circle cx="0" cy="0" r="4" fill="#16a34a"/>

    <!-- CG iterations -->
    <circle cx="-150" cy="35" r="5" fill="#2563eb"/>
    <text x="-165" y="50" font-family="sans-serif" font-size="9" fill="#2563eb">start</text>

    <!-- Iteration 1 -->
    <line x1="-150" y1="35" x2="-80" y2="-15" stroke="#2563eb" stroke-width="2" marker-end="url(#iter-arrow)"/>
    <text x="-115" y="0" font-family="sans-serif" font-size="8" fill="#2563eb">k=1</text>

    <!-- Iteration 2 -->
    <line x1="-75" y1="-15" x2="-20" y2="12" stroke="#2563eb" stroke-width="2" marker-end="url(#iter-arrow)"/>
    <text x="-55" y="5" font-family="sans-serif" font-size="8" fill="#2563eb">k=2</text>

    <!-- Iteration 3 -->
    <line x1="-15" y1="12" x2="5" y2="-3" stroke="#2563eb" stroke-width="2" marker-end="url(#iter-arrow)"/>
    <text x="-5" y="25" font-family="sans-serif" font-size="8" fill="#2563eb">k=3</text>

    <!-- Annotation -->
    <text x="120" y="0" font-family="sans-serif" font-size="10" fill="#6b7280">Truncate after k steps</text>
    <text x="120" y="15" font-family="sans-serif" font-size="10" fill="#6b7280">(typically 10-50)</text>
  </g>

  <!-- Bottom: Krylov subspace -->
  <g transform="translate(350, 395)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#374151">
      After k iterations: δ ∈ span{∇L, H∇L, H²∇L, ..., Hᵏ⁻¹∇L} (Krylov subspace)
    </text>
  </g>
</svg>