<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Loss Landscape Features</text>

  <!-- 3D-ish surface visualization using layered contours -->
  <g transform="translate(300, 220)">
    <!-- Base level (bottom of bowl) -->
    <ellipse cx="0" cy="20" rx="200" ry="80" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>

    <!-- Contour layers going up -->
    <ellipse cx="0" cy="10" rx="180" ry="72" fill="#c7d2fe" stroke="#a5b4fc" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="160" ry="64" fill="#a5b4fc" stroke="#818cf8" stroke-width="1"/>
    <ellipse cx="0" cy="-10" rx="140" ry="56" fill="#818cf8" stroke="#6366f1" stroke-width="1"/>
    <ellipse cx="0" cy="-20" rx="120" ry="48" fill="#6366f1" stroke="#4f46e5" stroke-width="1"/>
    <ellipse cx="0" cy="-30" rx="100" ry="40" fill="#4f46e5" stroke="#4338ca" stroke-width="1"/>
    <ellipse cx="0" cy="-40" rx="80" ry="32" fill="#4338ca" stroke="#3730a3" stroke-width="1"/>

    <!-- Saddle point region -->
    <ellipse cx="-100" cy="-35" rx="30" ry="15" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
    <text x="-100" y="-55" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#dc2626">saddle point</text>

    <!-- Local minimum -->
    <circle cx="60" cy="-25" r="15" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
    <text x="60" y="-45" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a">local min</text>

    <!-- Global minimum -->
    <circle cx="-30" cy="5" r="8" fill="#16a34a"/>
    <text x="-30" y="-15" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#16a34a" font-weight="bold">global min</text>

    <!-- Plateau region -->
    <rect x="100" y="-10" width="60" height="40" rx="5" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
    <text x="130" y="50" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#d97706">plateau</text>

    <!-- Trajectory -->
    <path d="M -150 60 Q -120 40 -100 -20 Q -80 -35 -60 -10 Q -40 5 -30 5"
          fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="-150" cy="60" r="5" fill="#dc2626"/>
    <text x="-170" y="65" font-family="sans-serif" font-size="10" fill="#dc2626">start</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="15" height="15" fill="#fecaca" stroke="#f87171"/>
    <text x="22" y="12" font-family="sans-serif" font-size="10" fill="#374151">Saddle: ∇L=0 but not minimum</text>

    <rect x="170" y="0" width="15" height="15" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="192" y="12" font-family="sans-serif" font-size="10" fill="#374151">Plateau: Small gradients, slow progress</text>

    <rect x="390" y="0" width="15" height="15" fill="#bbf7d0" stroke="#4ade80"/>
    <text x="412" y="12" font-family="sans-serif" font-size="10" fill="#374151">Local minima: May trap optimization</text>
  </g>

  <!-- Annotations -->
  <text x="300" y="375" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">
    In high dimensions: Saddle points dominate (more likely than local minima)
  </text>
</svg>