name: Content Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run validation script
        run: python scripts/validate_links.py

      - name: Check SVG contrast and dark mode
        run: |
          echo "=== Checking optimization book SVGs (strict) ==="
          python scripts/check_svg_contrast.py books/optimization-theory/images/*.svg
          echo ""
          echo "=== Checking assets/diagrams SVGs (advisory) ==="
          python scripts/check_svg_contrast.py assets/diagrams/*.svg || echo "Note: assets/diagrams has legacy contrast issues to fix"
