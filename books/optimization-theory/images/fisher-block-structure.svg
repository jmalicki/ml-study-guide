<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Background colors */
    .bg-layer1 { fill: #E3F2FD; }
    .bg-layer2 { fill: #E8F5E9; }
    .bg-layer3 { fill: #FFF3E0; }
    .bg-offdiag { fill: #FAFAFA; }
    .bg-white { fill: #ffffff; }

    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#1565C0"] { fill: #64B5F6; }
      text[fill="#2E7D32"] { fill: #81C784; }
      text[fill="#E65100"] { fill: #FFB74D; }

      .bg-layer1 { fill: #1a237e; }
      .bg-layer2 { fill: #1b5e20; }
      .bg-layer3 { fill: #e65100; }
      .bg-offdiag { fill: #424242; }
      .bg-white { fill: #2d2d2d; }

      rect[stroke="#1565C0"] { stroke: #64B5F6; }
      rect[stroke="#2E7D32"] { stroke: #81C784; }
      rect[stroke="#E65100"] { stroke: #FFB74D; }
      line[stroke="#1565C0"] { stroke: #64B5F6; }
      line[stroke="#2E7D32"] { stroke: #81C784; }
      line[stroke="#E65100"] { stroke: #FFB74D; }
      path[stroke="#1565C0"] { stroke: #64B5F6; }
      path[stroke="#2E7D32"] { stroke: #81C784; }
      path[stroke="#E65100"] { stroke: #FFB74D; }
    }
  </style>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">Block Structure of the Fisher Information Matrix</text>

  <!-- Neural Network (left side) -->
  <g transform="translate(50, 60)">
    <text x="80" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#333">Neural Network</text>

    <!-- Input layer -->
    <g transform="translate(0, 20)">
      <circle cx="80" cy="20" r="12" class="bg-white" stroke="#999" stroke-width="1.5"/>
      <circle cx="80" cy="50" r="12" class="bg-white" stroke="#999" stroke-width="1.5"/>
      <circle cx="80" cy="80" r="12" class="bg-white" stroke="#999" stroke-width="1.5"/>
      <text x="80" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">Input</text>
    </g>

    <!-- Layer 1 (W1) -->
    <g transform="translate(0, 20)">
      <!-- Connection lines to layer 1 -->
      <line x1="92" y1="20" x2="148" y2="35" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
      <line x1="92" y1="20" x2="148" y2="65" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
      <line x1="92" y1="50" x2="148" y2="35" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
      <line x1="92" y1="50" x2="148" y2="65" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
      <line x1="92" y1="80" x2="148" y2="35" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
      <line x1="92" y1="80" x2="148" y2="65" stroke="#1565C0" stroke-width="1" opacity="0.4"/>

      <circle cx="160" cy="35" r="12" class="bg-layer1" stroke="#1565C0" stroke-width="2"/>
      <circle cx="160" cy="65" r="12" class="bg-layer1" stroke="#1565C0" stroke-width="2"/>
      <text x="160" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1565C0">W₁</text>
    </g>

    <!-- Layer 2 (W2) -->
    <g transform="translate(0, 20)">
      <!-- Connection lines to layer 2 -->
      <line x1="172" y1="35" x2="228" y2="35" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
      <line x1="172" y1="35" x2="228" y2="65" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
      <line x1="172" y1="65" x2="228" y2="35" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
      <line x1="172" y1="65" x2="228" y2="65" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>

      <circle cx="240" cy="35" r="12" class="bg-layer2" stroke="#2E7D32" stroke-width="2"/>
      <circle cx="240" cy="65" r="12" class="bg-layer2" stroke="#2E7D32" stroke-width="2"/>
      <text x="240" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">W₂</text>
    </g>

    <!-- Layer 3 (W3) - output -->
    <g transform="translate(0, 20)">
      <!-- Connection lines to layer 3 -->
      <line x1="252" y1="35" x2="308" y2="50" stroke="#E65100" stroke-width="1" opacity="0.4"/>
      <line x1="252" y1="65" x2="308" y2="50" stroke="#E65100" stroke-width="1" opacity="0.4"/>

      <circle cx="320" cy="50" r="12" class="bg-layer3" stroke="#E65100" stroke-width="2"/>
      <text x="320" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#E65100">W₃</text>
    </g>
  </g>

  <!-- Arrow from network to matrix -->
  <g transform="translate(350, 130)">
    <path d="M 0 0 L 30 0" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- Fisher Matrix (right side) -->
  <g transform="translate(400, 55)">
    <text x="120" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#333">Fisher Matrix F</text>

    <!-- Matrix background -->
    <rect x="0" y="15" width="240" height="240" class="bg-white" stroke="#333" stroke-width="2"/>

    <!-- Block F11 (layer 1) -->
    <rect x="5" y="20" width="75" height="75" class="bg-layer1" stroke="#1565C0" stroke-width="2"/>
    <text x="42" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">F₁₁</text>

    <!-- Block F22 (layer 2) -->
    <rect x="85" y="100" width="70" height="70" class="bg-layer2" stroke="#2E7D32" stroke-width="2"/>
    <text x="120" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">F₂₂</text>

    <!-- Block F33 (layer 3) -->
    <rect x="160" y="175" width="75" height="75" class="bg-layer3" stroke="#E65100" stroke-width="2"/>
    <text x="197" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#E65100">F₃₃</text>

    <!-- Off-diagonal blocks (faded to show approximation) -->
    <rect x="85" y="20" width="70" height="75" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="120" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999">F₁₂</text>

    <rect x="160" y="20" width="75" height="75" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="197" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999">F₁₃</text>

    <rect x="5" y="100" width="75" height="70" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="42" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999">F₂₁</text>

    <rect x="160" y="100" width="75" height="70" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="197" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999">F₂₃</text>

    <rect x="5" y="175" width="75" height="75" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="42" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999">F₃₁</text>

    <rect x="85" y="175" width="70" height="75" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="120" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999">F₃₂</text>

    <!-- Labels -->
    <text x="42" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1565C0">θ₁</text>
    <text x="120" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2E7D32">θ₂</text>
    <text x="197" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E65100">θ₃</text>
  </g>

  <!-- Connecting curves from layers to blocks -->
  <path d="M 210 115 C 280 115 320 90 405 90" stroke="#1565C0" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <path d="M 290 115 C 340 130 370 155 485 155" stroke="#2E7D32" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <path d="M 370 115 C 420 140 450 200 557 220" stroke="#E65100" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>

  <!-- Legend / Explanation -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="600" height="75" class="bg-white" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="300" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">K-FAC Block-Diagonal Approximation</text>

    <rect x="20" y="35" width="15" height="15" class="bg-layer1" stroke="#1565C0" stroke-width="1"/>
    <rect x="20" y="55" width="15" height="15" class="bg-offdiag" stroke="#ccc" stroke-width="1" stroke-dasharray="2,2"/>

    <text x="45" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">Diagonal blocks F_ii: kept (capture per-layer curvature)</text>
    <text x="45" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">Off-diagonal blocks F_ij: ignored (cross-layer interactions ≈ 0)</text>

    <text x="400" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">F ≈ block-diag(F₁₁, F₂₂, F₃₃)</text>
    <text x="400" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">Each block is then Kronecker-factored</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
