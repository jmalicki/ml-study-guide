<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <!-- Background -->
  <rect width="500" height="200" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Learning Rate Stability Zones</text>

  <!-- Number line -->
  <line x1="40" y1="100" x2="460" y2="100" stroke="#333" stroke-width="2"/>

  <!-- Zones -->
  <!-- Too small (0 to 0.5/L) -->
  <rect x="40" y="70" width="100" height="60" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">Too slow</text>
  <text x="90" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Converges</text>

  <!-- Optimal (0.5/L to 1.5/L) -->
  <rect x="140" y="70" width="140" height="60" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="210" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32" font-weight="bold">Optimal</text>
  <text x="210" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Fast convergence</text>

  <!-- Risky (1.5/L to 2/L) -->
  <rect x="280" y="70" width="80" height="60" fill="#FFF8E1" stroke="#FFC107" stroke-width="1"/>
  <text x="320" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F57F17">Risky</text>
  <text x="320" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">May oscillate</text>

  <!-- Divergent (> 2/L) -->
  <rect x="360" y="70" width="100" height="60" fill="#FFEBEE" stroke="#f44336" stroke-width="1"/>
  <text x="410" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C62828">Diverges</text>
  <text x="410" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Unstable</text>

  <!-- Tick marks and labels -->
  <line x1="40" y1="130" x2="40" y2="140" stroke="#333" stroke-width="1"/>
  <text x="40" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0</text>

  <line x1="140" y1="130" x2="140" y2="140" stroke="#333" stroke-width="1"/>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0.5/L</text>

  <line x1="280" y1="130" x2="280" y2="140" stroke="#333" stroke-width="1"/>
  <text x="280" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">1.5/L</text>

  <line x1="360" y1="130" x2="360" y2="140" stroke="#333" stroke-width="1"/>
  <text x="360" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">2/L</text>

  <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">η (learning rate)</text>
</svg>