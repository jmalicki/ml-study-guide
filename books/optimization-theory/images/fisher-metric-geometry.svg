<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 320">
  <!-- Background -->
  <rect width="550" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="275" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Fisher Information: Geometry of Probability Distributions</text>

  <!-- Left: Parameter space -->
  <g transform="translate(130, 160)">
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Parameter Space</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(Euclidean metric)</text>

    <!-- Grid -->
    <line x1="-80" y1="-60" x2="80" y2="-60" stroke="#ddd" stroke-width="1"/>
    <line x1="-80" y1="-30" x2="80" y2="-30" stroke="#ddd" stroke-width="1"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#ddd" stroke-width="1"/>
    <line x1="-80" y1="30" x2="80" y2="30" stroke="#ddd" stroke-width="1"/>
    <line x1="-80" y1="60" x2="80" y2="60" stroke="#ddd" stroke-width="1"/>

    <line x1="-60" y1="-70" x2="-60" y2="70" stroke="#ddd" stroke-width="1"/>
    <line x1="-30" y1="-70" x2="-30" y2="70" stroke="#ddd" stroke-width="1"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#ddd" stroke-width="1"/>
    <line x1="30" y1="-70" x2="30" y2="70" stroke="#ddd" stroke-width="1"/>
    <line x1="60" y1="-70" x2="60" y2="70" stroke="#ddd" stroke-width="1"/>

    <!-- Two points -->
    <circle cx="-30" cy="0" r="6" fill="#2196F3"/>
    <circle cx="30" cy="30" r="6" fill="#f44336"/>

    <!-- Distance -->
    <line x1="-30" y1="0" x2="30" y2="30" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="10" y="5" font-family="Arial, sans-serif" font-size="10" fill="#333">||Δθ||</text>

    <text x="-30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2196F3">θ₁</text>
    <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f44336">θ₂</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(275, 160)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#4CAF50" stroke-width="2"/>
    <polygon points="40,0 33,-4 33,4" fill="#4CAF50"/>
    <text x="20" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50">Fisher</text>
    <text x="20" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50">metric</text>
  </g>

  <!-- Right: Distribution space -->
  <g transform="translate(420, 160)">
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Distribution Space</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(Fisher/KL metric)</text>

    <!-- Curved manifold -->
    <path d="M -80 50 Q -40 -50, 0 -30 Q 40 -10, 80 40" fill="none" stroke="#9C27B0" stroke-width="2"/>

    <!-- Two distributions on manifold -->
    <circle cx="-50" cy="15" r="6" fill="#2196F3"/>
    <circle cx="35" cy="-18" r="6" fill="#f44336"/>

    <!-- Geodesic path -->
    <path d="M -50 15 Q -10 -20, 35 -18" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="-5" y="-5" font-family="Arial, sans-serif" font-size="10" fill="#333">KL distance</text>

    <text x="-50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2196F3">p(·|θ₁)</text>
    <text x="35" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f44336">p(·|θ₂)</text>
  </g>

  <!-- Key insight box -->
  <g transform="translate(70, 230)">
    <rect x="0" y="0" width="410" height="70" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="5"/>
    <text x="205" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">Key Insight</text>
    <text x="205" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Small parameter change can cause large distribution change (and vice versa)</text>
    <text x="205" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Fisher metric measures: how much does the distribution change?</text>
  </g>

  <!-- Formula -->
  <text x="275" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">F = E[∇log p(x|θ) · ∇log p(x|θ)ᵀ]  →  Natural gradient: F⁻¹∇L</text>
</svg>
