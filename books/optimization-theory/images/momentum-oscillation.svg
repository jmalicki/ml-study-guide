<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style>

    <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">Momentum Dynamics: Oscillation vs Convergence</text>

  <!-- Axes -->
  <g transform="translate(60, 180)">
    <!-- X-axis (time) -->
    <line x1="0" y1="0" x2="500" y2="0" stroke="#333" stroke-width="2"/>
    <text x="250" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">Time step (t)</text>

    <!-- Y-axis (value) -->
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#333" stroke-width="2"/>
    <text x="-40" y="-60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333" transform="rotate(-90, -40, -60)">x<tspan font-size="9" baseline-shift="sub">t</tspan></text>

    <!-- Y-axis tick marks and labels -->
    <line x1="-5" y1="-100" x2="5" y2="-100" stroke="#333" stroke-width="1"/>
    <text x="-15" y="-96" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">1.0</text>

    <line x1="-5" y1="0" x2="5" y2="0" stroke="#333" stroke-width="1"/>
    <text x="-15" y="4" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">0</text>

    <line x1="-5" y1="100" x2="5" y2="100" stroke="#333" stroke-width="1"/>
    <text x="-15" y="104" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">-1.0</text>

    <!-- X-axis tick marks -->
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="1"/>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">0</text>

    <line x1="125" y1="-5" x2="125" y2="5" stroke="#333" stroke-width="1"/>
    <text x="125" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">25</text>

    <line x1="250" y1="-5" x2="250" y2="5" stroke="#333" stroke-width="1"/>
    <text x="250" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">50</text>

    <line x1="375" y1="-5" x2="375" y2="5" stroke="#333" stroke-width="1"/>
    <text x="375" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">75</text>

    <line x1="500" y1="-5" x2="500" y2="5" stroke="#333" stroke-width="1"/>
    <text x="500" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">100</text>

    <!-- Convergent trajectory (good parameters: β=0.9, η·λ=0.5) -->
    <!-- x_t+1 = (1 + 0.9 - 0.5)x_t - 0.9x_t-1 = 1.4x_t - 0.9x_t-1 -->
    <!-- Starting from x_0 = 1.0, x_-1 = 1.0 -->
    <path d="M 0 -100
             L 5 -90 L 10 -76 L 15 -60 L 20 -44 L 25 -28 L 30 -14
             L 35 -3 L 40 4 L 45 9 L 50 11 L 55 11 L 60 10 L 65 7
             L 70 4 L 75 1 L 80 -1 L 85 -2 L 90 -2 L 95 -2 L 100 -1
             L 105 -1 L 110 0 L 115 0 L 120 0 L 130 0 L 140 0
             L 150 0 L 200 0 L 250 0 L 300 0 L 400 0 L 500 0"
          fill="none" stroke="#81C784" stroke-width="2.5"/>

    <!-- Oscillating trajectory (bad parameters: β=0.9, η·λ=2.5) -->
    <!-- x_t+1 = (1 + 0.9 - 2.5)x_t - 0.9x_t-1 = -0.6x_t - 0.9x_t-1 -->
    <path d="M 0 -100
             L 5 -30 L 10 63 L 15 15 L 20 -84 L 25 -15 L 30 95
             L 35 3 L 40 -98 L 45 4 L 50 100 L 55 -10 L 60 -105
             L 65 17 L 70 107 L 75 -25 L 80 -108 L 85 32 L 90 109
             L 95 -38 L 100 -108 L 105 44 L 110 106 L 115 -49
             L 120 -103 L 125 53 L 130 99 L 135 -56 L 140 -94
             L 145 58 L 150 88 L 155 -59 L 160 -82 L 165 58
             L 170 75 L 175 -56 L 180 -68 L 185 53 L 190 61
             L 195 -49 L 200 -54 L 210 -41 L 220 -29 L 230 -19
             L 240 -11 L 250 -6 L 260 -2 L 280 0 L 300 0 L 400 0 L 500 0"
          fill="none" stroke="#E57373" stroke-width="2"/>

    <!-- Diverging trajectory (very bad parameters: β=0.9, η·λ=3.5) -->
    <!-- x_t+1 = (1 + 0.9 - 3.5)x_t - 0.9x_t-1 = -1.6x_t - 0.9x_t-1 -->
    <path d="M 0 -100
             L 5 -70 L 10 22 L 15 122 L 20 -35 L 25 -130"
          fill="none" stroke="#FFB74D" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="30" y="-100" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#FFB74D">diverges →</text>
  </g>

  <!-- Legend -->
  <g transform="translate(70, 290)">
    <!-- Convergent -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#81C784" stroke-width="2.5"/>
    <text x="40" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">
      Good parameters: β=0.9, ηλ=0.5
    </text>
    <text x="40" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666" font-style="italic">
      (smooth exponential decay to 0)
    </text>
  </g>

  <g transform="translate(70, 320)">
    <!-- Oscillating -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#E57373" stroke-width="2"/>
    <text x="40" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">
      Bad parameters: β=0.9, ηλ=2.5
    </text>
    <text x="40" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666" font-style="italic">
      (oscillates but eventually converges)
    </text>
  </g>

  <g transform="translate(350, 320)">
    <!-- Diverging -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#FFB74D" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="40" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">
      Very bad: β=0.9, ηλ=3.5
    </text>
    <text x="40" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666" font-style="italic">
      (diverges to infinity)
    </text>
  </g>

  <!-- Equation reference -->
  <text x="300" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666" font-style="italic">
    Second-order recurrence: x<tspan font-size="7" baseline-shift="sub">t+1</tspan> = (1 + β - ηλ)x<tspan font-size="7" baseline-shift="sub">t</tspan> - βx<tspan font-size="7" baseline-shift="sub">t-1</tspan>
  </text>
</svg>
