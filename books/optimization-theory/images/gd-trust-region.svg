<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <radialGradient id="trustGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E3F2FD;stop-opacity:0"/>
    </radialGradient>
  </defs>

    <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">Gradient Descent Trust Region</text>

  <!-- Current point and spherical trust region -->
  <g transform="translate(250, 170)">
    <!-- Spherical trust region -->
    <circle cx="0" cy="0" r="80" fill="url(#trustGrad)" stroke="#4A90A4" stroke-width="2" stroke-dasharray="5,3"/>

    <!-- Loss contours (elliptical - ill-conditioned) -->
    <ellipse cx="40" cy="30" rx="150" ry="40" fill="none" stroke="#ccc" stroke-width="1" transform="rotate(-20)"/>
    <ellipse cx="40" cy="30" rx="120" ry="32" fill="none" stroke="#bbb" stroke-width="1" transform="rotate(-20)"/>
    <ellipse cx="40" cy="30" rx="90" ry="24" fill="none" stroke="#aaa" stroke-width="1" transform="rotate(-20)"/>

    <!-- Current point -->
    <circle cx="0" cy="0" r="6" fill="#E57373"/>
    <text x="10" y="-10" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">θₜ</text>

    <!-- Gradient direction -->
    <line x1="0" y1="0" x2="-50" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="-65" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">-∇f</text>

    <!-- Optimal direction (toward minimum) -->
    <line x1="0" y1="0" x2="50" y2="35" stroke="#81C784" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr)"/>
    <text x="60" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#81C784">optimal</text>

    <!-- Trust region radius -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#4A90A4" stroke-width="1"/>
    <text x="10" y="-60" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4A90A4">η</text>
  </g>

  <!-- Explanation -->
  <text x="250" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">GD assumes spherical trust region (all directions equal)</text>
  <text x="250" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#666">But loss landscape is elongated → suboptimal steps</text>
</svg>