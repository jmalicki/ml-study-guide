<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

    <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">L-Lipschitz Gradients: How Fast Can Curvature Change?</text>

  <!-- Axes -->
  <line x1="50" y1="220" x2="450" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="220" x2="50" y2="50" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">x</text>
  <text x="30" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">f(x)</text>

  <!-- Smooth function (small L) -->
  <path d="M 70 180 Q 150 60, 250 140 Q 350 220, 430 100" fill="none" stroke="#81C784" stroke-width="2.5"/>

  <!-- Tangent lines at two points showing gradient doesn't change too fast -->
  <g>
    <!-- Point 1 -->
    <circle cx="150" cy="95" r="5" fill="#4A90A4"/>
    <line x1="100" y1="130" x2="200" y2="60" stroke="#4A90A4" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Point 2 -->
    <circle cx="250" cy="140" r="5" fill="#FFB74D"/>
    <line x1="200" y1="150" x2="300" y2="130" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>

  <!-- Annotation showing bounded change -->
  <path d="M 170 75 C 190 70, 210 95, 230 120" fill="none" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="200" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9C27B0">‖∇f(x) - ∇f(y)‖ ≤ L‖x-y‖</text>

  <!-- Legend box -->
  <rect x="300" y="45" width="180" height="60" fill="white" stroke="#ccc" rx="5"/>
  <text x="310" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">L = Lipschitz constant</text>
  <text x="310" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">Small L → smooth gradients</text>
  <text x="310" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">Large L → rapid changes</text>
</svg>