<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Dark mode */

    /* Background colors */
    .bg-amber-light { fill: #FFF8E1; }
    .bg-blue-light { fill: #E3F2FD; }
    .bg-green-light { fill: #E8F5E9; }
    .bg-red-light { fill: #FFEBEE; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }

      rect[fill="#E3F2FD"] { fill: #1a3a4a; }
      rect[fill="#E8F5E9"] { fill: #1a3a2a; }
      rect[fill="#FFEBEE"] { fill: #4a2a2a; }
      rect[fill="#FFF8E1"] { fill: #4a4020; }
      rect[fill="#f5f5f5"] { fill: #2a2a2a; }
      .bg-amber-light { fill: #ff6f00; }
      .bg-blue-light { fill: #1a237e; }
      .bg-green-light { fill: #1b5e20; }
      .bg-red-light { fill: #b71c1c; }
    }
  </style>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">Newton-Schulz Iteration: Why the Coefficient is 3</text>

  <!-- Main equation -->
  <rect x="180" y="42" width="340" height="35" class="bg-blue-light" stroke="#4A90A4" stroke-width="1" rx="5"/>
  <text x="350" y="65" text-anchor="middle" font-family="monospace" font-size="14" fill="#333">X_{k+1} = X_k · (cI - X_k^T X_k) / 2</text>

  <!-- Fixed Point Analysis Section -->
  <text x="350" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333">Fixed Point Analysis: What happens when X^T X = I?</text>

  <!-- Three coefficient boxes -->
  <!-- c=2 -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="180" height="140" class="bg-red-light" stroke="#E57373" stroke-width="2" rx="8"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#E57373">c = 2</text>

    <text x="90" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">X_{k+1} = X_k(2I - I)/2</text>
    <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">       = X_k · I/2</text>
    <text x="90" y="90" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#E57373">       = X_k / 2</text>

    <line x1="20" y1="105" x2="160" y2="105" stroke="#E57373" stroke-width="1"/>
    <text x="90" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E57373">Shrinks to zero!</text>
  </g>

  <!-- c=3 (correct) -->
  <g transform="translate(260, 130)">
    <rect x="0" y="0" width="180" height="140" class="bg-green-light" stroke="#81C784" stroke-width="3" rx="8"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#81C784">c = 3 ✓</text>

    <text x="90" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">X_{k+1} = X_k(3I - I)/2</text>
    <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">       = X_k · 2I/2</text>
    <text x="90" y="90" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#81C784">       = X_k</text>

    <line x1="20" y1="105" x2="160" y2="105" stroke="#81C784" stroke-width="1"/>
    <text x="90" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#81C784">Stable fixed point!</text>
  </g>

  <!-- c=4 -->
  <g transform="translate(470, 130)">
    <rect x="0" y="0" width="180" height="140" class="bg-red-light" stroke="#E57373" stroke-width="2" rx="8"/>
    <text x="90" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#E57373">c = 4</text>

    <text x="90" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">X_{k+1} = X_k(4I - I)/2</text>
    <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">       = X_k · 3I/2</text>
    <text x="90" y="90" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#E57373">       = 1.5 · X_k</text>

    <line x1="20" y1="105" x2="160" y2="105" stroke="#E57373" stroke-width="1"/>
    <text x="90" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E57373">Grows unboundedly!</text>
  </g>

  <!-- Convergence behavior section -->
  <text x="350" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#333">Convergence Behavior (starting from X_0 = G/||G||)</text>

  <!-- Convergence graph -->
  <g transform="translate(80, 315)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="260" y2="100" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#333" stroke-width="1.5"/>

    <!-- Y-axis label -->
    <text x="-10" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666" transform="rotate(-90, -10, 50)">||X^T X - I||</text>

    <!-- X-axis label -->
    <text x="130" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">Iteration k</text>

    <!-- Tick marks -->
    <text x="0" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">0</text>
    <text x="50" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">2</text>
    <text x="100" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">4</text>
    <text x="150" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">6</text>
    <text x="200" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">8</text>
    <text x="250" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">10</text>

    <!-- c=4 line (explodes) - goes off chart -->
    <path d="M0,80 L25,60 L50,30 L60,0" stroke="#E57373" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
    <text x="70" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#E57373">c=4 (diverges)</text>

    <!-- c=2 line (shrinks) -->
    <path d="M0,80 L25,85 L50,90 L75,93 L100,95 L150,97 L200,98 L250,99" stroke="#FFB74D" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    <text x="255" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FFB74D">c=2 (shrinks)</text>

    <!-- c=3 line (converges cubically) -->
    <path d="M0,80 L25,50 L50,20 L75,5 L100,1 L125,0.2 L150,0.1" stroke="#81C784" stroke-width="2.5" fill="none"/>
    <circle cx="150" cy="0" r="3" fill="#81C784"/>
    <text x="185" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#81C784">c=3 ✓</text>
  </g>

  <!-- Cubic convergence box -->
  <g transform="translate(400, 315)">
    <rect x="0" y="0" width="250" height="105" class="bg-amber-light" stroke="#FFB74D" stroke-width="1.5" rx="8"/>
    <text x="125" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFB74D">Cubic Convergence (c=3)</text>

    <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">If error at step k is ε_k:</text>
    <text x="125" y="68" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">ε_{k+1} ≈ C · ε_k³</text>

    <text x="15" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">Starting from ε₀ ≈ 1, just 5 iterations</text>
    <text x="15" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">reach machine precision!</text>
  </g>
</svg>
