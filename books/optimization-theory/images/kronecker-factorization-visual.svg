<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Dark mode */

    /* Background colors */
    .bg-amber-light { fill: #FFF8E1; }
    .bg-blue-light { fill: #E3F2FD; }
    .bg-green-light { fill: #E8F5E9; }

    /* Background colors */
    .bg-pink-light { fill: #FFCDD2; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      .bg-amber-light { fill: #ff6f00; }
      .bg-blue-light { fill: #1a237e; }
      .bg-green-light { fill: #1b5e20; }
      .bg-pink-light { fill: #c62828; }
    }
  </style>

    <!-- Title -->
  <text x="275" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">K-FAC: Kronecker-Factored Fisher Approximation</text>

  <!-- Full Fisher matrix (huge) -->
  <g transform="translate(80, 120)">
    <text x="40" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">Full Fisher F</text>
    <rect x="0" y="0" width="80" height="80" class="bg-pink-light" stroke="#E57373" stroke-width="2"/>
    <text x="40" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">n² entries</text>
    <text x="40" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">(intractable)</text>
    <text x="40" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E57373">O(n²) memory</text>
  </g>

  <!-- Approximation symbol -->
  <text x="180" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#333">≈</text>

  <!-- Kronecker product -->
  <g transform="translate(200, 120)">
    <text x="85" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">Kronecker Approximation</text>

    <!-- A matrix -->
    <rect x="0" y="20" width="40" height="40" class="bg-green-light" stroke="#81C784" stroke-width="2"/>
    <text x="20" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">A</text>
    <text x="20" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#81C784">d_in × d_in</text>

    <!-- Kronecker symbol -->
    <text x="55" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#333">⊗</text>

    <!-- G matrix -->
    <rect x="70" y="20" width="40" height="40" class="bg-blue-light" stroke="#4A90A4" stroke-width="2"/>
    <text x="90" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">G</text>
    <text x="90" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#4A90A4">d_out × d_out</text>

    <text x="55" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">O(d_in² + d_out²)</text>
  </g>

  <!-- Explanation of A and G -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="180" height="100" class="bg-amber-light" stroke="#FFC107" stroke-width="1" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#333">What are A and G?</text>
    <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">A = E[aₗaₗᵀ]</text>
    <text x="10" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">  input activations</text>
    <text x="10" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">G = E[gₗgₗᵀ]</text>
    <text x="10" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#666">  output gradients</text>
  </g>

  <!-- Inversion trick -->
  <g transform="translate(80, 250)">
    <text x="110" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#333">Inversion Trick</text>

    <rect x="0" y="15" width="40" height="40" class="bg-green-light" stroke="#81C784" stroke-width="2"/>
    <text x="20" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">A</text>

    <text x="55" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#333">⊗</text>

    <rect x="70" y="15" width="40" height="40" class="bg-blue-light" stroke="#4A90A4" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">G</text>

    <text x="130" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">)⁻¹ =</text>

    <rect x="160" y="15" width="40" height="40" class="bg-green-light" stroke="#81C784" stroke-width="2"/>
    <text x="180" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">A⁻¹</text>

    <text x="215" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#333">⊗</text>

    <rect x="230" y="15" width="40" height="40" class="bg-blue-light" stroke="#4A90A4" stroke-width="2"/>
    <text x="250" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">G⁻¹</text>

    <text x="-15" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">(</text>
  </g>

  <!-- Cost comparison -->
  <g transform="translate(350, 250)">
    <rect x="0" y="0" width="210" height="80" class="bg-green-light" stroke="#81C784" stroke-width="1.5" rx="5"/>
    <text x="105" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#81C784">Computational Savings</text>
    <text x="10" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">Full Fisher: O(n³) to invert</text>
    <text x="10" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">K-FAC: O(d_in³ + d_out³)</text>
    <text x="10" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">→ Often 1000x+ faster!</text>
  </g>

  <!-- Bottom note -->
  <text x="290" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333">Assumption: input activations and output gradients are independent (approximately true)</text>
</svg>
