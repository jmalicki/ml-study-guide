<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 340">
  <!-- Background -->
  <rect width="550" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="275" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">K-FAC: Kronecker-Factored Fisher Approximation</text>

  <!-- Full Fisher matrix (huge) -->
  <g transform="translate(80, 120)">
    <text x="40" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Full Fisher F</text>
    <rect x="0" y="0" width="80" height="80" fill="#FFCDD2" stroke="#f44336" stroke-width="2"/>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">n² entries</text>
    <text x="40" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">(intractable)</text>
    <text x="40" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f44336">O(n²) memory</text>
  </g>

  <!-- Approximation symbol -->
  <text x="180" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">≈</text>

  <!-- Kronecker product -->
  <g transform="translate(200, 120)">
    <text x="85" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Kronecker Approximation</text>

    <!-- A matrix -->
    <rect x="0" y="20" width="40" height="40" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="20" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">A</text>
    <text x="20" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4CAF50">d_in × d_in</text>

    <!-- Kronecker symbol -->
    <text x="55" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">⊗</text>

    <!-- G matrix -->
    <rect x="70" y="20" width="40" height="40" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">G</text>
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2196F3">d_out × d_out</text>

    <text x="55" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50">O(d_in² + d_out²)</text>
  </g>

  <!-- Explanation of A and G -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="180" height="100" fill="#FFF8E1" stroke="#FFC107" stroke-width="1" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">What are A and G?</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#333">A = E[aₗaₗᵀ]</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#666">  input activations</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#333">G = E[gₗgₗᵀ]</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="9" fill="#666">  output gradients</text>
  </g>

  <!-- Inversion trick -->
  <g transform="translate(80, 220)">
    <text x="110" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Inversion Trick</text>

    <rect x="0" y="15" width="40" height="40" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="20" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">A</text>

    <text x="55" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">⊗</text>

    <rect x="70" y="15" width="40" height="40" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="90" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">G</text>

    <text x="130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">)⁻¹ =</text>

    <rect x="160" y="15" width="40" height="40" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="180" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">A⁻¹</text>

    <text x="215" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">⊗</text>

    <rect x="230" y="15" width="40" height="40" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="250" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">G⁻¹</text>

    <text x="-15" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">(</text>
  </g>

  <!-- Cost comparison -->
  <g transform="translate(320, 215)">
    <rect x="0" y="0" width="210" height="80" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="5"/>
    <text x="105" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4CAF50">Computational Savings</text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" fill="#333">Full Fisher: O(n³) to invert</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#333">K-FAC: O(d_in³ + d_out³)</text>
    <text x="10" y="72" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50">→ Often 1000x+ faster!</text>
  </g>

  <!-- Bottom note -->
  <text x="275" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Assumption: input activations and output gradients are independent (approximately true)</text>
</svg>
