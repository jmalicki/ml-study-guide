<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f44336"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4CAF50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Steepest Descent vs Conjugate Gradient</text>

  <!-- Left: Steepest Descent -->
  <g transform="translate(150, 160)">
    <text x="0" y="-110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Steepest Descent</text>

    <!-- Elliptical contours -->
    <ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="#ddd" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="none" stroke="#bbb" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="none" stroke="#aaa" stroke-width="1.5"/>

    <!-- Minimum -->
    <circle cx="0" cy="0" r="4" fill="#333"/>

    <!-- Zig-zag path -->
    <path d="M 90 25 L 40 -18 L 55 8 L 20 -12 L 30 5 L 5 -5 L 10 2 L 0 0"
          fill="none" stroke="#f44336" stroke-width="2" marker-end="url(#a1)"/>

    <!-- Start point -->
    <circle cx="90" cy="25" r="5" fill="#f44336"/>

    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Many oscillating steps</text>
  </g>

  <!-- Right: Conjugate Gradient -->
  <g transform="translate(450, 160)">
    <text x="0" y="-110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Conjugate Gradient</text>

    <!-- Elliptical contours -->
    <ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="#ddd" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="none" stroke="#bbb" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="none" stroke="#aaa" stroke-width="1.5"/>

    <!-- Minimum -->
    <circle cx="0" cy="0" r="4" fill="#333"/>

    <!-- Direct path (2 steps for 2D) -->
    <path d="M 90 25 L 20 -8 L 0 0"
          fill="none" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#a2)"/>

    <!-- Start point -->
    <circle cx="90" cy="25" r="5" fill="#4CAF50"/>

    <!-- Intermediate point -->
    <circle cx="20" cy="-8" r="4" fill="#4CAF50"/>

    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Exactly n steps in n dimensions</text>
  </g>

  <!-- Bottom note -->
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Conjugate directions are A-orthogonal: pᵢᵀApⱼ = 0 for i ≠ j</text>
</svg>