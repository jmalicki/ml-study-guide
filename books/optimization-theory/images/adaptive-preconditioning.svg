<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 300">
  <style>
    /* Light mode (default) */
    text { fill: #000000; }
    .label-text { fill: #666666; }

    /* Dark mode */

    /* Background colors */
    .bg-green-light { fill: #E8F5E9; }
    .bg-red-light { fill: #FFEBEE; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
      .label-text { fill: #cccccc; }

      text[fill="#000"], text[fill="#000000"], text[fill="#333"], text[fill="#666"] {
        fill: #ffffff;
      }
      text[fill="#fff"], text[fill="#ffffff"], text[fill="white"] {
        fill: #ffffff;
      }
      text[fill="#E57373"] { fill: #ef5350; }
      text[fill="#81C784"] { fill: #66bb6a; }
      text[fill="#FFB74D"] { fill: #ffa726; }
      text[fill="#4A90A4"] { fill: #4fc3f7; }
      .bg-green-light { fill: #1b5e20; }
      .bg-red-light { fill: #b71c1c; }
    }
  </style>

    <!-- Title -->
  <text x="275" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#333">Adaptive Methods as Diagonal Preconditioning</text>

  <!-- Left: poorly conditioned -->
  <g transform="translate(130, 150)">
    <text x="0" y="-85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#333">Before (ill-conditioned)</text>

    <!-- Elongated ellipse contours -->
    <ellipse cx="0" cy="0" rx="90" ry="25" fill="none" stroke="#ddd" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="19" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="50" ry="14" fill="none" stroke="#bbb" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="none" stroke="#aaa" stroke-width="1.5"/>

    <!-- Minimum -->
    <circle cx="0" cy="0" r="4" fill="#333"/>

    <!-- Gradient (steep in y) -->
    <line x1="60" y1="-18" x2="60" y2="25" stroke="#E57373" stroke-width="2"/>
    <polygon points="60,25 56,18 64,18" fill="#E57373"/>
    <text x="75" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E57373">∇L</text>

    <!-- Axes labels -->
    <text x="0" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">θ₁ (slow direction)</text>
    <text x="-100" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666" transform="rotate(-90, -100, 0)">θ₂ (fast)</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(275, 150)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#81C784" stroke-width="2"/>
    <polygon points="40,0 33,-4 33,4" fill="#81C784"/>
    <text x="20" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">scale by</text>
    <text x="20" y="-3" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">1/√v</text>
  </g>

  <!-- Right: preconditioned -->
  <g transform="translate(420, 150)">
    <text x="0" y="-85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#333">After (preconditioned)</text>

    <!-- Circular contours -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ddd" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ccc" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#bbb" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#aaa" stroke-width="1.5"/>

    <!-- Minimum -->
    <circle cx="0" cy="0" r="4" fill="#333"/>

    <!-- Gradient (now points to minimum) -->
    <line x1="40" y1="-28" x2="8" y2="-6" stroke="#81C784" stroke-width="2"/>
    <polygon points="8,-6 16,-10 14,-2" fill="#81C784"/>
    <text x="55" y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#81C784">∇̃L</text>

    <!-- Axes labels -->
    <text x="0" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666">θ̃₁ = θ₁</text>
    <text x="-70" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#666" transform="rotate(-90, -70, 0)">θ̃₂</text>
  </g>

  <!-- Explanation boxes -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="200" height="55" class="bg-red-light" stroke="#E57373" stroke-width="1" rx="5"/>
    <text x="100" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#E57373">Problem</text>
    <text x="100" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">Different parameters have</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">very different curvatures</text>
  </g>

  <g transform="translate(300, 230)">
    <rect x="0" y="0" width="200" height="55" class="bg-green-light" stroke="#81C784" stroke-width="1" rx="5"/>
    <text x="100" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#81C784">Solution</text>
    <text x="100" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">Divide each parameter by</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#333">√(accumulated squared gradients)</text>
  </g>
</svg>
