<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280">
  <!-- Background -->
  <rect width="500" height="280" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Truncated CG: Residual vs Iterations</text>

  <!-- Axes -->
  <line x1="60" y1="220" x2="460" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="220" x2="60" y2="50" stroke="#333" stroke-width="1.5"/>

  <!-- Y-axis label -->
  <text x="25" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90, 25, 135)">‖residual‖</text>

  <!-- X-axis label -->
  <text x="260" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">CG iterations</text>

  <!-- Residual decay curve -->
  <path d="M 60 70 Q 100 90, 140 130 Q 180 165, 220 185 Q 280 200, 340 208 Q 400 212, 460 215"
        fill="none" stroke="#2196F3" stroke-width="2.5"/>

  <!-- Key points -->
  <circle cx="60" cy="70" r="4" fill="#2196F3"/>
  <circle cx="140" cy="130" r="4" fill="#2196F3"/>
  <circle cx="220" cy="185" r="4" fill="#2196F3"/>
  <circle cx="340" cy="208" r="4" fill="#2196F3"/>

  <!-- Truncation line -->
  <line x1="180" y1="50" x2="180" y2="220" stroke="#f44336" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="180" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f44336">truncate here</text>

  <!-- Annotations -->
  <rect x="200" y="70" width="160" height="70" fill="white" stroke="#ddd" rx="5"/>
  <text x="280" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Early iterations:</text>
  <text x="280" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4CAF50">Rapid progress</text>
  <text x="280" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Late iterations:</text>
  <text x="280" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Diminishing returns</text>

  <!-- Iteration markers -->
  <text x="60" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">0</text>
  <text x="140" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">5</text>
  <text x="220" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">10</text>
  <text x="300" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">15</text>
  <text x="380" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">20</text>
  <text x="460" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">n</text>
</svg>