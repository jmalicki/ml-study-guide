<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arwGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <marker id="arwBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Gradient vs Newton Direction</text>

  <!-- Contour plot -->
  <g transform="translate(250, 170)">
    <!-- Elliptical contours -->
    <ellipse cx="50" cy="20" rx="160" ry="45" fill="none" stroke="#ddd" stroke-width="1.5" transform="rotate(-15)"/>
    <ellipse cx="50" cy="20" rx="120" ry="34" fill="none" stroke="#ccc" stroke-width="1.5" transform="rotate(-15)"/>
    <ellipse cx="50" cy="20" rx="80" ry="23" fill="none" stroke="#bbb" stroke-width="1.5" transform="rotate(-15)"/>
    <ellipse cx="50" cy="20" rx="40" ry="12" fill="none" stroke="#aaa" stroke-width="1.5" transform="rotate(-15)"/>

    <!-- Minimum -->
    <circle cx="50" cy="20" r="5" fill="#333"/>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">θ*</text>

    <!-- Current point -->
    <circle cx="-80" cy="30" r="6" fill="#f44336"/>
    <text x="-95" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">θₜ</text>

    <!-- Gradient direction (perpendicular to contour, but not toward minimum) -->
    <line x1="-80" y1="30" x2="-20" y2="-20" stroke="#2196F3" stroke-width="2.5" marker-end="url(#arwBlue)"/>
    <text x="-10" y="-30" font-family="Arial, sans-serif" font-size="12" fill="#2196F3">-∇f (gradient)</text>

    <!-- Newton direction (directly toward minimum) -->
    <line x1="-80" y1="30" x2="35" y2="22" stroke="#4CAF50" stroke-width="2.5" marker-end="url(#arwGreen)"/>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" fill="#4CAF50">-H⁻¹∇f (Newton)</text>
  </g>

  <!-- Explanation box -->
  <rect x="30" y="260" width="440" height="50" fill="white" stroke="#ddd" rx="5"/>
  <text x="250" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Gradient points perpendicular to contours (steepest descent locally)</text>
  <text x="250" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Newton points directly at the minimum (using curvature information)</text>
</svg>